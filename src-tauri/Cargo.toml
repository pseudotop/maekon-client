[package]
name = "maekon-app"
description = "Maekon local-first work agent - Tauri v2 GUI, automation, DI, orchestration, lifecycle"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

# #7734 (Wave-3 B2 of #7744): thin `[lib]` target so integration tests can
# `use maekon_app::...` real types instead of parsing/duplicating source. Name
# and path are Cargo defaults once `src/lib.rs` exists (package name
# `maekon-app` -> lib name `maekon_app`), so only the non-default setting is
# declared here. `doctest = false`: this is an internal app library with no
# published-API contract, not a crate meant to carry runnable doc examples —
# activating doctests over ~1,200 LOC of composition-root code would add a
# brand-new failure surface orthogonal to this enabler.
[lib]
doctest = false

[[bin]]
name = "maekon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }
chrono = { workspace = true }

[dependencies]
# #8685: cargo-mutants' inert marker attribute keeps OS/Tauri revocation
# orchestration in the disposable-VM integration lane while the pure
# fail-closed capture boundary remains mutation-tested. The macro has no
# runtime behavior or transitive dependencies.
mutants = "=0.0.4"
tauri = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-single-instance = "2"
tauri-plugin-wdio = { workspace = true, optional = true }
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }

# 내부 크레이트
maekon-core = { workspace = true }
maekon-automation = { workspace = true }
maekon-monitor = { workspace = true }
maekon-vision = { workspace = true }
maekon-network = { workspace = true, optional = true }
# ADR-034 P2: unconditional on purpose. The breaker registry + backoff live
# here now; every third-party crate this pulls (reqwest, parking_lot, rand,
# url) is already unconditional in this manifest, so the minimal build gains
# no supply-chain surface — and the old cfg-branched CircuitBreakerRegistry
# stub (#5032/#7743) could be deleted because the real type now exists in
# every feature-matrix cell.
maekon-http-core = { workspace = true }
# ADR-034 P3: connector adapter (read-only Context Sources). `integration_runtime`
# is compiled unconditionally (lib.rs:88), so this is unconditional too.
maekon-integration = { workspace = true }
maekon-storage = { workspace = true }
maekon-suggestion = { workspace = true }
maekon-web = { workspace = true }
maekon-api-contracts = { workspace = true }
maekon-analysis = { workspace = true }
maekon-audio = { workspace = true, optional = true }
maekon-embedding = { workspace = true, optional = true }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
# E20-41 (#4833): OS-CSPRNG source for the per-session local-API auth token.
rand = { workspace = true }
# #8044: Argon2id PIN hashing for the capture-history re-auth fallback (offline
# brute-force resistant verifier stored in app_meta; never a plaintext PIN).
argon2 = { workspace = true }
ed25519-dalek = { workspace = true }
# #9707: URL parsing for the OS handoff allowlist. Already in Cargo.lock via
# maekon-network, so this adds no crate to the supply-chain surface.
url = { workspace = true }
directories = { workspace = true }
# #11068: cross-platform "are these two paths the same file", replacing three
# hand-written cfg branches whose Windows arm used unstable std APIs. Already in
# Cargo.lock (via walkdir) and already in supply-chain/audits.toml, so this adds
# no new crate to the graph.
same-file = "1.0"
parking_lot = { workspace = true }
sysinfo = { workspace = true }
tempfile = { workspace = true }

# 자동 업데이트
bsdiff = { workspace = true }
self-replace = { workspace = true }
reqwest = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
keyring = { workspace = true }
image = { workspace = true }
raw-window-handle = "0.6"

# D13-v2c: generate-external-cert subcommand (feature-gated, external-grpc-tools)
rcgen = { workspace = true, optional = true }
time = { workspace = true, optional = true }
# Linux systemd integration (feature-gated)
sd-notify = { version = "0.5", optional = true }

# Telemetry (feature-gated, default OFF). `metrics` is enabled alongside
# `trace` so the OTLP MeterProvider (E20-43 #4835) compiles; both signals stay
# behind the opt-in `telemetry` feature and are NOT in default features.
opentelemetry = { version = "0.32", optional = true, default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", optional = true, default-features = false, features = ["rt-tokio", "trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
tracing-opentelemetry = { version = "0.33", optional = true }

[features]
default = [
    "custom-protocol",
    "app-tray",
    "analysis",
    "native-vision",
    "native-input",
    "linux-atspi",
    "local-suggestions",
]
custom-protocol = ["tauri/custom-protocol"]
app-tray = ["tauri/tray-icon"]
# C1 (E35): 'analysis' gates BYOK/OAuth *user-provider direct adapter* code
# (RemoteLlmProvider, RemoteOcrProvider, OAuthClient, TokenRefreshCoordinator,
# ProviderRuntimeContext, provider_secret_backend, oauth_provider_registry).
# maekon-network carries all of these; 'analysis' pulls it in.  Default-on.
# (#5734's LlmCallHealth lives in maekon-core, so no-default builds keep
# excluding the network transport entirely.)
# 'server' adds the Oneshim server *integration transport* (HttpTransport, OIDC
# device flow, integration runtime) on top — it does NOT gate provider adapters.
analysis = ["dep:maekon-network"]
# E20-24 (#4816): the on-device suggestion pipeline (generate → queue → score →
# accept/reject/defer → history), learning entirely locally via FeedbackSignalSink
# with NO server. Default-on so OSS builds are a self-contained "local productivity
# copilot that learns from you". Relies only on the always-compiled maekon-suggestion
# / maekon-storage crates plus the in-crate `LocalApiClient` no-op (satisfies the
# required `Arc<dyn ApiClient>` without maekon-network), so it compiles even under
# --no-default-features. The `server` feature ADDS the network transport on top
# (SSE receive of server/team suggestions + feedback POST for cross-user aggregation).
local-suggestions = []
# C1 (E35): 'server' = Oneshim server integration transport only.
# Provider adapters (BYOK/OAuth) are gated under 'analysis', not 'server'.
server = ["analysis", "local-suggestions"]
grpc = ["server", "maekon-network/grpc"]
# D13: Enable the local dashboard gRPC server (tonic-based, uses the
# 10080-10089 port band alongside Axum REST). Opt-in so default builds pay zero
# tonic dep cost.
grpc-dashboard = ["maekon-web/grpc-dashboard"]
# D13-v2c: External gRPC binding — opt-in TLS+JWT/mTLS server on a separate port.
# Depends on grpc-dashboard (loopback) being compiled in as well.
grpc-dashboard-external = ["maekon-web/grpc-dashboard-external"]
# D13-v2c: generate-external-cert subcommand — rcgen + JWT keypair generation.
external-grpc-tools = ["maekon-web/external-grpc-tools", "dep:rcgen", "dep:time"]
# sd_notify(3) READY=/STOPPING= integration for systemd service units.
# NOT in default features — pass --features systemd-notify for Linux release builds.
systemd-notify = ["dep:sd-notify"]
audio = ["dep:maekon-audio"]
stt = ["audio", "maekon-audio/whisper"]
cloud-stt = ["audio", "maekon-audio/cloud-stt"]
download = ["audio", "maekon-audio/download"]
embedding = ["dep:maekon-embedding"]
native-vision = ["maekon-vision/native-vision"]
native-input = ["maekon-automation/enigo"]
hnsw = ["maekon-analysis/hnsw"]
linux-atspi = ["maekon-vision/linux-atspi"]
lan-sync = ["maekon-network/lan-sync"]
webdriver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
ml-detect = ["maekon-vision/ml-detect"]
linux-sandbox = ["maekon-automation/linux-sandbox"]
windows-sandbox = ["maekon-automation/windows-sandbox"]
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { workspace = true, features = ["tray-icon"] }
block2 = "0.6"
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-user-notifications = { workspace = true }

[target.'cfg(windows)'.dependencies]
tauri = { workspace = true, features = ["tray-icon"] }
tauri-winrt-notification = { workspace = true }
windows-sys = { workspace = true }

[package.metadata.bundle]
name = "Maekon"
identifier = "com.maekon.app"
icon = ["icons/icon.icns"]
copyright = "Copyright 2026 Maekon Contributors"
category = "Productivity"
short_description = "Local-first work agent with policy-gated automation"
long_description = """
Maekon is a local-first work agent for AI-assisted work.
It organizes desktop context into private-by-default next-action candidates and policy-gated automation paths.
"""
osx_minimum_system_version = "10.15"

[package.metadata.deb]
maintainer = "Maekon Team"
copyright = "2026, Maekon Contributors"
license-file = ["../LICENSE", "4"]
extended-description = """
Maekon is a local-first work agent for AI-assisted work with policy-gated automation.
"""
depends = "$auto, libgtk-4-1, libglib2.0-0, libwebkitgtk-6.0-4"
section = "utility"
priority = "optional"
assets = [
    ["target/release/maekon", "usr/bin/", "755"],
    # #11023: without this profile the app aborts a few seconds after start on
    # stock Ubuntu 24.04, which restricts unprivileged user namespaces through
    # AppArmor and so stops WebKitGTK from sandboxing its helper processes.
    ["packaging/apparmor/maekon", "etc/apparmor.d/", "644"],
    # #11064: without these the package installs a GUI application that never
    # appears in a launcher. The autostart entry the app writes at runtime is a
    # different file for a different purpose and does not put it in a menu.
    # The icon must ship with the entry — an `Icon=` pointing at nothing renders
    # blank, which looks like a broken app rather than a missing asset.
    ["packaging/desktop/maekon.desktop", "usr/share/applications/", "644"],
    ["icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/maekon.png", "644"],
    ["icons/32x32.png", "usr/share/icons/hicolor/32x32/apps/maekon.png", "644"],
]
# A conffile: it lives in /etc and a user may edit it (the profile includes
# <local/maekon> for that), so an upgrade must not silently overwrite it.
conf-files = ["/etc/apparmor.d/maekon"]
# postinst loads the profile, postrm unloads it. Loading is best-effort — a
# system without AppArmor is not an install failure — but a failure prints why,
# because the symptom it causes looks nothing like a packaging problem.
maintainer-scripts = "packaging/debian"

[dev-dependencies]
serde_json = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
# #7735 E-1: `SyncEngine::has_egress_sink` (moved to maekon-core) is gated
# `cfg(any(test, feature = "test-support"))`. maekon-core is a [dependencies]
# entry above (compiled without our `cfg(test)`), so the `agent_runtime::sync_setup`
# regression test needs the dev-only `test-support` feature to see the method.
# Dual-declaration idiom precedent: crates/maekon-analysis/Cargo.toml.
maekon-core = { workspace = true, features = ["test-support"] }
# #4928: cross-family erasure 통합 테스트의 GuardedConnection funnel 직접 INSERT 용
# (rusqlite::Error 타입 명시). 이미 maekon-storage 를 통한 transitive 의존이다.
rusqlite = { workspace = true }
mockito = { workspace = true }
tokio-test = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
zeroize = { workspace = true }
serial_test = "4"
# D13-v2c: generate-external-cert test helpers.
x509-parser = { workspace = true }
jsonwebtoken = { workspace = true }
# #7735 E-2: `FocusAnalyzer::on_app_switch` (test-only convenience wrapper) is
# gated `#[cfg(any(test, feature = "test-support"))]` in maekon-analysis and
# used from this crate's own `#[cfg(test)]` tests (e.g.
# scheduler/loops/helpers/mod.rs). Plain `#[cfg(test)]` on the maekon-analysis
# side would not activate for a normal (non-test) dependency build, so the
# feature must be enabled here via `[dev-dependencies]` only (#7729 house
# pattern; never via `[dependencies]`, so it never reaches the shipped
# binary).
maekon-analysis = { workspace = true, features = ["test-support"] }
