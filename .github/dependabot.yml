version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # public repo는 export target이므로 version-update PR은 parent SSOT에서만 받는다.
    # Dependabot security update PR 한도는 GitHub가 별도로 관리한다.
    open-pull-requests-limit: 0
    # #11339: the sysinfo hold is released. It existed because 0.39+ requires
    # rustc 1.95 while the workspace declared 1.88.0 — a declaration the lockfile
    # had already stopped honouring. The workspace now declares 1.95.0, so the
    # gap this entry guarded no longer exists.
    ignore:
      # time 0.3.52 changed the `Parsable::parse` signature by adding parser
      # defaults; cookie 0.18.1 still calls the one-argument API. This is an API
      # incompatibility, NOT a version-range one — cookie 0.18.1 requires
      # `time ^0.3`, so the range alone would happily accept 0.3.55.
      #
      # #11339: cookie 0.18.2 (2026-08-08) postdates that change and is the
      # first version that could carry the fix, so this hold is releasable once
      # the lockfile moves cookie forward. `test-release-export-guardrails.sh`
      # derives that condition from the locked cookie version and will fail if
      # this entry outlives it.
      #
      # Not released here: `time` already carries a deferred-audit exemption
      # (#11281) sized at 21,951 insertions with 166 added unsafe lines in 88
      # distinct forms. Bumping stacks more unaudited delta onto that backlog,
      # which is a supply-chain decision rather than a dependency one.
      - dependency-name: "time"
        versions: [">=0.3.52"]
      # Dependabot grouped cargo updater가 tauri-build 2.6.3 lockfile 갱신 중
      # updater 내부 RuntimeError로 실패한다. updater 또는 Tauri 체인이 안정화될
      # 때까지 정확히 해당 버전만 보류한다.
      - dependency-name: "tauri-build"
        versions: ["2.6.3"]
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # public repo는 export target이므로 GitHub Actions version-update PR도
    # parent SSOT에서만 받는다.
    open-pull-requests-limit: 0
    groups:
      gha-all:
        patterns: ["*"]
