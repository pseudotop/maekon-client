version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # public repo는 export target이므로 version-update PR은 parent SSOT에서만 받는다.
    # Dependabot security update PR 한도는 GitHub가 별도로 관리한다.
    open-pull-requests-limit: 0
    # #11339: the sysinfo hold is released. It existed because 0.39+ requires
    # rustc 1.95 while the workspace declared 1.88.0 — a declaration the lockfile
    # had already stopped honouring. The workspace now declares 1.95.0, so the
    # gap this entry guarded no longer exists.
    #
    # #13995: the time hold is released too. time 0.3.52 changed the
    # `Parsable::parse` signature by adding parser defaults, and cookie 0.18.1
    # still called the one-argument API. The lockfile now carries cookie 0.18.3
    # (the RUSTSEC-2026-0594 fix), which postdates that change, so the gap this
    # entry guarded no longer exists. `test-release-export-guardrails.sh` derives
    # the condition from the locked cookie version and fails if the hold comes
    # back while cookie is at or past 0.18.2. A time bump still has to clear
    # `cargo vet`: 0.3.51 is fully audited and the #11281 exemption is gone.
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # public repo는 export target이므로 GitHub Actions version-update PR도
    # parent SSOT에서만 받는다.
    open-pull-requests-limit: 0
    groups:
      gha-all:
        patterns: ["*"]
