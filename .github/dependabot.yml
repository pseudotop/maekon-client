version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # sysinfo 0.39+ raises its required rustc to 1.95, violating the workspace
    # `rust-version = "1.88.0"` MSRV. Hold at 0.38 until the MSRV is intentionally
    # raised, so a routine Dependabot sweep cannot silently re-break it (#6848).
    ignore:
      - dependency-name: "sysinfo"
        versions: [">=0.39"]
      - dependency-name: "time"
        versions: [">=0.3.52"]
      # Dependabot grouped cargo updater가 tauri-build 2.6.3 lockfile 갱신 중
      # updater 내부 RuntimeError로 실패한다. updater 또는 Tauri 체인이 안정화될
      # 때까지 정확히 해당 버전만 보류한다.
      - dependency-name: "tauri-build"
        versions: ["2.6.3"]
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      gha-all:
        patterns: ["*"]
