name: Feature request
description: Suggest a public Maekon Client improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Maekon Client is exported from an internal source of truth. Accepted public suggestions are applied through the parent source tree before the public repository is regenerated.

        Do not include secrets, tokens, private screenshots, raw capture content, raw audio/input data, customer data, private logs, or local absolute paths. Security vulnerabilities should be reported privately through the Security tab.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This is not a security vulnerability or sensitive data exposure.
          required: true
        - label: I have removed secrets, tokens, private screenshots, raw captures, private logs, customer data, and local absolute paths.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What user workflow should improve?
      placeholder: When I...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful behavior change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention existing workarounds or related tools.
    validations:
      required: false
