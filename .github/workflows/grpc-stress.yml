name: gRPC Stress Test

on:
  # Temporarily manual-only while local Maekon TC work is in progress.
  # Restore schedule before re-enabling CI.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
      - name: Cache Rust build artifacts
        uses: ./.github/actions/rust-cache
        with:
          key: grpc-stress
      # No Linux GUI system-deps install (WebKitGTK 6, GTK4, etc.):
      # cargo test -p maekon-web does not transitively pull in any
      # Tauri/webkit-linking crate. If a future workspace dep change makes
      # this assumption false, link errors will surface loudly here — at
      # which point add the standard install step (see ci.yml:148-171).
      - name: Print fd limits and assert hard cap
        run: |
          echo "soft: $(ulimit -Sn)"
          echo "hard: $(ulimit -Hn)"
          test "$(ulimit -Hn)" -ge 65536 || {
            echo "ERROR: hard fd limit $(ulimit -Hn) < 65536"
            exit 1
          }
      - name: Install frontend dist stub (rust-embed compile-time requirement)
        run: |
          mkdir -p crates/maekon-web/frontend/dist
          echo '<!doctype html>' > crates/maekon-web/frontend/dist/index.html
      # No sandbox-worker stub required: cargo test -p maekon-web does not
      # compile src-tauri (dep graph is src-tauri → maekon-web, not reverse).
      - name: Run stress tests
        run: |
          ulimit -n 65536
          cargo test --locked -p maekon-web \
            --features stress-test \
            --test external_grpc_stress \
            -- --test-threads=1 --nocapture
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: info
