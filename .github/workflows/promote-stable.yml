name: Promote Stable Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'Validated RC tag to promote (for example v0.3.7-rc.1)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  promote:
    name: Prepare Stable Promotion PR
    runs-on: ubuntu-latest
    steps:
      - name: Generate App installation token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.MAEKON_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAEKON_RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0

      - name: Fetch latest main and tags
        run: git fetch origin main --tags --force

      - name: Validate RC input
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/release-common.sh

          RC_TAG="${{ inputs.rc_tag }}"
          if [[ "${RC_TAG}" != v* ]]; then
            echo "::error::rc_tag must start with v (for example v0.3.7-rc.1)"
            exit 1
          fi

          RC_VERSION="${RC_TAG#v}"
          if ! is_rc_version "${RC_VERSION}"; then
            echo "::error::rc_tag must be in vX.Y.Z-rc.N format"
            exit 1
          fi

          if ! git rev-parse "${RC_TAG}" >/dev/null 2>&1; then
            echo "::error::RC tag ${RC_TAG} does not exist"
            exit 1
          fi

          STABLE_VERSION="$(base_version "${RC_VERSION}")"
          STABLE_TAG="v${STABLE_VERSION}"
          if git rev-parse "${STABLE_TAG}" >/dev/null 2>&1; then
            echo "::error::Stable tag ${STABLE_TAG} already exists"
            exit 1
          fi

          echo "rc_tag=${RC_TAG}" >> "$GITHUB_OUTPUT"
          echo "rc_version=${RC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "stable_tag=${STABLE_TAG}" >> "$GITHUB_OUTPUT"
          echo "stable_version=${STABLE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure git identity for App bot
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          BOT_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          set -euo pipefail
          BOT_USER="${BOT_SLUG}[bot]"
          BOT_ID="$(gh api "/users/${BOT_USER}" -q .id)"
          git config user.name "${BOT_USER}"
          git config user.email "${BOT_ID}+${BOT_USER}@users.noreply.github.com"

      - name: Create stable promotion commit
        id: promotion
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main "${{ steps.versions.outputs.rc_tag }}"
          PROMOTE_STABLE_NO_PUSH=1 PROMOTE_STABLE_SKIP_TAG=1 ./scripts/promote-stable.sh "${{ steps.versions.outputs.rc_version }}"
          PROMOTION_BRANCH="release/promote-${{ steps.versions.outputs.stable_tag }}"
          git branch -M "${PROMOTION_BRANCH}"
          echo "promotion_branch=${PROMOTION_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Push stable promotion branch
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "${{ steps.promotion.outputs.promotion_branch }}"

      - name: Open stable promotion PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR_BODY="$(cat <<'EOF'
          Promotes the validated RC metadata to stable.

          After this PR is merged into `main`, publish the stable release tag from
          a maintainer workstation with a verified signing key:

          ```bash
          ./scripts/publish-stable-tag.sh ${{ steps.versions.outputs.stable_version }}
          ```

          The stable tag push triggers `release.yml`.
          EOF
          )"

          EXISTING_PR="$(gh pr list \
            --head "${{ steps.promotion.outputs.promotion_branch }}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${EXISTING_PR}" ]; then
            gh pr edit "${EXISTING_PR}" \
              --title "chore(release): ${{ steps.versions.outputs.stable_tag }}" \
              --body "${PR_BODY}"
            echo "Updated existing PR #${EXISTING_PR}"
          else
            gh pr create \
              --base main \
              --head "${{ steps.promotion.outputs.promotion_branch }}" \
              --title "chore(release): ${{ steps.versions.outputs.stable_tag }}" \
              --body "${PR_BODY}"
          fi

      - name: Print summary
        run: |
          echo "Stable promotion PR prepared:"
          echo "  RC tag:     ${{ steps.versions.outputs.rc_tag }}"
          echo "  Stable tag: ${{ steps.versions.outputs.stable_tag }}"
          echo "  Branch:     ${{ steps.promotion.outputs.promotion_branch }}"
          echo "After merge, run ./scripts/publish-stable-tag.sh ${{ steps.versions.outputs.stable_version }} from protected main."
