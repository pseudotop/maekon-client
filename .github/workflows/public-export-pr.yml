name: Public Export PR

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: 'Public export branch to open against main'
        required: true
        type: string
      title:
        description: 'Pull request title'
        required: false
        default: 'chore: refresh public SSOT export'
        type: string
      body:
        description: 'Pull request body'
        required: false
        default: 'Public export snapshot from the internal Maekon Client SSOT.'
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  open-public-export-pr:
    name: Open App-Authored Public Export PR
    runs-on: ubuntu-latest
    # 실측 n=11 p50=10s max=13s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 10
    steps:
      - name: Validate public export branch
        env:
          HEAD_BRANCH: ${{ inputs.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${HEAD_BRANCH}" != codex/public-export-* && "${HEAD_BRANCH}" != release/public-export-* ]]; then
            echo "::error::head_branch must start with codex/public-export- or release/public-export- (got: ${HEAD_BRANCH})"
            exit 1
          fi

      - name: Verify public main ruleset prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ruleset_id="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets" \
            --jq '.[] | select(.name == "main-protection" and .target == "branch" and .enforcement == "active") | .id' \
            | head -n 1)"
          if [[ -z "${ruleset_id}" ]]; then
            echo "::error::public export requires an active branch ruleset named main-protection"
            exit 1
          fi

          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" --jq '(.bypass_actors | length) == 0')" != "true" ]]; then
            echo "::error::main-protection must not allow bypass actors for public export"
            exit 1
          fi

          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" --jq '(.conditions.ref_name.include // []) | index("~DEFAULT_BRANCH") != null')" != "true" ]]; then
            echo "::error::main-protection must apply to the default branch"
            exit 1
          fi

          pull_request_rule_count="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" \
            --jq '[.rules[] | select(.type == "pull_request" and .parameters.require_code_owner_review == true and .parameters.required_approving_review_count >= 1)] | length')"
          if [[ "${pull_request_rule_count}" == "0" ]]; then
            echo "::error::main-protection must require CODEOWNER review and at least one approving review"
            exit 1
          fi

          change_detection_count="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" \
            --jq '[.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[] | select(.context == "Change Detection")] | length')"
          if [[ "${change_detection_count}" == "0" ]]; then
            echo "::error::main-protection must require the Change Detection status check"
            exit 1
          fi

      - name: Generate release App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.MAEKON_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAEKON_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Open or update public export PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          PR_TITLE: ${{ inputs.title }}
          PR_BODY: ${{ inputs.body }}
        shell: bash
        run: |
          set -euo pipefail
          gh api /installation/repositories >/dev/null

          existing_pr="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${HEAD_BRANCH}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${existing_pr}" ]; then
            existing_author="$(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${existing_pr}" \
              --jq '.user.login')"
            if [[ "${existing_author}" != "maekon-release-bot[bot]" && "${existing_author}" != "maekon-release-bot" ]]; then
              echo "::error::existing public export PR #${existing_pr} for ${HEAD_BRANCH} is authored by ${existing_author}. Close it before rerunning Public Export PR so the App can create an App-authored PR."
              exit 1
            fi
            gh pr edit "${existing_pr}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}"
            echo "Updated existing public export PR #${existing_pr}"
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${HEAD_BRANCH}" \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}"
          fi
