name: gRPC Governance

on:
  workflow_dispatch:
  # "gRPC Contract and Readiness Gate" is a REQUIRED ruleset check — it must
  # report on every PR to main. A paths-filtered pull_request trigger means a
  # PR that touches none of the listed paths never produces the check, which
  # the ruleset treats as permanently "expected" and blocks the merge. Run on
  # all PRs to main; the push trigger below stays paths-filtered.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - ".github/actions/rust-cache/**"
      - ".github/workflows/grpc-governance.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "api/proto/**"
      - "crates/maekon-network/src/proto/**"
      - "crates/maekon-web/src/proto/generated/**"
      - "scripts/regenerate-dashboard-protos.sh"
      - "scripts/regenerate-protos.sh"
      - "scripts/verify-grpc-compatibility.sh"
      - "scripts/verify-grpc-mtls-config.sh"
      - "scripts/verify-grpc-readiness.sh"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  grpc-readiness:
    name: gRPC Contract and Readiness Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y \
            libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libnotify-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: ./.github/actions/rust-cache
        with:
          key: grpc-governance

      - name: Create frontend dist stub for Tauri generate_context!()
        run: mkdir -p crates/maekon-web/frontend/dist && echo '<!doctype html><title>Maekon Dashboard</title><h1>Maekon</h1>' > crates/maekon-web/frontend/dist/index.html

      - name: Create sandbox worker stub for Tauri externalBin
        run: |
          TRIPLE=$(rustc -vV | awk '/^host:/ { print $2 }')
          touch "src-tauri/maekon-sandbox-worker-${TRIPLE}"

      # F-RC-C22-01: Consumer Contract proto source presence.
      # Public repository root is already the Maekon client snapshot, so the
      # upstream SSOT comparison runs before export.
      - name: Verify proto source is present
        run: |
          CLIENT_PROTO="api/proto/oneshim/client/v1"
          if [ ! -d "$CLIENT_PROTO" ]; then
            echo "MISSING PROTO SOURCE: $CLIENT_PROTO" >&2
            exit 1
          fi
          echo "OK: public proto source exists."

      # regenerate-protos.sh 의 임시 proto-gen 크레이트(prost-build)가 PATH 의
      # protoc 을 요구한다 — 러너에 기본 설치되어 있지 않다.
      - name: Install protoc (proto regeneration prerequisite)
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y --no-install-recommends protobuf-compiler libprotobuf-dev
          protoc --version

      # F-RC-C22-01: 생성 코드 staleness 감지
      # regenerate-protos.sh 실행 후 git diff 로 커밋된 코드와 비교.
      # build.rs 암묵적 재생성만으로는 필드/enum 누락을 감지하지 못하는 문제 차단.
      - name: Regenerate proto code and verify no diff (F-RC-C22-01)
        run: |
          ./scripts/regenerate-protos.sh
          if ! git diff --quiet -- crates/maekon-network/src/proto/generated/; then
            echo "STALE GENERATED CODE: regenerate-protos.sh 결과가 커밋된 파일과 다릅니다." >&2
            git diff -- crates/maekon-network/src/proto/generated/ >&2
            echo "" >&2
            echo "  scripts/regenerate-protos.sh 를 실행하고" >&2
            echo "  생성된 파일을 커밋하세요." >&2
            exit 1
          fi
          echo "OK: 생성된 proto 코드가 최신입니다."

      # F-RC-C34-01: Dashboard proto 생성 코드 drift 감지
      # regenerate-dashboard-protos.sh 실행 후 git diff 로 커밋된 코드와 비교.
      # build.rs watch path 가 maekon/ -> oneshim/ 으로 정정됨 (cycle 34 fix).
      - name: Regenerate dashboard protos (F-RC-C34-01)
        run: bash scripts/regenerate-dashboard-protos.sh
      - name: Check dashboard proto drift (F-RC-C34-01)
        run: |
          if ! git diff --quiet crates/maekon-web/src/proto/generated/; then
            echo "::error::Dashboard proto generated code drift detected"
            git diff crates/maekon-web/src/proto/generated/
            echo ""
            echo "  scripts/regenerate-dashboard-protos.sh 를 실행하고"
            echo "  생성된 파일을 커밋하세요."
            exit 1
          fi
          echo "OK: Dashboard proto 생성 코드가 최신입니다."

      - name: Run gRPC compatibility matrix gate
        run: ./scripts/verify-grpc-compatibility.sh

      - name: Run gRPC mTLS config validation
        run: ./scripts/verify-grpc-mtls-config.sh

      - name: Run gRPC readiness verification
        run: ./scripts/verify-grpc-readiness.sh
