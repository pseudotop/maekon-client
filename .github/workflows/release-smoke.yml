name: Release Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  # Same cargo network tolerance as release.yml. The installer packaging
  # rehearsal below installs cargo-wix and tauri-cli from crates.io, and a
  # transient fetch error that the tag build would retry must not fail the
  # rehearsal (#14011).
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  changes:
    name: Release Smoke Change Detection
    runs-on: ubuntu-latest
    # 실측 n=12 p50=5s max=7s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/gha-detect-changes.sh

  frontend-assets:
    name: Build Release Smoke Frontend Assets
    needs: [changes]
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    # 실측 n=6 p50=42s max=49s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          version: '10'
          lockfile-path: crates/maekon-web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: crates/maekon-web/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend bundle
        working-directory: crates/maekon-web/frontend
        run: pnpm build

      - name: Verify frontend build output
        run: test -f crates/maekon-web/frontend/dist/index.html

      - name: Package frontend dist artifact
        run: tar -czf crates/maekon-web/frontend/frontend-dist.tar.gz -C crates/maekon-web/frontend dist

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-smoke-frontend-dist
          path: crates/maekon-web/frontend/frontend-dist.tar.gz
          if-no-files-found: error

  smoke:
    name: Build Release Smoke (${{ matrix.name }})
    needs: [changes, frontend-assets]
    if: >
      always() &&
      needs.frontend-assets.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            # Same image as release.yml build-release (#11246 floor).
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          # #11595: `macos-14` 는 Apple Silicon 이다. x86_64 를 그 위에서 만들면
          # 크로스빌드가 되어 배포 슬라이스가 Intel 에서 한 번도 실행되지 않는다
          # (Rosetta 는 AVX 를 지원하지 않아 whisper/GGML 의 x86 SIMD 경로가 영영
          # 안 돈다). `macos-15-intel` 은 실제 Intel hosted 러너다 — 되돌리지 말 것.
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # Same values as the Windows row of release.yml build-release; the
            # installer packaging rehearsal below reads them (#14011).
            artifact_name: maekon-windows-x64
            asset_ext: zip
    runs-on: ${{ matrix.os }}
    # 실측 n=13 max=1868s (windows 행) + n=5 max=1042s (release.yml 의 같은 패키징
    # 스텝) = 2910s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    # #14011: the Windows row now also rehearses installer packaging. No run of
    # the combined row exists yet, so the budget adds the two measured parts;
    # re-measure after the first live dispatch.
    timeout-minutes: 100
    environment: desktop-smoke
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download release frontend dist artifact
        uses: ./.github/actions/download-artifact
        with:
          github-token: ${{ github.token }}
          name: release-smoke-frontend-dist
          path: crates/maekon-web/frontend

      - name: Extract and verify release frontend dist artifact
        shell: bash
        run: |
          if [ ! -f crates/maekon-web/frontend/frontend-dist.tar.gz ]; then
            echo "::error::release-smoke frontend dist artifact is missing"
            exit 1
          fi
          rm -rf crates/maekon-web/frontend/dist
          tar -xzf crates/maekon-web/frontend/frontend-dist.tar.gz -C crates/maekon-web/frontend
          test -f crates/maekon-web/frontend/dist/index.html
          if grep -Eq '^\s*<html></html>\s*$' crates/maekon-web/frontend/dist/index.html; then
            echo "::error::release-smoke frontend dist artifact looks like a placeholder"
            exit 1
          fi

      - name: Configure OpenSSL for SQLCipher (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-openssl

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y \
            libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libnotify-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Verify DEB metadata assets
        if: runner.os == 'Linux'
        run: ./scripts/verify-deb-metadata.sh

      # #11595: 라벨이 아니라 **실제 러너 아키텍처**를 본다. `macos-x64` 레인이
      # Apple Silicon 으로 되돌아가면 x86_64 는 크로스빌드가 되고 실행 검증이
      # 사라지는데, 레인 이름은 그대로라 아무도 눈치채지 못한다. 그 조용한 퇴행을
      # 여기서 red 로 만든다.
      - name: Assert the x86_64 macOS lane runs on real Intel hardware
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          arch="$(uname -m)"
          echo "runner arch: $arch"
          if [ "$arch" != "x86_64" ]; then
            echo "::error::x86_64-apple-darwin 레인이 '$arch' 러너에서 돈다 — 크로스빌드로 퇴행했다 (#11595)"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: ./.github/actions/rust-cache
        with:
          key: release-smoke-${{ matrix.target }}
          # #11369: 저장하지 않는다. 실측 11회에서 **어떤 job 도 자기 키를
          # 복원한 적이 없고**, 실제 공유는 restore-key `<OS>-rust-` 폴백으로
          # 이미 일어난다. 그런데 저장은 호출처마다 따로 해서 10 GiB 예산을
          # 서로 밀어냈다 — `Linux-rust-ci-test` 축출이 그 증상이었다.
          # 복원은 그대로 두므로 이 job 이 받는 것은 달라지지 않는다.
          save: "false"

      - name: Build sandbox worker sidecar for Tauri externalBin
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ./scripts/cargo-cache.sh build --locked --release --target "$TARGET" -p maekon-sandbox-worker
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SOURCE="target/${TARGET}/release/maekon-sandbox-worker.exe"
            DEST="src-tauri/maekon-sandbox-worker-${TARGET}.exe"
            test -f "$SOURCE"
            cp "$SOURCE" "$DEST"
          else
            SOURCE="target/${TARGET}/release/maekon-sandbox-worker"
            DEST="src-tauri/maekon-sandbox-worker-${TARGET}"
            test -x "$SOURCE"
            cp "$SOURCE" "$DEST"
            chmod +x "$DEST"
          fi

      - name: Build release smoke
        shell: bash
        # Mirror release.yml: scope to `-p maekon-app` and use the same
        # OS-conditional feature set. Linux also needs `systemd-notify` because
        # the released DEB ships a Type=notify unit. All three ship `lan-sync`
        # (#8056) and `stt,download` (#8053) to mirror the shipped feature set.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            FEATURES="grpc,systemd-notify,linux-sandbox,lan-sync,stt,download"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            FEATURES="grpc,windows-sandbox,lan-sync,stt,download"
          else
            FEATURES="grpc,lan-sync,stt,download"
          fi
          ./scripts/cargo-cache.sh build --locked --release --target "$TARGET" -p maekon-app --features "$FEATURES"

      - name: Binary smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/maekon"
          test -x "$BIN"
          FILE_INFO="$(file "$BIN")"
          echo "Binary: $FILE_INFO"
          case "$(uname -s)" in
            Darwin) echo "$FILE_INFO" | grep -qE "Mach-O|universal" ;;
            Linux)  echo "$FILE_INFO" | grep -qE "ELF" ;;
          esac

      - name: Binary smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/maekon.exe"
          if (!(Test-Path $bin)) {
            throw "binary missing: $bin"
          }
          $sz = (Get-Item $bin).Length
          if ($sz -lt 1MB) { throw "binary too small: $sz bytes" }
          Write-Host "Binary OK: $bin ($([math]::Round($sz / 1MB, 1)) MB)"

      - name: GUI bootstrap smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/maekon.exe"
          $outLog = Join-Path $env:RUNNER_TEMP "maekon-release-smoke-win.out.log"
          $errLog = Join-Path $env:RUNNER_TEMP "maekon-release-smoke-win.err.log"
          $mergedLog = Join-Path $env:RUNNER_TEMP "maekon-release-smoke-win.log"

          $proc = Start-Process -FilePath $bin -PassThru -WindowStyle Hidden -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          Start-Sleep -Seconds 3

          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Wait-Process -Id $proc.Id -ErrorAction SilentlyContinue
          }

          $stdout = if (Test-Path $outLog) { Get-Content $outLog -Raw } else { "" }
          $stderr = if (Test-Path $errLog) { Get-Content $errLog -Raw } else { "" }
          $combined = "$stdout`n$stderr"
          Set-Content -Path $mergedLog -Value $combined

          $panicPattern = "Cannot start a runtime from within a runtime|Cannot drop a runtime|panicked at|SIGABRT|stack backtrace"
          if ($combined -match $panicPattern) {
            Write-Host "GUI bootstrap smoke detected runtime/panic failure"
            if (Test-Path $outLog) { Get-Content $outLog }
            if (Test-Path $errLog) { Get-Content $errLog }
            exit 1
          }
          Write-Host "GUI bootstrap smoke OK (rc=$($proc.ExitCode))"

      - name: GUI bootstrap smoke (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/maekon"
          LOG="$RUNNER_TEMP/maekon-release-smoke.log"

          set +e
          MAEKON_DISABLE_TRAY=1 "$BIN" >"$LOG" 2>&1 &
          PID=$!
          sleep 3
          if kill -0 "$PID" >/dev/null 2>&1; then
            kill "$PID" >/dev/null 2>&1 || true
            GRACE=0
            while kill -0 "$PID" >/dev/null 2>&1 && [[ "$GRACE" -lt 5 ]]; do
              sleep 1
              GRACE=$((GRACE + 1))
            done
            if kill -0 "$PID" >/dev/null 2>&1; then
              echo "SIGTERM did not terminate process $PID after 5s; sending SIGKILL"
              kill -9 "$PID" >/dev/null 2>&1 || true
            fi
          fi
          wait "$PID" 2>/dev/null
          RC=$?
          set -e

          if grep -qE "Cannot start a runtime from within a runtime|Cannot drop a runtime|panicked at|SIGABRT|stack backtrace" "$LOG"; then
            if ! grep -qE "WKWebView|no display|NSApplication" "$LOG" || \
               grep -qE "Cannot start a runtime|Cannot drop a runtime|SIGABRT|stack backtrace" "$LOG"; then
              echo "GUI bootstrap smoke detected runtime/panic failure"
              cat "$LOG"
              exit 1
            fi
          fi

          if [[ "$RC" -eq 139 || "$RC" -eq 134 ]]; then
            echo "GUI bootstrap smoke crashed: rc=$RC"
            cat "$LOG"
            exit 1
          fi

          echo "GUI bootstrap smoke OK (rc=$RC)"

      # ── Windows installer packaging rehearsal (#14011) ─────────────────────
      # From here to "Record Windows Authenticode policy state" this row runs
      # the Windows packaging sequence of release.yml's `build-release` job,
      # step for step: same names, same bodies, same order. release.yml runs
      # that sequence only after the tag is pushed, so a break in it strands
      # the tag. The prebuilt closure failed on the v0.0.1-rc.7 tag (#10698,
      # `maekon.exe -> mmdevapi.dll`) before this row inspected imports at
      # all, and the packaged closure step failed on the v0.0.1-rc.11 tag
      # (#12776) while this row still checked `maekon.exe` alone and packaged
      # nothing.
      #
      # Do not edit one side alone. The internal SSOT guard
      # `test_maekon_release_smoke_installer_parity.py` compares these steps
      # with release.yml and fails when either workflow drifts. The tag-bound
      # `Verify MSI version`, the checksums and the uploads stay in release.yml
      # only: nothing built here is uploaded, and the rehearsal reads no secret.
      # The Authenticode record belongs here only while the policy state is
      # `prepared_not_active` (report mode). Once it is `active` that step
      # demands signed artifacts, which this workflow can never have, and it
      # must leave the rehearsal.
      - name: Stage signed Microsoft VC runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/stage-windows-vc-runtime.ps1 `
            -PayloadRoot "target/${{ matrix.target }}/release"

      - name: Verify prebuilt Windows runtime DLL closure
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw "Visual Studio C++ tools are required for PE closure verification" }
          $dumpbins = @(Get-ChildItem -Path (Join-Path $installation "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse)
          $dumpbin = $dumpbins |
            Where-Object { $_.FullName -match '[\\/]Hostx64[\\/]x64[\\/]dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (!$dumpbin) { $dumpbin = $dumpbins | Sort-Object FullName -Descending | Select-Object -First 1 }
          if (!$dumpbin) { throw "dumpbin.exe was not found under $installation" }
          node scripts/verify-windows-runtime-closure.mjs `
            --payload-root "target/${{ matrix.target }}/release" `
            --dependency-tool $dumpbin.FullName
          if ($LASTEXITCODE -ne 0) { throw "Prebuilt runtime closure verification failed with exit $LASTEXITCODE" }

      - name: Validate WiX assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "src-tauri/wix/main.wxs")) {
            Write-Error "Missing WiX manifest: src-tauri/wix/main.wxs"
            exit 1
          }
          if (!(Test-Path "src-tauri/wix/license.rtf")) {
            Write-Error "Missing WiX license file: src-tauri/wix/license.rtf"
            exit 1
          }
          python scripts/verify_wix_installer_assets.py

      - name: Install cargo-wix
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/cargo-cache.sh install cargo-wix --version 0.3.9 --locked --force

      - name: Install Tauri CLI
        if: runner.os == 'Windows'
        shell: bash
        # The version pin and --locked are explained next to the same step in
        # release.yml.
        run: ./scripts/cargo-cache.sh install tauri-cli --version 2.11.2 --locked --force

      - name: Build MSI installer
        if: runner.os == 'Windows'
        shell: bash
        run: bash ./scripts/build-localized-msi.sh "${{ matrix.target }}" "../target/${{ matrix.target }}/release" all

      - name: Verify localized MSI wizard metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msiFiles = @(Get-ChildItem -Path "target/wix","src-tauri/target/wix" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName)
          ./scripts/verify-localized-msi-metadata.ps1 -MsiPath $msiFiles.FullName

      - name: Build NSIS setup installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_PATH="${RUNNER_TEMP}/tauri-nsis-ci-config.json"
          RUNTIME_ROOT="$(cygpath -m "$(pwd)/target/${{ matrix.target }}/release")"
          printf '{"build":{"beforeBuildCommand":""},"bundle":{"resources":{"%s/vcruntime140.dll":"vcruntime140.dll","%s/vcruntime140_1.dll":"vcruntime140_1.dll"}}}\n' \
            "$RUNTIME_ROOT" "$RUNTIME_ROOT" > "$CONFIG_PATH"
          ./scripts/cargo-cache.sh tauri build \
            --bundles nsis \
            --target ${{ matrix.target }} \
            --features grpc,windows-sandbox,lan-sync,stt,download \
            --ci \
            --config "$CONFIG_PATH"

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/maekon.exe,target/${{ matrix.target }}/release/maekon-sandbox-worker.exe,target/${{ matrix.target }}/release/vcruntime140.dll,target/${{ matrix.target }}/release/vcruntime140_1.dll -DestinationPath dist/${{ matrix.artifact_name }}.${{ matrix.asset_ext }}

      - name: Verify packaged Windows runtime DLL closure
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw "Visual Studio C++ tools are required for PE closure verification" }
          $dumpbins = @(Get-ChildItem -Path (Join-Path $installation "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse)
          $dumpbin = $dumpbins |
            Where-Object { $_.FullName -match '[\\/]Hostx64[\\/]x64[\\/]dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (!$dumpbin) { $dumpbin = $dumpbins | Sort-Object FullName -Descending | Select-Object -First 1 }
          if (!$dumpbin) { throw "dumpbin.exe was not found under $installation" }

          $zipRoot = Join-Path $env:RUNNER_TEMP "maekon-zip-runtime-closure"
          Remove-Item -LiteralPath $zipRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath "dist/${{ matrix.artifact_name }}.${{ matrix.asset_ext }}" -DestinationPath $zipRoot
          node scripts/verify-windows-runtime-closure.mjs --payload-root $zipRoot --dependency-tool $dumpbin.FullName
          if ($LASTEXITCODE -ne 0) { throw "ZIP runtime closure verification failed with exit $LASTEXITCODE" }

          $msiFiles = @(Get-ChildItem -Path "target/wix","src-tauri/target/wix" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName)
          if ($msiFiles.Count -ne 2) { throw "Expected exactly two localized MSI files, found $($msiFiles.Count)" }
          foreach ($locale in @("en-US", "ko-KR")) {
            if (@($msiFiles | Where-Object { $_.Name -like "*-$locale-*" }).Count -ne 1) {
              throw "Expected exactly one $locale MSI file"
            }
          }
          foreach ($msi in $msiFiles) {
            $msiRoot = Join-Path $env:RUNNER_TEMP "maekon-msi-runtime-closure-$($msi.BaseName)"
            Remove-Item -LiteralPath $msiRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $msiRoot -Force | Out-Null
            # msiexec.exe is a GUI-subsystem program, so the call operator
            # returns before extraction finishes and never sets $LASTEXITCODE.
            # v0.0.1-rc.11 checked an empty directory 0.11 s later, then read
            # that check's stale exit code as an extraction failure (#12776).
            $extract = Start-Process -FilePath msiexec.exe -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$msiRoot`"") -Wait -PassThru
            if ($extract.ExitCode -ne 0) { throw "MSI administrative extraction failed for $($msi.Name) with exit $($extract.ExitCode)" }
            node scripts/verify-windows-runtime-closure.mjs --payload-root $msiRoot --dependency-tool $dumpbin.FullName
            if ($LASTEXITCODE -ne 0) { throw "MSI runtime closure verification failed for $($msi.Name) with exit $LASTEXITCODE" }
          }

          $setup = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/nsis","src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$setup) { throw "No NSIS setup file found for runtime closure verification" }
          $nsisRoot = Join-Path $env:RUNNER_TEMP "maekon-nsis-runtime-closure"
          Remove-Item -LiteralPath $nsisRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $nsisRoot -Force | Out-Null
          & 7z.exe x "-o$nsisRoot" -y $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "NSIS extraction failed with exit $LASTEXITCODE" }
          node scripts/verify-windows-runtime-closure.mjs --payload-root $nsisRoot --dependency-tool $dumpbin.FullName
          if ($LASTEXITCODE -ne 0) { throw "NSIS runtime closure verification failed with exit $LASTEXITCODE" }

      - name: Record Windows Authenticode policy state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $policy = Get-Content -LiteralPath "supply-chain/windows-authenticode-policy.json" -Raw | ConvertFrom-Json
          $mode = switch ($policy.enforcement_state) {
            "prepared_not_active" { "Report" }
            "active" { "Required" }
            default { throw "Unknown Authenticode enforcement state: $($policy.enforcement_state)" }
          }
          $msiFiles = @(Get-ChildItem -Path "target/wix","src-tauri/target/wix" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue)
          $setupFiles = @(Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/nsis","src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue)
          $artifacts = @(
            "target/${{ matrix.target }}/release/maekon.exe",
            "target/${{ matrix.target }}/release/maekon-sandbox-worker.exe"
          ) + $msiFiles.FullName + $setupFiles.FullName
          $verification = @{
            Path = $artifacts
            Mode = $mode
            ExpectedPublisherSubject = [string] $policy.publisher_subject
            ReceiptPath = "dist/windows-authenticode-receipt.json"
          }
          if ($mode -eq "Required") {
            $verification.RequireTimestamp = $true
            $verification.RequireSignTool = $true
          }
          ./scripts/verify-windows-authenticode.ps1 @verification

      - name: Sanitize macOS GUI smoke evidence
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          SANITIZED_DIR="$RUNNER_TEMP/maekon-release-smoke-sanitized"
          RELEASE_TAG="${GITHUB_REF_NAME:-v0.0.0-e19-smoke}"
          if [[ "$RELEASE_TAG" != v* ]]; then
            RELEASE_TAG="v0.0.0-e19-smoke"
          fi
          ARTIFACT_CHECKSUM="sha256:$(printf '%s' "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')"
          python3 scripts/sanitize_desktop_evidence.py \
            --input "$RUNNER_TEMP/maekon-release-smoke.log" \
            --input-id release-smoke-log-${{ matrix.name }} \
            --artifact-kind log_excerpt \
            --output-dir "$SANITIZED_DIR" \
            --commit-sha "$GITHUB_SHA" \
            --release-tag "$RELEASE_TAG" \
            --artifact-checksum "$ARTIFACT_CHECKSUM" \
            --runner-label release-smoke-${{ matrix.name }} \
            --cleanup-status pass

      - name: Sanitize Windows GUI smoke evidence
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $sanitizedDir = Join-Path $env:RUNNER_TEMP "maekon-release-smoke-win-sanitized"
          $releaseTag = $env:GITHUB_REF_NAME
          if (-not $releaseTag -or -not $releaseTag.StartsWith("v")) {
            $releaseTag = "v0.0.0-e19-smoke"
          }
          $shaBytes = [System.Text.Encoding]::UTF8.GetBytes($env:GITHUB_SHA)
          $hashBytes = [System.Security.Cryptography.SHA256]::HashData($shaBytes)
          $artifactChecksum = "sha256:" + ([System.BitConverter]::ToString($hashBytes).Replace("-", "").ToLowerInvariant())
          python scripts/sanitize_desktop_evidence.py `
            --input (Join-Path $env:RUNNER_TEMP "maekon-release-smoke-win.log") `
            --input-id "release-smoke-log-${{ matrix.name }}" `
            --artifact-kind log_excerpt `
            --output-dir $sanitizedDir `
            --commit-sha $env:GITHUB_SHA `
            --release-tag $releaseTag `
            --artifact-checksum $artifactChecksum `
            --runner-label "release-smoke-${{ matrix.name }}" `
            --cleanup-status pass

      - name: Upload macOS GUI smoke sanitized bundle
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-smoke-sanitized-bundle-${{ matrix.name }}
          path: ${{ runner.temp }}/maekon-release-smoke-sanitized
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows GUI smoke sanitized bundle
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-smoke-sanitized-bundle-${{ matrix.name }}
          path: ${{ runner.temp }}/maekon-release-smoke-win-sanitized
          if-no-files-found: ignore
          retention-days: 7
