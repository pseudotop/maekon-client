name: Integrity Gates

on:
  # Temporarily manual-only while local Maekon TC work is in progress.
  # Restore push/schedule triggers before re-enabling CI.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  integrity:
    name: Standalone Integrity Gates
    runs-on: ubuntu-latest
    # 실측 n=10 p50=1095s max=1361s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y \
            libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libnotify-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: ./.github/actions/rust-cache
        with:
          key: integrity-gates

      - name: Install tooling
        run: |
          ./scripts/cargo-cache.sh install cargo-audit --locked --force
          ./scripts/cargo-cache.sh install cargo-deny --locked --force
          ./scripts/cargo-cache.sh install cargo-vet --locked --force
          ./scripts/cargo-cache.sh install cargo-cyclonedx --locked --force
          python3 -m pip install --upgrade pynacl

      - name: Create frontend dist stub for Tauri generate_context!()
        run: mkdir -p crates/maekon-web/frontend/dist && echo '<!doctype html><title>Maekon Dashboard</title><h1>Maekon</h1>' > crates/maekon-web/frontend/dist/index.html

      - name: Create sandbox worker stub for Tauri externalBin
        # verify-integrity.sh invokes a workspace cargo build that walks
        # the Tauri externalBin manifest. Tauri's build script aborts when
        # the per-target sandbox-worker binary is missing — the same stub
        # other CI jobs (Test, Release Smoke matrix builds) already create.
        # Job is pinned to ubuntu-latest so the target triple is constant.
        run: touch src-tauri/maekon-sandbox-worker-x86_64-unknown-linux-gnu

      - name: Run integrity verification script
        env:
          INTEGRITY_VET_MODE: strict
        run: ./scripts/verify-integrity.sh

      - name: Run key rotation rehearsal script
        run: ./scripts/rehearse-key-rotation.sh

      - name: Upload integrity artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: integrity-artifacts
          path: artifacts/integrity/
