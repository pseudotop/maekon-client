name: Security & Compliance

on:
  # #6442 F19: the public-export supply-chain gate now runs automatically on PRs and
  # pushes to main — not workflow_dispatch-only — so the self-contained cargo-audit /
  # cargo-deny / cargo-vet / exemption-expiry checks gate every export change. Manual
  # dispatch is kept for ad-hoc re-validation.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    name: Supply Chain Controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libnotify-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install tooling
        run: |
          # F-SC-C33-03: 도구 버전 명시 고정 — CI 비결정성 방지
          ./scripts/cargo-cache.sh install cargo-audit --locked --force
          ./scripts/cargo-cache.sh install cargo-deny --version 0.19.7 --locked --force
          ./scripts/cargo-cache.sh install cargo-vet --version 0.10.2 --locked --force
          ./scripts/cargo-cache.sh install cargo-about --locked --features cli
          ./scripts/cargo-cache.sh install cargo-cyclonedx --locked --force

      - name: RustSec audit
        # F-SC-04: suppression moved to deny.toml [advisories].ignore
        # so local and CI behavior are identical.
        run: ./scripts/cargo-cache.sh audit

      - name: License/advisory/source policy
        run: ./scripts/cargo-cache.sh deny check licenses advisories sources bans

      # #6442 F19: real, self-contained exemption-expiry gate. verify_exemption_expiry.py
      # now ships in the export (clients/maekon-client/scripts/supply_chain/), so the
      # public gate enforces the deny.toml + cargo-vet config Review-by dates itself —
      # no longer relying on the parent-only cargo-supply-chain.yml. Hard gate
      # (--fail-on-expired): a lapsed review-by date fails the export build.
      - name: Verify exemption expiry dates (F-SC-C30-03)
        run: |
          python3 scripts/supply_chain/verify_exemption_expiry.py \
            --fail-on-expired \
            --deny-file deny.toml \
            supply-chain/config.toml

      # F-SC-01: the 3-field annotation schema (notes + reason + expiry) is still
      # deprecated (exits 0 with a warning) — OOS-TBD F-SC-C34-01 tracks the backfill +
      # strict re-enable. The active expiry enforcement is the self-contained step above.
      - name: Exemption annotation gate (F-SC-01)
        run: ./scripts/ci/check-vet-exemption-annotations.sh

      # F-SC-02: continue-on-error removed — cargo-vet failures now block merges.
      # Grace period (90-day expiry 2026-08-22) covers the 947 baseline entries;
      # any new un-annotated exemption will be caught by the gate above first.
      - name: Supply-chain policy (cargo-vet, advisory)
        run: ./scripts/cargo-cache.sh vet check

      - name: Generate third-party notice
        run: ./scripts/cargo-cache.sh about generate --workspace --offline --threshold 1.0 --config about.toml about.hbs > THIRD_PARTY_NOTICES.html

      - name: Generate SBOM (CycloneDX)
        run: |
          mkdir -p artifacts/sbom
          # src-tauri は crates/ 配下ではなく repository root の src-tauri/ に存在するため
          # find 対象に src-tauri を追加する (F-SC-C20-02)
          find crates src-tauri -name 'sbom.cdx.json' -delete 2>/dev/null || find crates -name 'sbom.cdx.json' -delete
          ./scripts/cargo-cache.sh cyclonedx --format json --override-filename sbom.cdx --manifest-path Cargo.toml

          sbom_count=0
          # src-tauri は workspace メンバーだが crates/ 配下ではないため別途検索が必要 (F-SC-C20-02)
          while IFS= read -r sbom_path; do
            crate_name="$(basename "$(dirname "${sbom_path}")")"
            cp "${sbom_path}" "artifacts/sbom/${crate_name}.sbom.cdx.json"
            sbom_count=$((sbom_count + 1))
          done < <({ find crates -name 'sbom.cdx.json'; find src-tauri -name 'sbom.cdx.json' 2>/dev/null || true; } | sort)

          if [ "${sbom_count}" -eq 0 ]; then
            echo "No SBOM files were generated by cargo-cyclonedx" >&2
            exit 1
          fi

      - name: Upload compliance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: compliance-artifacts
          path: |
            THIRD_PARTY_NOTICES.html
            artifacts/sbom/*.json
          retention-days: 90  # F-SC-C33-04: SBOM/NOTICES 90일 보관 (감사 추적 요건)
