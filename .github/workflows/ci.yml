name: CI

on:
  # Restored after the rc.6 un-bitrot campaign drove the full suite green —
  # required ruleset checks must come from pull_request/push runs.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  # `-W warnings`, NOT `-D`: the vendored `patches/` crates (muda/tao/wry) are
  # uncapped local path deps — verified via `cargo build -v` that cargo emits
  # no `--cap-lints allow` for their rustc invocations (unlike plain
  # registry/git deps) — so a global `-D` via RUSTFLAGS gates third-party code
  # we don't lint-own (confirmed by forcing `RUSTFLAGS=-D warnings`: `tao` and
  # `wry` hard-fail on their macOS unnecessary-`unsafe`-block warnings). This
  # env var is intentionally left at `-W` (#7743, ctd-W3 A2).
  #
  # First-party deny now has TWO independent layers, neither of which touches
  # `patches/`:
  #   1. `Cargo.toml`'s `[workspace.lints.rust]` (`unused`, `dead_code` =
  #      "deny") — every first-party crate opts in via `lints.workspace =
  #      true` (#7719), so this is baked into the MANIFEST and applies on
  #      every platform's plain `cargo build`/`check`/`test`, not just this
  #      job. Verified empirically: a manifest-configured deny on a
  #      specific/named lint or lint GROUP survives a later, broader
  #      `RUSTFLAGS: -W warnings` (rustc keeps the more specific level) — only
  #      a manifest-level `warnings = "deny"` naming the IDENTICAL group would
  #      be overridden by this env var, which is why the table below denies
  #      `unused`/`dead_code` specifically rather than the `warnings` group.
  #   2. This job's `check` sub-job's explicit
  #      `clippy --workspace --all-targets -- -D warnings` steps (ubuntu-only)
  #      — clippy's trailing `-- <flags>` apply only to the directly-selected
  #      workspace packages, never to `patches/` path dependencies (verified:
  #      the identical invocation only WARNS, never errors, on the vendored
  #      `tray-icon`/`tauri-runtime-wry` crates).
  # A weekly macOS/Windows leg of the SAME clippy invocation now also runs in
  # the PARENT monorepo's internal weekly CI (not part of this public export —
  # see `patches/README.md`'s "Weekly audit lane" section, which documents it
  # from the parent-repo side), so platform-`#[cfg(...)]` first-party code
  # gets real deny-linting too, not just execution (see the `test-platform`
  # job below).
  RUSTFLAGS: -W warnings

jobs:
  changes:
    name: Change Detection
    runs-on: ubuntu-latest
    # 실측 n=12 p50=8s max=9s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
      release_metadata_only: ${{ steps.filter.outputs.release_metadata_only }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify public export PR author
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'codex/public-export-') || startsWith(github.head_ref, 'release/public-export-')) }}
        env:
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$PR_AUTHOR_LOGIN" != "maekon-release-bot[bot]" && "$PR_AUTHOR_LOGIN" != "maekon-release-bot" ]]; then
            echo "::error::public export PR ${PR_HEAD_REF} must be opened by maekon-release-bot via the Public Export PR workflow; got ${PR_AUTHOR_LOGIN} (${PR_AUTHOR_TYPE}). Close the manual PR and dispatch the workflow instead of gh pr create."
            exit 1
          fi
          if [[ "$PR_AUTHOR_TYPE" != "Bot" ]]; then
            echo "::error::public export PR ${PR_HEAD_REF} must be App-authored; got author type ${PR_AUTHOR_TYPE}."
            exit 1
          fi

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/gha-detect-changes.sh

  frontend:
    name: Frontend (build + e2e)
    needs: [changes]
    # Required ruleset check: must REPORT on every PR (a skipped required check
    # blocks the merge under the branch ruleset). Always run on pull_request;
    # keep the path-gated optimization for push/dispatch only.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      (github.event_name != 'pull_request' &&
      needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    # 실측 n=11 p50=307s max=324s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          version: '10'
          lockfile-path: crates/maekon-web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: crates/maekon-web/frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: crates/maekon-web/frontend
        run: pnpm lint

      - name: TypeScript type check
        working-directory: crates/maekon-web/frontend
        run: npx tsc --noEmit

      - name: Run frontend unit tests (vitest)
        working-directory: crates/maekon-web/frontend
        run: pnpm test

      - name: Verify route integrity
        run: ./scripts/verify-route-integrity.sh

      - name: Build frontend bundle
        working-directory: crates/maekon-web/frontend
        run: pnpm build

      - name: Verify frontend build output
        run: test -f crates/maekon-web/frontend/dist/index.html

      - name: Build Storybook review catalog
        working-directory: crates/maekon-web/frontend
        run: pnpm build-storybook:review

      - name: Verify Storybook build output
        run: test -f crates/maekon-web/frontend/storybook-review-static/index.html

      - name: Install Playwright browser
        working-directory: crates/maekon-web/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run web dashboard E2E tests
        working-directory: crates/maekon-web/frontend
        run: pnpm test:e2e

      - name: Upload Playwright report artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-playwright-artifacts
          path: |
            crates/maekon-web/frontend/playwright-report
            crates/maekon-web/frontend/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Package frontend dist artifact
        run: tar -czf crates/maekon-web/frontend/frontend-dist.tar.gz -C crates/maekon-web/frontend dist

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-dist-bundle
          path: crates/maekon-web/frontend/frontend-dist.tar.gz
          if-no-files-found: error

      - name: Package Storybook artifact
        run: tar -czf crates/maekon-web/frontend/storybook-review-static.tar.gz -C crates/maekon-web/frontend storybook-review-static

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-storybook-bundle
          path: crates/maekon-web/frontend/storybook-review-static.tar.gz
          if-no-files-found: error

  check:
    name: Check (fmt + clippy)
    needs: [changes]
    # Required ruleset check: must REPORT on every PR (a skipped required check
    # blocks the merge under the branch ruleset). Always run on pull_request;
    # keep the path-gated optimization for push/dispatch only.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    # 실측 n=12 p50=1125s max=2352s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y \
            libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libnotify-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: ./.github/actions/rust-cache
        with:
          key: ci-check

      - name: Check formatting (advisory — does not block external PRs)
        # House-style, like the hedge gate (#6346): annotate external PRs but never
        # hard-block — `cargo fmt` is a one-command fix and a maintainer runs it
        # while porting. The source-of-truth (parent) `House-style gate` enforces
        # fmt, so exported source is always clean regardless of this advisory step.
        continue-on-error: true
        run: ./scripts/cargo-cache.sh fmt --all -- --check

      - name: Verify architecture dependency direction
        run: ./scripts/check-architecture-deps.sh

      - name: Verify consent erasure barrier (#4928)
        run: ./scripts/check-consent-erasure-barrier.sh

      - name: Verify web contract boundary
        run: ./scripts/verify-web-contract-boundary.sh

      - name: Verify HTTP interface manifest
        run: ./scripts/verify-http-interface-manifest.sh

      - name: Verify Tauri IPC command manifests
        run: node ./scripts/validate-ipc-command-manifests.mjs

      - name: Verify HTTP OpenAPI snapshot sync
        run: ./scripts/verify-http-openapi-sync.sh

      - name: Generate HTTP OpenAPI snapshot
        run: ./scripts/generate-http-openapi.sh dist/maekon-web.v1.openapi.yaml

      - name: Upload HTTP OpenAPI snapshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maekon-web-v1-openapi
          path: dist/maekon-web.v1.openapi.yaml
          if-no-files-found: error

      - name: Verify commit message hygiene
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: ./scripts/verify-commit-message-hygiene.sh "$PR_BASE_SHA" "$HEAD_SHA"

      - name: Verify CI build artifact guardrails
        run: bash scripts/ci/check-build-artifact-guardrails.sh

      - name: Verify public/private CI split
        run: bash scripts/ci/check-public-private-ci-split.sh

      - name: CI grep heuristic for #[instrument] on sensitive fns
        run: bash scripts/ci/grep-no-instrument-on-sensitive-fns.sh

      - name: Create frontend dist stub for Tauri generate_context!()
        run: mkdir -p crates/maekon-web/frontend/dist && echo '<!doctype html><title>Maekon Dashboard</title><h1>Maekon</h1>' > crates/maekon-web/frontend/dist/index.html

      - name: Create sandbox worker stub for Tauri externalBin
        run: |
          TRIPLE=$(rustc -vV | awk '/^host:/ { print $2 }')
          touch "src-tauri/maekon-sandbox-worker-${TRIPLE}"

      - name: Run clippy (standalone)
        run: ./scripts/cargo-cache.sh clippy --workspace --all-targets -- -D warnings -A clippy::empty_docs -A clippy::derivable_impls -A clippy::type_complexity -A clippy::unwrap_used -A clippy::expect_used

      # #5734 / C3 adversarial finding: no CI cell built maekon-app with
      # --no-default-features, so breakage of that cell landed silently
      # (#5032 history; the cell was found pre-broken again in E35 C1).
      # A plain `cargo check` is intentional — this guards compile health of
      # the no-network/no-analysis build, not its (different) warning set.
      - name: Check maekon-app (--no-default-features)
        run: ./scripts/cargo-cache.sh check -p maekon-app --no-default-features

      - name: Run clippy (server features)
        run: ./scripts/cargo-cache.sh clippy --workspace --all-targets --features server -- -D warnings -A clippy::empty_docs -A clippy::derivable_impls -A clippy::type_complexity -A clippy::unwrap_used -A clippy::expect_used

      - name: Run clippy (grpc features)
        run: ./scripts/cargo-cache.sh clippy --workspace --all-targets --features grpc -- -D warnings -A clippy::empty_docs -A clippy::derivable_impls -A clippy::type_complexity -A clippy::unwrap_used -A clippy::expect_used

      - name: Run clippy (grpc-dashboard + test-support)
        run: ./scripts/cargo-cache.sh clippy -p maekon-web --no-default-features --features grpc-dashboard,test-support --all-targets -- -D warnings -A clippy::empty_docs -A clippy::derivable_impls -A clippy::type_complexity -A clippy::unwrap_used -A clippy::expect_used

      # D13-v2c follow-up (PR #491): the external gRPC code path
      # (`#[cfg(feature = "grpc-dashboard-external")]` modules under
      # `crates/maekon-web/src/grpc/external/*`) was not clippy-checked by
      # any prior step. Latent `significant_drop_tightening` violations
      # only surfaced when `grpc-dashboard-external` was locally enabled.
      # This step closes the coverage gap.
      - name: Run clippy (grpc-dashboard-external + external-grpc-tools + test-support)
        run: ./scripts/cargo-cache.sh clippy -p maekon-web --no-default-features --features grpc-dashboard-external,external-grpc-tools,test-support --all-targets -- -D warnings -A clippy::empty_docs -A clippy::derivable_impls -A clippy::type_complexity -A clippy::unwrap_used -A clippy::expect_used

      - name: Run clippy (lan-sync features)
        run: ./scripts/cargo-cache.sh clippy -p maekon-network --all-targets --features lan-sync -- -D warnings -A clippy::empty_docs -A clippy::derivable_impls -A clippy::type_complexity -A clippy::unwrap_used -A clippy::expect_used

      - name: Run clippy (linux-sandbox features)
        run: ./scripts/cargo-cache.sh clippy -p maekon-automation --all-targets --features linux-sandbox -- -D warnings -A clippy::empty_docs -A clippy::derivable_impls -A clippy::type_complexity -A clippy::unwrap_used -A clippy::expect_used

      - name: Run clippy (telemetry feature)
        run: ./scripts/cargo-cache.sh clippy -p maekon-app --all-targets --features telemetry -- -D warnings -A clippy::empty_docs -A clippy::derivable_impls -A clippy::type_complexity -A clippy::unwrap_used -A clippy::expect_used

      # F2 (P2): Feature-matrix dead-spot coverage.
      #
      # cloud-stt: pure Rust (reqwest multipart) — no native lib dependency.
      #   `maekon-audio/src/lib.rs` gates the entire `cloud_stt` module behind
      #   `#[cfg(feature = "cloud-stt")]`, so `cargo test --workspace` without
      #   this feature compiles and runs 22 tests; with the feature enabled it
      #   runs 30 (8 additional mockito-backed unit tests in cloud_stt.rs).
      #   Those 8 tests were a dead spot in CI until this step was added.
      #   No native library dependency; cost is pure Rust compilation (~tens of seconds).
      - name: Test maekon-audio (--features cloud-stt)
        run: ./scripts/cargo-cache.sh test -p maekon-audio --features cloud-stt

      # windows-sandbox: the feature flag switches code paths inside
      #   `maekon-automation/src/sandbox/windows.rs`, which is itself
      #   `#[cfg(target_os = "windows")]`. On this ubuntu runner the
      #   windows.rs module is not compiled regardless of the feature flag,
      #   so this lints the platform-neutral code (win_limits.rs, sbpl.rs) and
      #   the test targets under the feature and verifies the feature
      #   declaration + Cargo.toml wiring are not broken. #6439 F5: promoted
      #   from `check` to `clippy --all-targets` for parity with the other
      #   feature cells above. Real Win32 enforcement — including the
      #   Job-Object limit-binding assertion (job_object_limits_actually_bind)
      #   — is exercised by the `test-platform: windows-latest` `--features
      #   windows-sandbox` run further below.
      #   Estimated CI cost: ~3–5 s (incremental, no new native deps).
      - name: Clippy maekon-automation (--features windows-sandbox)
        run: ./scripts/cargo-cache.sh clippy -p maekon-automation --all-targets --features windows-sandbox -- -D warnings -A clippy::empty_docs -A clippy::derivable_impls -A clippy::type_complexity -A clippy::unwrap_used -A clippy::expect_used

      # F2 (P2): whisper — promoted from excluded to a live CI cell (#5812).
      #   whisper-rs builds whisper.cpp via cmake (cmake is now installed in the
      #   "Install Linux dependencies" step above). bindgen also needs clang to
      #   generate bindings from the C/C++ headers; libclang-dev is already in
      #   that same step. No additional system packages are required beyond those
      #   two (already present).
      #   This is `test` (same rationale as the cloud-stt cell above): the
      #   feature's unit tests are model-free (guard/param tests — 23 pass
      #   locally without any model download); model-requiring paths are not
      #   exercised by the suite. Test vs check adds no meaningful cost — the
      #   cmake + C++ build of whisper.cpp dominates (~2–3 min, incremental
      #   after the first cached run).
      - name: Test maekon-audio (--features whisper)
        run: ./scripts/cargo-cache.sh test -p maekon-audio --features whisper

      # D13-v2b PR-B2 follow-up: enforce CRIT-12 invariant that `test-support`
      # is never transitively enabled via `grpc-dashboard`. If this smoke build
      # ever fails because a production code path references a test-support
      # gated symbol, the feature leak must be fixed before release.
      - name: Smoke build (grpc-dashboard, no test-support)
        run: ./scripts/cargo-cache.sh build --locked -p maekon-web --no-default-features --features grpc-dashboard

  perf-gates:
    name: Performance Gates
    needs: [changes, check]
    if: >
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    # 실측 n=3 p50=414s max=421s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 15
    env:
      MAEKON_ENABLE_PERF_GATES: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y \
            libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libnotify-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: ./.github/actions/rust-cache
        with:
          key: ci-perf-gates

      - name: Run automation perf gate tests
        run: ./scripts/cargo-cache.sh test --locked --release -p maekon-automation perf_budget_ -- --nocapture

      - name: Run vision perf gate tests
        run: ./scripts/cargo-cache.sh test --locked --release -p maekon-vision perf_budget_ -- --nocapture

  # #11348: the eight feature-combination test runs below used to be sequential
  # steps inside a single `test` job. Measured on the last green `pull_request`
  # run before this change (32464194805): 10 + 12 + 12 + 4 + 4 + 4 + 0 + 7 = 53
  # minutes of that job's 58, with every setup step (checkout, apt, toolchain,
  # cache, stubs, sandbox worker) under a minute COMBINED. `build:` waits on
  # `test`, so those 53 minutes sat squarely on the critical path:
  # check 17m -> test 58m -> build 32m = the 108m total wall clock measured.
  #
  # A matrix makes the critical path the SLOWEST CELL instead of their sum.
  # `runs-on: ubuntu-latest` on a public repository bills no hosted minutes, so
  # the added concurrency is free. The `max-parallel: 1` contract in
  # scripts/ci-cost-control-contracts.test.mjs governs the PAID hosted legs in
  # maekon-client-patch-audit.yml, not this job — its own comment notes the
  # sibling `first-party-lint-per-os` is already a matrix.
  #
  # `fail-fast: false` is load-bearing, not cosmetic. As sequential steps the
  # first failing feature set aborted the rest, so a red run only ever revealed
  # "the next one" and each fix cost another full round trip. Cells now report
  # independently and one run shows every failure.
  #
  # The cache key stays SHARED (`ci-test`) rather than becoming per-cell. The
  # repository holds 9.84 GiB against a 10 GB Actions cache allowance
  # (`Linux-rust-ci-test` alone is 1.08 GiB), so eight distinct keys would evict
  # one another and every cell would build cold — slower than the sequential job
  # this replaces. actions/cache skips the upload when the key already exists,
  # so concurrent cells do not fight over the save.
  test-matrix:
    name: Test (${{ matrix.cell.name }})
    needs: [changes, check]
    if: >
      always() &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    # 이전 실측 n=30 p50=2263s max=5307s 는 여덟 조합의 **합**에 대한 값이다. 셀
    # 하나의 최댓값은 12분이었으나 콜드 캐시 셀을 위해 여유를 둔다.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cell:
          - name: standalone
            args: test --locked --workspace
          - name: server
            args: test --locked --workspace --features server
          - name: grpc
            args: test --locked --workspace --features grpc
          # D13-v2b PR-B2: execute the SubscribeMetrics handler tests.
          # test-support enables MockSystemMonitor + active_stream_count accessor.
          - name: grpc-dashboard
            args: test --locked -p maekon-web --no-default-features --features grpc-dashboard,test-support
          # D13-v2c follow-up (PR #491): execute the 36 external_grpc_integration
          # tests + 2 sibling integration files (audit_query_surface,
          # live_config_endpoint). The default `--workspace` run happens without
          # the `grpc-dashboard-external` + `external-grpc-tools` feature set, so
          # without this cell the ~40 integration tests guarding D14 request-id
          # correlation, D22 fallback, D25 audit query, D27 warmup preservation,
          # D28 status mapping, D29 live-config, D33 1s reload convergence are
          # not actually executed by CI.
          - name: grpc-dashboard-external
            args: test --locked -p maekon-web --no-default-features --features grpc-dashboard-external,external-grpc-tools,test-support
          - name: lan-sync
            args: test --locked -p maekon-network --features lan-sync
          - name: linux-sandbox
            args: test --locked -p maekon-automation --features linux-sandbox
          - name: telemetry
            args: test --locked -p maekon-app --features telemetry -- --test-threads=1
    env:
      RUN_HEAVY_TESTS: ${{ github.event_name == 'workflow_dispatch' || ((needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && needs.changes.outputs.release_metadata_only != 'true') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Skip heavy Rust tests for metadata-only or non-Rust changes
        if: env.RUN_HEAVY_TESTS != 'true'
        run: echo "Only metadata-only or non-Rust changes detected; marking Test check green without running the heavy suite."

      - name: Install Linux dependencies
        if: env.RUN_HEAVY_TESTS == 'true'
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y \
            libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libnotify-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain
        if: env.RUN_HEAVY_TESTS == 'true'
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        if: env.RUN_HEAVY_TESTS == 'true'
        uses: ./.github/actions/rust-cache
        with:
          key: ci-test

      - name: Create frontend dist stub for Tauri generate_context!()
        if: env.RUN_HEAVY_TESTS == 'true'
        run: mkdir -p crates/maekon-web/frontend/dist && echo '<!doctype html><title>Maekon Dashboard</title><h1>Maekon</h1>' > crates/maekon-web/frontend/dist/index.html

      - name: Create sandbox worker stub for Tauri externalBin
        if: env.RUN_HEAVY_TESTS == 'true'
        run: |
          TRIPLE=$(rustc -vV | awk '/^host:/ { print $2 }')
          touch "src-tauri/maekon-sandbox-worker-${TRIPLE}"

      # The linux sandbox layering test (#5604) executes the REAL worker via
      # the cargo-test parent-dir lookup — build it before the test run.
      - name: Build sandbox worker binary
        if: env.RUN_HEAVY_TESTS == 'true'
        run: ./scripts/cargo-cache.sh build --locked -p maekon-sandbox-worker

      # The cell's argv arrives through the environment rather than being
      # interpolated into this script. `Analyze (actions)` is a required check
      # and template expansion inside `run:` is what its injection queries look
      # for. The unquoted expansion below is deliberate — the argv needs word
      # splitting (`-- --test-threads=1`).
      - name: Run tests (${{ matrix.cell.name }})
        if: env.RUN_HEAVY_TESTS == 'true'
        env:
          CELL_ARGS: ${{ matrix.cell.args }}
        run: ./scripts/cargo-cache.sh $CELL_ARGS

  # `Test` is a REQUIRED status check. Splitting the job above into a matrix
  # renames its cells to `Test (standalone)` and friends, and a required context
  # that stops being reported leaves every PR permanently pending — the same
  # trap landing-build.yml records from #10076. This aggregate keeps the `Test`
  # name reporting and derives its verdict from the matrix.
  #
  # `if: always()` and the explicit result check are both required. Without the
  # former the aggregate is skipped when a cell fails and the context vanishes;
  # without the latter a failed matrix reads as green here.
  test:
    name: Test
    needs: [test-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every Test cell succeeded
        env:
          # 'skipped' passes: when `changes` finds no Rust/CI edits the matrix
          # does not run, which matches the previous job going green with its
          # own steps skipped.
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: |
          case "$MATRIX_RESULT" in
            success|skipped)
              echo "Test matrix result: $MATRIX_RESULT"
              ;;
            *)
              echo "Test matrix result: $MATRIX_RESULT - failing the aggregate Test check."
              exit 1
              ;;
          esac

  # #4826 (E20-34): run the test suite on macOS + Windows so platform-gated code
  # (`#[cfg(target_os = "macos"/"windows")]`) is actually EXERCISED, not just
  # compiled on the Linux leg. New OS-gated tests this lights up:
  #   - macOS:   maekon-monitor::macos (active-window/idle/circuit-breaker),
  #              maekon-vision accessibility (AX) + native_detect/native_ocr,
  #              maekon-automation::sandbox::macos (App Sandbox / SBPL).
  #   - Windows: maekon-vision accessibility (UIA), maekon-automation::sandbox::windows
  #              (Job Objects), src-tauri cli::windows_sandbox_overhead.
  # The ubuntu `test` job above stays the COMPREHENSIVE leg (full feature matrix +
  # linux-sandbox/server/grpc/telemetry). These legs run only the DEFAULT-feature
  # `cargo test --workspace` — the heavy native-lib features (ocr/whisper/embedding/
  # ml-detect) are non-default and installed on no runner, and the Linux-only
  # features (linux-sandbox/systemd-notify/linux-atspi) don't apply off-Linux.
  # maekon-embedding's default fastembed-local feature pulls ONNX Runtime; the
  # comprehensive Linux leg still covers it, while the platform leg stays focused
  # on OS-gated code instead of native ML linker availability.
  #
  # OS-dependency notes (researched for #4826):
  #   - macOS needs NO extra system packages (CoreAudio/CoreGraphics/WKWebView/
  #     Keychain ship with the SDK). The macOS `--workspace` test build was verified
  #     to link locally on aarch64-apple-darwin.
  #   - Windows needs ONLY the OpenSSL setup (rusqlite `bundled-sqlcipher`, a DEFAULT
  #     dep, links libssl/libcrypto on Windows) — same action the `build:` job uses.
  #     WebView2 ships on the runner. (Windows could not be verified locally — host
  #     is macOS — so this leg is design+inspection; if a `--workspace` link error
  #     surfaces, fall back to `-p maekon-app` + `-p maekon-monitor -p maekon-vision
  #     -p maekon-automation` to still capture the OS-gated tests.)
  #   - Direct `cargo` (not scripts/cargo-cache.sh, which is bash + `du`) for shell
  #     portability on Windows; the rust-cache action handles caching.
  #   - RUSTFLAGS stays `-W warnings` for these legs: the goal here is to
  #     EXECUTE platform tests, not to hard-fail the whole leg on every
  #     default-warn rustc lint. This remains deliberate for the lint classes
  #     RUSTFLAGS still governs (`deprecated`, `unreachable_patterns`, etc.) —
  #     flipping this job's RUSTFLAGS to `-D` would also gate the vendored
  #     `patches/` fork (see the top-of-file `RUSTFLAGS` comment; verified by
  #     forcing `-D warnings` there).
  #   - #7743 (ctd-W3 A2) closed the specific gap this comment used to
  #     describe (a PRE-EXISTING unused-import case in maekon-storage tests
  #     that a `-Dwarnings` macOS `--workspace` test build caught locally but
  #     no CI job ever ran): `Cargo.toml`'s `[workspace.lints.rust]` now
  #     denies `unused`/`dead_code` at the MANIFEST level. That deny survives
  #     this job's `RUSTFLAGS: -W warnings` (a manifest-configured deny on a
  #     specific/named lint group is not overridden by a later, broader `-W
  #     warnings` flag — verified empirically), so this leg's own `cargo test
  #     --workspace` build step now DOES hard-fail on those two classes in
  #     `#[cfg(target_os = "macos"/"windows")]` first-party code, even though
  #     the job's overall RUSTFLAGS stays relaxed for every other lint.
  #   - Full per-OS `clippy -D warnings` coverage (every lint the ubuntu
  #     `check` job's clippy steps enforce, not just the two above) now runs
  #     WEEKLY (not per-PR, per the repo's CI-cost policy) in the repo-root
  #     `Maekon Client Weekly Checks` workflow's `first-party-lint-per-os`
  #     job — see `patches/README.md`'s "Weekly audit lane" section.
  test-platform:
    name: Test (${{ matrix.os }})
    needs: [changes, check]
    if: >
      always() &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ci == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # 실측 n=30 p50=2263s max=5307s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 120
    env:
      # Relax the workflow-global `-Dwarnings` for the platform test legs (see job comment).
      RUSTFLAGS: -W warnings
      RUN_HEAVY_TESTS: ${{ github.event_name == 'workflow_dispatch' || ((needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true') && needs.changes.outputs.release_metadata_only != 'true') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Skip heavy Rust tests for metadata-only or non-Rust changes
        if: env.RUN_HEAVY_TESTS != 'true'
        run: echo "Only metadata-only or non-Rust changes; marking platform Test green without the heavy suite."

      - name: Configure OpenSSL for SQLCipher (Windows)
        if: env.RUN_HEAVY_TESTS == 'true' && runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-openssl

      - name: Install Rust toolchain
        if: env.RUN_HEAVY_TESTS == 'true'
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        if: env.RUN_HEAVY_TESTS == 'true'
        uses: ./.github/actions/rust-cache
        with:
          key: ci-test-${{ matrix.target }}

      - name: Create frontend dist stub for Tauri generate_context!()
        if: env.RUN_HEAVY_TESTS == 'true'
        shell: bash
        run: mkdir -p crates/maekon-web/frontend/dist && echo '<!doctype html><title>Maekon Dashboard</title><h1>Maekon</h1>' > crates/maekon-web/frontend/dist/index.html

      - name: Create sandbox worker stub for Tauri externalBin
        if: env.RUN_HEAVY_TESTS == 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            touch "src-tauri/maekon-sandbox-worker-${TARGET}.exe"
          else
            touch "src-tauri/maekon-sandbox-worker-${TARGET}"
            chmod +x "src-tauri/maekon-sandbox-worker-${TARGET}"
          fi

      # #11061: compile the exact Windows default/no-sandbox-feature surface
      # before executing tests. `--keep-going` lets Cargo report failures in
      # independent crates during the same export PR, instead of discovering
      # one blocked layer per #164 -> #165 -> #166 round-trip. The workspace
      # manifest's `unused`/`dead_code` deny policy makes the two known
      # maekon-automation regressions hard failures even under `RUSTFLAGS=-W`.
      - name: Check Windows default workspace without sandbox features (keep-going)
        if: env.RUN_HEAVY_TESTS == 'true' && matrix.os == 'windows-latest'
        run: cargo check --locked --workspace --all-targets --exclude maekon-lint --exclude maekon-embedding --keep-going

      - name: Run tests (default workspace)
        if: env.RUN_HEAVY_TESTS == 'true'
        # Exclude maekon-lint from the REQUIRED run: its tests are house-style
        # gates (value-blind assertion hedges, i18n, language-check) we hold the
        # core team to but do not hard-block external contributors on (#6346).
        # House-style is surfaced by the separate advisory step below.
        run: cargo test --locked --workspace --exclude maekon-lint --exclude maekon-embedding

      - name: House-style gates (advisory — does not block external PRs)
        if: env.RUN_HEAVY_TESTS == 'true'
        # Value-blind assertion hedges (`assert!(x.is_ok()/is_err())`), i18n, and
        # language-check are project conventions, not correctness bugs. We annotate
        # PRs with them but never fail the build here (#6346: internal SSOT =
        # blocking via the parent gate; external/public = advisory). See
        # CONTRIBUTING.md ("Test assertions") for how to fix or justify a site.
        continue-on-error: true
        run: |
          cargo test --locked -p maekon-lint
          cargo run --locked -q -p maekon-lint --bin language-check -- non-english --path crates --path src-tauri
          cargo run --locked -q -p maekon-lint --bin language-check -- i18n --strict-i18n

      # F2 (P2): windows-sandbox feature — Win32 Job Object + token-restriction code
      # (`#[cfg(target_os = "windows")]` in maekon-automation/src/sandbox/windows.rs)
      # is ONLY compiled on this Windows leg. The ubuntu check-only step in the
      # `check` job validates Cargo feature wiring; this step executes the actual
      # Windows sandbox tests with the feature flag enabled.
      #
      # Shell portability note: `test-platform` uses direct `cargo` (not
      # scripts/cargo-cache.sh) for cross-platform compatibility — same pattern as
      # the `Run tests (default workspace)` step directly above. The rust-cache
      # action installed earlier handles caching for both steps.
      #
      # Local (macOS) verification: not possible — `#[cfg(target_os = "windows")]`
      # guards are compiled out. Command form verified by inspection against the
      # `Run tests (default workspace)` step above (identical `cargo test --locked`
      # invocation, narrowed to `-p maekon-automation`).
      - name: Test maekon-automation (--features windows-sandbox)
        if: env.RUN_HEAVY_TESTS == 'true' && matrix.os == 'windows-latest'
        run: cargo test --locked -p maekon-automation --features windows-sandbox

      # F2 (P2): keychain integration tests — promoted from #[ignore] to CI cell
      # (#5643 residual). The macOS runner provides a real Keychain daemon (securityd).
      # A dedicated CI keychain is created so these tests never touch the runner's
      # default login keychain. `security set-keychain-settings maekon-ci.keychain`
      # (no -u or -l flags) disables auto-lock and auto-sleep-lock, keeping the
      # keychain accessible for the duration of the job.
      # The `#[ignore]` attribute is kept on the tests so that `cargo test` on a
      # local developer machine (without keychain setup) does not run them by default.
      # CI runs them explicitly via `-- --ignored keychain`.
      - name: Prepare CI keychain (macOS)
        if: env.RUN_HEAVY_TESTS == 'true' && matrix.os == 'macos-latest'
        run: |
          security create-keychain -p "" maekon-ci.keychain
          security default-keychain -s maekon-ci.keychain
          security unlock-keychain -p "" maekon-ci.keychain
          security set-keychain-settings maekon-ci.keychain
      - name: Run keychain integration tests (macOS)
        if: env.RUN_HEAVY_TESTS == 'true' && matrix.os == 'macos-latest'
        run: cargo test --locked -p maekon-storage -- --ignored keychain

  linux-autostart-unit:
    name: Linux Autostart Unit Tests
    needs: [changes, check]
    if: >
      always() &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    # 실측 n=12 p50=576s max=796s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Linux dependencies (Tauri GTK/WebKit + libsystemd-dev for sd-notify)
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y \
            libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libnotify-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libsystemd-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: ./.github/actions/rust-cache
        with:
          key: ci-linux-autostart-unit

      - name: Create frontend dist stub for Tauri generate_context!()
        run: mkdir -p crates/maekon-web/frontend/dist && echo '<!doctype html><title>Maekon Dashboard</title><h1>Maekon</h1>' > crates/maekon-web/frontend/dist/index.html

      - name: Create sandbox worker stub for Tauri externalBin
        run: |
          TRIPLE=$(rustc -vV | awk '/^host:/ { print $2 }')
          touch "src-tauri/maekon-sandbox-worker-${TRIPLE}"

      - name: Run linux_autostart_unit smoke test
        run: cargo test --locked -p maekon-app --features systemd-notify --test linux_autostart_unit

      - name: Run autostart inline linux_tests
        run: cargo test --locked -p maekon-app --features systemd-notify --lib autostart::tests::linux_tests

      - name: Run autostart inline linux_capability_tests
        run: cargo test --locked -p maekon-app --features systemd-notify --lib autostart::tests::linux_capability_tests

      - name: Run migration_hashes tests
        run: cargo test --locked -p maekon-app --features systemd-notify --lib lifecycle::migration_hashes::tests

      - name: Run sd_notify tests
        run: cargo test --locked -p maekon-app --features systemd-notify --lib lifecycle::sd_notify::tests

  build:
    name: Build (${{ matrix.target }})
    needs: [changes, test, frontend]
    # Keep the expensive cross-platform matrix out of ordinary PRs, but make
    # public export PRs report these checks before merge. Export branches are
    # the release-adjacent path where a skipped Build matrix is too weak.
    if: >
      (github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'codex/public-export-') ||
      startsWith(github.head_ref, 'release/public-export-'))) ||
      (github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ci == 'true'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: maekon-macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: maekon-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: maekon-windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: maekon-linux-x64
    runs-on: ${{ matrix.os }}
    # 실측 n=37 p50=923s max=1868s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download frontend dist artifact
        uses: ./.github/actions/download-artifact
        with:
          github-token: ${{ github.token }}
          name: frontend-dist-bundle
          path: crates/maekon-web/frontend

      - name: Extract and verify frontend dist artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="crates/maekon-web/frontend/frontend-dist.tar.gz"
          index_html="crates/maekon-web/frontend/dist/index.html"
          if [ ! -f "$artifact" ]; then
            echo "::error::Missing frontend-dist-bundle artifact; CI build artifacts require real frontend dist"
            exit 1
          fi
          tar -xzf "$artifact" -C crates/maekon-web/frontend
          if [ ! -f "$index_html" ]; then
            echo "::error::frontend-dist-bundle did not contain dist/index.html"
            exit 1
          fi
          if grep -qx '<html></html>' "$index_html"; then
            echo "::error::Blank frontend dist stub detected in CI build artifact path"
            exit 1
          fi

      - name: Configure OpenSSL for SQLCipher (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-openssl

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y \
            libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libnotify-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Verify DEB metadata assets
        if: runner.os == 'Linux'
        run: ./scripts/verify-deb-metadata.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: ./.github/actions/rust-cache
        with:
          key: ci-build-${{ matrix.target }}

      # Tauri externalBin (`maekon-sandbox-worker`) expects a file named
      # `src-tauri/maekon-sandbox-worker-<triple>[.exe]` at build time. CI
      # builds don't need the real sandbox-worker (Release workflow builds it
      # properly for shipped binaries); a zero-byte stub is sufficient so
      # `cargo build -p maekon-app` doesn't trip on the externalBin
      # resource-not-found error (see project_main_ci_frontend_artifact_gap
      # memory — root-cause for main-branch CI reds through iter-224).
      - name: Create sandbox worker stub for Tauri externalBin
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            touch "src-tauri/maekon-sandbox-worker-${TARGET}.exe"
          else
            touch "src-tauri/maekon-sandbox-worker-${TARGET}"
            chmod +x "src-tauri/maekon-sandbox-worker-${TARGET}"
          fi

      - name: Build release
        shell: bash
        # Builds the SHIPPED feature set per OS, identical to release.yml and
        # pinned against it by scripts/test-release-workflow-governance.sh.
        #
        # This parity is not cosmetic. The Windows PE closure check below only
        # means something if it inspects the binary that actually ships. Until
        # #10698 this step built `--features grpc` alone, so `stt` — and with
        # it cpal's WASAPI import of `mmdevapi.dll` — was never linked here.
        # The closure gate therefore passed on every export PR and failed for
        # the first time on the v0.0.1-rc.7 tag build, when the tag was already
        # irreversible and the release had no artifacts.
        #
        # `-p maekon-app` (rather than `--workspace`) stays: a workspace-wide
        # release build pulls optional maekon-embedding dependencies including
        # ort-sys, which has no x86_64-apple-darwin prebuilt ONNX Runtime
        # artifact. That is the reason for the package scope, and it never
        # required narrowing features — release.yml builds all four targets at
        # full parity, and did so successfully for rc.7.
        #
        # RUSTFLAGS is the SECOND parity axis, and matching features alone was
        # not enough. Cargo's extra-flag sources are mutually exclusive and
        # `RUSTFLAGS` outranks `target.<triple>.rustflags`, so this workflow's
        # top-level `RUSTFLAGS: -W warnings` silently discarded the
        # `CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C
        # target-feature=+crt-static` that setup-windows-openssl exports — the
        # release contract's static MSVC CRT. release.yml sets no workflow-level
        # RUSTFLAGS, so there the flag applies. CI therefore linked the CRT
        # dynamically and imported `MSVCP140.dll`, which the shipped binary does
        # not; the closure gate failed on a binary that still was not the one
        # that ships (#10698, rc.8 export PR maekon-client#160).
        #
        # So reproduce release.yml's EFFECTIVE flags per OS rather than
        # inheriting this job's linting flags: Windows gets exactly the
        # static-CRT flag, the other targets get none (release.yml has no
        # RUSTFLAGS and `.cargo/config.toml` sets no `rustflags`). Dropping
        # `-W warnings` here changes nothing that matters — `warnings` is at
        # warn by default, and the first-party deny lives in `Cargo.toml`'s
        # `[workspace.lints.rust]`, not in this env var.
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            FEATURES="grpc,systemd-notify,linux-sandbox,lan-sync,stt,download"
            export RUSTFLAGS=""
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            FEATURES="grpc,windows-sandbox,lan-sync,stt,download"
            export RUSTFLAGS="-C target-feature=+crt-static"
          else
            FEATURES="grpc,lan-sync,stt,download"
            export RUSTFLAGS=""
          fi
          echo "effective RUSTFLAGS: '${RUSTFLAGS}'"
          ./scripts/cargo-cache.sh build --locked --release --target ${{ matrix.target }} -p maekon-app --features "$FEATURES"

      - name: Stage and verify signed Microsoft VC runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/stage-windows-vc-runtime.ps1 `
            -PayloadRoot "target/${{ matrix.target }}/release"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw "Visual Studio C++ tools are required for PE closure verification" }
          $dumpbin = Get-ChildItem -Path (Join-Path $installation "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName -match '[\\/]Hostx64[\\/]x64[\\/]dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (!$dumpbin) { throw "x64 dumpbin.exe was not found under $installation" }
          node scripts/verify-windows-runtime-closure.mjs `
            --payload-root "target/${{ matrix.target }}/release" `
            --dependency-tool $dumpbin.FullName `
            --binary maekon.exe

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.artifact_name }}.tar.gz maekon

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/maekon.exe,target/${{ matrix.target }}/release/vcruntime140.dll,target/${{ matrix.target }}/release/vcruntime140_1.dll -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.zip
          if-no-files-found: ignore
