name: Linux systemd Integration (manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        default: 'main'
        required: false

permissions:
  contents: read

jobs:
  linux-systemd-integration:
    name: Linux systemd Integration Tests (T8-T10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.branch }}
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable
      - name: Install systemd + dbus + libsystemd-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y systemd dbus-user-session libsystemd-dev
          systemctl --user start dbus
      - name: Touch tauri externalbin + frontend stubs
        run: |
          TRIPLE=$(rustc -vV | awk '/^host:/ {print $2}')
          touch src-tauri/maekon-sandbox-worker-${TRIPLE}
          mkdir -p crates/maekon-web/frontend/dist
          echo '<!doctype html><title>Maekon Dashboard</title><h1>Maekon</h1>' > crates/maekon-web/frontend/dist/index.html
      - name: Run live tests
        run: cargo test --locked -p maekon-app --features systemd-notify --test linux_autostart_systemd_live -- --ignored
