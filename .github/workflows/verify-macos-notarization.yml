name: Verify Published macOS Notarization

# Independent of notarize-macos-release-assets.yml on purpose (#10935).
#
# That workflow verifies the bytes it produces, but it cannot report a problem
# when it fails before reaching its checks, and it reports nothing at all when
# it never runs. v0.0.1-rc.8 published signed-but-unnotarized macOS assets for
# ~13 hours for exactly that reason: the notarization run failed on its own
# while the Release workflow stayed green.
#
# This workflow reads the release page instead, so the same finding surfaces
# regardless of why the assets are unstapled.

on:
  schedule:
    # Daily, offset off the hour to avoid the top-of-hour Actions queue.
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated release tags to check (default: 5 most recent)"
        required: false
        type: string

concurrency:
  group: verify-macos-notarization
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-published-notarization:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      MAEKON_PUBLIC_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Verify published macOS assets are stapled
        id: verify
        shell: bash
        env:
          # Never interpolate workflow inputs into the script body; pass them
          # through the environment. Selection and charset validation happen
          # inside the script, which runs locally and is covered by the script
          # guard suite — this step deliberately contains no branching bash,
          # because nothing executes this workflow before merge (#10963).
          MAEKON_NOTARIZATION_TAGS: ${{ inputs.tags }}
        run: |
          set -uo pipefail
          status=0
          ./scripts/verify-published-macos-notarization.sh --from-env \
            >notarization-report.txt 2>&1 || status=$?
          cat notarization-report.txt
          exit "$status"

      # #10935/#10948: the independent macOS sweep remains public. The private
      # owner observer (#12892) receives its run/attempt; no SSOT credential is exported.
      - name: Record verification failure for the private maintainer observer
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          # #12892: the private owner observer polls this exact run/attempt.
          # Public jobs carry no private Issue/Project credentials.
          printf 'MAEKON_NOTARIZATION_FAILURE_V1 workflow=verify-macos-notarization.yml run_id=%s attempt=%s source_sha=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          {
            echo '### macOS notarization failure'
            printf 'Workflow: verify-macos-notarization.yml\nRun: %s\nAttempt: %s\nSource SHA: %s\n\n' \
              "$RUN_URL" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA"
            echo 'The private ONESHIM maintainer observer files the owner alert for this incident.'
            echo 'Keep the macOS checks and inspect the first failing step in the original run.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::macOS notarization failed; private observer incident: $RUN_URL"
