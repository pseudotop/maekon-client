name: Notarize macOS Release Assets

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to notarize (e.g. v0.0.10)"
        required: true
        type: string
      source_run_id:
        description: "Release workflow run id that produced DMG/PKG artifacts (optional)"
        required: false
        type: string

concurrency:
  group: notarize-macos-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  notarize-macos-assets:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (startsWith(github.event.workflow_run.head_branch, 'v') ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: macos-latest
    environment: macos-notarization
    timeout-minutes: 180
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_run_id: ${{ steps.release.outputs.source_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Resolve release tag and source run id
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_PARENT_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WORKFLOW_PARENT_EVENT" == "workflow_dispatch" ]]; then
              # Parent release.yml was manually dispatched; head_branch is
              # the dispatching branch (typically main), not the tag.
              # release.yml exposes the tag via `run-name: Release <TAG>`,
              # which GitHub surfaces as `display_title`. Extract via regex.
              RELEASE_TAG="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID" \
                --jq '.display_title // empty' \
                | grep -oE 'v[0-9][^[:space:]]*' \
                | head -n1)"
            else
              RELEASE_TAG="$WORKFLOW_HEAD_BRANCH"
            fi
            SOURCE_RUN_ID="$WORKFLOW_RUN_ID"
          else
            RELEASE_TAG="${DISPATCH_TAG:-}"
            SOURCE_RUN_ID="${DISPATCH_SOURCE_RUN_ID:-}"
          fi

          if [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" != v* ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ -z "$SOURCE_RUN_ID" ]]; then
            SOURCE_RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release.yml \
              --branch "$RELEASE_TAG" \
              --limit 30 \
              --json databaseId,status,conclusion,event \
              | jq -r '[.[] | select(.event == "push" and .status == "completed" and .conclusion == "success")][0].databaseId // empty')"
          fi

          if [[ -z "$SOURCE_RUN_ID" ]]; then
            echo "Unable to resolve a successful release run for tag $RELEASE_TAG" >&2
            exit 1
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved RELEASE_TAG=$RELEASE_TAG SOURCE_RUN_ID=$SOURCE_RUN_ID"

      - name: Validate notarization secrets
        shell: bash
        run: |
          required=(
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_TEAM_ID
            MACOS_NOTARY_APP_PASSWORD
          )
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done

      - name: Download macOS installer artifacts from release run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name maekon-macos-universal-dmg \
            --dir dist
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name maekon-macos-universal-pkg \
            --dir dist
          find dist -mindepth 2 -type f \( -name '*.dmg' -o -name '*.pkg' \) -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          ls -la dist
          test -f dist/maekon-macos-universal.dmg
          test -f dist/maekon-macos-universal.pkg

      - name: Configure notarization keychain profile
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/maekon-notary.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials "maekon-notary" \
            --keychain "$KEYCHAIN_PATH" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG and PKG
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/notary-submit-and-poll.sh \
            dist/maekon-macos-universal.dmg \
            "$KEYCHAIN_PATH" \
            "maekon-notary" \
            "10800" \
            "60"
          bash ./scripts/notary-submit-and-poll.sh \
            dist/maekon-macos-universal.pkg \
            "$KEYCHAIN_PATH" \
            "maekon-notary" \
            "10800" \
            "60"
          xcrun stapler staple dist/maekon-macos-universal.dmg
          xcrun stapler staple dist/maekon-macos-universal.pkg
          xcrun stapler validate dist/maekon-macos-universal.dmg
          xcrun stapler validate dist/maekon-macos-universal.pkg

          DMG_MOUNTPOINT="$(mktemp -d "$RUNNER_TEMP/maekon-dmg.XXXXXX")"
          cleanup_dmg_mount() {
            hdiutil detach "$DMG_MOUNTPOINT" >/dev/null 2>&1 || true
            rmdir "$DMG_MOUNTPOINT" >/dev/null 2>&1 || true
          }
          trap cleanup_dmg_mount EXIT

          hdiutil attach dist/maekon-macos-universal.dmg \
            -nobrowse \
            -readonly \
            -mountpoint "$DMG_MOUNTPOINT" >/dev/null
          VERSION="${RELEASE_TAG#v}"
          ./scripts/verify-macos-app-bundle.sh \
            --expected-short-version "$VERSION" \
            --expected-build-version "$(python3 scripts/macos-bundle-version.py "$VERSION")" \
            "$DMG_MOUNTPOINT/Maekon.app"
          spctl --assess --type execute --verbose=4 "$DMG_MOUNTPOINT/Maekon.app"
          cleanup_dmg_mount
          trap - EXIT

          spctl --assess --type install --verbose=4 dist/maekon-macos-universal.pkg

      - name: Record final notarized checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          assets = []
          for artifact_name in (
              "maekon-macos-universal.dmg",
              "maekon-macos-universal.pkg",
          ):
              artifact = dist / artifact_name
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              assets.append(
                  {
                      "name": artifact_name,
                      "sha256": digest,
                      "notary_log": str(dist / "notary-logs" / f"{artifact_name}.notary-log.json"),
                  }
              )

          manifest = {
              "schema_version": 1,
              "release_tag": os.environ["RELEASE_TAG"],
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "macos_assets": assets,
          }
          (dist / "notarization-final-byte-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat dist/notarization-final-byte-manifest.json

      - name: Upload notarization logs artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maekon-macos-notary-logs-${{ env.RELEASE_TAG }}
          path: dist/notary-logs/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload notarized final bytes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maekon-macos-notarized-assets-${{ env.RELEASE_TAG }}
          path: |
            dist/maekon-macos-universal.dmg
            dist/maekon-macos-universal.pkg
            dist/notarization-final-byte-manifest.json
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup notary keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

  publish-notarized-assets:
    needs: notarize-macos-assets
    runs-on: ubuntu-latest
    environment: release-signing
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.notarize-macos-assets.outputs.release_tag }}
      UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
      MAEKON_UPDATE_PUBLIC_KEY: ${{ secrets.MAEKON_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Verify update signing keypair
        run: python3 scripts/verify-update-signing-keypair.py

      - name: Download notarized final bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: maekon-macos-notarized-assets-${{ needs.notarize-macos-assets.outputs.release_tag }}
          path: dist

      - name: Generate final notarized sidecars
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pynacl
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path

          from nacl.signing import SigningKey

          key = SigningKey(base64.b64decode(os.environ["UPDATE_SIGNING_PRIVATE_KEY_B64"]))
          assets = [
              Path("dist/maekon-macos-universal.dmg"),
              Path("dist/maekon-macos-universal.pkg"),
              Path("dist/notarization-final-byte-manifest.json"),
          ]

          for path in assets:
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              path.with_suffix(path.suffix + ".sha256").write_text(
                  f"{digest}  {path.name}\n",
                  encoding="utf-8",
              )
              signature = key.sign(data).signature
              path.with_suffix(path.suffix + ".sig").write_text(
                  base64.b64encode(signature).decode("ascii") + "\n",
                  encoding="utf-8",
              )
          PY
          ls -la dist

      - name: Attest final notarized provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/*

      - name: Publish notarized final bytes
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            dist/maekon-macos-universal.dmg \
            dist/maekon-macos-universal.dmg.sha256 \
            dist/maekon-macos-universal.dmg.sig \
            dist/maekon-macos-universal.pkg \
            dist/maekon-macos-universal.pkg.sha256 \
            dist/maekon-macos-universal.pkg.sig \
            dist/notarization-final-byte-manifest.json \
            dist/notarization-final-byte-manifest.json.sha256 \
            dist/notarization-final-byte-manifest.json.sig \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify published notarized final bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf published-assets
          mkdir -p published-assets

          set +e
          verify_status=0
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir published-assets \
            --pattern 'maekon-macos-universal.dmg*' \
            --pattern 'maekon-macos-universal.pkg*' \
            --pattern 'notarization-final-byte-manifest.json*' \
            || verify_status=$?

          if [[ "$verify_status" -eq 0 ]]; then
            python3 -m pip install --upgrade pynacl || verify_status=$?
          fi

          if [[ "$verify_status" -eq 0 ]]; then
            python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          from nacl.exceptions import BadSignatureError
          from nacl.signing import VerifyKey

          root = Path("published-assets")
          public_key_bytes = base64.b64decode(os.environ["MAEKON_UPDATE_PUBLIC_KEY"])
          verify_key = VerifyKey(public_key_bytes)

          manifest_path = root / "notarization-final-byte-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest_sha_by_name = {
              asset["name"]: asset["sha256"]
              for asset in manifest.get("macos_assets", [])
          }

          for asset_name in (
              "maekon-macos-universal.dmg",
              "maekon-macos-universal.pkg",
              "notarization-final-byte-manifest.json",
          ):
              asset = root / asset_name
              sha_path = root / f"{asset_name}.sha256"
              sig_path = root / f"{asset_name}.sig"

              if not asset.is_file():
                  raise SystemExit(f"missing release asset: {asset_name}")
              if not sha_path.is_file():
                  raise SystemExit(f"missing checksum sidecar: {sha_path.name}")
              if not sig_path.is_file():
                  raise SystemExit(f"missing signature sidecar: {sig_path.name}")

              data = asset.read_bytes()
              actual_sha = hashlib.sha256(data).hexdigest()
              expected_sha = sha_path.read_text(encoding="utf-8").split()[0]
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"stale checksum sidecar for {asset_name}: expected {actual_sha}, got {expected_sha}"
                  )

              if asset_name in manifest_sha_by_name and manifest_sha_by_name[asset_name] != actual_sha:
                  raise SystemExit(
                      f"notarization manifest checksum mismatch for {asset_name}"
                  )

              signature = base64.b64decode(sig_path.read_text(encoding="utf-8").strip())
              try:
                  verify_key.verify(data, signature)
              except BadSignatureError as exc:
                  raise SystemExit(f"stale signature sidecar for {asset_name}") from exc
          PY
            verify_status=$?
          fi
          set -e

          if [[ "$verify_status" -ne 0 ]]; then
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            echo "::error::Deleted invalid release for ${RELEASE_TAG}: final byte sidecar validation failed."
            exit "$verify_status"
          fi

  # Without this, a notarization failure is silent: the Release workflow stays
  # green and the release page keeps its signed-but-unnotarized macOS assets
  # with nothing to distinguish them. That is how v0.0.1-rc.8 shipped assets
  # Gatekeeper would refuse, for ~13 hours (#10935).
  report-notarization-failure:
    needs: [notarize-macos-assets, publish-notarized-assets]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # A broken release is maintainer news first. Filing it here would publish
      # "this release is not notarized" on the public repo, so the alert is
      # routed to the SSOT instead (#10948). Scoped to issues:write on that one
      # repository — no wider grant than the alert needs.
      - name: Mint an SSOT-scoped token for issue filing
        id: ssot_token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.MAEKON_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAEKON_AUTOMATION_APP_PRIVATE_KEY }}
          owner: pseudotop
          repositories: oneshim
          permission-issues: write

      - name: Open or update the notarization failure issue
        shell: bash
        env:
          # Falls back to the dispatch input or the parent run's branch when the
          # notarize job died before it could resolve and publish the tag.
          RELEASE_TAG: ${{ needs.notarize-macos-assets.outputs.release_tag }}
          DISPATCH_TAG: ${{ inputs.tag }}
          PARENT_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SSOT_TOKEN: ${{ steps.ssot_token.outputs.token }}
          PUBLIC_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${RELEASE_TAG:-}"
          [[ -n "$TAG" ]] || TAG="${DISPATCH_TAG:-}"
          [[ -n "$TAG" ]] || TAG="${PARENT_HEAD_BRANCH:-}"
          [[ -n "$TAG" ]] || TAG="(tag unresolved)"

          # Losing the alert is the exact defect #10935 exists to fix, so a
          # failed mint degrades to the public repo rather than to silence.
          # That needs two faults at once: a broken release AND broken minting.
          SSOT_ISSUE_REPO="pseudotop/oneshim"
          FALLBACK_NOTE=""
          if [[ -n "${SSOT_TOKEN:-}" ]]; then
            TARGET_REPO="$SSOT_ISSUE_REPO"
            export GH_TOKEN="$SSOT_TOKEN"
          else
            TARGET_REPO="$GITHUB_REPOSITORY"
            export GH_TOKEN="$PUBLIC_TOKEN"
            FALLBACK_NOTE="yes"
            echo "::error::Could not mint the ${SSOT_ISSUE_REPO} token; filing publicly so the alert is not lost."
          fi

          ISSUE_TITLE="release(maekon): macOS notarization failed for ${TAG}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          BODY_FILE="$(mktemp)"
          {
            echo "\`Notarize macOS Release Assets\` failed for \`${TAG}\`."
            echo
            echo "The Release workflow may still be green. If assets were already published, the macOS DMG and PKG are signed but **not notarized or stapled**, and Gatekeeper will refuse them."
            echo
            echo "1. Open [the failing run](${RUN_URL}) and read the first failing step."
            echo "2. Fix the cause, then re-run this workflow with \`tag=${TAG}\` and the Release run id as \`source_run_id\`."
            echo "3. Confirm with \`Verify Published macOS Notarization\`, or locally:"
            echo "   \`./scripts/verify-published-macos-notarization.sh ${TAG}\`"
            if [[ -n "$FALLBACK_NOTE" ]]; then
              echo
              echo "> Filed here rather than in ${SSOT_ISSUE_REPO} because the automation App token could not be minted. Check the App installation and its private key."
            fi
            echo
            echo "Opened automatically — see #10935."
          } > "$BODY_FILE"

          EXISTING="$(gh issue list \
            --repo "$TARGET_REPO" \
            --state open \
            --search "\"$ISSUE_TITLE\" in:title" \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$TARGET_REPO" --body-file "$BODY_FILE"
          else
            gh issue create \
              --repo "$TARGET_REPO" \
              --title "$ISSUE_TITLE" \
              --body-file "$BODY_FILE"
          fi
