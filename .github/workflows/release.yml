name: Release

run-name: Release ${{ inputs.tag_name || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build (for example v0.3.7)'
        required: true
        type: string
      release_sha:
        description: 'Commit SHA that the release tag points to'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  # Tolerate transient crates.io / network flakes on the 4-platform build
  # matrix (e.g. "Error in the HTTP2 framing layer" fetching a dependency).
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}

permissions:
  contents: read
  actions: read

jobs:
  verify-version:
    name: Verify Version Consistency
    runs-on: ubuntu-latest
    # 실측 n=10 p50=15s max=23s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 10
    environment: release-signing
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      release_version: ${{ steps.release.outputs.release_version }}
      release_kind: ${{ steps.release.outputs.release_kind }}
      base_version: ${{ steps.release.outputs.base_version }}
    steps:
      - name: Generate release App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.MAEKON_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAEKON_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-security-events: read
          permission-vulnerability-alerts: read

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}

      # ⚠️ 이 아래 순서는 보안 계약이다 (#11155).
      #
      # 위 checkout 은 `inputs.release_sha` 를 그대로 받는다 — 아직 아무것도 검증되지
      # 않은 트리다. 그러므로 **그 트리의 코드를 실행하는 첫 스텝보다 검증이 먼저여야
      # 한다.** 아래 두 검증은 git 연산과 `gh api` 만 쓰고 체크아웃한 트리의 스크립트를
      # 실행하지 않는다. 쓰는 값(RELEASE_TAG·RELEASE_SHA)도 워크플로 `env:` 에서 오므로
      # 트리에 의존하지 않는다.
      #
      # `Classify release version` 이 `source ./scripts/release-common.sh` 로 그 트리의
      # 셸을 실행하는 첫 지점이라 검증 뒤로 옮겼다. 새 스텝을 넣을 때 이 경계를 넘지 말 것.
      - name: Verify release tag matches the requested commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags --depth=1
          if ! TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}" 2>/dev/null)"; then
            echo "::error::Release tag ${RELEASE_TAG} does not exist in the fetched repository state"
            exit 1
          fi

          echo "Tag commit:     ${TAG_COMMIT}"
          echo "Requested SHA:  ${RELEASE_SHA}"
          if [ "${TAG_COMMIT}" != "${RELEASE_SHA}" ]; then
            echo "::error::Release SHA must match the commit pointed to by ${RELEASE_TAG}"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            MAIN_SHA="$(git rev-parse origin/main)"
            echo "main commit:    ${MAIN_SHA}"
            if [ "${RELEASE_SHA}" != "${MAIN_SHA}" ]; then
              echo "::error::Release tags must point to origin/main HEAD when first pushed"
              exit 1
            fi
          else
            echo "workflow_dispatch rerun detected; skipping origin/main HEAD check"
          fi

      - name: Verify release source trust
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_PROTECTED="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.protected')"
          BRANCH_RULE_COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main?per_page=100" --jq 'length' 2>/dev/null || echo "0")"
          if [ "${BRANCH_PROTECTED}" != "true" ] && [ "${BRANCH_RULE_COUNT}" -eq 0 ]; then
            echo "::error::Public main must have branch protection or an active ruleset before releasing."
            exit 1
          fi

          TAG_OBJECT_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.type')"
          TAG_OBJECT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          if [ "${TAG_OBJECT_TYPE}" != "tag" ]; then
            echo "::error::${RELEASE_TAG} is a lightweight tag. Releases require an annotated signed tag."
            exit 1
          fi

          TAG_VERIFIED="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" --jq '.verification.verified')"
          TAG_VERIFY_REASON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" --jq '.verification.reason // "unknown"')"
          if [ "${TAG_VERIFIED}" != "true" ]; then
            echo "::error::${RELEASE_TAG} tag signature is not GitHub-verified (reason: ${TAG_VERIFY_REASON})."
            exit 1
          fi

      - name: Classify release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/release-common.sh
          TAG_VERSION="${RELEASE_TAG#v}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          if is_rc_version "${TAG_VERSION}"; then
            echo "release_kind=rc" >> "$GITHUB_OUTPUT"
            echo "base_version=$(base_version "${TAG_VERSION}")" >> "$GITHUB_OUTPUT"
          elif is_stable_version "${TAG_VERSION}"; then
            echo "release_kind=stable" >> "$GITHUB_OUTPUT"
            echo "base_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported tag format: ${RELEASE_TAG}. Use vX.Y.Z-rc.N or vX.Y.Z"
            exit 1
          fi

      - name: Verify Cargo.toml version matches tag
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/release-common.sh
          TAG_VERSION="${RELEASE_TAG#v}"
          CARGO_VERSION="$(workspace_version)"
          echo "Tag version:   $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch! Tag ${RELEASE_TAG} but Cargo.toml has $CARGO_VERSION"
            echo "Fix: Update [workspace.package] version in Cargo.toml to \"$TAG_VERSION\""
            exit 1
          fi

      - name: Verify Cargo.lock workspace versions match tag
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/release-common.sh
          TAG_VERSION="${RELEASE_TAG#v}"
          if ! MISMATCHES="$(workspace_lock_mismatches "${TAG_VERSION}")"; then
            echo "::error::Cargo.lock workspace package versions must match ${TAG_VERSION}"
            while IFS=$'\t' read -r package_name package_version; do
              [ -z "${package_name}" ] && continue
              echo "::error file=Cargo.lock::${package_name} is ${package_version}"
            done <<< "${MISMATCHES}"
            echo "Fix: sync Cargo.lock workspace package versions after bumping release versions"
            exit 1
          fi

      - name: Verify frontend package.json version matches tag
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/release-common.sh
          TAG_VERSION="${RELEASE_TAG#v}"
          PKG_VERSION="$(frontend_version)"
          echo "Tag version:      $TAG_VERSION"
          echo "package version:  $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch! Tag ${RELEASE_TAG} but frontend package.json has $PKG_VERSION"
            exit 1
          fi

      - name: Verify CHANGELOG.md [Unreleased] header hygiene
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/release-common.sh
          HEADER_COUNT="$(changelog_unreleased_count)"
          echo "[Unreleased] header count: ${HEADER_COUNT}"
          if [ "${HEADER_COUNT}" -ne 1 ]; then
            echo "::error::CHANGELOG.md must contain exactly one [Unreleased] header, found ${HEADER_COUNT}"
            exit 1
          fi

      - name: Verify CHANGELOG.md release notes policy
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          ./scripts/verify-release-notes-policy.sh --public --version "${TAG_VERSION}"

      - name: Enforce rc-first stable promotion
        if: steps.release.outputs.release_kind == 'stable'
        env:
          GH_TOKEN: ${{ secrets.MAEKON_RELEASE_SECURITY_TOKEN || steps.app_token.outputs.token }}
          MAEKON_UPDATE_PUBLIC_KEY: ${{ secrets.MAEKON_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          source ./scripts/release-common.sh
          BASE_VERSION="${{ steps.release.outputs.base_version }}"
          RC_TAG="$(latest_rc_tag_for_base "${BASE_VERSION}")"
          if [ -z "${RC_TAG}" ]; then
            echo "::error::Stable release v${BASE_VERSION} requires an existing RC tag v${BASE_VERSION}-rc.N"
            exit 1
          fi

          echo "Latest RC tag: ${RC_TAG}"
          RC_COMMIT="$(git rev-parse "${RC_TAG}^{commit}")"
          if [ "${RC_COMMIT}" = "${RELEASE_SHA}" ]; then
            echo "::error::Stable tag must come from a promotion commit, not directly from ${RC_TAG}"
            exit 1
          fi

          mapfile -t CHANGED_FILES < <(git diff --name-only "${RC_COMMIT}" "${RELEASE_SHA}")
          if [ "${#CHANGED_FILES[@]}" -eq 0 ]; then
            echo "::error::Stable promotion commit must change metadata relative to ${RC_TAG}"
            exit 1
          fi

          BAD_FILES=()
          for file in "${CHANGED_FILES[@]}"; do
            [ -z "${file}" ] && continue
            if ! allowed_promotion_file "${file}"; then
              BAD_FILES+=("${file}")
            fi
          done

          if [ "${#BAD_FILES[@]}" -gt 0 ]; then
            printf '::error::Stable promotion changed non-metadata files: %s\n' "${BAD_FILES[*]}"
            exit 1
          fi

          if ! changelog_section_body_matches "${BASE_VERSION}" "${RC_TAG#v}"; then
            echo "::error::Stable CHANGELOG section [${BASE_VERSION}] must match the latest RC section [${RC_TAG#v}]"
            exit 1
          fi

          RELEASE_JSON="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RC_TAG}")"
          export RELEASE_JSON

          python3 - "${RC_TAG}" <<'PY'
          import json
          import os
          import sys

          tag = sys.argv[1]
          release = json.loads(os.environ["RELEASE_JSON"])
          assets = len(release.get("assets", []))

          if release.get("draft"):
              raise SystemExit(f"Latest RC release {tag} is still a draft")
          if not release.get("prerelease"):
              raise SystemExit(f"Latest RC release {tag} is not marked as prerelease")
          if assets == 0:
              raise SystemExit(f"Latest RC release {tag} has no assets")

          print(f"Verified RC release {tag}: prerelease={release.get('prerelease')} assets={assets}")
          PY

          if [[ -z "${MAEKON_UPDATE_PUBLIC_KEY:-}" ]]; then
            echo "::error::MAEKON_UPDATE_PUBLIC_KEY is required to verify RC final-byte signatures"
            exit 1
          fi

          rm -rf rc-release-assets
          mkdir -p rc-release-assets
          gh release download "$RC_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir rc-release-assets \
            --pattern 'maekon-macos-universal.dmg*' \
            --pattern 'maekon-macos-universal.pkg*' \
            --pattern 'notarization-final-byte-manifest.json*'

          python3 -m pip install --upgrade pynacl
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          from nacl.exceptions import BadSignatureError
          from nacl.signing import VerifyKey

          root = Path("rc-release-assets")
          verify_key = VerifyKey(base64.b64decode(os.environ["MAEKON_UPDATE_PUBLIC_KEY"]))
          required_assets = [
              "maekon-macos-universal.dmg",
              "maekon-macos-universal.dmg.sha256",
              "maekon-macos-universal.dmg.sig",
              "maekon-macos-universal.pkg",
              "maekon-macos-universal.pkg.sha256",
              "maekon-macos-universal.pkg.sig",
              "notarization-final-byte-manifest.json",
              "notarization-final-byte-manifest.json.sha256",
              "notarization-final-byte-manifest.json.sig",
          ]

          missing = [asset for asset in required_assets if not (root / asset).is_file()]
          if missing:
              raise SystemExit(f"RC release is missing notarized final-byte assets: {', '.join(missing)}")

          manifest = json.loads((root / "notarization-final-byte-manifest.json").read_text(encoding="utf-8"))
          manifest_sha_by_name = {
              asset["name"]: asset["sha256"]
              for asset in manifest.get("macos_assets", [])
          }

          for asset_name in (
              "maekon-macos-universal.dmg",
              "maekon-macos-universal.pkg",
              "notarization-final-byte-manifest.json",
          ):
              asset = root / asset_name
              data = asset.read_bytes()
              actual_sha = hashlib.sha256(data).hexdigest()
              expected_sha = (root / f"{asset_name}.sha256").read_text(encoding="utf-8").split()[0]
              if actual_sha != expected_sha:
                  raise SystemExit(f"stale checksum sidecar for {asset_name}: expected {actual_sha}, got {expected_sha}")
              if asset_name in manifest_sha_by_name and manifest_sha_by_name[asset_name] != actual_sha:
                  raise SystemExit(f"notarization manifest checksum mismatch for {asset_name}")

              signature = base64.b64decode((root / f"{asset_name}.sig").read_text(encoding="utf-8").strip())
              try:
                  verify_key.verify(data, signature)
              except BadSignatureError as exc:
                  raise SystemExit(f"stale signature sidecar for {asset_name}") from exc
          PY

      - name: Check release security alerts
        env:
          GH_TOKEN: ${{ secrets.MAEKON_RELEASE_SECURITY_TOKEN || steps.app_token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          ACCEPTANCE_FILE="supply-chain/release-alert-acceptance.json"
          if [ ! -f "${ACCEPTANCE_FILE}" ]; then
            echo "::error::${ACCEPTANCE_FILE} is required so accepted alerts are explicit and reviewable."
            exit 1
          fi

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" > dependabot-alerts.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" > codeql-alerts.json

          python3 - "${ACCEPTANCE_FILE}" dependabot-alerts.json codeql-alerts.json <<'PY'
          import datetime as dt
          import json
          import sys

          acceptance_path, dependabot_path, codeql_path = sys.argv[1:]
          today = dt.date.today()

          def load_paginated_alerts(path):
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
              if isinstance(data, list) and all(isinstance(page, list) for page in data):
                  return [alert for page in data for alert in page]
              if isinstance(data, list):
                  return data
              raise TypeError(f"{path} must contain a JSON array or paginated array")

          with open(acceptance_path, encoding="utf-8") as fh:
              accepted = json.load(fh)
          dependabot_alerts = load_paginated_alerts(dependabot_path)
          codeql_alerts = load_paginated_alerts(codeql_path)

          def not_expired(entry):
              value = entry.get("accepted_until")
              if not value:
                  return False
              return dt.date.fromisoformat(value) >= today

          def accepted_dependabot(alert):
              advisory = alert.get("security_advisory") or {}
              dependency = alert.get("dependency") or {}
              for entry in accepted.get("dependabot", []):
                  if not not_expired(entry):
                      continue
                  selectors = {
                      "number": alert.get("number"),
                      "advisory": advisory.get("ghsa_id"),
                      "package": (dependency.get("package") or {}).get("name"),
                      "manifest": dependency.get("manifest_path"),
                  }
                  declared = [(key, value) for key, value in selectors.items() if key in entry]
                  if declared and all(entry.get(key) == value for key, value in declared):
                      return True
              return False

          def accepted_codeql(alert):
              rule = alert.get("rule") or {}
              for entry in accepted.get("codeql", []):
                  if not not_expired(entry):
                      continue
                  number_match = entry.get("number") == alert.get("number")
                  rule_match = entry.get("rule") == rule.get("id")
                  if number_match or rule_match:
                      return True
              return False

          open_dependabot = [a for a in dependabot_alerts if not accepted_dependabot(a)]
          open_codeql = [
              a
              for a in codeql_alerts
              if (a.get("tool") or {}).get("name") == "CodeQL" and not accepted_codeql(a)
          ]

          for alert in open_dependabot:
              advisory = alert.get("security_advisory") or {}
              dependency = alert.get("dependency") or {}
              package = (dependency.get("package") or {}).get("name", "unknown")
              print(
                  "::error::Unaccepted Dependabot alert "
                  f"#{alert.get('number')}: {package} "
                  f"{advisory.get('severity', 'unknown')} "
                  f"{advisory.get('ghsa_id', 'unknown')} "
                  f"({dependency.get('manifest_path', 'unknown manifest')})"
              )

          for alert in open_codeql:
              rule = alert.get("rule") or {}
              print(
                  "::error::Unaccepted CodeQL alert "
                  f"#{alert.get('number')}: {rule.get('id', 'unknown rule')} "
                  f"({alert.get('html_url', 'no url')})"
              )

          accepted_dependabot_count = len(dependabot_alerts) - len(open_dependabot)
          accepted_codeql_count = len(
              [a for a in codeql_alerts if (a.get("tool") or {}).get("name") == "CodeQL"]
          ) - len(open_codeql)
          if accepted_dependabot_count:
              print(f"::notice::{accepted_dependabot_count} Dependabot alert(s) matched release acceptance records")
          if accepted_codeql_count:
              print(f"::notice::{accepted_codeql_count} CodeQL alert(s) matched release acceptance records")

          if open_dependabot or open_codeql:
              raise SystemExit(1)
          print("Release security alert gate passed")
          PY

      - name: Verify tauri.conf.json consistency
        run: |
          PRODUCT_NAME=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['productName'])")
          IDENTIFIER=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['identifier'])")
          echo "productName: $PRODUCT_NAME"
          echo "identifier:  $IDENTIFIER"
          if [ "$PRODUCT_NAME" != "Maekon" ]; then
            echo "::error::tauri.conf.json productName must be 'Maekon', got '$PRODUCT_NAME'"
            exit 1
          fi
          if [ "$IDENTIFIER" != "com.maekon.app" ]; then
            echo "::error::tauri.conf.json identifier must be 'com.maekon.app', got '$IDENTIFIER'"
            exit 1
          fi

  build-frontend-assets:
    name: Build Frontend Assets
    needs: verify-version
    runs-on: ubuntu-latest
    # 실측 n=10 p50=58s max=153s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.verify-version.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          version: '10'
          lockfile-path: crates/maekon-web/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: crates/maekon-web/frontend
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check (early fail)
        working-directory: crates/maekon-web/frontend
        run: npx tsc --noEmit

      - name: Build frontend bundle
        working-directory: crates/maekon-web/frontend
        run: pnpm build

      - name: Verify frontend build output
        run: test -f crates/maekon-web/frontend/dist/index.html

      - name: Package frontend dist artifact
        run: tar -czf crates/maekon-web/frontend/frontend-dist.tar.gz -C crates/maekon-web/frontend dist

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-dist-bundle
          path: crates/maekon-web/frontend/frontend-dist.tar.gz
          if-no-files-found: error

  build-release:
    name: Build Release (${{ matrix.target }})
    needs: [verify-version, build-frontend-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: maekon-macos-arm64
            asset_ext: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: maekon-macos-x64
            asset_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: maekon-windows-x64
            asset_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: maekon-linux-x64
            asset_ext: tar.gz
    runs-on: ${{ matrix.os }}
    # 실측 n=31 p50=746s max=2904s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.verify-version.outputs.release_sha }}

      - name: Checkout workflow tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: .workflow-tools

      # Clear any stale extraction target so `gh run download` (which refuses
      # to overwrite) never aborts with "file exists" when the rust-cache
      # restored a prior run's frontend-dist-bundle into the workspace.
      - name: Clean stale frontend artifact target
        shell: bash
        run: rm -rf crates/maekon-web/frontend/frontend-dist-bundle crates/maekon-web/frontend/frontend-dist.tar.gz

      - name: Download frontend dist artifact
        uses: ./.workflow-tools/.github/actions/download-artifact
        with:
          github-token: ${{ github.token }}
          name: frontend-dist-bundle
          path: crates/maekon-web/frontend

      - name: Extract frontend dist artifact
        shell: bash
        run: |
          tar -xzf crates/maekon-web/frontend/frontend-dist.tar.gz -C crates/maekon-web/frontend
          test -f crates/maekon-web/frontend/dist/index.html

      - name: Configure OpenSSL for SQLCipher (Windows)
        if: runner.os == 'Windows'
        uses: ./.workflow-tools/.github/actions/setup-windows-openssl

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y \
            libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libnotify-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Verify DEB metadata assets
        if: runner.os == 'Linux'
        run: ./scripts/verify-deb-metadata.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: ./.github/actions/rust-cache
        with:
          key: release-build-${{ matrix.target }}

      # Tauri externalBin (`maekon-sandbox-worker`) expects a binary named
      # `<name>-<target-triple>[.exe]` at the src-tauri/ root. Build the
      # sandbox-worker crate for this target and copy it into place BEFORE
      # the maekon-app release build so the Tauri bundler finds it.
      - name: Build sandbox worker for Tauri externalBin
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          ./scripts/cargo-cache.sh build --locked --release --target "$TARGET_TRIPLE" -p maekon-sandbox-worker
          SRC="target/$TARGET_TRIPLE/release/maekon-sandbox-worker"
          DST="src-tauri/maekon-sandbox-worker-$TARGET_TRIPLE"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "$SRC.exe" "$DST.exe"
          else
            cp "$SRC" "$DST"
            chmod +x "$DST"
          fi
          ls -la "src-tauri/maekon-sandbox-worker-$TARGET_TRIPLE"* || true

      # Regression guards:
      # - #6118: Linux releases need `systemd-notify` for Type=notify units.
      # - #6752: shipped Linux/Windows releases must include the native sandbox
      #   feature for their platform instead of presenting unenforced sandbox UI.
      # - #8056: shipped releases (all 3 OS) must include `lan-sync` so the
      #   cross-device LAN sync engine compiles in — without it
      #   `SyncTransportKind::Lan` short-circuits to "sync disabled" and
      #   `discover_sync_peers` can never work in a shipped binary. Default
      #   remains opt-in via `config.sync.enabled`; the feature only gates code
      #   inclusion, not activation.
      # - #8053: shipped releases (all 3 OS) must include `stt,download` so the
      #   local audio/STT subsystem (~3,900 LoC `maekon-audio` crate + 10 tauri
      #   commands + AudioTab UI) compiles in — without it `audio_wiring.rs` wires
      #   every capability to `None` and all 10 audio commands dead-end in
      #   `service.unavailable`. `stt` pulls in the base `audio` feature plus
      #   `maekon-audio/whisper`; `download` adds on-demand model fetching. Models
      #   are NOT bundled — they download on demand. `cloud-stt` is deliberately
      #   excluded (local-only privacy posture). The feature only gates code
      #   inclusion, not activation (opt-in via `config.audio.enabled`).
      - name: Assert native release feature sets
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'FEATURES="grpc,systemd-notify,linux-sandbox,lan-sync,stt,download"' .github/workflows/release.yml; then
            echo "::error::Linux release build must use FEATURES=grpc,systemd-notify,linux-sandbox,lan-sync,stt,download (#6118/#6752/#8056/#8053)." >&2
            exit 1
          fi
          if ! grep -q 'FEATURES="grpc,windows-sandbox,lan-sync,stt,download"' .github/workflows/release.yml; then
            echo "::error::Windows release build must use FEATURES=grpc,windows-sandbox,lan-sync,stt,download (#6752/#8056/#8053)." >&2
            exit 1
          fi
          if ! grep -q 'FEATURES="grpc,lan-sync,stt,download"' .github/workflows/release.yml; then
            echo "::error::macOS release build must use FEATURES=grpc,lan-sync,stt,download (#8056/#8053)." >&2
            exit 1
          fi

      - name: Verify WebDriver dependency isolation
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/check-webdriver-security-isolation.sh

      - name: Build release
        shell: bash
        # Feature set is OS-conditional. Linux keeps `systemd-notify` for its
        # Type=notify unit and adds `linux-sandbox`; Windows adds
        # `windows-sandbox`. macOS has no native sandbox Cargo feature here.
        # All three ship `lan-sync` (#8056) so the LAN cross-device sync engine
        # is compiled into the shipped binary, and `stt,download` (#8053) so the
        # local audio/STT subsystem + on-demand model download are live.
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            FEATURES="grpc,systemd-notify,linux-sandbox,lan-sync,stt,download"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            FEATURES="grpc,windows-sandbox,lan-sync,stt,download"
          else
            FEATURES="grpc,lan-sync,stt,download"
          fi
          ./scripts/cargo-cache.sh build --locked --release --target ${{ matrix.target }} -p maekon-app --features "$FEATURES"

      - name: Stage signed Microsoft VC runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/stage-windows-vc-runtime.ps1 `
            -PayloadRoot "target/${{ matrix.target }}/release"

      - name: Verify prebuilt Windows runtime DLL closure
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw "Visual Studio C++ tools are required for PE closure verification" }
          $dumpbins = @(Get-ChildItem -Path (Join-Path $installation "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse)
          $dumpbin = $dumpbins |
            Where-Object { $_.FullName -match '[\\/]Hostx64[\\/]x64[\\/]dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (!$dumpbin) { $dumpbin = $dumpbins | Sort-Object FullName -Descending | Select-Object -First 1 }
          if (!$dumpbin) { throw "dumpbin.exe was not found under $installation" }
          node scripts/verify-windows-runtime-closure.mjs `
            --payload-root "target/${{ matrix.target }}/release" `
            --dependency-tool $dumpbin.FullName

      - name: Validate WiX assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "src-tauri/wix/main.wxs")) {
            Write-Error "Missing WiX manifest: src-tauri/wix/main.wxs"
            exit 1
          }
          if (!(Test-Path "src-tauri/wix/license.rtf")) {
            Write-Error "Missing WiX license file: src-tauri/wix/license.rtf"
            exit 1
          }

      # ── MSI 인스톨러 (Windows only) ──
      - name: Install cargo-wix
        if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/cargo-cache.sh install cargo-wix --version 0.3.9 --locked --force

      - name: Install Tauri CLI
        if: runner.os == 'Windows'
        shell: bash
        # --locked: install from tauri-cli 2.11.2's published Cargo.lock so the
        # transitive `time` dep is pinned to the version it was tested with.
        # Without it, `cargo install` resolves `time` fresh and (since
        # 2026-06) picks up time 0.3.48, which fails to compile tauri-utils on
        # the MSVC target with E0119 — a non-reproducible "the world moved"
        # break that did not exist when rc.5 was built.
        run: ./scripts/cargo-cache.sh install tauri-cli --version 2.11.2 --locked --force

      - name: Build MSI installer
        if: runner.os == 'Windows'
        shell: bash
        working-directory: src-tauri
        run: ../scripts/cargo-cache.sh wix -p maekon-app --nocapture --target ${{ matrix.target }} --no-build --target-bin-dir ../target/${{ matrix.target }}/release

      - name: Build NSIS setup installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_PATH="${RUNNER_TEMP}/tauri-nsis-ci-config.json"
          RUNTIME_ROOT="$(cygpath -m "$(pwd)/target/${{ matrix.target }}/release")"
          printf '{"build":{"beforeBuildCommand":""},"bundle":{"resources":{"%s/vcruntime140.dll":"vcruntime140.dll","%s/vcruntime140_1.dll":"vcruntime140_1.dll"}}}\n' \
            "$RUNTIME_ROOT" "$RUNTIME_ROOT" > "$CONFIG_PATH"
          ./scripts/cargo-cache.sh tauri build \
            --bundles nsis \
            --target ${{ matrix.target }} \
            --features grpc,windows-sandbox,lan-sync,stt,download \
            --ci \
            --config "$CONFIG_PATH"

      # ── DEB 패키지 (Linux only) ──
      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: ./scripts/cargo-cache.sh install cargo-deb --version 3.7.0 --locked --force

      - name: Build DEB package
        if: runner.os == 'Linux'
        run: ./scripts/cargo-cache.sh deb -p maekon-app --target ${{ matrix.target }} --no-build

      # ── 패키징 ──
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp ../../../src-tauri/icons/icon.icns .
            tar -czvf ../../../dist/"$ARTIFACT_NAME"."$ASSET_EXT" maekon maekon-sandbox-worker icon.icns
          else
            tar -czvf ../../../dist/"$ARTIFACT_NAME"."$ASSET_EXT" maekon maekon-sandbox-worker
          fi
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          ASSET_EXT: ${{ matrix.asset_ext }}

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/maekon.exe,target/${{ matrix.target }}/release/maekon-sandbox-worker.exe,target/${{ matrix.target }}/release/vcruntime140.dll,target/${{ matrix.target }}/release/vcruntime140_1.dll -DestinationPath dist/${{ matrix.artifact_name }}.${{ matrix.asset_ext }}

      - name: Verify packaged Windows runtime DLL closure
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw "Visual Studio C++ tools are required for PE closure verification" }
          $dumpbins = @(Get-ChildItem -Path (Join-Path $installation "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse)
          $dumpbin = $dumpbins |
            Where-Object { $_.FullName -match '[\\/]Hostx64[\\/]x64[\\/]dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (!$dumpbin) { $dumpbin = $dumpbins | Sort-Object FullName -Descending | Select-Object -First 1 }
          if (!$dumpbin) { throw "dumpbin.exe was not found under $installation" }

          $zipRoot = Join-Path $env:RUNNER_TEMP "maekon-zip-runtime-closure"
          Remove-Item -LiteralPath $zipRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath "dist/${{ matrix.artifact_name }}.${{ matrix.asset_ext }}" -DestinationPath $zipRoot
          node scripts/verify-windows-runtime-closure.mjs --payload-root $zipRoot --dependency-tool $dumpbin.FullName

          $msi = Get-ChildItem -Path "target/wix","src-tauri/target/wix" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$msi) { throw "No MSI file found for runtime closure verification" }
          $msiRoot = Join-Path $env:RUNNER_TEMP "maekon-msi-runtime-closure"
          Remove-Item -LiteralPath $msiRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $msiRoot -Force | Out-Null
          & msiexec.exe /a $msi.FullName /qn "TARGETDIR=$msiRoot"
          if ($LASTEXITCODE -ne 0) { throw "MSI administrative extraction failed with exit $LASTEXITCODE" }
          node scripts/verify-windows-runtime-closure.mjs --payload-root $msiRoot --dependency-tool $dumpbin.FullName

          $setup = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/nsis","src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$setup) { throw "No NSIS setup file found for runtime closure verification" }
          $nsisRoot = Join-Path $env:RUNNER_TEMP "maekon-nsis-runtime-closure"
          Remove-Item -LiteralPath $nsisRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $nsisRoot -Force | Out-Null
          & 7z.exe x "-o$nsisRoot" -y $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "NSIS extraction failed with exit $LASTEXITCODE" }
          node scripts/verify-windows-runtime-closure.mjs --payload-root $nsisRoot --dependency-tool $dumpbin.FullName

      - name: Generate checksums
        if: runner.os != 'Windows'
        run: |
          cd dist
          shasum -a 256 ${{ matrix.artifact_name }}.${{ matrix.asset_ext }} > ${{ matrix.artifact_name }}.${{ matrix.asset_ext }}.sha256

      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = Get-FileHash -Algorithm SHA256 -Path "dist/${{ matrix.artifact_name }}.${{ matrix.asset_ext }}"
          "$($hash.Hash.ToLower())  ${{ matrix.artifact_name }}.${{ matrix.asset_ext }}" | Out-File -Encoding ascii "dist/${{ matrix.artifact_name }}.${{ matrix.asset_ext }}.sha256"

      - name: Upload zip/tar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}-archive
          path: |
            dist/${{ matrix.artifact_name }}.${{ matrix.asset_ext }}
            dist/${{ matrix.artifact_name }}.${{ matrix.asset_ext }}.sha256
          if-no-files-found: error

      - name: Verify MSI version
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG_REF: ${{ needs.verify-version.outputs.release_tag }}
        run: |
          $expectedVersion = $env:TAG_REF -replace '^v', ''
          # Tauri normalizes the semver `-rc.N` suffix to `.N` for the MSI
          # ProductVersion because WiX requires a 4-part numeric version
          # (MAJOR.MINOR.PATCH.BUILD). So `0.0.1-rc.1` becomes `0.0.1.1` in
          # the MSI filename. Build the expected pattern accordingly.
          $expectedMsiPattern = $expectedVersion -replace '-rc\.', '.'
          $msiFile = Get-ChildItem -Path "target/wix","src-tauri/target/wix" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msiFile) { Write-Error "No MSI file found"; exit 1 }
          $msiName = $msiFile.Name
          Write-Host "MSI file: $msiName, expected pattern: $expectedMsiPattern"
          $escapedPattern = [regex]::Escape($expectedMsiPattern)
          if ($msiName -notmatch $escapedPattern) {
            Write-Error "MSI version mismatch: file=$msiName expected pattern=$expectedMsiPattern"
            exit 1
          }
          Write-Host "MSI version check passed"

      - name: Verify DEB version
        if: runner.os == 'Linux'
        env:
          TAG_REF: ${{ needs.verify-version.outputs.release_tag }}
        run: |
          EXPECTED_VERSION="${TAG_REF#v}"
          if [[ "$EXPECTED_VERSION" == *-* ]]; then
            EXPECTED_DEB_UPSTREAM="${EXPECTED_VERSION%%-*}~${EXPECTED_VERSION#*-}"
          else
            EXPECTED_DEB_UPSTREAM="$EXPECTED_VERSION"
          fi
          DEB_FILE=$(find target -name "*.deb" -type f | head -1)
          if [ -z "$DEB_FILE" ]; then echo "No DEB file found"; exit 1; fi
          DEB_VERSION=$(dpkg-deb -f "$DEB_FILE" Version)
          echo "DEB file: $(basename $DEB_FILE)"
          echo "DEB version: $DEB_VERSION"
          echo "Expected tag version: $EXPECTED_VERSION"
          echo "Expected DEB upstream: $EXPECTED_DEB_UPSTREAM"
          DEB_UPSTREAM="${DEB_VERSION%%-*}"
          if [ "$DEB_UPSTREAM" != "$EXPECTED_DEB_UPSTREAM" ]; then
            echo "::error::DEB version mismatch: got $DEB_VERSION (upstream $DEB_UPSTREAM), expected upstream $EXPECTED_DEB_UPSTREAM from tag $EXPECTED_VERSION"
            exit 1
          fi

      - name: Upload MSI artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maekon-windows-x64-msi
          path: |
            target/wix/*.msi
            src-tauri/target/wix/*.msi
          if-no-files-found: error

      - name: Upload NSIS setup artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maekon-windows-x64-setup-exe
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload DEB artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maekon-linux-x64-deb
          path: target/${{ matrix.target }}/debian/*.deb
          if-no-files-found: error

  build-macos-universal:
    name: Build macOS Universal Binary
    needs: [verify-version, build-release]
    runs-on: macos-latest
    environment: release-signing
    timeout-minutes: 120
    env:
      TAG_REF: ${{ needs.verify-version.outputs.release_tag }}
      MACOS_APP_CERT_P12_B64: ${{ secrets.MACOS_APP_CERT_P12_B64 }}
      MACOS_APP_CERT_PASSWORD: ${{ secrets.MACOS_APP_CERT_PASSWORD }}
      MACOS_INSTALLER_CERT_P12_B64: ${{ secrets.MACOS_INSTALLER_CERT_P12_B64 }}
      MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
      MACOS_APP_SIGNING_IDENTITY: ${{ secrets.MACOS_APP_SIGNING_IDENTITY }}
      MACOS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.verify-version.outputs.release_sha }}

      - name: Checkout workflow tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: .workflow-tools

      - name: Download arm64 artifact
        uses: ./.workflow-tools/.github/actions/download-artifact
        with:
          github-token: ${{ github.token }}
          name: maekon-macos-arm64-archive
          path: artifacts/arm64

      - name: Download x64 artifact
        uses: ./.workflow-tools/.github/actions/download-artifact
        with:
          github-token: ${{ github.token }}
          name: maekon-macos-x64-archive
          path: artifacts/x64

      - name: Verify architecture archives
        shell: bash
        run: |
          test -f artifacts/arm64/maekon-macos-arm64.tar.gz
          test -f artifacts/x64/maekon-macos-x64.tar.gz

      - name: Extract binaries
        run: |
          mkdir -p binaries
          tar -xzf artifacts/arm64/maekon-macos-arm64.tar.gz -C binaries
          mv binaries/maekon binaries/maekon-arm64
          mv binaries/maekon-sandbox-worker binaries/maekon-sandbox-worker-arm64
          rm -f binaries/icon.icns
          tar -xzf artifacts/x64/maekon-macos-x64.tar.gz -C binaries
          mv binaries/maekon binaries/maekon-x64
          mv binaries/maekon-sandbox-worker binaries/maekon-sandbox-worker-x64
          rm -f binaries/icon.icns

      - name: Create universal binary
        run: |
          lipo -create binaries/maekon-arm64 binaries/maekon-x64 -output binaries/maekon
          lipo -create binaries/maekon-sandbox-worker-arm64 binaries/maekon-sandbox-worker-x64 -output binaries/maekon-sandbox-worker
          file binaries/maekon
          file binaries/maekon-sandbox-worker
          mkdir -p dist
          cp src-tauri/icons/icon.icns binaries/
          tar -czvf dist/maekon-macos-universal.tar.gz -C binaries maekon maekon-sandbox-worker icon.icns
          shasum -a 256 dist/maekon-macos-universal.tar.gz > dist/maekon-macos-universal.tar.gz.sha256

      - name: Upload universal artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maekon-macos-universal
          path: |
            dist/maekon-macos-universal.tar.gz
            dist/maekon-macos-universal.tar.gz.sha256

      - name: Validate macOS signing secret material
        shell: bash
        run: |
          required=(
            MACOS_APP_CERT_P12_B64
            MACOS_APP_CERT_PASSWORD
            MACOS_INSTALLER_CERT_P12_B64
            MACOS_INSTALLER_CERT_PASSWORD
          )
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done

      # NEW-C3 (#2934): Confirm that tauri.conf.json signingIdentity is null.
      # Maekon intentionally bypasses Tauri's built-in signer (signingIdentity: null)
      # and uses an explicit codesign/productsign pipeline below.  If a developer
      # accidentally sets signingIdentity to a non-null value in tauri.conf.json, the
      # Tauri bundler would attempt to sign during 'cargo tauri build', which fails in
      # CI because the release certificate is not present at compile time.
      # This step detects that drift early and fails with a clear diagnostic.
      # Reference: docs/guides/macos-release-signing-runbook.md, ADR-020.
      - name: Verify tauri.conf.json signingIdentity is null (manual-signing contract)
        shell: bash
        run: |
          set -euo pipefail
          SIGNING_IDENTITY="$(python3 - <<'PYEOF'
          import json, sys
          with open('src-tauri/tauri.conf.json') as f:
              conf = json.load(f)
          macos_section = (conf.get('bundle') or {}).get('macOS') or {}
          val = macos_section.get('signingIdentity')
          print('null' if val is None else str(val))
          PYEOF
          )"
          echo "tauri.conf.json bundle.macOS.signingIdentity = ${SIGNING_IDENTITY}"
          if [[ "${SIGNING_IDENTITY}" != "null" ]]; then
            echo "tauri.conf.json bundle.macOS.signingIdentity must be null." >&2
            echo "Maekon uses a manual codesign pipeline; Tauri built-in signer must be disabled." >&2
            echo "See docs/guides/macos-release-signing-runbook.md and ADR-020 for details." >&2
            exit 1
          fi
          echo "Contract verified: Tauri built-in signer is disabled; manual codesign pipeline is active."

      - name: Import macOS signing certificates
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/maekon-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          APP_CERT_PATH="$RUNNER_TEMP/macos-app-cert.p12"
          INSTALLER_CERT_PATH="$RUNNER_TEMP/macos-installer-cert.p12"

          echo "$MACOS_APP_CERT_P12_B64" | base64 --decode > "$APP_CERT_PATH"
          echo "$MACOS_INSTALLER_CERT_P12_B64" | base64 --decode > "$INSTALLER_CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security import "$APP_CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_APP_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security import "$INSTALLER_CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_INSTALLER_CERT_PASSWORD" \
            -T /usr/bin/productsign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "APP_CERT_PATH=$APP_CERT_PATH" >> "$GITHUB_ENV"
          echo "INSTALLER_CERT_PATH=$INSTALLER_CERT_PATH" >> "$GITHUB_ENV"

      - name: Resolve macOS signing identities
        shell: bash
        run: |
          set -euo pipefail

          ALL_IDENTITIES="$(security find-identity -v "$KEYCHAIN_PATH" || true)"
          echo "$ALL_IDENTITIES"

          resolve_identity() {
            local kind="$1"
            local requested="$2"
            local resolved=""

            if [[ -n "$requested" ]] && printf '%s\n' "$ALL_IDENTITIES" | grep -F "\"$requested\"" >/dev/null; then
              resolved="$requested"
            else
              resolved="$(printf '%s\n' "$ALL_IDENTITIES" | sed -n "s/.*\"\\($kind: [^\"]*\\)\".*/\\1/p" | head -n1)"
            fi

            printf '%s' "$resolved"
          }

          APP_IDENTITY="$(resolve_identity "Developer ID Application" "${MACOS_APP_SIGNING_IDENTITY:-}")"
          INSTALLER_IDENTITY="$(resolve_identity "Developer ID Installer" "${MACOS_INSTALLER_SIGNING_IDENTITY:-}")"

          if [[ -z "$APP_IDENTITY" ]]; then
            echo "Unable to resolve Developer ID Application identity from imported certificate." >&2
            exit 1
          fi
          if [[ -z "$INSTALLER_IDENTITY" ]]; then
            echo "Unable to resolve Developer ID Installer identity from imported certificate." >&2
            exit 1
          fi

          echo "MACOS_APP_SIGNING_IDENTITY_RESOLVED=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_INSTALLER_SIGNING_IDENTITY_RESOLVED=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "Resolved macOS app/installer signing identities."

      - name: Validate macOS icon asset format
        shell: bash
        run: |
          ICON_FILE_INFO="$(file src-tauri/icons/icon.icns)"
          echo "$ICON_FILE_INFO"
          if [[ "$ICON_FILE_INFO" != *"Mac OS X icon"* ]]; then
            echo "src-tauri/icons/icon.icns must be a valid ICNS file." >&2
            exit 1
          fi

      - name: Create macOS app bundle
        shell: bash
        run: |
          VERSION="${TAG_REF#v}"
          APP_BUNDLE="dist/Maekon.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"
          cp binaries/maekon "$APP_BUNDLE/Contents/MacOS/maekon"
          chmod +x "$APP_BUNDLE/Contents/MacOS/maekon"
          cp binaries/maekon-sandbox-worker "$APP_BUNDLE/Contents/MacOS/maekon-sandbox-worker"
          chmod +x "$APP_BUNDLE/Contents/MacOS/maekon-sandbox-worker"
          cp src-tauri/icons/icon.icns "$APP_BUNDLE/Contents/Resources/icon.icns"
          cat > "$APP_BUNDLE/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Maekon</string>
            <key>CFBundleDisplayName</key>
            <string>Maekon</string>
            <key>CFBundleIdentifier</key>
            <string>com.maekon.app</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>maekon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSExceptionDomains</key>
              <dict>
                <key>127.0.0.1</key>
                <dict>
                  <key>NSExceptionAllowsInsecureHTTPLoads</key>
                  <true/>
                  <key>NSIncludesSubdomains</key>
                  <false/>
                </dict>
                <key>localhost</key>
                <dict>
                  <key>NSExceptionAllowsInsecureHTTPLoads</key>
                  <true/>
                  <key>NSIncludesSubdomains</key>
                  <false/>
                </dict>
              </dict>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Verify macOS app bundle version
        shell: bash
        run: |
          EXPECTED_VERSION="${TAG_REF#v}"
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" dist/Maekon.app/Contents/Info.plist)
          echo "Expected: $EXPECTED_VERSION"
          echo "Bundle:   $BUNDLE_VERSION"
          if [ "$BUNDLE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::macOS bundle version mismatch: got $BUNDLE_VERSION, expected $EXPECTED_VERSION"
            exit 1
          fi

      - name: Sign and verify macOS app bundle
        shell: bash
        run: |
          codesign --force --deep --options runtime --timestamp \
            --entitlements src-tauri/assets/maekon.entitlements \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$MACOS_APP_SIGNING_IDENTITY_RESOLVED" \
            dist/Maekon.app
          codesign --verify --deep --strict --verbose=2 dist/Maekon.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG installer
        shell: bash
        run: |
          # Free transient build artifacts before DMG creation.
          rm -rf artifacts binaries

          create-dmg \
            --volname "Maekon" \
            --volicon "src-tauri/icons/icon.icns" \
            --background "src-tauri/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 80 \
            --icon "Maekon.app" 180 170 \
            --app-drop-link 480 170 \
            --no-internet-enable \
            dist/maekon-macos-universal.dmg \
            dist/Maekon.app

      - name: Create and sign PKG installer
        run: |
          VERSION="${TAG_REF#v}"
          UNSIGNED_PKG_TMP="dist/maekon-macos-universal-pkgbuild-unsigned.pkg"
          pkgbuild \
            --component dist/Maekon.app \
            --identifier com.maekon.app \
            --version "$VERSION" \
            --install-location /Applications \
            "$UNSIGNED_PKG_TMP"
          productsign \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$MACOS_INSTALLER_SIGNING_IDENTITY_RESOLVED" \
            "$UNSIGNED_PKG_TMP" \
            dist/maekon-macos-universal.pkg
          pkgutil --check-signature dist/maekon-macos-universal.pkg
          rm -f "$UNSIGNED_PKG_TMP"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maekon-macos-universal-dmg
          path: dist/maekon-macos-universal.dmg
          if-no-files-found: error

      - name: Upload PKG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: maekon-macos-universal-pkg
          path: dist/maekon-macos-universal.pkg
          if-no-files-found: error

      - name: Cleanup macOS signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$APP_CERT_PATH" "$INSTALLER_CERT_PATH"

  release-reliability-smoke:
    name: Release Reliability Smoke (${{ matrix.name }})
    needs: [verify-version, build-release, build-macos-universal]
    environment: desktop-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact_name: maekon-linux-x64-archive
            run_updater_tests: true
          - name: macos
            os: macos-latest
            artifact_name: maekon-macos-universal
            run_updater_tests: true
          - name: windows
            os: windows-latest
            artifact_name: maekon-windows-x64-archive
            run_updater_tests: true
    runs-on: ${{ matrix.os }}
    # 실측 n=13 p50=517s max=2119s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.verify-version.outputs.release_sha }}

      - name: Checkout workflow tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: .workflow-tools

      - name: Download release archive for smoke
        uses: ./.workflow-tools/.github/actions/download-artifact
        with:
          github-token: ${{ github.token }}
          name: ${{ matrix.artifact_name }}
          path: smoke-assets

      - name: Verify downloaded smoke assets
        shell: bash
        run: |
          ls -la smoke-assets
          test -n "$(find smoke-assets -maxdepth 1 -type f)"

      - name: Download macOS installer artifacts for smoke
        if: matrix.name == 'macos'
        uses: ./.workflow-tools/.github/actions/download-artifact
        with:
          github-token: ${{ github.token }}
          name: maekon-macos-universal-dmg
          path: smoke-installers

      - name: Download macOS PKG artifact for smoke
        if: matrix.name == 'macos'
        uses: ./.workflow-tools/.github/actions/download-artifact
        with:
          github-token: ${{ github.token }}
          name: maekon-macos-universal-pkg
          path: smoke-installers

      - name: Verify downloaded macOS installer assets
        if: matrix.name == 'macos'
        shell: bash
        run: |
          find smoke-installers -maxdepth 3 -type f
          test -f smoke-installers/maekon-macos-universal.dmg
          test -f smoke-installers/maekon-macos-universal.pkg

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y \
            libwebkitgtk-6.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libnotify-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: ./.github/actions/rust-cache
        with:
          key: release-reliability-smoke-${{ matrix.name }}

      # The sidecar build below compiles maekon-storage → rusqlite with the
      # `bundled-sqlcipher` feature, whose openssl-sys build needs OPENSSL_DIR
      # on Windows (the runner image no longer auto-provides it). Mirror the
      # build job's OpenSSL setup so the smoke sidecar build doesn't fail with
      # "Missing environment variable OPENSSL_DIR".
      - name: Configure OpenSSL for SQLCipher (Windows)
        if: runner.os == 'Windows'
        uses: ./.workflow-tools/.github/actions/setup-windows-openssl

      # Tauri externalBin requires `maekon-sandbox-worker-<triple>[.exe]` at
      # the src-tauri/ root at build time. Build the real sidecar so release
      # reliability smoke also catches missing/stale sandbox-worker packaging
      # assumptions instead of relying on a synthetic touch-file.
      - name: Build sandbox worker sidecar for Tauri externalBin
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | awk '/^host:/ { print $2 }')
          ./scripts/cargo-cache.sh build --locked --release -p maekon-sandbox-worker
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            SOURCE="target/release/maekon-sandbox-worker.exe"
            DEST="src-tauri/maekon-sandbox-worker-${TRIPLE}.exe"
            test -f "$SOURCE"
            cp "$SOURCE" "$DEST"
          else
            SOURCE="target/release/maekon-sandbox-worker"
            DEST="src-tauri/maekon-sandbox-worker-${TRIPLE}"
            test -x "$SOURCE"
            cp "$SOURCE" "$DEST"
            chmod +x "$DEST"
          fi

      - name: Run smoke script (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./.workflow-tools/scripts/release-reliability-smoke.sh
          export MAEKON_SMOKE_LOG_DIR="$RUNNER_TEMP/maekon-release-smoke"
          export MAEKON_SMOKE_REPO_ROOT="$GITHUB_WORKSPACE"
          if [[ "${{ matrix.run_updater_tests }}" == "true" ]]; then
            ./.workflow-tools/scripts/release-reliability-smoke.sh --assets-dir smoke-assets
          else
            ./.workflow-tools/scripts/release-reliability-smoke.sh --assets-dir smoke-assets --skip-updater-tests
          fi

      - name: Run smoke script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MAEKON_SMOKE_REPO_ROOT = $env:GITHUB_WORKSPACE
          if ("${{ matrix.run_updater_tests }}" -eq "true") {
            .\.workflow-tools\scripts\release-reliability-smoke.ps1 -AssetsDir smoke-assets
          } else {
            .\.workflow-tools\scripts\release-reliability-smoke.ps1 -AssetsDir smoke-assets -SkipUpdaterTests
          }

      - name: Run macOS installer smoke script
        if: matrix.name == 'macos'
        shell: bash
        run: |
          chmod +x ./.workflow-tools/scripts/release-installer-smoke-macos.sh
          MAEKON_SMOKE_LOG_DIR="$RUNNER_TEMP/maekon-installer-smoke" \
            ./.workflow-tools/scripts/release-installer-smoke-macos.sh --assets-dir smoke-installers

      - name: Sanitize macOS release smoke logs
        if: failure() && matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          SANITIZED_DIR="$RUNNER_TEMP/maekon-release-smoke-sanitized"
          RELEASE_TAG="${RELEASE_TAG_NAME:-${GITHUB_REF_NAME:-v0.0.0-e19-smoke}}"
          if [[ "$RELEASE_TAG" != v* ]]; then
            RELEASE_TAG="v0.0.0-e19-smoke"
          fi
          ARTIFACT_CHECKSUM="sha256:$(printf '%s' "$GITHUB_SHA" | shasum -a 256 | awk '{print $1}')"
          python3 .workflow-tools/scripts/sanitize_desktop_evidence.py \
            --input "$RUNNER_TEMP/maekon-release-smoke/gui-bootstrap-installed-binary.log" \
            --input-id release-reliability-gui-bootstrap \
            --input "$RUNNER_TEMP/maekon-installer-smoke/gui-bootstrap-installed-app.log" \
            --input-id release-installer-gui-bootstrap \
            --artifact-kind log_excerpt \
            --output-dir "$SANITIZED_DIR" \
            --commit-sha "$GITHUB_SHA" \
            --release-tag "$RELEASE_TAG" \
            --artifact-checksum "$ARTIFACT_CHECKSUM" \
            --runner-label release-reliability-smoke-${{ matrix.name }} \
            --cleanup-status pass

      - name: Upload macOS release smoke sanitized bundle
        if: failure() && matrix.name == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-smoke-sanitized-bundle-${{ matrix.name }}
          path: ${{ runner.temp }}/maekon-release-smoke-sanitized
          if-no-files-found: ignore
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [verify-version, build-release, build-macos-universal, release-reliability-smoke]
    if: needs.build-release.result == 'success' && needs.build-macos-universal.result == 'success' && needs.release-reliability-smoke.result == 'success'
    runs-on: ubuntu-latest
    # 실측 n=2 p50=928s max=928s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 35
    environment: release-signing
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ needs.verify-version.outputs.release_sha }}

      - name: Checkout workflow tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: .workflow-tools

      - name: Download all artifacts
        uses: ./.workflow-tools/.github/actions/download-artifact
        with:
          github-token: ${{ github.token }}
          pattern: maekon-*
          path: dist
          merge-multiple: true

      - name: Flatten nested artifacts
        run: |
          # Move installer files from nested paths to dist/
          find dist -mindepth 2 -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.dmg' -o -name '*.pkg' \) -exec mv {} dist/ \;
          # Clean up empty nested directories
          find dist -mindepth 1 -type d -empty -delete

      - name: Verify installer coverage
        run: |
          for pattern in "*.msi" "*.exe" "*.deb" "*.dmg" "*.pkg"; do
            if ! compgen -G "dist/${pattern}" > /dev/null; then
              echo "Missing expected installer artifact: ${pattern}" >&2
              exit 1
            fi
          done

      - name: Verify artifacts
        run: find dist -type f

      - name: Include signed runtime policy bundle
        run: |
          if [ -f "policy/runtime-policy.json" ]; then
            cp "policy/runtime-policy.json" "dist/runtime-policy.json"
            echo "Included runtime policy bundle in release artifacts"
          else
            echo "No runtime policy bundle found; skipping"
          fi

      - name: Generate HTTP OpenAPI snapshot
        run: ./scripts/generate-http-openapi.sh dist/maekon-web.v1.openapi.yaml

      - name: Ensure checksums exist for all release files
        run: |
          shopt -s nullglob
          for file in dist/*; do
            [ -f "$file" ] || continue
            case "$file" in
              *.sha256|*.sig)
                continue
                ;;
            esac
            shasum -a 256 "$file" > "$file.sha256"
          done

      - name: Generate CycloneDX SBOM (F-SC-09/F-SC-13)
        # F-SC-13: anchore/sbom-action SHA-pinned to the v0.24.0 commit.
        # The prior pin (61119d4) became unresolvable once anchore re-pointed
        # an older tag and GC'd the old commit — this is the first release
        # since that pin landed, so it surfaced now. Re-resolved to the current
        # v0.24.0 commit (which `git/ref/tags/v0.24.0` reports as type=commit;
        # for lightweight tags object.sha IS the commit, no dereference needed).
        # 생성된 sbom.cdx.json 은 dist/ 에 추가되어 릴리스 어셋으로 첨부된다.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-artifact: false

      - name: Checksum SBOM (F-SC-09)
        run: shasum -a 256 dist/sbom.cdx.json > dist/sbom.cdx.json.sha256

      - name: Verify release evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/sbom.cdx.json
          test -s dist/sbom.cdx.json.sha256
          shasum -a 256 -c dist/sbom.cdx.json.sha256

      - name: Install signing dependencies
        run: python3 -m pip install --upgrade pynacl

      - name: Sign release artifacts (Ed25519)
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          from nacl.signing import SigningKey

          key_b64 = os.environ.get("UPDATE_SIGNING_PRIVATE_KEY_B64", "").strip()
          if not key_b64:
              raise SystemExit("Missing secret: UPDATE_SIGNING_PRIVATE_KEY_B64")

          seed = base64.b64decode(key_b64)
          if len(seed) != 32:
              raise SystemExit(f"UPDATE_SIGNING_PRIVATE_KEY_B64 must decode to 32 bytes, got {len(seed)}")

          signing_key = SigningKey(seed)
          dist = Path("dist")
          signed = 0
          for path in dist.glob("*"):
              if not path.is_file():
                  continue
              if path.suffix in {".sha256", ".sig"}:
                  continue
              payload = path.read_bytes()
              signature = signing_key.sign(payload).signature
              path.with_suffix(path.suffix + ".sig").write_text(base64.b64encode(signature).decode("ascii") + "\n", encoding="utf-8")
              signed += 1

          if signed == 0:
              raise SystemExit("No release artifacts were signed")
          print(f"Signed artifacts: {signed}")
          PY

      - name: Run signed release reliability smoke
        env:
          MAEKON_SMOKE_LOG_DIR: ${{ runner.temp }}/maekon-signed-release-smoke
          # install.sh prefers $MAEKON_UPDATE_PUBLIC_KEY over its hardcoded
          # fallback. We pass the secret-pair public key explicitly here so
          # the signed smoke verifies against the same key that signed the
          # artifacts (UPDATE_SIGNING_PRIVATE_KEY_B64 in the prior step).
          MAEKON_UPDATE_PUBLIC_KEY: ${{ secrets.MAEKON_UPDATE_PUBLIC_KEY }}
        run: |
          chmod +x ./scripts/release-reliability-smoke.sh
          ./scripts/release-reliability-smoke.sh --assets-dir dist --asset-name maekon-linux-x64.tar.gz --skip-updater-tests --require-signature

      - name: Attest release artifacts provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/*

      - name: Ensure at least one asset exists
        run: |
          ASSET_COUNT=$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "No release assets were produced."
            exit 1
          fi
          echo "Asset count: $ASSET_COUNT"

      - name: Extract version from tag
        id: version
        run: echo "version=${RELEASE_TAG}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        env:
          TAG_REF: ${{ needs.verify-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG_REF#v}"
          ./scripts/verify-release-notes-policy.sh --public --version "$VERSION" --print-section > changelog_section.md

          if [ ! -s changelog_section.md ]; then
            echo "::error::No reviewed CHANGELOG.md section found for [$VERSION]"
            echo "Fix: Add ## [$VERSION] - $(date +%Y-%m-%d) with curated release notes to CHANGELOG.md"
            exit 1
          fi

      - name: Generate release notes
        id: notes
        env:
          RELEASE_KIND: ${{ needs.verify-version.outputs.release_kind }}
        run: |
          VERSION="${RELEASE_TAG}"
          CHANGELOG_CONTENT=$(cat changelog_section.md)

          if [ "${RELEASE_KIND}" = "rc" ]; then
            cat > quick_install.md <<QUICK_INSTALL_EOF
          This is a prerelease. GitHub's \`latest\` release endpoint does not include
          prereleases, so install commands are pinned to \`${VERSION}\`.

          **macOS / Linux:**
          \`\`\`bash
          curl -fsSL -o /tmp/maekon-install.sh \\
            https://raw.githubusercontent.com/${{ github.repository }}/${VERSION}/scripts/install.sh
          MAEKON_VERSION=${VERSION} bash /tmp/maekon-install.sh --require-signature
          \`\`\`

          **Windows (PowerShell):**
          \`\`\`powershell
          \$tmp = Join-Path \$env:TEMP "maekon-install.ps1"
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/${{ github.repository }}/${VERSION}/scripts/install.ps1" -OutFile \$tmp
          powershell -ExecutionPolicy Bypass -File \$tmp -Version ${VERSION} -RequireSignature
          \`\`\`
          QUICK_INSTALL_EOF
          else
            cat > quick_install.md <<QUICK_INSTALL_EOF
          **macOS / Linux:**
          \`\`\`bash
          curl -fsSL -o /tmp/maekon-install.sh \\
            https://raw.githubusercontent.com/${{ github.repository }}/${VERSION}/scripts/install.sh
          MAEKON_VERSION=${VERSION} bash /tmp/maekon-install.sh --require-signature
          \`\`\`

          **Windows (PowerShell):**
          \`\`\`powershell
          \$tmp = Join-Path \$env:TEMP "maekon-install.ps1"
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/${{ github.repository }}/${VERSION}/scripts/install.ps1" -OutFile \$tmp
          powershell -ExecutionPolicy Bypass -File \$tmp -Version ${VERSION} -RequireSignature
          \`\`\`
          QUICK_INSTALL_EOF
          fi
          QUICK_INSTALL_CONTENT=$(cat quick_install.md)

          cat > release_notes.md <<NOTES_EOF
          <!-- rollout:5 -->

          ## What's Changed

          ${CHANGELOG_CONTENT}

          ---

          ### Downloads

          Maekon is the app display name. Release filenames intentionally retain
          \`maekon-*\` for installer, updater, and checksum compatibility.

          | Platform | Architecture | File | Format |
          |----------|-------------|------|--------|
          | macOS | Universal (arm64 + x64) | \`maekon-macos-universal.dmg\` | DMG Installer (signed) |
          | macOS | Universal (arm64 + x64) | \`maekon-macos-universal.pkg\` | PKG Installer (signed) |
          | macOS | Universal | \`maekon-macos-universal.tar.gz\` | Binary |
          | macOS | Apple Silicon | \`maekon-macos-arm64.tar.gz\` | Binary |
          | macOS | Intel | \`maekon-macos-x64.tar.gz\` | Binary |
          | Windows | x64 | \`maekon-*.msi\` | MSI Installer |
          | Windows | x64 | \`maekon-windows-x64.zip\` | Binary |
          | Linux | x64 | \`maekon-*.deb\` | DEB Package |
          | Linux | x64 | \`maekon-linux-x64.tar.gz\` | Binary |

          ### Quick Install

          ${QUICK_INSTALL_CONTENT}

          **Full changelog:** [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          NOTES_EOF

      - name: Prepend release date header (Phase 4 A-4)
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-version.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.verify-version.outputs.release_sha }}
        run: |
          set -euo pipefail
          DATE=$(date -u +"%B %d, %Y")
          ISO_DATE=$(date -u +"%Y-%m-%d")
          SHORT_SHA="${RELEASE_SHA:0:9}"
          # Use env-sourced RELEASE_TAG/RELEASE_SHA (workflow outputs, not user
          # input) to compose the header; DATE/ISO_DATE are generated here so
          # no external input. SHORT_SHA mirrors build.rs GIT_SHA (--short=9).
          HEADER="## Maekon $RELEASE_TAG — Released $DATE"
          BUILD_LINE="**Built**: \`$ISO_DATE\` UTC · **Commit**: \`$SHORT_SHA\`"
          # Idempotency guard (Q5 follow-up): skip prepend if a header for
          # this tag is already present on the first line — regardless of
          # its date suffix. Protects against workflow re-runs (same day or
          # cross-day) that would otherwise double-prepend the header.
          PREFIX="## Maekon $RELEASE_TAG — Released "
          FIRST_LINE=$(head -n1 release_notes.md)
          case "$FIRST_LINE" in
            "$PREFIX"*)
              echo "Release date header already present for $RELEASE_TAG — skipping prepend"
              ;;
            *)
              printf "%s\n\n%s\n\n" "$HEADER" "$BUILD_LINE" | cat - release_notes.md > release_notes.md.new
              mv release_notes.md.new release_notes.md
              ;;
          esac

      - name: Create or update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_NAME: ${{ needs.verify-version.outputs.release_tag }}
          RELEASE_TARGET_SHA: ${{ needs.verify-version.outputs.release_sha }}
          RELEASE_NAME: Maekon ${{ steps.version.outputs.version }}
          RELEASE_IS_PRERELEASE: ${{ contains(steps.version.outputs.version, '-') }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG_NAME} already exists; updating notes and assets"
            gh release view "$RELEASE_TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' > existing_release_assets.txt
            if grep -Fxq "notarization-final-byte-manifest.json" existing_release_assets.txt &&
              find dist -maxdepth 1 -type f \( -name 'maekon-macos-universal.dmg*' -o -name 'maekon-macos-universal.pkg*' \) -print -quit | grep -q .; then
              echo "::error::Refusing to clobber notarized macOS final-byte assets. Use notarize-macos-release-assets.yml to republish final macOS bytes."
              exit 1
            fi
            gh release edit "$RELEASE_TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --notes-file release_notes.md
            gh release upload "$RELEASE_TAG_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            exit 0
          fi

          create_args=(
            "$RELEASE_TAG_NAME"
            --repo "$GITHUB_REPOSITORY"
            --target "$RELEASE_TARGET_SHA"
            --title "$RELEASE_NAME"
            --notes-file release_notes.md
          )

          if [[ "$RELEASE_IS_PRERELEASE" == "true" ]]; then
            create_args+=(--prerelease)
          fi

          gh release create "${create_args[@]}" dist/*

      - name: Trigger maekon-landing redeploy
        if: success()
        shell: bash
        env:
          DEPLOY_HOOK_URL: ${{ secrets.MAEKON_LANDING_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOOK_URL:-}" ]]; then
            echo "::warning::MAEKON_LANDING_DEPLOY_HOOK secret missing — landing will show stale release info until next git push to main"
            exit 0
          fi
          # POST to Vercel deploy hook URL (no body, no auth required — URL is the secret).
          # Fail-open: log warning on non-200 so a landing redeploy hiccup doesn't fail the release.
          if curl -X POST -fsSL "$DEPLOY_HOOK_URL" -o /dev/null; then
            echo "✓ Vercel deploy hook triggered for maekon-landing"
          else
            echo "::warning::Vercel deploy hook returned non-200 — landing may show stale data until next push"
          fi
