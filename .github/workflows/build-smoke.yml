name: Build Smoke Test

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform to build'
        required: true
        type: choice
        options:
          - windows
          - macos-arm64
          - macos-x64
          - linux
          - all
      ref:
        description: 'Branch or commit SHA to build (default: main)'
        required: false
        type: string
        default: 'main'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  # `-W warnings`: smoke builds must EXECUTE, not lint — the vendored
  # `patches/` crates are uncapped path deps whose macOS impls fail a global
  # `-D` (see ci.yml `check` job for the ubuntu first-party deny gate, and its
  # top-of-file `RUSTFLAGS` comment for the empirical mechanism writeup).
  # `Cargo.toml`'s `[workspace.lints.rust]` first-party `unused`/`dead_code`
  # deny (#7743, ctd-W3 A2) is baked into the manifest, not a CI-only flag, so
  # it applies to this workflow's builds too without needing a RUSTFLAGS
  # change here.
  RUSTFLAGS: -W warnings

permissions:
  contents: read

jobs:
  resolve-matrix:
    name: Resolve Build Matrix
    runs-on: ubuntu-latest
    # 실측 n=5 p50=2s max=4s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          BUILD_TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          case "${BUILD_TARGET}" in
            windows)
              echo 'matrix={"include":[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","artifact_name":"maekon-windows-x64","asset_ext":"zip"}]}' >> "$GITHUB_OUTPUT"
              ;;
            macos-arm64)
              echo 'matrix={"include":[{"os":"macos-14","target":"aarch64-apple-darwin","artifact_name":"maekon-macos-arm64","asset_ext":"tar.gz"}]}' >> "$GITHUB_OUTPUT"
              ;;
            macos-x64)
              echo 'matrix={"include":[{"os":"macos-13","target":"x86_64-apple-darwin","artifact_name":"maekon-macos-x64","asset_ext":"tar.gz"}]}' >> "$GITHUB_OUTPUT"
              ;;
            linux)
              echo 'matrix={"include":[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","artifact_name":"maekon-linux-x64","asset_ext":"tar.gz"}]}' >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo 'matrix={"include":[{"os":"macos-14","target":"aarch64-apple-darwin","artifact_name":"maekon-macos-arm64","asset_ext":"tar.gz"},{"os":"macos-13","target":"x86_64-apple-darwin","artifact_name":"maekon-macos-x64","asset_ext":"tar.gz"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","artifact_name":"maekon-windows-x64","asset_ext":"zip"},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","artifact_name":"maekon-linux-x64","asset_ext":"tar.gz"}]}' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build (${{ matrix.target }})
    needs: resolve-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # 실측 n=3 p50=1679s max=1986s → 2 × 최대 (5분 올림, 하한 10 · 상한 120)
    timeout-minutes: 70
    env:
      BUILD_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: smoke-build-${{ matrix.target }}

      - name: Configure OpenSSL for SQLCipher (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-openssl

      # #11237: the Linux leg ran on `ubuntu-22.04` while `release.yml` builds on
      # `ubuntu-latest`. The feature strings matched, so this step called itself
      # "release feature parity" — but the axis that decides this build is the
      # system PipeWire header, and that is set by the runner image, not by
      # features. `libspa 0.9.2` does not match 22.04's PipeWire 0.3.48
      # (`spa_video_info_raw` has no `flags`; `modifier` is `i64`), so the leg was
      # red while the release it claimed to rehearse built fine — rc.8 shipped
      # Linux artifacts from that same feature set.
      #
      # WHAT THIS DROPS: nothing here observes whether the source still builds on
      # 22.04 any more. `docs/guides/autostart.md` claims Ubuntu 20.04+, and that
      # claim is now unverified by CI. It was already only half-verified — the
      # shipped `.deb` is built on `ubuntu-latest`, so whether a 22.04 user can
      # run it is a separate, still-open question that this leg never answered.
      #
      # Must cover the SHIPPED Linux feature set, not just the webview stack.
      # `stt` pulls cpal -> PipeWire SPA and whisper -> bindgen, so a list
      # without libspa/libpipewire/libasound/libclang fails the build outright:
      #   error: failed to run custom build command for `libspa-sys v0.9.2`
      # (#10838, run 31679073940). This lane has compiled `stt` since #8053 and
      # is dispatch-only, so nothing exercised it until the rc.8 tag point.
      # Keep in step with ci.yml's Build job list.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-6.0-dev \
            libglib2.0-dev \
            libpango1.0-dev \
            libatk1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libnotify-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libudev-dev \
            libclang-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          version: '10'
          lockfile-path: crates/maekon-web/frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: crates/maekon-web/frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Create sandbox worker stub for Tauri externalBin
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            touch "src-tauri/maekon-sandbox-worker-${TARGET}.exe"
          else
            touch "src-tauri/maekon-sandbox-worker-${TARGET}"
            chmod +x "src-tauri/maekon-sandbox-worker-${TARGET}"
          fi

      # Each build sets its EFFECTIVE RUSTFLAGS rather than inheriting this
      # workflow's `RUSTFLAGS: -W warnings`. Cargo's extra-flag sources are
      # mutually exclusive and `RUSTFLAGS` outranks `target.<triple>.rustflags`,
      # so the top-level lint flag silently discarded the
      # `-C target-feature=+crt-static` that setup-windows-openssl exports — the
      # release contract's static MSVC CRT. The CRT then linked dynamically,
      # `MSVCP140.dll` entered the import table, and the PE closure check below
      # failed on a binary that is not the shipped one (#10838).
      #
      # release.yml sets no RUSTFLAGS at all and `.cargo/config.toml` sets no
      # `rustflags`, so its effective flags are: Windows `+crt-static`, every
      # other target none. Reproduce exactly that. Feature parity alone is not
      # parity — every dimension that changes the import table has to match.
      - name: Build release binary (macOS release feature parity)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          export RUSTFLAGS=""
          cargo build --locked --release --target ${{ matrix.target }} -p maekon-app --features grpc,lan-sync,stt,download

      - name: Build release binary (Windows release feature parity)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export RUSTFLAGS="-C target-feature=+crt-static"
          echo "effective RUSTFLAGS: '${RUSTFLAGS}'"
          cargo build --locked --release --target ${{ matrix.target }} -p maekon-app --features grpc,windows-sandbox,lan-sync,stt,download

      - name: Build release binary (Linux release feature parity)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export RUSTFLAGS=""
          cargo build --locked --release --target ${{ matrix.target }} -p maekon-app --features grpc,systemd-notify,linux-sandbox,lan-sync,stt,download

      # Feature parity above is only half the rehearsal: a binary that compiles
      # can still fail to launch on a clean host. This lane built the shipped
      # Windows binary and never inspected its imports, so the v0.0.1-rc.7
      # closure failure (`maekon.exe -> mmdevapi.dll`) was reachable here and
      # first surfaced in release.yml, after the tag was already pushed.
      - name: Stage and verify signed Microsoft VC runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./scripts/stage-windows-vc-runtime.ps1 `
            -PayloadRoot "target/${{ matrix.target }}/release"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw "Visual Studio C++ tools are required for PE closure verification" }
          $dumpbin = Get-ChildItem -Path (Join-Path $installation "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName -match '[\\/]Hostx64[\\/]x64[\\/]dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (!$dumpbin) { throw "x64 dumpbin.exe was not found under $installation" }
          node scripts/verify-windows-runtime-closure.mjs `
            --payload-root "target/${{ matrix.target }}/release" `
            --dependency-tool $dumpbin.FullName `
            --binary maekon.exe

      - name: Run clippy (warnings only, non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            FEATURES="grpc,systemd-notify,linux-sandbox,lan-sync,stt,download"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            FEATURES="grpc,windows-sandbox,lan-sync,stt,download"
          else
            FEATURES="grpc,lan-sync,stt,download"
          fi
          cargo clippy --locked --target ${{ matrix.target }} -p maekon-app --features "$FEATURES" -- -W warnings

      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }} -p maekon-app

      - name: Print summary
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
        shell: bash
        run: |
          echo "## Build Smoke Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | ${TARGET} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OS | ${OS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | ${BUILD_REF} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | Pass |" >> "$GITHUB_STEP_SUMMARY"
