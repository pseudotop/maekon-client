name: Build Smoke Test

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform to build'
        required: true
        type: choice
        options:
          - windows
          - macos-arm64
          - macos-x64
          - linux
          - all
      ref:
        description: 'Branch or commit SHA to build (default: main)'
        required: false
        type: string
        default: 'main'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  # `-W warnings`: smoke builds must EXECUTE, not lint — the vendored
  # `patches/` crates are uncapped path deps whose macOS impls fail a global
  # `-D` (see ci.yml `check` job for the first-party deny gate).
  RUSTFLAGS: -W warnings

permissions:
  contents: read

jobs:
  resolve-matrix:
    name: Resolve Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          BUILD_TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          case "${BUILD_TARGET}" in
            windows)
              echo 'matrix={"include":[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","artifact_name":"maekon-windows-x64","asset_ext":"zip"}]}' >> "$GITHUB_OUTPUT"
              ;;
            macos-arm64)
              echo 'matrix={"include":[{"os":"macos-14","target":"aarch64-apple-darwin","artifact_name":"maekon-macos-arm64","asset_ext":"tar.gz"}]}' >> "$GITHUB_OUTPUT"
              ;;
            macos-x64)
              echo 'matrix={"include":[{"os":"macos-13","target":"x86_64-apple-darwin","artifact_name":"maekon-macos-x64","asset_ext":"tar.gz"}]}' >> "$GITHUB_OUTPUT"
              ;;
            linux)
              echo 'matrix={"include":[{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","artifact_name":"maekon-linux-x64","asset_ext":"tar.gz"}]}' >> "$GITHUB_OUTPUT"
              ;;
            all)
              echo 'matrix={"include":[{"os":"macos-14","target":"aarch64-apple-darwin","artifact_name":"maekon-macos-arm64","asset_ext":"tar.gz"},{"os":"macos-13","target":"x86_64-apple-darwin","artifact_name":"maekon-macos-x64","asset_ext":"tar.gz"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","artifact_name":"maekon-windows-x64","asset_ext":"zip"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","artifact_name":"maekon-linux-x64","asset_ext":"tar.gz"}]}' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build (${{ matrix.target }})
    needs: resolve-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      BUILD_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: smoke-build-${{ matrix.target }}

      - name: Configure OpenSSL for SQLCipher (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-openssl

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-6.0-dev

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          version: '10'
          lockfile-path: crates/maekon-web/frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: crates/maekon-web/frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Create sandbox worker stub for Tauri externalBin
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            touch "src-tauri/maekon-sandbox-worker-${TARGET}.exe"
          else
            touch "src-tauri/maekon-sandbox-worker-${TARGET}"
            chmod +x "src-tauri/maekon-sandbox-worker-${TARGET}"
          fi

      - name: Build release binary (macOS release feature parity)
        if: runner.os == 'macOS'
        run: cargo build --locked --release --target ${{ matrix.target }} -p maekon-app --features grpc

      - name: Build release binary (Windows release feature parity)
        if: runner.os == 'Windows'
        run: cargo build --locked --release --target ${{ matrix.target }} -p maekon-app --features grpc,windows-sandbox

      - name: Build release binary (Linux release feature parity)
        if: runner.os == 'Linux'
        run: cargo build --locked --release --target ${{ matrix.target }} -p maekon-app --features grpc,systemd-notify,linux-sandbox

      - name: Run clippy (warnings only, non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            FEATURES="grpc,systemd-notify,linux-sandbox"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            FEATURES="grpc,windows-sandbox"
          else
            FEATURES="grpc"
          fi
          cargo clippy --locked --target ${{ matrix.target }} -p maekon-app --features "$FEATURES" -- -W warnings

      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }} -p maekon-app

      - name: Print summary
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
        shell: bash
        run: |
          echo "## Build Smoke Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | ${TARGET} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| OS | ${OS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | ${BUILD_REF} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | Pass |" >> "$GITHUB_STEP_SUMMARY"
