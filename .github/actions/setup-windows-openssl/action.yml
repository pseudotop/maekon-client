name: Setup Windows OpenSSL
description: >-
  Configure the Windows MSVC build for SQLCipher's VENDORED OpenSSL. Does not
  locate or link any system OpenSSL SDK — see the note below.

# WHY THIS NO LONGER PROBES FOR A SYSTEM OpenSSL SDK (#9884 / #10060)
# -------------------------------------------------------------------
# `rusqlite` is built with `bundled-sqlcipher-vendored-openssl`, which makes
# `libsqlite3-sys` pull `openssl-sys` with its `vendored` feature and compile
# OpenSSL from source via `openssl-src`. That switch is the fix for #9884:
# plain `bundled-sqlcipher` linked the SYSTEM OpenSSL *dynamically* on Windows
# (libsqlite3-sys build.rs gates on this exact feature), so shipped artifacts
# needed `libcrypto-3-x64.dll` on the target host and could not launch without it.
#
# This action previously staged the SDK's static archives and exported:
#
#     OPENSSL_DIR / OPENSSL_INCLUDE_DIR / OPENSSL_LIB_DIR
#     OPENSSL_LIBS=ssl:crypto
#     OPENSSL_STATIC=1
#     OPENSSL_NO_VENDOR=1      <-- the fatal one
#
# `OPENSSL_NO_VENDOR=1` makes openssl-sys skip vendoring even when the feature
# is enabled, so it fell back to the system probe and asked rustc to link
# `ssl`/`crypto` — while the staged files were named `libssl.lib`/`libcrypto.lib`.
# The build failed with:
#
#     error: could not find native static library `ssl`, perhaps an -L flag is missing?
#
# Setting those variables now actively defeats the fix. The only consumer of
# `openssl-sys` in this workspace is `libsqlite3-sys`
# (`cargo tree --workspace -i openssl-sys`), so nothing else needs a system SDK
# and requiring one would be a build failure with no upside.
#
# What DOES still matter is the MSVC CRT: the release contract links it
# statically, and `openssl-src` reads the same `crt-static` target feature to
# build OpenSSL with a matching runtime.

runs:
  using: composite
  steps:
    - name: Configure vendored OpenSSL build
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        # Fail closed if an ambient OPENSSL_NO_VENDOR would silently re-break the
        # build. Treat only "0" as disabled, matching openssl-sys's own check.
        if ($env:OPENSSL_NO_VENDOR -and $env:OPENSSL_NO_VENDOR -ne "0") {
          Write-Error ("the no-vendor override is set to '$($env:OPENSSL_NO_VENDOR)' " +
            "in the environment. SQLCipher requires vendored OpenSSL (#9884); with " +
            "it set, openssl-sys falls back to a system SDK and the link fails.")
        }

        "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static" |
          Out-File -FilePath $env:GITHUB_ENV -Append

        Write-Host "OpenSSL: vendored via openssl-src (no system SDK used)"
        Write-Host "MSVC CRT: statically linked"
