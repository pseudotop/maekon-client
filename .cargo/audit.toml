# cargo-audit configuration (RustSec).
#
# F-SC-04: cargo-audit does NOT read deny.toml, so the "RustSec audit" CI step
# (./scripts/cargo-cache.sh audit) previously failed on the same advisories that
# `cargo deny` already accepts via deny.toml. This file mirrors the accepted
# VULNERABILITY-class advisory IDs from deny.toml [advisories].ignore so that
# cargo-audit and cargo-deny suppress exactly the same accepted advisories, and
# so local `cargo audit` and CI behave identically (the stated F-SC-04 intent).
#
# SCOPE: this list contains only accepted vulnerability-class advisory IDs.
# Unmaintained and unsound advisories are not suppressed here: cargo audit
# reports them as non-failing warnings, which keeps the whole-lock warning
# channel. cargo-deny checks them for every crate in its graph and fails on any
# that deny.toml does not ignore by exact ID (#13705).
#
# SSOT: deny.toml [advisories] is the single source of rationale for
# suppressions. This file mirrors its vulnerability-class IDs; when those
# change, update this list in the same commit. The verify_exemption_expiry.py
# CI gate scans deny.toml (not this file) for any Review-by date that bounds a
# suppression.

[advisories]
# #13631 removed RUSTSEC-2026-0194/0195 after updating all vulnerable quick-xml
# consumers. Only 0.41.0 and 0.42.0 remain; the same frozen OSV scan detects the
# old lock as a positive control and reports neither advisory on the new lock.
# The previous exception was removed before its 2026-11-16 deadline.
# RUSTSEC-2026-0459 (#13722): libsqlite3-sys 0.38.2 compiles SQLCipher on
# SQLite 3.51.3. deny.toml holds the reason and the removal condition; delete
# this mirror in the same change that deletes the deny.toml entry.
ignore = [
  "RUSTSEC-2026-0459",
]
