[[exemptions.onig_sys]]
version = "69.9.1"
criteria = "safe-to-deploy"
notes = """
reason: cycle22-grace-baseline (cargo vet baseline import without manual audit)
review-by: 2026-11-08
follow-up: #3908 triage 2026-05-29 — not auditable/trustable in this triage pass (no-publisher crate, small/individual maintainer, or expert-concurrency unsafe); extended to 2026-11-01 per disposition #2. Re-review by 2026-11-01: targeted hand-audit or per-crate publisher-trust authorization. category:small-maintainer-or-other
disposition 2026-08-23 (#11281): kept, with an exit path measured rather than assumed.
  Hand-audit is not credible here: the 69.5.0 -> 69.9.1 delta is 65,633 lines and the
  body of it is vendored C (oniguruma/src/*.c, ~20k lines of regex engine) plus autotools
  files. Claiming complete reasoning over that is not something this audit can support.
  Publisher trust does not close it either, and the reason is a defect worth naming: this
  file already carries [[trusted.onig_sys]] for Keats#2876, but on crates.io that account
  published 1 of the 12 releases that have publisher records (8.3%). The actual maintainer
  is iwillspeak#3325 with 9 of 12 (75%), who published 69.9.1 and is trusted nowhere in
  this file. The existing trust entry therefore covers the wrong identity.
  Exit path: 69.9.2 and 69.9.3 are published through Trusted Publishing signed
  github:rust-onig/rust-onig, and onig 6.5.1 requires "69.9.1" (i.e. ^69.9.1), so both
  satisfy the constraint. Bumping to 69.9.3 lets this close on a repository signature
  instead of an individual account — a stronger identity than either option above.
  Chain: maekon-app -> maekon-embedding -> fastembed -> tokenizers -> onig -> onig_sys.
"""

