[[exemptions.cpal]]
version = "0.18.2"
criteria = "safe-to-deploy"
notes = """
reason: #11200 dependabot patch bump 0.18.1 -> 0.18.2. cpal has no audit chain in this
  project (only this exemption), so cargo-vet offers no delta path — certifying it means
  a full inspect of 28,256 lines, which was not done. This entry keeps the same
  uncertified posture as the 0.18.1 exemption it replaces; it does not claim review.
what-changed: upstream CHANGELOG for 0.18.2 is bug-fix only — xrun reporting added on
  AAudio/CoreAudio/PipeWire/WASAPI, timestamps kept monotonic across device and graph
  changes, ALSA sub-millisecond timeout no longer treated as a non-blocking poll, ALSA
  builds fixed on FreeBSD/DragonFly/NetBSD. No API removal, no new process or network
  surface. Measured diff: 36 files, +1923/-821, of which 15 added lines are `unsafe` in
  the aaudio/alsa backends.
why-take-it: no security driver — `cargo deny` is green on the current versions — but the
  bump is posture-neutral (already exempted) and buys the ALSA timeout and timestamp
  monotonicity fixes.
review-by: 2026-11-01
follow-up: Re-review the aaudio/alsa `unsafe` additions and the WASAPI windows-core 0.62
  pin before promotion beyond routine public export. category:public-dependabot-major
"""

