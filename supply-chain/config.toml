[[exemptions.time]]
version = "0.3.51"
criteria = "safe-to-deploy"
notes = """
reason: #7200 public-dependabot-ssot (#125 cargo-minor-patch queue resolved through parent SSOT; cargo-vet diff not fully certified in this pass). This continues the unaudited acceptance path from #6220 rather than serving as a safe-to-deploy attestation.
review-by: 2026-09-20
follow-up: #6220/#7200 — hand-audit the time 0.3.49..0.3.51 diff together with the pending num_fmt / FormatDescriptionV3 unsafe review, or replace with explicit trusted audit before promotion beyond routine public export.
disposition 2026-08-23 (#11281), revised after a partial audit — three findings change the picture.

  **Exposure is boundary, not general.** The prior note left this implicit and the reason line
  still says category:small-maintainer-or-other, which is the wrong axis. Under
  PUBLISHER-TRUST-POLICY.md §4 the test is whether a single malicious release, on its own,
  yields code execution or access to key material. Measured on Cargo.lock, `time` is a direct
  dependency of rcgen, x509-parser, asn1-rs, simple_asn1, yasna, der-parser, oid-registry,
  jsonwebtoken, cookie and cookie_store — the certificate and token validity stack. Date
  arithmetic that is wrong there makes expired certificates and tokens validate, which is a
  trust decision compromised without a second bug. That places it in the policy's
  "cryptography and certificates" family, so **publisher trust alone is not sufficient** and
  the remaining options are an audit or a recorded owner exception.
  For the record, publisher trust would otherwise have looked easy: jhpratt#15682 shipped 86
  of the 90 releases carrying publisher records (95.6%), with github:time-rs/time Trusted
  Publishing on the other 4. But 0.3.51 itself was published by the individual, not the
  signature, and jhpratt is trusted nowhere in this file — so it would also have been a new
  identity decision.

  **The unsafe surface grew 2.5x and it is not a relocation.** Counting `src/**/*.rs` in both
  versions rather than diff `+` lines: 105 -> 259 unsafe lines, 69 -> 145 distinct forms, with
  83 forms that do not appear in 0.3.47 at all and 36 additional occurrences of forms that do.
  The growth is concentrated in a new hand-optimised integer formatting path (src/num_fmt.rs)
  that writes into `MaybeUninit` buffers at computed offsets.

  **That new path was read end to end and is sound.** src/num_fmt.rs is 630 lines and was
  audited in full. Array-indexed lookups stay in bounds (`SINGLE_DIGITS` 10 bytes indexed by
  ru8<0,9>; `ZERO_PADDED_PAIRS`/`SPACE_PADDED_PAIRS` 200 bytes indexed by ru8<0,99>*2 reading
  2). The magic-constant division in `div_100` was checked at its upper bound: with
  SIG = (1<<19)/100+1 = 5243, n = 9999 gives (9999*5243)>>19 = 99, so the claimed
  `high < 100` holds across ru16<0,9_999>. Both `MaybeUninit` writers were traced through
  every caller: `u64_pad_none` (20-byte buffer) and `u128_pad_none` (39-byte buffer, seeded by
  `enc_16lsd::<23>` and `enc_16lsd::<7>`). In each the tail loop consumes exactly four digits
  per four bytes of offset, and the `offset -= 1` step cannot underflow because the only case
  reaching offset 0 is the full-width value, where remain is 0 and value is non-zero so the
  branch is skipped.

  **One defect found, not exploitable.** `write_one_digit` documents its requirement as
  "`buf` must be at least `offset` bytes long"; writing one byte at `offset` needs
  `offset + 1`. The sibling `write_two_digits` states `offset + 2` correctly. It is a private
  `const unsafe fn` with exactly two call sites (num_fmt.rs:478 and :548) and both satisfy the
  correct bound, so nothing in the crate relies on the weaker wording and it is unreachable
  from outside. Worth reporting upstream as a documentation fix.

  **What remains.** Roughly 90 unsafe sites outside num_fmt.rs — timestamp.rs (10 internal
  `__*_unchecked`), formattable.rs, component_provider.rs, date.rs, lexer_ast.rs, strftime.rs,
  plus 6 `transmute` and 10 `unwrap_unchecked`. Nearly all are `deranged` range assertions, and
  `deranged::new_unchecked` calls `core::hint::assert_unchecked`, so an out-of-range value is
  genuine UB rather than a wrong number — each site needs its own in-range proof. Certifying
  safe-to-deploy on a boundary crate requires finishing those; this pass did not, and the
  exemption stays until it does. The revisit date recorded on this entry above is 2026-09-20.
"""

