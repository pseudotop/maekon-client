[[audits.libbz2-rs-sys]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.1.1 -> 0.2.2"
notes = "The new unsafe is a fast-path bit reader in the decompressor, and its guard was checked: `if self.avail_in < 8 { return None; }` sits immediately above `u64::from_be_bytes(unsafe { self.next_in.cast::<[u8; 8]>().read() })`, so the eight bytes read are the eight the caller has declared available. `[u8; 8]` has alignment one, so the cast imposes no alignment requirement beyond validity, and validity follows from the same guard. This matters more than usual because a decompressor processes untrusted input, and the check is a real runtime branch rather than a debug assertion. The remaining additions are a vendored `bzlib.h` so C consumers can link against this Rust reimplementation, and the surrounding shift arithmetic that rounds available bits down to whole bytes. Scope recorded: `avail_in` accurately describing the readable region at `next_in` is the bzip2 stream contract that the caller upholds, in the same way it does for the original C library."

