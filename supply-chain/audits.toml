[[audits.memmap2]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.9.10 -> 0.9.11"
notes = "Security fix, and it matches this repository's own advisory record: deny.toml documents RUSTSEC-2026-0186 as resolved by exactly this 0.9.10 -> 0.9.11 bump. Reading the delta independently agrees. `flush` and `flush_async` gain `if offset > self.len || len > self.len - offset { return Err(InvalidInput) }` before computing a page-aligned pointer and calling msync, and `advise` gains a bounds check before madvise. The crate also adds `#![deny(unsafe_op_in_unsafe_fn)]`, which accounts for most of the diff volume: broad `unsafe { ... }` blocks are split into per-operation blocks with SAFETY comments, and `self.ptr.offset(-(alignment as isize))` becomes `self.ptr.sub(alignment)`, avoiding the isize cast. `MmapInner::advise` becomes an `unsafe fn`, with the safe `Advice` enum and the `UncheckedAdvice` variants separated at the public API. One inconsistency worth recording: the check in `advise` is `offset > self.len || len > self.len`, which is weaker than the `len > self.len - offset` used in flush, so offset+len can still exceed the mapping. That is not unsound here, because the pointer stays within one-past-the-end and an oversized length is rejected by the kernel with ENOMEM rather than causing UB, but the two checks are not equivalent."

