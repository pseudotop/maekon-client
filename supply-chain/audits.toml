[[audits.rubato]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "3.0.0"
notes = """
VD-05.7 full audit — rubato 3.0.0 (15 files, 5,783 lines of runtime .rs).

This repository already audits rubato 5.0.0. 3.0.0 is what the lockfile actually
resolves, and it was exempted rather than audited, so this is a full inspection.
The 5.0.0 reasoning was not copied over: `asynchro_fast.rs` in 3.0.0 does not
import `validate_buffers` at all, so the caller chain had to be re-traced.

No build script. No C, C++, or Objective-C. Powerful imports: zero — filesystem,
network, process, environment, `extern "C"`, `#[link]`, `#[no_mangle]`, libc,
dynamic loading all absent.

Fifty-one unsafe sites in four groups.

1. src/sinc_interpolator/aligned_buf.rs (8 sites) — a hand-rolled 32-byte-aligned
heap buffer, the sharpest thing in the crate.
  - `layout()` uses `checked_mul` for `len * size_of::<T>()` and
    `Layout::from_size_align`, so neither the multiply nor the alignment round-up
    can overflow silently.
  - `zeroed(0)` and `from_slice(&[])` allocate nothing and store
    `NonNull::dangling()`. That is `align_of::<T>()`-aligned and non-null, which
    is what `slice::from_raw_parts(ptr, 0)` requires.
  - `alloc_zeroed` / `alloc` results go through
    `NonNull::new(..).unwrap_or_else(|| handle_alloc_error(layout))`, so a null
    return aborts rather than being dereferenced.
  - `from_slice` copies with `copy_nonoverlapping` into a freshly allocated
    region — no overlap possible — with `count == src.len() ==` the allocated
    length, and `T: Copy` so nothing is dropped twice.
  - `Drop` recomputes the layout as `len * size_of::<T>()` with plain `*`, which
    is safe here because the same product already passed `checked_mul` at
    construction and `len` is never mutated afterwards. It skips `dealloc` when
    `len == 0`, matching the paths that never allocated, and passes the same size
    and alignment the allocation used.
  - `Deref`/`DerefMut` hand out `from_raw_parts(ptr, len)` over memory that is
    always initialized (zeroed or copied) and exclusively owned; `&mut self`
    supplies the exclusivity for the mut version.
  - `unsafe impl<T: Send> Send` / `unsafe impl<T: Sync> Sync` are the standard
    bounds for a uniquely-owning container — the same ones `Vec<T>` carries. The
    raw `NonNull<T>` would otherwise make the type neither.
  - Documented limitation, and it is real: `zeroed` is only valid for types whose
    all-zero bit pattern is a value, which `T: Copy` does not enforce. The type is
    `pub(crate)` and instantiated only with the numeric `Sample` types.

2. src/sinc_interpolator/{sinc_interpolator_avx,_sse,_neon}.rs (~13 each) —
`#[target_feature(enable = ...)]` functions, which are UB to call on a CPU
lacking the feature. Each interpolator's constructor gates on that:
`pub fn new(..) -> Result<Self, MissingCpuFeature>` starts with
`if let Some(feature) = FEATURES.iter().find(|f| !f.is_detected()) { return Err(..) }`
(avx:263, sse:263, neon:266), where `is_detected` is `is_x86_feature_detected!` /
`is_aarch64_feature_detected!` (error.rs:23-42). The `#[target_feature]` functions
are reachable only through methods on a constructed instance, so the runtime check
dominates every call.

3. src/sinc_interpolator/mod.rs (2 sites).
  - :118 `ptr::write_bytes(combined.as_mut_ptr(), 0, combined.len())` — a memset
    over a `&mut [T]`, valid because `T: Sample` is f32/f64 and all-zero bits are
    0.0 for both.
  - :225 the scalar dot product. `wave_cut` is built by *checked* slicing,
    `&wave[index..index + sinc.len()]`, so an out-of-range index panics before
    any unsafe runs. The eight-way unrolled loop runs `wave_cut.len() / 8` times
    with `idx += 8`, so the highest offset touched is `(n/8)*8 - 1 < n`, and
    `sinc.len() == wave_cut.len()` by construction. The remainder below 8 that the
    loop skips is not a silent truncation: all four constructors assert
    `sinc_len % 8 == 0` (mod.rs:280, avx:267, sse:267, neon:270).

4. src/asynchro_fast.rs (5 sites) — `wave_in.get_unchecked(chan).get_unchecked(range)`
feeding `wave_out.write_sample_unchecked(..)`, one per polynomial degree.
`InnerResampler::process` asserts no preconditions of its own, so the bounds come
from its only caller, `Async::process_into_buffer` (asynchro.rs:450). That call
runs `validate_buffers(buffer_in, buffer_out, &channel_mask, nbr_channels,
frames_to_read + input_offset, needed_output_size + output_offset)?` at :470 —
with `?`, so a mismatch returns before :516 dispatches to `process`. The window
arithmetic fits the buffer by construction: the internal buffer is
`calculate_max_input_size(..) + 2 * interpolator_len` per channel (asynchro.rs:214),
and each degree reads `(start_idx + 2 * interpolator_len) .. + nbr_points()`,
consuming exactly that headroom. Degree and window agree —
`Septic → nbr_points() == 8` with a `+ 8` slice and `start_idx = idx_floor - 3`
(points at x = -3..4, as the doc states); `Quintic → 6` with `+ 6`. The
interpolators themselves index with safe `yvals[0..7]`, so a short slice would
panic rather than read out of bounds."""

[[audits.rubato]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "5.0.0"
notes = """
VD-05.7 full audit — rubato 5.0.0 (16 files, 7,838 lines of src).

Audited to unblock dependabot #11345, the last of the five crates that PR needs.
A full inspection rather than a delta: 3.0.0 is exempted in this repository, not
audited, so there was no chain to shorten.

Powerful imports: zero on every axis — filesystem, network, process spawning,
environment access, `extern "C"`, `#[link]`, `#[no_mangle]`, libc, dynamic
loading. No build script. The entire safe-to-deploy question is the unsafe.

Unsafe: 51 sites, and they are one thing — the resampler hot loops pairing
`wave_in.get_unchecked(chan).get_unchecked(range)` with
`wave_out.write_sample_unchecked(chan, frame + output_offset, ..)`. The
`InnerResampler::process` that contains them is `pub(crate)` and asserts no
preconditions, so soundness rests on invariants established by its single caller,
`Async::process_into_buffer` (asynchro.rs:601). Those were traced.

Channel and output-frame bounds are checked per call:
`validate_buffers(buffer_in, buffer_out, nbr_channels, frames_to_read +
input_offset, needed_output_size + output_offset)?` runs before the loop, and the
loop writes `frame + output_offset` for `frame in 0..nbr_frames` with
`nbr_frames <= needed_output_size`. `chan` comes from
`channel_mask.iter().enumerate()` over the same `nbr_channels` the internal
buffer was allocated with.

The input-side index bound is the substantive one, and the author states the
invariant in the code. `calculate_output_size` for `FixedAsync::Input` reads:

    // n * avg_t_ratio + 0.5*(1/r2 - 1/r1) <= space
    let space = chunk_size as f64 - (interpolator_len + 1) as f64 - last_index;

so `needed_output_size` is chosen such that the total index advance stays within
`space`, giving `idx <= chunk_size - L - 1`. The `- (interpolator_len + 1)` term
is exactly the interpolator-window reserve. The buffer is
`calculate_max_input_size(..) + 2 * interpolator_len` (asynchro.rs:231-237), and
`idx` starts at `init_last_index() = -(nbr_points / 2)`.

Checked arithmetically for every degree the crate offers rather than argued in
general terms, since the margin is small:

    degree   L  back  window   idx max      read end   buffer_len   slack
    Cubic    4    1     4      chunk-5      chunk+6    chunk+8        2
    Quintic  6    2     6      chunk-7      chunk+9    chunk+12       3
    Septic   8    3     8      chunk-9      chunk+12   chunk+16       4

and the lower bound, `start_idx + 2L` at the initial index, is 5 / 7 / 9
respectively — never negative despite `start_idx = idx.floor() - back` being
negative on the first frames.

The sizing depends on `max_resample_ratio_relative`, so that parameter has to
hold at runtime, and it does: `set_resample_ratio` and
`set_resample_ratio_relative` both gate on `relative_ratio_in_bounds` and return
`ResampleError::RatioOutOfBounds` otherwise, and `validate_ratios` rejects a
non-positive ratio at construction. `step_index` itself is unguarded float
arithmetic, which is why the bound has to come from the output-size calculation
rather than from a clamp.

Note for future readers: a first pass at this deferred the crate after reading
the hot loop alone and judging the margin unprovable. That was premature — the
reserve is in `calculate_output_size`, one file away, and omitting its
`- (interpolator_len + 1)` term makes the arithmetic look tight when it is not.
"""

