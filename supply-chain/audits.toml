[[audits.hybrid-array]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.4.7 -> 0.4.10"
notes = "Two new unsafe functions, both checked rather than accepted from their comments. `cast_from_core` and `cast_from_core_mut` reinterpret `&[T; N]` and `&mut [T; N]` as `&Array<T, U>`; the type is declared `#[repr(transparent)] pub struct Array<T, U: ArraySize>(pub U::ArrayType<T>)` and the impl block carrying these functions is bounded `U: ArraySize<ArrayType<T> = [T; N]>`, so within it `Self` provably is a transparent newtype over `[T; N]` and the cast is sound — the bound enforces what the SAFETY comment asserts. The equivalent slice-level casts already existed and are only reordered here. One behavioural fix: `self.as_mut().iter_mut()` becomes `self.0.as_mut().iter_mut()`, going through the inner array rather than re-entering the wrapper's own `as_mut`. `ctutils` is added as an optional dependency alongside `subtle` rather than replacing it — both remain in the feature powerset the CI matrix exercises. Remainder is new tests and an `Array<T, U1>::from_ref` helper built on the cast above."

