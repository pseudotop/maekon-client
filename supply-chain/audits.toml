[[audits.uuid]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "1.23.1 -> 1.24.0"
notes = "Net effect on the unsafe surface is favourable and the new blocks were checked. The parser loses one: a `str::from_utf8_unchecked` over the input is replaced by safe indexing and `char_indices` on the original `&str`, which is the attacker-facing path and is now unsafe-free. The formatter is restructured to write into `MaybeUninit` buffers, concentrating its unsafe into three small helpers. `slice_as_uninit_mut` casts `&mut [u8]` to `&mut [MaybeUninit<u8>]`, the safe direction with identical layout. `write_bytes` copies with `copy_nonoverlapping` after `let dst = &mut dst[..src.len()]` — that slicing is checked, so a length mismatch panics rather than overrunning, and the `debug_assert_eq!` above it is a diagnostic rather than the actual guard. `assume_init_ascii_mut` is an `unsafe fn` whose two obligations are documented separately, and its callers reach it only after `write_bytes` has filled the buffer from a fixed-size formatted array of exactly matching length. Worth noting by contrast with compression-core in this same batch: the same class of length invariant is enforced here by checked slicing rather than by a debug-only assertion."

[[audits.uuid]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "1.24.0 -> 1.24.1"
notes = """
Dependabot bump 1.24.0 -> 1.24.1 (#11165). Diff reviewed by unpacking both crates.io
tarballs and comparing trees.

Shipping change is a parser correctness fix, and it closes a real defect:

  src/error.rs — the per-character validation loop used `character as u8` and matched
  the truncated byte against `b'0'..=b'9' | b'a'..=b'f'`. `as u8` truncates, so a
  non-ASCII char whose low byte lands in the hex range was accepted as a hex digit.
  Concretely U+0130 (LATIN CAPITAL LETTER I WITH DOT ABOVE, 0x130) truncates to 0x30
  = '0'. 1.24.1 replaces the cast with `character.is_ascii_hexdigit()`, so the check
  operates on the char, not a truncated byte.

  src/parser.rs — adds the matching regression test asserting that parsing a string
  containing U+0130 yields `ErrorKind::ParseChar` instead of being accepted.

  src/lib.rs — doc-comment version strings only (1.24.0 -> 1.24.1 in examples).

Static signals, both trees:
- Cargo.toml dependency set unchanged; only the crate's own version string differs.
- `unsafe` occurrence count unchanged (25 -> 25); no new unsafe surface.
- No build.rs in either version; no inline asm, no process/network syscalls added.

Upgrading is strictly safer than staying: 1.24.0 can accept input that 1.24.1 rejects.

Scope: delta review of the shipping source change plus capability/static signals
(dependencies, unsafe count, build script). Not a line-by-line audit of the whole crate.
"""

[[audits.uuid]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "1.24.1 -> 1.26.0"
notes = """
#11730 delta audit — uuid 1.24.1 -> 1.26.0. License: Apache-2.0 OR MIT.
Delta read in full: 6 files, +150/-14 (Cargo.toml, Cargo.toml.orig, README, src/lib.rs,
src/external/serde_support.rs, src/timestamp.rs).

Manifest: version bump only, including the matching bump of the wasm32-gated
`uuid-rng-internal-lib` path dependency. No dependency added or removed, no feature added,
no build script (this crate has none).

Two source additions, both opt-in:

1. `src/external/serde_support.rs` adds `pub mod bytes` — a serde helper that writes a
   Uuid through `Serializer::serialize_bytes(u.as_bytes())` and reads it back through
   `deserialize_bytes`, so byte-string-aware formats (CBOR, MessagePack) encode 16 bytes
   instead of a 16-element integer sequence. It is reachable only when a consumer opts in
   with `#[serde(with = "uuid::serde::bytes")]`. `src/lib.rs` re-exports it next to the
   existing `braced/compact/hyphenated/simple/urn` modules. The module ships its own
