It does carry a build script, so that is where the audit actually lands.
build.rs is 61 lines and does exactly one thing: it reads `OUT_DIR`, creates
`$OUT_DIR/webgl_exts.rs`, walks `api_webgl/extensions/` — a directory inside the
crate's own packaged sources, reached via `env::current_dir()` — and for each
subdirectory that is not named `template` and contains an `extension.xml`, writes
one `&*include_bytes!("<absolute path>"),` line into a slice literal.

Checked against the ways a build script goes wrong: it spawns no process, opens
no network connection, reads nothing outside its own package, and writes nothing
outside `OUT_DIR`. The only environment variable it touches is `OUT_DIR`, which
Cargo supplies. The generated line uses `{:?}` on the path, so the value is
emitted as a properly escaped Rust string literal rather than pasted raw — and
the paths come from files Cargo unpacked from the crate itself, not from anything
a caller controls.

