[[audits.quick-xml]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.39.2 -> 0.39.4"
notes = """
VD-05.7 delta audit — quick-xml 0.39.2 -> 0.39.4 (35 insertions / 10 deletions).

Audited to unblock dependabot #11201, which fails `cargo vet` on 0.39.4 and 0.41.0.

A small patch release, and a welcome one. Thirty-three of the changed lines are in
src/parser/dtd.rs and most of them are comments explaining the fix. The fix itself
is a panic: `UndecidedMarkup` carries a 9-byte work buffer sized for the longest
DTD keyword (`!NOTATION`), and when a chunk boundary delivered nine or more bytes
after `<` while `switch()` still returned `None`, the old code staged more bytes
than the buffer could hold, which panicked on the slice copy. The new code
recognises that case as definitively-not-a-keyword and skips to `>` instead.
Reachable from malformed or adversarially chunked XML, so this is a denial-of-
service fix worth taking.

Unsafe: none, and this is a property of the whole crate rather than the delta —
a scan of all 36 files in src/ (35,283 lines) finds zero occurrences. The
consequence matters for reading the above: the bug it fixes was a panic, not
memory corruption, because there is no unsafe code for it to corrupt.

Powerful imports in the delta: none on any axis. Dependency surface unchanged,
measured by parsing both Cargo.toml files. No build script in either version.
"""

