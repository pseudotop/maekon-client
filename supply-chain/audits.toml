[[audits.xkbcommon]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.9.0"
notes = """
Whole crate read; 7523 lines, 93 unsafe sites, 59 percent in the top four shapes and 75 of them in src/xkb/mod.rs.

Method note: unsafe sites were clustered by normalised shape before reading, so a repeated idiom is argued once with its instance count recorded and the sites that do not fit a cluster are read individually. Sites under tests/, benches/ and examples/ were counted separately and are named where the split matters.

The dominant idiom is the fixed C buffer: declare a stack array of known length, take a pointer to its first element, and pass pointer and length together to xkb_keysym_get_name, xkb_keysym_to_utf8 and their relatives, then build a Rust string from however many bytes the library reports. The length always travels with the pointer, and the return count is checked before the buffer is read back. The remaining sites are the ref/unref pairs on xkb_context, xkb_keymap, xkb_state and xkb_compose_table, each matched by a Drop impl so an early return does not leak a reference.

Recorded as a behaviour rather than a soundness issue: names crossing into the C API go through `CString::new(name.as_bytes().to_owned()).unwrap()`, so a name containing an interior NUL panics rather than returning an error. That is a panic, not undefined behaviour, and it rejects the input rather than truncating it -- but a caller passing attacker-influenced keysym names should know it aborts the thread.

Exposure: keyboard handling on Linux."""

