[[audits.audio-core]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.2.1"
notes = """
Whole crate read; 2625 lines, six unsafe items and no capability surface at all.

Four of the six are `unsafe impl Sample for ..` over f32, f64, the integer types and [u8; N]. The trait they implement is declared `pub unsafe trait Sample: Copy` with the obligation written out -- "Implementor must make sure that a bit-pattern of all-zeros is a legal bit-pattern for the implemented type" -- and each impl is preceded by the reasoning for that specific type, f32 and f64 citing to_bits() being zero for zero. Every type the crate implements it for satisfies the condition, and because the trait is unsafe a downstream implementor has to acknowledge the same obligation rather than stumble into it.

The other two are the declaration and one implementation of `unsafe fn set_interleaved_topology(&mut self, channels, frames)`, a trait method whose unsafety is the point: it reshapes a buffer's channel/frame geometry without revalidating it, so the caller carries the obligation that the new topology matches the allocation. Marking the method rather than hiding the reshape behind a safe wrapper is the correct choice.

Exposure: reached through audioadapter and audioadapter-buffers into rubato and this workspace's maekon-audio."""

[[audits.audioadapter]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "3.0.0"
notes = """
Whole crate read; 1808 lines, 35 unsafe sites of which a third are in examples and test assertions.

Method note: this crate's unsafe sites were clustered by normalised shape before reading, so that a repeated idiom is argued once with its instance count recorded rather than restated per line, and the sites that do not fit a cluster are read individually. The counts below come from that pass.

The substance is one pair of trait methods: read_sample_unchecked and write_sample_unchecked, declared unsafe with the bounds obligation on the caller, plus the safe read_sample/write_sample wrappers that perform the channel and frame checks and then delegate. That is the right shape -- the checked path is the default and the unchecked one is opt-in and marked -- and the internal callers that use the unchecked form do so inside loops whose bounds come from the same channels/frames values the buffer was built with.

This crate is the consumer of audioadapter-sample, whose BytesSample trait carries the mem::zeroed gap recorded in that entry. Nothing here widens it: audioadapter does not implement BytesSample for any additional type.

