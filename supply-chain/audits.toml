[[audits.self-replace]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "1.5.0"
notes = """
Whole crate read; 803 lines, three unsafe sites and sixteen capability calls. The capability count is the crate's entire purpose -- replacing the executable of the running process -- so the audit is about whether it does only that, and does it consistently.

The unix path is the conventional one: copy the replacement into a temporary file beside the target so the two share a filesystem, then fs::rename over the original, which is atomic and leaves no window where the path is absent. No unsafe is involved.

All three unsafe sites are Windows, where a running image cannot be overwritten in place. CreateFileW opens a copy of the executable with FILE_FLAG_DELETE_ON_CLOSE and an inheritable SECURITY_ATTRIBUTES, and the result is compared against INVALID_HANDLE_VALUE before use. DuplicateHandle then upgrades the current-process pseudo-handle into a real inheritable one, and on failure the already-open tmp_handle is closed before returning -- the error path cleans up rather than leaking. The temporary copy is then spawned with the handle value and the original path as arguments so it can wait for this process to exit and finish the swap, and both handles are closed afterwards. Every pointer passed to the API refers to a local that outlives the call: the NUL-terminated Vec<u16> built from encode_wide, and the stack SECURITY_ATTRIBUTES.

Two things recorded rather than ruled out. The Windows filename is built with encode_wide().chain(Some(0)) and no interior-NUL check, so a path containing one would be truncated by the API; here the path is a temporary the crate created itself rather than caller input, which is what makes that acceptable and not a general guarantee. And the 100 ms thread::sleep before closing the handles is documented in-source as possibly unnecessary and not clearly load-bearing, which means the handoff's timing rests on an untested assumption rather than on a synchronisation primitive.

Exposure: a direct dependency of this workspace's own maekon-app -- the updater path -- so it is live shipped code."""

