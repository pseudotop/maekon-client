[[audits.x11-dl]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "2.21.0"
notes = """
VD-05.7 full audit — x11-dl 2.21.0 (9,607 lines of runtime .rs, 56-line build.rs).

A grep for `unsafe` returns 117 hits, and that number is misleading in the usual
way for a binding crate: almost all of them are `unsafe extern "C" fn` appearing
in *type* position inside function-pointer declarations (xt.rs and glx.rs alone
account for most), not executable code. Separating declarations from bodies leaves
four things to review.

1. src/internal.rs:12 `pub unsafe fn mem_eq<T: Sized>(a: &T, b: &T) -> bool` —
byte-compares two values. Reading padding or uninitialized bytes would be UB, so
the obligation is on the caller; the `unsafe fn` marker carries it, though there
is no `# Safety` doc. One caller: xlib.rs:2775, `impl PartialEq for ImageFns`.
`ImageFns` (xlib.rs:2744) is a struct whose every field is
`Option<unsafe extern "C" fn(..) -> ..>`. `Option<fn>` uses the null-pointer
niche, so each field is exactly pointer-sized and pointer-aligned and the struct
has no padding; both `Some` and `None` are fully initialized bit patterns. The
bytes read are all initialized. Sound.

2. src/internal.rs:25 `pub unsafe fn transmute_union<I, O>(input: &I) -> O` —
`let mut output: O = zeroed();` then a byte copy of
`min(size_of::<I>(), size_of::<O>())`. `zeroed()` on an arbitrary `O` is UB when
`O` has no valid all-zero representation, so again the caller carries it. One
caller: xlib.rs:2720, `impl From<[$ty; $n]> for ClientMessageData`, converting a
POD integer array into the X11 client-message union. Both sides are integer
arrays, all-zero is a value for both, and the `min` bounds the copy to the smaller
side with any tail left zeroed. Sound.

Recorded, not blocking: both helpers do pointer arithmetic through `usize`
(`(a_addr + i) as *const u8`) instead of `.add(i)`. That is exposed-provenance
style — permitted today, but it would not survive a strict-provenance model. An
upstream cleanup, not a defect here.

3. src/link.rs:26-66 — the `link!` macro. It builds a struct of function pointers
by `mem::transmute`-ing `dlsym` results, which is the standard shape for a
dynamic binding; soundness rests on the declared signatures matching the real X11
ABI, which is the premise of the crate. The handles do not dangle: the
`DynamicLibrary` and the function struct are stored together in a
`once_cell::sync::OnceCell` static (`CACHED`), so the library is never unloaded
while the pointers live. `unsafe impl Send`/`Sync` on the generated struct covers
function pointers plus `*mut T` globals; for the globals this matches X11's own
threading contract (callers are expected to use `XInitThreads`) rather than adding
a new guarantee.

4. src/link.rs:80-135 `DynamicLibrary::open` / `open_multi`. `CString::new(name)`
rejects interior NUL with an error rather than truncating. A null `dlopen` result
is turned into an error, and `dlerror()` is read through `CStr::from_ptr` with
`to_string_lossy`. The names are compile-time literals from the `link!`
invocations plus `libdir` baked in by build.rs; no runtime input reaches the
`dlopen` path. Library resolution still follows the system loader's rules, which
is inherent to dynamic linking.

build.rs (56 lines): calls `pkg_config::get_variable(pcname, "libdir")` for 16 X
libraries, writes the results as string constants into `$OUT_DIR/config.rs`, and
emits `cargo:rustc-link-lib=dl` on Linux (`c` on FreeBSD/DragonFly). It spawns
`pkg-config` — expected for a `-sys`-shaped crate — and writes nothing outside
`OUT_DIR`. No network access. The usual build-environment caveat applies: a
hostile `PKG_CONFIG_PATH` would change the baked libdir, the same exposure every
pkg-config-using crate has.

No C, C++, or Objective-C sources in the package."""

[[audits.x11rb]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.13.2"
notes = """
VD-05.7 full audit — x11rb 0.13.2 (28,324 lines of runtime .rs).

Same crate and same reasoning as the 0.14.0 audit in this file. The equivalence
was measured: `diff -rq` over both `src/` trees reports two differing files, and
neither changes the safety picture — `xcb_ffi/mod.rs` is behind the closed
`allow-unsafe-code` gate, and `rust_connection/stream.rs` differs by 34 lines
where 0.13.2 carries an extra abstract-Unix-socket attempt
(`connect_abstract_unix_stream`, Linux/Android) that 0.14.0 removed. That code is
plain `rustix` calls with no unsafe, which the crate could not contain anyway.

Unsafe: none compiled here, compiler-enforced. lib.rs:147 is

    #![cfg_attr(not(feature = "allow-unsafe-code"), forbid(unsafe_code))]

and `forbid` cannot be lifted by an inner `#[allow]`.

The feature is off, verified against the lockfile rather than the feature list:
`allow-unsafe-code = ["libc", "as-raw-xcb-connection"]` (Cargo.toml:73-76), and
x11rb 0.13.2's Cargo.lock entry lists only `gethostname`, `rustix`, and
`x11rb-protocol`. `dl-libxcb`, which also pulls the feature in, would additionally
need `libloading` and `once_cell` — also absent.

Everything unsafe sits behind that gate: `pub mod xcb_ffi`
(`#[cfg(feature = "allow-unsafe-code")]`, lib.rs:161-162) and `mod unsafe_code` in
utils.rs holding `CSlice`, its `unsafe impl Send`/`Sync`, `libc::free`, and
`from_raw_parts` (utils.rs:13-14). The `#[link(name = "xcb")] extern "C"` block is
inside xcb_ffi and is likewise not compiled.

No build script. No C, C++, or Objective-C sources.

Powerful imports in the compiled surface: the X11 connection itself
(`TcpStream::connect` and the Unix-socket path in rust_connection/stream.rs, with
the address coming from `$DISPLAY`), plus `$XCURSOR_THEME` / `$XCURSOR_SIZE`
lookups (cursor/mod.rs:93,344) and read-only `File::open` on the cursor theme
paths they name (cursor/find_cursor.rs:10,131). No process spawning, no writes to
the filesystem or environment, no libc."""

