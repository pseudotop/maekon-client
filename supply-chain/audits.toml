[[audits.spin]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.9.9"
notes = """
Whole crate read; 4920 lines, 117 unsafe sites over 74 shapes, concentrated in src/rwlock.rs (40), src/once.rs (28) and src/mutex/fair.rs (16).

The dominant shape is the guard constructor: `data: unsafe { &mut *self.data.get() }` and its shared counterpart, forming a reference into the UnsafeCell only inside the branch where the atomic compare-exchange has already succeeded. That is the standard lock pattern and the ordering is what makes it sound -- the exclusive reference is created after, not before, exclusivity is established.

The auto-trait assertions were checked against the claim the source makes about them. src/rwlock.rs carries the comment "Same unsafe impls as std::sync::RwLock" above
    unsafe impl<T: ?Sized + Send, R> Send for RwLock<T, R> {}
    unsafe impl<T: ?Sized + Send + Sync, R> Sync for RwLock<T, R> {}
and those bounds do match the standard library's: Send needs only T: Send because moving the lock moves the value, while Sync needs T: Send + Sync because a shared lock hands out both &T to many threads and &mut T to one. The guard types carry the same pairing.

Scope, stated rather than implied. This entry identifies the crate's central invariant, confirms the unsafe surface is confined to the places that maintain it, and follows the reasoning at each cluster. It does not constitute an independent re-derivation of the algorithm's correctness under all interleavings or operation orders -- that needs either a proof or a Miri run under the crate's own test suite, and no Miri run was performed for this audit."""

