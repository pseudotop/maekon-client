[[trusted.openssl-src]]
criteria = "safe-to-deploy"
user-id = 1 # Alex Crichton (alexcrichton)
start = "2019-02-25"
end = "2027-08-22"
notes = "Publish share: alexcrichton shipped 65 of 89 published versions (73%); sfackler shipped 12 and 12 predate publisher records. Window basis: start is the publisher's first publication, per cargo-vet's default; no earlier owner's releases are covered. Corroboration: isrg, arielos, mozilla and one other trust this publisher, per cargo vet suggest. Those registries publish trust entries without stated reasons (measured 2026-08-22: mozilla 2 of 228, zcash 0 of 206, arielos 0 of 95, isrg 0 of 50), so the citation raises confidence but is not the basis. Release process: trustpub_data is null on every version. Exposure: boundary, and among the most severe — the crate vendors the OpenSSL C sources and compiles them during the build, so a malicious release both runs code at build time and places cryptographic code in the shipped binary. Why an audit was not performed: the payload is roughly a million lines of upstream C that this crate packages rather than authors; auditing it would be auditing OpenSSL, not this wrapper. Approval: this entry lands by pull request under the ONESHIM Contributors identity, which policy section 5 records as the approval mechanism. It does not cite the #3908 owner-approved identity review, because this publisher was not part of it."

