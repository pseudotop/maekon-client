[[audits.rust-embed-impl]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "8.12.0"
notes = """Proc macro, so the criteria ask both about this crate and about the code it emits. `#![forbid(unsafe_code)]` is compiler-enforced here and the generated code embeds file bytes as literals plus a Metadata constructor, so it introduces no unsafe downstream either. Powerful imports are compile-time filesystem access: it resolves the folder given in the `#[folder = "..."]` attribute against `CARGO_MANIFEST_DIR`, canonicalises it, and uses `symlink_metadata` while walking. Reads are therefore anchored to the crate being compiled rather than to an arbitrary path, and the paths come from the developer's own attribute. No process spawning, no network, no build script."""

[[audits.rust-embed-utils]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "8.12.0"
notes = "Whole crate read. `#![forbid(unsafe_code)]` is compiler-enforced, so the unsafe half of the criteria is closed by construction. Powerful imports are filesystem reads, and they are build-time by nature: `get_files` walks a developer-specified folder with walkdir and `read_file_from_fs` reads each file and takes a SHA-256 of the contents. Two things worth recording rather than glossing. `follow_links(true)` means the walk follows symlinks out of the nominated folder, so what gets embedded is whatever those links resolve to; that is the crate's long-standing behaviour and is under the control of whoever owns the source tree, not of remote input. `path_to_str` panics on a path that is not valid UTF-8. Timestamps honour SOURCE_DATE_EPOCH when set, which is what makes embedded output reproducible. No process spawning and no network."

