[[audits.uds_windows]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "1.2.1"
notes = """
Whole crate read; 2031 lines, 56 unsafe sites, all inside src/stdnet/. The crate implements Unix domain sockets on Windows, so the unsafe is Winsock and overlapped I/O rather than parsing.

Method note: this crate's unsafe sites were clustered by normalised shape before reading, so that a repeated idiom is argued once with its instance count recorded rather than restated per line, and the sites that do not fit a cluster are read individually. The counts below come from that pass.

Three groups. The largest is direct Winsock calls -- socket, bind, connect, accept, recv and their overlapped variants -- each passing a SOCKADDR_UN built on the stack together with its length, and each checking the return against SOCKET_ERROR or INVALID_SOCKET before continuing. The second is a set of unsafe trait methods -- read_overlapped, connect_overlapped, result -- whose unsafety is the OVERLAPPED contract: the caller must keep the OVERLAPPED structure and its buffer alive and unmoved until the operation completes, which no signature can express, so marking the methods is the correct choice. The third is from_raw_socket, the standard ownership-transfer constructor that is unsafe in std for the same reason.

The path handling deserves a note because it is the crate's own input surface: a SOCKADDR_UN has a fixed sun_path array, and the crate checks the incoming path length against it and returns an error rather than truncating or overflowing.

Scope: the overlapped-completion protocol is only as sound as its callers honouring the pinning contract, which is why those methods are unsafe; this audit does not verify the callers.

Exposure: Windows only, and absent from the graph on the targets measured here."""

