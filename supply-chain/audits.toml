[[audits.tempfile]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "3.3.0"
notes = """
Whole crate read; 3443 lines, four unsafe sites and 23 capability calls. The capability count is the crate's purpose -- OpenOptions 14 times, env::temp_dir 6, File::create 3 -- so the audit is about whether it does only that.

The unsafe is confined to the platform persist paths. On unix it is one block in persist(): the two paths are converted with the crate's cstr() helper, which builds a CString and therefore rejects any interior NUL rather than truncating, and then rename() or the link()/unlink() pair is called depending on the overwrite flag, with every return passed through cvt_err. On Windows the three blocks are the equivalent MoveFileEx and file-attribute calls. No pointer crosses the boundary without having been built from an owned CString in the same expression.

The security-relevant behaviour of a temp-file crate is not its unsafe but its creation flags, and those are the expected ones: src/file/imp/unix.rs and its windows counterpart both call open_options.create_new(true), which is O_CREAT|O_EXCL semantics through OpenOptions so an attacker cannot win a symlink race by pre-creating the path, and the directory comes from env::temp_dir unless the caller overrides it.

Recorded plainly: 3.3.0 is an old release of this crate. cargo-deny reports no advisory against it, which was checked rather than assumed, but a consumer choosing between versions should know this entry covers the old one."""

[[audits.tesseract-plumbing]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.8.0"
notes = "Whole crate read; the same author and the same wrapper discipline as leptonica-plumbing. `TessBaseApi` owns a `*mut TessBaseAPI` and deletes it in `Drop`; it declares `unsafe impl Send` but deliberately not `Sync`, so the handle may move between threads but cannot be shared concurrently, which matches how the tesseract API is documented. `AllWordConfidences` is the one place a slice is built from a raw pointer, and its length is not assumed: `all_word_confidences` null-checks the returned pointer and then walks it until the `-1` terminator to compute the length before constructing the wrapper, with `Drop` calling `TessDeleteIntArray`. Scope recorded on two points. That length is only correct if tesseract really terminates the array with `-1`, which is its documented contract but not something this audit can verify. And `create()` does not null-check `TessBaseAPICreate()`; tesseract aborts on allocation failure rather than returning null, so this is not reachable in practice, but the check is absent rather than unnecessary."

