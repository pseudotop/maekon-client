[[audits.serde_with]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "3.21.0"
notes = """
VD-05.7 full audit — serde_with 3.21.0 (22,553 lines of runtime .rs).

Supersedes the `no-publisher` exemption: the reason for that exemption was the
absence of a publisher to trust, which a full audit makes moot.

No build script. No C, C++, or Objective-C. `#![no_std]`.

A trap worth recording, because it nearly shortened this audit: lib.rs:20 contains
`forbid(unsafe_code)`, but it sits inside `#![doc(test(attr(...)))]` (lib.rs:1-21),
so it constrains generated doctest binaries only, not the crate. The crate does
contain unsafe. Reading the attribute in context rather than grepping for the
token is what separated the two.

Unsafe: four sites, all in src/utils.rs, and all reachable in this build.

1-3. `array_from_iterator` (utils.rs:154-205) — fixed-size array deserialization,
called from de/impls.rs:424, :991, :1585, :1732. Ungated. This is the array
initialization idiom from the standard library's `MaybeUninit` docs.
  - :179 `MaybeUninit::uninit().assume_init()` producing `[MaybeUninit<T>; N]`.
    Sound: the type claimed initialized is itself `MaybeUninit`, which requires no
    initialization.
  - :168 `ptr::drop_in_place` in `drop_array_elems(num, arr)`, reached on the two
    error arms with `num = idx`. At iteration `idx`, elements `[0, idx)` have been
    assigned and `[idx, N)` have not, so it drops exactly the initialized prefix.
    The moved `arr` is then dropped as `[MaybeUninit<T>; N]`, which is a no-op —
    no double free.
  - :204 `transmute_copy::<_, [T; N]>(&arr)` on the success path only, after every
    element is assigned. `MaybeUninit<T>` shares size and alignment with `T`, so
    the layouts match. The source stays a `MaybeUninit` array and its drop is a
    no-op, so the bitwise copy does not create a double drop.
  - Panic inside the loop leaks the initialized prefix (dropping the
    `MaybeUninit` array does not run `T::drop`). A leak, not unsoundness; the
    in-source comment says the same.
  - Adversarial input was considered, since this is a deserializer: `N` is a const
    generic fixed at compile time and the attacker controls only how many items
    the iterator yields. Fewer than `N` takes the `None` arm and errors after
    dropping the prefix; more than `N` simply stops at `N`. Neither path indexes
    past the array.

4. `ManuallyDrop::take(&mut self.value)` (utils.rs:314) inside
`impl Drop for DropGuard`. Reachable — `DropGuard` is gated on
`schemars_0_8`/`schemars_0_9`/`schemars_1`, and Cargo.lock lists `schemars 0.9.0`
and `schemars 1.2.2` among serde_with's dependencies, so the feature is on. Sound:
`Drop::drop` runs at most once per value and this `take` is the only place the
value is removed, so it cannot be taken twice.

Powerful imports: one hit, lib.rs:359 `include_str!` inside a `#[doc = ...]`
attribute macro. It embeds documentation markdown at compile time and reads
nothing at runtime. No filesystem, process, network, or environment access
anywhere in the crate."""

