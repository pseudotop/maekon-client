[[audits.hermit-abi]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.2.6 -> 0.3.3"
notes = """
Chain step. The tree carries hermit-abi 0.5.2; this is the link cargo-vet was missing on the path to it, so the delta is audited on its own terms rather than as the version we ship.

Six files. The manifest moves the repository from hermitcore/rusty-hermit to hermitcore/hermit-rs and normalises the licence string from MIT/Apache-2.0 to MIT OR Apache-2.0; the README follows. tcplistener.rs and tcpstream.rs change only attributes, swapping #[inline(always)] for #[deprecated(since = "0.3.0")] on the old socket entry points -- seventeen such swaps and no body touched. The substance is lib.rs.

The delta removes unsafe rather than adding it: 42 occurrences of the unsafe keyword go and none arrive. 0.2.6 declared its ABI symbols in a private extern "C" block and wrapped roughly forty of them in hand-written pub unsafe fn shims, each of which did nothing but unsafe { sys_name(..) }. 0.3.3 deletes that layer and exposes the extern "C" declarations directly. Callers still need unsafe to call them, but there is no longer a hand-written translation step in between that could disagree with the declaration it wraps.

That makes signature fidelity the whole remaining question, so it was checked mechanically instead of by eye. Every fn declaration inside every extern "C" block was extracted from both extracted sources, the sys_ prefix normalised away and whitespace collapsed, then compared: 44 declarations in 0.2.6, 63 in 0.3.3, 35 in common, and zero ABI mismatches among the common set. The single difference the comparison flagged is a parameter name, init_queue(ptr: usize) becoming init_queue(id: usize) -- identical type, and parameter names are not part of the C ABI. A mutation-implant control corrupting one return type moved the detector from one flag to two, so the comparison is live rather than vacuously passing.

Nine symbols are dropped (rand, srand, secure_rand32, secure_rand64, the four recmutex_* entries, and yield) and 28 arrive, essentially the POSIX file and socket surface -- accept, bind, connect, socket, send, recv, stat, readdir and so on -- plus read_entropy and yield_now. The dependency on libc 0.2 is dropped entirely and libc::c_int becomes core::ffi::c_int, so the crate loses a dependency and takes the canonical type; the remaining manifest entries are the optional rustc-std-workspace-* shims used only under rustc-dep-of-std.

Scope, stated rather than implied. Those 28 new declarations are hand-written against the HermitCore kernel ABI and were not diffed against the kernel's own headers one by one. A wrong signature there would be unsound and this audit does not rule it out; what it rules out is a silent change to a signature that already existed.

Reachability, recorded as a fact about this tree and not about the crate. hermit-abi enters only through polling, and only under target_os = "hermit": cargo tree -i hermit-abi -e normal --workspace prints nothing to print for the host targets and resolves only with --target all. The client builds for macOS, Windows and Linux, so none of this code compiles here. A downstream importer targeting Hermit should not read that as coverage."""

