Powerful imports: two apparent hits, both benign on inspection. `src/iter.rs:175`
and `:176` match on `read_to_string`, but they are the `io::Read` trait
implementation for the progress-wrapping reader —
`fn read_to_string(&mut self, buf: &mut String) -> io::Result<usize>` delegating
to `self.it.read_to_string(buf)`. That is a method the crate *implements* on data
a caller already owns, not an access the crate initiates. Nothing opens a path.
Network, process spawning, environment access, `extern "C"`, `#[link]`,
`#[no_mangle]`, libc and dynamic loading returned zero hits.

No build script.

Nine declared dependencies, six of them optional (`futures-core`, `rayon`,
`tokio`, `unicode-segmentation`, `unicode-width`, `vt100`). This repository's
Cargo.lock resolves it with `console`, `portable-atomic`, `unicode-width`,
`unit-prefix` and `web-time` — the async and parallel integrations are not
enabled here. Enabling `tokio` or `rayon` later would pull in code this audit did
not cover.

