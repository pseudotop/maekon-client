[[audits.blake2]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.11.0"
notes = """
#11848 exact-version full-source audit for PR #11840. License: MIT OR Apache-2.0;
Rust 2024, MSRV 1.85, and no build script. Reviewed all Rust source files and
all alloc/reset/size_opt/zeroize features. No process, filesystem, network,
shell, FFI, or build-time execution capability was found.
AUDIT SCOPE: full crate version; all targets and features reviewed.

The sole unsafe block converts an immutable reference to a repr(C) vector of
four fully initialized u32/u64 fields into a byte slice of exactly size_of(Self).
Those homogeneous fields introduce no uninitialized padding; the returned slice
cannot outlive or mutate the vector. Compression, parameter sizing, keyed/unkeyed
initialization, reset, and zeroization paths otherwise use safe bounded slices.
Exact all-feature stable tests passed: 4 MAC, 1 BLAKE2b KAT, 3 personalization,
and 2 keyed-API unkeyed-mode tests (10/10, zero failures); Argon2's all-feature
suite additionally exercised BLAKE2b across 40 passing KAT/PHC cases. The
upstream benchmark target alone requires nightly #![feature(test)] and was
therefore excluded from the stable test run. Scope is memory/capability safety
and bundled vectors for this version, not an independent cryptographic proof.
"""

