[[audits.quinn]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.11.9"
notes = """
Whole crate read; 6524 lines and **not one occurrence of the unsafe token** anywhere in src/. For a full QUIC implementation that is worth stating plainly.

The capability picture needed checking rather than assuming, because a transport crate that opens no socket sounds wrong. A capability scan over the package reports 31 hits, and every one of them is in benches/ or examples/ -- UdpSocket::bind in the benchmark harness, process::exit and fs::write in the sample client and server. src/ has none. The crate does not create sockets: Runtime::wrap_udp_socket takes a std::net::UdpSocket the caller already made, and AsyncUdpSocket is a trait the runtime integration implements. Quinn is the protocol state machine plus an async wrapper, and the I/O authority stays with whoever supplies the socket.

Method note shared by this batch: the zero was not taken from one grep. Every line carrying the unsafe token, comments excluded, was listed and read, and the same detector was run against dlopen2 0.8.2 and simdutf8 0.1.5 from the same band as a positive control, where it reports 252 and 145 executable sites. A zero here is a measured zero.

Exposure: present in Cargo.lock as a dependency of reqwest 0.13.4 -- the HTTP/3 path -- and absent from the resolved graph even under --all-features, so it is carried but not built here."""

[[audits.quinn-proto]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.11.15"
notes = """
VD-05.7 full audit — quinn-proto 0.11.15 (24,616 lines of runtime .rs).

No build script. No C, C++, or Objective-C.

Unsafe: five sites, and they are one thing — `VarInt::from_u64_unchecked`
(varint.rs:44) and its four callers. What matters is that the function body is

    pub const unsafe fn from_u64_unchecked(x: u64) -> Self { Self(x) }

There is no unsafe operation inside it. The `unsafe` is a contract marker for a
library invariant (`VarInt < 2^62`), not a memory operation, so violating it can
only be UB if some other code leans on that invariant unsafely.

Nothing does. `grep` for `get_unchecked`, `set_len`, `from_raw`, `assume_init`,
`unreachable_unchecked`, `assert_unchecked`, `transmute`, and
`copy_nonoverlapping` over the entire crate returns zero hits. And the one place
the invariant is consumed, `VarInt::size` (varint.rs:53-66), ends its range ladder
with `panic!("malformed VarInt")` rather than `unreachable_unchecked`. So an
out-of-range `VarInt` yields a panic or a malformed wire encoding — never memory
unsafety — within this crate.

Callers, each checked:
  - connection/mod.rs:3257 — CRYPTO frame offset, bounded by the handshake.
  - connection/send_buffer.rs:99 — retransmit `range.start`, a stream offset.
  - connection/send_buffer.rs:118 — `self.unsent`, a stream offset.
    QUIC caps stream offsets at 2^62-1 because they are varints on the wire; the
    parse direction cannot exceed it.
  - lib.rs:280 — `From<StreamId> for VarInt`, passing `StreamId`'s inner u64.

Recorded finding on that last one, since it is the only caller whose input is not
protocol-bounded: `StreamId::new(initiator, dir, index)` (lib.rs:257) is public
and computes `(index << 2) | ..` without validating `index`. An application
passing `index >= 2^60` produces a `StreamId >= 2^62`, and the `From` impl then
hands that to `from_u64_unchecked`, breaking its documented contract. Given the
absence of unchecked memory operations above, the consequence is a panic in
`VarInt::size` or a malformed frame, not UB, and it requires local misuse of the
API rather than remote input — `From<VarInt> for StreamId` is the direction the
wire takes, and a `VarInt` parsed from the wire is already below 2^62. Not a
blocker for safe-to-deploy; worth an upstream report.

Powerful imports: three hits, all `std::net::{Ipv4Addr, Ipv6Addr}` (coding.rs:3,
token.rs:437, token.rs:465). These are address value types used for encoding and
