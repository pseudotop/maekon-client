[[audits.eventsource-stream]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.2.3"
notes = """
Whole crate read; 8 files, 1022 lines, exactly one unsafe block. That block is String::from_utf8_unchecked in src/utf8_stream.rs and it is sound. It runs only on the Err arm of String::from_utf8, where valid_up_to() gives the index the standard library certified as the end of valid UTF-8; split_off(valid_size) leaves exactly that certified prefix in the vector being converted and moves the remainder into the buffer for the next poll. The bytes handed to from_utf8_unchecked are therefore precisely the ones std just validated.

Recorded because the criteria ask about behaviour an attacker can manipulate, not only about unsafe: the surrounding decoder has no bound on its buffer, and neither does the event parser. Grepping both for max, limit or capacity returns nothing. Two byte sequences from a hostile or broken server stall it. A genuinely invalid byte gives valid_up_to() == 0, so split_off(0) empties the conversion vector, the stream yields Ok("") -- never an error, since the Utf8 error variant is only produced at end of stream -- and the whole input is written back to the buffer; each further chunk appends and fails identically, so the buffer grows without bound while the consumer receives empty strings. A stream that never sends an event boundary stalls the parser the same way, with no Event ever yielded.

This matters here rather than in the abstract. The crate is a direct dependency of this workspace's maekon-network crate, which feeds it reqwest's bytes_stream in a long-lived client process. This audit does not rule the behaviour out; it is a property of the crate as written, and it is reported to the consumer rather than resolved inside a dependency audit."""

