[[audits.mac-notification-sys]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.6.12"
notes = '''
Whole crate read, Objective-C included; six Rust files at 719 lines with five unsafe sites, plus objc/notify.m and objc/notify.h at 274 lines which build.rs compiles with cc and links against AppKit. The native source is deployed code, so it is in scope and was read rather than treated as opaque.

build.rs returns early under DOCS_RS and compiles nothing unless CARGO_CFG_TARGET_OS is macos. It passes -Wno-deprecated-declarations and a -mmacos-version-min derived from MACOSX_DEPLOYMENT_TARGET or an arch default, and panics on an unrecognised arch, which is a build failure rather than a safety question. No network, no command execution beyond the compiler cc drives.

The finding. getBundleIdentifier builds AppleScript by interpolation -- [NSString stringWithFormat:@"get id of application \"%@\"", appName] -- and hands the result to [[NSAppleScript alloc] initWithSource:]. Nothing escapes appName, so a name containing a double quote closes the literal and the remainder is parsed as AppleScript, which is an execution primitive. The Rust side does not escape either: pub fn get_bundle_identifier(app_name: &str) passes the string straight through, and notify-rust re-exports get_bundle_identifier_or_default, so this reaches downstream users as a safe function.

What bounds it, checked rather than assumed. The path this crate walks on its own is not affected: ensure_application_set, the function every notification goes through, calls get_bundle_identifier_or_default("use_default") with a literal. And no caller in this tree passes anything else -- greps across notify-rust 4.12.0, tauri-plugin-notification 2.3.3 and this workspace's own crates find the symbol only in notify-rust's re-export line and its documentation table, never in a call. So the sink is real and reachable through the public API; it is not reached with attacker-influenced input here. A consumer that passes a user-supplied application name should treat this as script injection.

The rest of the Objective-C is manual retain/release rather than ARC. setApplication releases the previous fakeBundleIdentifier, assigns, then retains the new one -- an ordering that would be a use-after-free if the two were the same object, which cannot happen because Rust's set_application wraps the call in a Once and the C comment records the same at-most-once invariant. The remaining Rust unsafe is objc2 message sends into NSUserNotificationCenter with Retained<> return types.

Exposure: notify-rust 4.12.0 into tauri-plugin-notification 2.3.3 into maekon-app. macOS only, and live there.'''

