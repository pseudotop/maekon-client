[[audits.gethostname]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "1.1.0"
notes = "Whole crate read; two unsafe blocks, both Windows-only and both checked. On Unix there is no unsafe at all: the crate defers to `rustix::system::uname().nodename()`. On Windows it calls `GetComputerNameExW` twice through a `windows_link::link!` declaration. The first call passes a null buffer purely to learn the required size and is expected to fail; the code then asserts the returned size is non-zero, allocates `vec![0u16; buffer_size]`, and calls again with a pointer to that buffer and the same size variable. Afterwards it asserts the size the API reports equals `buffer.len() - 1`, which is the documented difference between the two calls, and slices up to the first NUL. The documented race — the machine name changing between the two calls — therefore ends in a panic rather than an out-of-bounds read. `Command::new` appears only inside `#[cfg(test)]`, where the test shells out to `hostname`/`uname` to compare; it is not on any library path."

