notes = "Publish share: BurntSushi shipped 9 of 12 published versions (75%); the remaining 3 predate crates.io publisher records and no other named publisher appears. Window: start is the publisher's first publication. Corroboration: isrg, arielos, mozilla and one other trust this publisher. Those registries publish trust entries without notes (measured 2026-08-22: mozilla 2 of 228, zcash 0 of 206, arielos 0 of 95, isrg 0 of 50), so the citation is corroboration and not the basis; the findings above are. Release process: trustpub_data is null on every version. Exposure: general, with the caveat stated. This is a thin safe wrapper over Windows console and file-handle calls, so it does sit on Windows API surface, but it does not define the FFI signatures itself (windows-sys does, and that crate is deliberately not covered here), does not spawn processes and does not write file contents at attacker-controlled paths."

