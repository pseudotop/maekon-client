[[audits.zeroize]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "1.8.2 -> 1.9.0"
notes = "This release strengthens the guarantee the crate exists to provide, so it was read closely. `atomic_fence()` is replaced by a new `optimization_barrier(val)`. That matters: an atomic fence does not actually stop a compiler from eliminating preceding non-atomic stores, which is precisely the dead-store elimination zeroize is trying to prevent. The new barrier has two implementations. On targets where inline asm is stable (aarch64, arm, arm64ec, loongarch64, riscv32/64, s390x, x86, x86_64) and not under miri, it is an `asm!` block whose template is just a comment, taking the value's pointer as a register input with `options(readonly, preserves_flags, nostack)`. It therefore emits no instruction while forcing the compiler to materialise the pointer and assume the block may read the pointed-to memory, which is what keeps the preceding writes alive; the options are accurate for a block that reads and does not write. Elsewhere it falls back to `core::hint::black_box` plus an `#[inline(never)]` helper doing `read_volatile` on the first byte, guarded by `size_of_val(val) > 0` so a zero-sized value is not read. Scope recorded: that fallback reads one byte of the referenced value, which is fine for the zeroed buffers this is meant for but would be reading uninitialised memory if a caller passed a reference to a value whose first byte is uninitialised."

