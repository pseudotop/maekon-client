criteria = "safe-to-deploy"
delta = "1.9.1 -> 1.8.1"
notes = "A downgrade, so the direction was checked before anything else: does 1.8.1 hold different values, or merely fewer? Merely fewer. In src/lib.rs the `cenum!` blocks lose constants that 1.9.1 added for clang 19 and 20 — `CXCallingConv_PreserveNone`, `CXCursor_PackIndexingExpr`, the `CXCursor_OpenACC*` and `CXCursor_OMP*Directive` family — and `CXCursor_ArraySectionExpr = 147` reverts to its former name `CXCursor_OMPArraySectionExpr` with the same value 147. No constant changes value, so nothing is mis-mapped; the crate simply does not name the newer cursor kinds. The build helpers likewise lose additions rather than gaining anything: the `LIBRARY_PATH` search is absent and the Windows and Cygwin discovery globs are narrower, so 1.8.1 looks in fewer places for libclang, not more. No unsafe anywhere in the delta."

