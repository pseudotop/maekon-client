[[audits.curve25519-dalek]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "4.1.3 -> 5.0.0"
notes = """Major bump on the crate that carries the field and group arithmetic under ed25519-dalek, so the constant-time scalar path was followed specifically. The change that mattered looked at first like a regression: both `Scalar29::sub` and `Scalar52::sub` delete a local `black_box` helper built on `core::ptr::read_volatile`, which existed as an optimisation barrier stopping the compiler from turning the conditional reduction into a branch. It is not a regression — the barrier moves rather than disappears. The hand-rolled `underflow_mask = ((borrow >> 31) ^ 1).wrapping_sub(1)` and its masked add are replaced by `difference.conditional_add_l(Choice::from((borrow >> 31) as u8))`, which selects each limb with `u32::conditional_select(&0, &constants::L[i], condition)` from subtle, the purpose-built constant-time abstraction that carries its own barriers. The semantics were checked to be identical: the old mask was all-ones exactly when the borrow's top bit was set, and the new `Choice` is one under the same condition, so L is added on underflow in both. The source's own TODO asked for exactly this — "find a better home (or abstraction) for this" — and it is now answered. Also added is `shr1_assign`, a carrying right shift over limbs that is plain arithmetic. Scope recorded: the correctness of the curve arithmetic itself is not something a delta review establishes, and the remaining changes across the other files are API and backend reorganisation for the 5.0 release."""

