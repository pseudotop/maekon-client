[[audits.ed25519-dalek]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "2.2.0 -> 3.0.0"
notes = "Major bump on a signature crate, so the verification path was followed specifically. The change there is a multipart refactor rather than a change of algorithm: `RCompute::compute` takes `message: &[&[u8]]` instead of `&[u8]` and feeds the hash with `message.iter().for_each(|slice| c.update(slice))` instead of a single `c.update(message)`. Hashing one slice and hashing a one-element array containing that slice present identical bytes to the digest, and every call site is updated consistently to wrap its argument, so single-part verification is unchanged. `Verifier::verify` now delegates to a new `MultipartVerifier::multipart_verify` with `&[message]`. The apparent unsafe removal is a deleted comment and `#[allow(deprecated)]` around `Scalar::from_bits`, which curve25519-dalek 5.0 no longer deprecates; no unsafe block changes. Remaining edits are the hybrid-array migration in digest paths (`generic_array::typenum` to `array::typenum`) and a `KeySizeUser` impl. Scope recorded: the field and group arithmetic lives in curve25519-dalek 5.0.0, a separate crate with its own audit requirement."

