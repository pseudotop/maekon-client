[[audits.kuchikiki]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.8.8-speedreader"
notes = """
Whole crate read; 2395 lines, six unsafe sites -- five in src/cell_extras.rs and one in src/node_data_ref.rs -- plus a single File::create in the serializer.

cell_extras.rs exists to read through Cell::as_ptr instead of doing the take/set dance that Cell normally forces, and the module states its own soundness argument at the top: Cell<T> is !Sync so no other thread can be in the cell, and for the duration of the raw pointer access the thread runs only code known not to touch the same cell again. That second clause is the load-bearing one and it holds for each method here -- is_none reads a discriminant, upgrade calls Weak::upgrade, and clone_inner clones an Rc or Weak; none of them runs user code that could re-enter the tree.

take_if_unique_strong is the one that could go wrong and visibly does not. Its final arm matches `Some(_)` rather than binding the Rc, with the comment "Not borrowing the Rc<T> here as we would be invalidating that borrow while it is outstanding" -- self.take() would do exactly that. The aliasing hazard is identified and avoided rather than missed.

Context worth linking rather than hiding: this is the crate at the head of the servo_arc chain recorded in this initiative. kuchikiki 0.8.8-speedreader pulls selectors 0.24, which brings servo_arc 0.2.0 with the unmaintained nodrop and phf_codegen 0.8 with rand 0.7.3. That is a dependency-graph question, separate from this crate's own code, and it is tracked as an owner decision elsewhere."""

