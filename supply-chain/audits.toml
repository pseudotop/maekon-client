What `no_std` actually does here (src/lib.rs 124-141):

    #![no_std]
    #[cfg(not(flate2_unstable_nightly_alloc_io))] extern crate std;
    #[cfg(flate2_unstable_nightly_alloc_io)]      use {alloc::io, core::error};
