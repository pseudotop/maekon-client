[[audits.urlencoding]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "2.1.3"
notes = "Whole crate read, and all three unsafe blocks were checked rather than taken on the comments. Each is a `str::from_utf8_unchecked`, and each is sound. In `encode_into`, `ascii_len` is produced by `take_while` over the unreserved set `[0-9A-Za-z-._~]`, so the `safe` slice it splits off is ASCII by construction. The percent-escape triple is built as `[b'%', to_hex_digit(byte >> 4), to_hex_digit(byte & 15)]`; both arguments are at most 15 so `to_hex_digit` returns a digit or `A`-`F`, again ASCII. The third block, in `encode`, converts the whole input, and is only reached when `encode_into` returned true, which happens only on the first iteration when `ascii_len >= data.len()` — that is, when the entire input is in the unreserved set. Note that `to_hex_digit`'s second match arm is written `10..=255` and would overflow for a large argument, but it is a private function and both call sites mask to 4 bits. Decoding is safe code throughout and returns Cow, borrowing when nothing was escaped. No unsafe outside these three, no capabilities, no build script."

