[[audits.notify]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "8.1.0 -> 8.2.0"
notes = """
Delta 8.1.0 -> 8.2.0: three files, 198 insertions and 64 deletions. Only one of them carries code. Cargo.toml and Cargo.toml.orig differ solely in the version line; the dependency tables are byte-identical, so the new tests add nothing to the graph (tempfile 3.10.0 is already a dev-dependency in 8.1.0, checked in both extracted manifests rather than inferred from the diff). No unsafe block, transmute, raw-pointer cast, MaybeUninit or libc:: call is added or removed anywhere in the delta; the whole patch was grepped for each of those and the match set is empty.

The substance is the fix for notify-rs/notify#678. In the inotify event loop the path resolved from self.paths.get(&event.wd) is an Option<PathBuf>, and it is now unwrapped once at the top: None logs at debug level and continues to the next event. That case is a watch descriptor the crate no longer knows about, which happens when unwatch races events the kernel had already buffered. Before this change the loop went on to construct events with add_some_path(path.clone()) where path was None. add_some_path is a no-op on None -- read directly in notify-types 2.1.0 src/event.rs:693, not assumed -- so the event was still delivered to the handler with an empty paths vector. The new regression test asserts precisely that absence ("expected no events without path"). The crate's ambient filesystem authority is unchanged by this; the delta narrows what it emits rather than widening what it can reach.

Everything else in inotify.rs follows mechanically from that hoist. add_watch_by_event and remove_watch_by_event take &PathBuf instead of &Option<PathBuf> and lose their inner if-let; every add_some_path(path.clone()) becomes add_path(path.clone()); the DELETE_SELF arm drops its None branch and its Some branch keeps the same self.watches lookup and the same Folder/File/Other mapping. Each of those was checked against the surrounding context rather than counted.

One further behaviour change, recorded here as the discretion the criteria ask for. In the add_watches loop, self.add_watch(path, true, false).ok() previously discarded every error. It now forwards ErrorKind::MaxFilesWatch to the event handler and breaks out of the loop. Relative to 8.1.0 this does not reduce coverage -- the same watches were failing before, silently -- and it makes an incomplete recursive watch observable to the caller, which is the safer default. The break rests on the upstream assumption that once the inotify watch limit is reached every later call in the same pass returns the same error. If the limit were raised concurrently, paths later in the list would be skipped where 8.1.0 would have retried them. That is a coverage and liveness question rather than a soundness one, and this audit records it rather than ruling it out.

The remainder is test code: the two pre-existing tests move into a #[cfg(test)] mod tests, one added test is #[ignore]d because it requires changing fs.inotify.max_user_watches while it runs, and the other is the #678 regression test described above."""

