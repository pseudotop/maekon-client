[[audits.rcgen]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.14.9 -> 0.14.10"
notes = "AUDIT SCOPE: delta 0.14.9 -> 0.14.10; all targets and features reviewed. #11730 (delta newly surfaced by the regenerated dependabot group #11821). All six changed source files were read; every change moves toward RFC 5280 conformance. (1) Empty CRL distribution point URIs are now rejected on both the certificate and CRL paths, blocking an encoding that violates GeneralNames ::= SEQUENCE SIZE (1..MAX) (new Error::EmptyCrlDistributionPointUris). (2) Missing-extension-block bug fix: should_write_exts omitted key_usages and crl_distribution_points, so a certificate requesting only one of them silently dropped the keyUsage or CRLDistributionPoints extension. (3) RFC 5280 5.3.1: the reasonCode extension is omitted when the reason is Unspecified. (4) RFC 5280 5.3.2: invalidityDate must be GeneralizedTime even in the 1950-2049 UTCTime range, so dt_to_generalized replaces write_dt_utc_or_generalized. (5) The RSA-PSS path was removed; the removed PKCS_RSA_PSS_SHA256 was pub(crate) rather than pub, was already commented out of SignatureAlgorithm::iter(), and its own doc comment recorded that both openssl and webpki reject the certificates it produced -- dead private code, so this is not a semver break in a patch release. (6) ML-DSA moved from the aws_lc_rs_unstable gate to aws_lc_rs (aws-lc-rs 1.18 stabilized PQDSA), with to_pkcs8 -> to_pkcs8v1. Every change ships with a test. Reachability was measured on three axes: maekon depends on rcgen with default features only (crypto, pem, ring) and enables neither aws_lc_rs nor fips, so (6) is not compiled; there are zero call sites setting key_usages and zero CRL uses, so (1)-(4) do not change current output. Since those are absence claims, a positive control was run on the same sweep: rcgen matches 11 files and CertificateParams matches 10. No new unsafe, no build script, no network access."

