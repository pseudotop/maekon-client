[[audits.embed_plist]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "1.2.2"
notes = """
Whole crate read; #![no_std], zero dependencies, two files, 749 lines. Eight occurrences of unsafe, of which several are inside doc comments. The three filesystem hits a capability grep reports are all std::fs::read inside doctest examples, not crate code.

Two real unsafe constructs. The first lives in the exported macro, so it is code this crate generates into the caller and is in scope for that reason. It declares union Transmute { from: *const [u8; LEN], into: &'static [u8; LEN] } and reads the into arm to turn a const raw pointer into a const reference, which is a const-eval workaround for dereferencing a pointer in a const item. The pointer comes from const SLICE: &[u8] = $bytes, and a const item's referent is necessarily 'static and const-evaluable, so the resulting reference is valid for the lifetime it claims and covers exactly LEN bytes. The array is then placed with #[used], #[link_section = "__TEXT,__info_plist,regular,no_dead_strip"] and #[no_mangle], the last of which turns a second use in the same link unit into a duplicate-symbol error rather than two competing sections.

The second is get_info_plist (and its launchd twin), which declares two extern statics -- the _EMBED_INFO_PLIST symbol and the Mach-O section end -- subtracts their addresses and builds a slice with core::slice::from_raw_parts. Using the embedded symbol rather than the section start is deliberate: it forces a link error when the macro was never invoked, so the accessor cannot be reached without the data existing.

Scope, stated rather than implied. That subtraction trusts the linker to place the section end after the symbol; the code performs no ordering or overflow check, and if end preceded start the unsigned subtraction would produce an enormous length. Mach-O section semantics make that so, but this audit does not prove it. Equally, if another crate in the same link unit emitted into __TEXT,__info_plist after this symbol, the returned slice would run past the caller's own plist into the neighbouring bytes -- still mapped memory rather than undefined behaviour, but more than the caller asked for. The #[no_mangle] guard prevents the common in-crate case and not the general one.

Exposure: a direct dependency of the vendored tauri 2.11.2, macOS-only in practice since the link sections are Mach-O."""

