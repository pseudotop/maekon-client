notes = 'This is the GF(2^128) arithmetic underneath GHASH, so the aarch64 path was checked directly. The delta restructures it around a `FieldElement` newtype over `type ByteArray = [u8; 16]`, and the net effect on unsafe is a reduction — scattered raw intrinsics are consolidated into a few typed helpers. Every memory-touching intrinsic was confirmed in bounds: `load_bytes` is `vld1q_u8(bytes.as_ptr())` on a `&[u8; 16]`, reading exactly sixteen bytes from a sixteen-byte array, and `from_uint64x2_t` is `vst1q_u8(out.as_mut_ptr(), ..)` writing sixteen into a `ByteArray`. All of them carry `#[target_feature(enable = "neon", enable = "aes")]` and a `# Safety` line naming the NEON and PMULL requirement, which is the correct shape: the obligation is pushed to callers, who are gated the same way. Scope recorded: the correctness of the carryless multiply and reduction is algorithmic rather than a memory-safety property and was not re-derived here. Related: the ghash rc.6 to 0.6.0 delta audited earlier changed no source at all and deferred to this crate, which is where the arithmetic actually lives.'

