[[audits.ashpd]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.11.1"
notes = """
VD-05.7 full audit — ashpd 0.11.1 (69 files, 15,866 lines of src).

An XDG Desktop Portal client. It reaches this tree only through
rfd -> tauri-plugin-dialog -> maekon-app, and rfd declares it as

    [target.'cfg(any(target_os = "linux", target_os = "freebsd", ...))'.dependencies.ashpd]
    features = ["raw_handle"]
    default-features = false

so it compiles on Linux and the BSDs only, with `raw_handle` plus `wayland`
(pulled in by rfd's own default `wayland` feature) and **without** gtk4.

Unsafe: six shipped blocks, of which **five do not compile here**. Those five are
in `activation_token/gtk4.rs` and `window_identifier/gtk4.rs`, and both modules
sit behind `#[cfg(any(feature = "gtk4_wayland", feature = "gtk4_x11"))]`. The
lockfile confirms it independently of the feature declaration: ashpd resolves
with `enumflags2, futures-channel, futures-util, rand, raw-window-handle, serde,
serde_repr, tokio, url, wayland-backend` and no gtk4 crate.

What does compile is one `unsafe` block plus two marker impls.

`window_identifier/mod.rs:168` calls `unsafe { Self::from_wayland_raw(..) }`.
That callee is correctly declared `pub async unsafe fn` with a stated contract —
"Both surface and display pointers have to be valid. You must ensure the
`display_ptr` lives longer than the returned `WindowIdentifier`."

**Observation worth recording.** The caller, `from_raw_handle`, is a *safe*
`pub async fn`, and it discharges that contract on its caller's behalf without
restating it — its doc comment says only "The constructor returns a valid handle
under both Wayland & X11". `RawWindowHandle::Wayland` is safely constructible in
raw-window-handle 0.6 (`WaylandWindowHandle::new` takes a `NonNull`, and
`NonNull::new` accepts any non-null address), so a caller can build a handle
holding a bogus pointer entirely in safe code and hand it to a safe function that
dereferences it. This is the same shape as the finding this repository raised
against audioadapter-sample 3.0.0: an unsafe obligation resting on a safe API.
Two things bound it in practice — raw-window-handle 0.6 deliberately steers
callers to the lifetime-bound `HasWindowHandle`/`WindowHandle<'_>` types and
treats `RawWindowHandle` as the unchecked layer, and the only path here is rfd
passing a genuine handle obtained from the live toolkit window. Worth reporting
upstream as a missing safety note rather than treated as a live defect.

`unsafe impl Send for WindowIdentifier` and `unsafe impl Sync` (mod.rs:102-103)
are sound *in this configuration* and the qualifier matters. With gtk4 off the
enum carries either `WaylandWindowIdentifier` — whose payload is
`ZxdgExportedV1`/`ZxdgExportedV2`, wayland-client protocol proxies that
wayland-backend already makes thread-safe, plus a plain `WindowIdentifierType` —
or an X11 XID, which is a `c_ulong`. The impls cover the whole enum including the
`Gtk4(Gtk4WindowIdentifier)` variant, and GTK4 objects are not thread-safe, so
enabling `gtk4_wayland` or `gtk4_x11` would make these marker impls need a fresh
look. They do not need one here.

Capability surface: 4 filesystem, 1 process, 1 environment read, **zero network**
— a portal client talks over D-Bus to the local portal service. No `extern "C"`,
no `#[link]`, no `#[no_mangle]`, no dynamic loading. No build script.
"""

