[[audits.matrixmultiply]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.3.10"
notes = """
Whole crate read; 6967 lines, 91 unsafe sites in shipped code plus 13 in tests, and ten arch/asm sites. No capability surface. The dominant shape -- 22 sites -- is `unsafe fn kernel(..)`, the per-architecture GEMM microkernels, each of which writes into a caller-provided output pointer at strides the caller computed.

Method note: for a SIMD crate the soundness question is not the count of unsafe blocks but whether an intrinsic can ever run on a CPU lacking its feature, which is undefined behaviour. That was checked directly rather than assumed: the #[target_feature(enable = ..)] attributes, the runtime detection macros, and the dispatch sites that connect them were each located in the source.

Ten #[target_feature(enable = ..)] attributes cover the fma, avx and neon kernels, and selection goes through the macros in src/x86/macros.rs and src/aarch64/macros.rs which combine `is_x86_feature_detected!` / `std::arch::is_aarch64_feature_detected!` with `cfg!(target_feature = ..)` for the statically-enabled case.

One detail in that macro is worth naming because it looks alarming and is not. The condition reads `compile_env_matches_or_is_empty!("MMTEST_FEATURE", $name) && is_x86_feature_detected!(..)`, so an environment variable participates in kernel selection. It is joined with && to the real detection, which means it can only narrow the set -- it lets a test pin one specific kernel -- and cannot cause a kernel to be chosen on a CPU that lacks its feature.

The kernels themselves take raw pointers plus row and column strides and write a fixed MR x NR tile. Their unsafety is that contract: the caller must supply a destination large enough for the tile at those strides. That obligation lives in gemm.rs, which computes the blocking, and marking the kernels unsafe rather than wrapping them is the right expression of it.

Scope: this audit followed the blocking arithmetic at the call sites rather than proving every tile stays in bounds for all shapes. A dimension-handling error there would be an out-of-bounds write, and this entry does not rule that out."""

