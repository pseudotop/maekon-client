notes = "#11281 VD-05.7 Tier 3-c publisher-trust. Publish share: rtbo shipped 21 of 21 publisher-recorded versions (100%); 17 versions (0.4.0 and earlier, 2016..2019) predate crates.io publisher records, so the corrected denominator is 21. Window basis: start is the publisher's first recorded publication, per cargo-vet's default; the pre-record releases fall outside the window, and repository history attributes them to the same author. Corroboration: no registry in our import set trusts this publisher (cargo vet suggest, 2026-08-27; positive control in the same run: rib for jni-macros). Sole crates.io owner. Repository tie is direct: tag v1.7.0 in rust-x-bindings/rust-xcb points at commit 7b4580fe, rtbo's own release merge (rtbo/release-1.7.0, 2026-01-03), and rtbo is the repository's dominant author with 601 contributions — 18x the second contributor. Release process: trustpub_data is null on all 38 versions (checked 2026-08-27). Exposure: boundary-leaning — the crate carries the FFI declarations for libxcb, where a wrong declaration is memory corruption by itself; this note is therefore also the owner exception policy section 4 requires. Why an audit was not performed: of 43,130 lines, the bulk is machine-generated X11 protocol code (produced by the rust-xcb generator from the XML protocol definitions), which line-by-line reading cannot meaningfully verify — the h2 entry records the same judgment for a framing state machine. What was checked instead: the identity tie above, the 100% corrected publish share, and reachability — xcb enters this tree only through xcap's Linux screen-capture path. Approval: lands by pull request under the ONESHIM Contributors identity (policy section 5); owner approval for this identity recorded in #11281 (2026-08-27 owner decision). Not part of the #3908 identity review."

