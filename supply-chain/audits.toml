[[audits.webkit6]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.6.1"
notes = """
VD-05.7 full audit — webkit6 0.6.1 (82 runtime .rs files, 22,714 lines).

Safe Rust bindings for WebKitGTK 6, reached through tauri / tauri-runtime-wry /
wry, so it compiles on the Linux target this project ships. No build script, no C
sources of its own.

## What the 1,428 unsafe sites actually are

Two layers, and the split matters for what this audit can honestly claim.

The C ABI is **not declared here**. `webkit6-sys` is a separate crate holding the
`extern "C"` function declarations, and it is already audited in this repository
(present in audits.toml, absent from the exemption list). The 29 files in
`webkit6/src/auto/` that contain `extern "C"` declare *Rust* signal and async
trampolines that C calls back into — not C functions.

Everything under `src/auto/` is machine-generated. Each file opens with

    // This file was generated by gir (https://github.com/gtk-rs/gir)
    // from gir-files (https://github.com/gtk-rs/gir-files)
    // from webkit-gir-files
    // DO NOT EDIT

and the unsafe within it is the standard glib-rs shape, counted rather than
assumed: 282 direct `ffi::webkit_*` calls, 308 `self.to_glib_none()` receiver
conversions, ~423 `from_glib*` result conversions split across the ownership
variants (`from_glib`, `from_glib_none`, `from_glib_full`), 202 boxed-closure
setups feeding 199 `connect_raw` signal registrations, and 49 `unsafe impl` /
`unsafe fn from_value` pairs implementing glib's `StaticType`/`FromValue` traits.

That uniformity is the point. Verifying 1,400 generated call sites individually
would not add information — the correctness of the mapping is a property of gir
and the gir XML, not of choices made in this crate. What an audit at this level can
do is confirm the code is generated, confirm the generated shape is the expected
one, and then read whatever deviates from it.

## The hand-written surface

Two files sit outside `auto/`: `lib.rs` and `website_data_manager.rs`, together
holding four `unsafe` blocks and two `unsafe extern "C"` trampolines
(`clear_trampoline`, `remove_trampoline`). Both trampolines follow the gio async
pattern, and the ownership handoff is correct in both directions:

  - Setup boxes the callback (`Box_::new`) and hands ownership to C exactly once
    via `Box_::into_raw(user_data) as *mut _`.
  - The trampoline takes it back exactly once with
    `Box_::from_raw(user_data as *mut _)`, invokes it, and lets the box drop —
    so the allocation is freed once. `P: FnOnce` makes the single invocation a
    type-level fact rather than a convention.
  - The error path uses `from_glib_full(error)` on the `GError` out-parameter,
    which matches gio's transfer-full convention for `*_finish` functions;
    `from_glib_none` there would leak, and not converting would leak the same way.
  - `error` is initialized to `ptr::null_mut()` and tested with `is_null()` before
    conversion, so the success path never converts a null pointer.

The residual is a leak, not unsoundness: if the async operation never completes,
the boxed closure is never reclaimed. That is inherent to the gio callback contract
and is how every gtk-rs binding handles it.

## Powerful imports

`libc` appears as a dependency for C type aliases. No filesystem, process, network,
or environment access originates in this crate — it is a binding layer, and the
capabilities it exposes (a web view, cookie and website-data management) belong to
WebKitGTK, gated by whatever the embedding application does with them.

## Scope statement

Verified: that `src/auto/` is generated and carries the DO-NOT-EDIT marker; that
the generated unsafe is the standard glib-rs pattern, by counting each form rather
than sampling; that the C ABI declarations live in the separately-audited
`webkit6-sys`; and both hand-written trampolines, including the `into_raw`/
`from_raw` pairing and the `from_glib_full` ownership match.

Not verified, and stated plainly: the correspondence between each generated
`ffi::webkit_*` call and the real WebKitGTK C signature. That correspondence is
produced by gir from the gir XML and is the same trust this project already extends
by auditing `webkit6-sys`. A reviewer who wants that link checked independently
should treat this crate as still exempt."""

[[audits.webkit6-sys]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.6.0"
notes = """
Whole crate read; 6820 lines. 104 occurrences of the unsafe token and **no executable unsafe block** -- every one is an `unsafe extern "C" fn(..)` inside a callback type declaration, the signature of a function WebKitGTK may invoke, not code that runs. The file carries the gir header naming gtk-rs/gir and webkit-gir-files and is marked DO NOT EDIT, so these declarations come from GObject introspection data rather than hand-transcription.

Method note shared by this batch: the zero was not taken from one grep. Every line carrying the unsafe token, comments excluded, was listed and read, and the same detector was run against dlopen2 0.8.2 and simdutf8 0.1.5 from the same band as a positive control, where it reports 252 and 145 executable sites. A zero here is a measured zero.

build.rs returns early under DOCS_RS so documentation builds do not link, and otherwise calls system_deps probe, printing a cargo warning and exiting 1 on failure -- no network, no compiler, nothing written outside what system-deps manages. The remaining capability hits are in tests/abi.rs, the generated ABI harness that shells out to pkg-config and a C compiler to compare struct layouts; that is test code and does not ship.

Scope: the declarations were not diffed field by field against the WebKitGTK headers. A wrong signature in the generated bindings would be unsound and this audit does not rule it out; what it establishes is that the crate contains no unsafe code of its own and no build-time capability beyond a pkg-config probe.

Exposure: through webkit6 into the vendored tauri 2.11.2. Linux."""

