[[audits.jsonwebtoken]]
who = "supply-chain-compliance-owner <richard.kim0828@gmail.com>"
criteria = "safe-to-deploy"
version = "10.3.0"
notes = """
JWT encoding/decoding library used as the auth-gate token validation crate
in oneshim (D13-v2c, features = ["aws_lc_rs"]).

Source review scope:
- Algorithm enforcement: jsonwebtoken 10.x requires explicit Algorithm enum
  in DecodingKey/Validation — no algorithm confusion attacks. The `alg`
  field in the header is cross-checked against the Validation struct; passing
  `Algorithm::HS256` as a decoding algorithm when the token uses RS256 will
  result in a rejection, not a bypass. Reviewed src/decoding.rs and
  src/validation.rs. The `aws_lc_rs` feature replaces the `ring` backend with
  aws-lc-rs for the RSA/ECDSA operations — functionally equivalent in terms of
  algorithm correctness.

- Token signing/verification: src/encoding.rs signs via the selected
  Algorithm; src/decoding.rs verifies. Both paths go through the crypto backend
  (aws-lc-rs when the feature is enabled). No custom crypto; delegates entirely
  to the backend for actual cryptographic operations.

- aws_lc_rs feature: pulls in `aws-lc-rs` (audited separately as
  aws-lc-rs:1.16.2 — see burn-rate exemption). The aws-lc-rs crate is the
  AWS-maintained Rust wrapper around the aws-lc C library (fork of BoringSSL).
  Builds reviewed: aws-lc-sys build.rs runs cmake — this is expected behavior
  for C-library wrappers. The cmake build is reproducible.

- Side-channel resistance: jsonwebtoken delegates all constant-time comparison
  to the backend library. The aws-lc-rs backend uses the same constant-time
  primitives as BoringSSL (CRYPTO_memcmp). No timing-observable branches in
  the Rust wrapper code itself.

- No active RustSec advisories for jsonwebtoken 10.3.0 as of 2026-05-23.
  RUSTSEC-2021-0058 (algorithm confusion in jsonwebtoken <8.x) does not apply
  to 10.x which has mandatory explicit algorithm specification.

License: MIT. Commercially usable.
"""

[[audits.jsonwebtoken]]
who = "supply-chain-compliance-owner <richard.kim0828@gmail.com>"
criteria = "safe-to-deploy"
delta = "10.3.0 -> 10.4.0"
notes = """
Cycle 32 dependabot bump 10.3.0 → 10.4.0 (released 2026-05-11 by Keats).
Diff reviewed via `cargo vet diff --mode=local`: 9 files, 64 insertions, 41 deletions.

Delta summary:

1. src/algorithms.rs — `Algorithm::family()` visibility promoted from
   `pub(crate)` to `pub`. No logic change; exposes an existing method.
   `AlgorithmFamily` doc comments for Ec/Ed variants swapped to match
   the enum ordering (cosmetic). No security relevance.

2. src/encoding.rs + src/decoding.rs — `EncodingKey` and `DecodingKey`
   now derive `Zeroize, ZeroizeOnDrop` from the new `zeroize = "1.8.2"`
   direct dependency. This is a positive security change: key material in
   the `content: Vec<u8>` (EncodingKey) and `kind: DecodingKeyKind` fields
   is zeroed on drop, reducing key exposure time in memory. The
   `family: AlgorithmFamily` enum field is correctly tagged
   `#[zeroize(skip)]` — it is a non-secret enum discriminant.
   Zeroize's derive proc-macro does not introduce unsafe code in the
   calling crate. The `ZeroizeOnDrop` implementation calls `zeroize()`
   from the `Drop` impl generated by the proc-macro — standard pattern,
   reviewed correct.

3. src/jwk.rs — Ed25519 JWK thumbprint bug fix: the format string for
   the JSON canonical form was missing quotes around `crv` and `kty`
   field names (`{crv:` → `{"crv":`). This is a correctness fix for
   RFC 7638 thumbprint computation on Ed25519 keys. No security boundary
   change; thumbprint computation is not used in token decode/verify path
   in oneshim's usage (aws_lc_rs feature, HMAC/RS256/ES256 algorithms).

4. src/validation.rs — Two additive changes:
   a. `Validation::new_for_family(AlgorithmFamily)` new constructor that
      accepts all algorithms of a given family. Internally delegates to
      a refactored `new_impl(Vec<Algorithm>)` helper. No change to
      existing `Validation::new(Algorithm)` behavior.
   b. Rust-edition 2024 syntax reformatting of sub/iss/aud validation
      branches (nested `if` → `if let ... && ...` and match guard style).
      Semantics are identical: same conditions, same error returns, same
      branch coverage. Reviewed all three claim validators (sub, iss,
      aud) — no condition removed, no early-return elided.

5. benches/jwt.rs — Import reshuffle (`black_box` moved to `std::hint`).
   Benchmark-only, not shipped in production binary.

6. Cargo.toml — MSRV bumped `1.85.0 → 1.88.0`. CI uses stable toolchain
   (dtolnay/rust-toolchain@stable) which is well beyond 1.88.0 as of
   audit date; no CI impact. Note: workspace Cargo.toml declares
   `rust-version = "1.77.1"` which is now stale relative to this dep's
   MSRV. This is a documentation gap filed for OOS resolution — it does
   not affect the safety assessment of the crate itself.

No unsafe code introduced. No new build scripts. No new ambient
capabilities (no filesystem, network, or process-spawn access added).
No active RustSec advisories for jsonwebtoken 10.4.0 as of 2026-05-26.
License: MIT (unchanged). Commercially usable.
"""

