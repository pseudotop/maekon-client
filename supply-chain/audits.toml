[[audits.tonic]]
who = "supply-chain-compliance-owner <richard.kim0828@gmail.com>"
criteria = "safe-to-deploy"
version = "0.14.6"
notes = """
F-SC-C23-01: Full source audit of tonic 0.14.6 vs 0.12.3 diff.
checksum: ac2a5518c70fa84342385732db33fb3f44bc4cc748936eb5833d2df34d6445ef

gRPC codec (encode/decode): uses bytes::Bytes + prost 0.14.3 for protobuf
serialization. No unsafe blocks in tonic itself. No inline crypto.

Auth interceptor surface: tower middleware pattern (Interceptor trait).
Callers supply credentials via MetadataValue; tonic does not implement
any crypto operations. No changes from 0.12.x in auth interceptor surface.

TLS delegation: 0.14.6 introduces rustls-native-certs as a direct
dependency (previously via tls feature flags). TLS handshake is delegated
entirely to rustls — tonic adds no cryptographic logic.

prost bump: 0.12.x → 0.14.3 (protobuf decode). prost 0.14.3 reviewed
separately; no unsafe code in prost decode path for well-formed messages.
decode_length_delimited uses Buf trait — no raw pointer arithmetic.

hyper/h2 surface: 0.14.6 targets h2 + hyper-util (same pattern as 0.12.x
hyper 1.x integration). No changes in HTTP/2 framing that affect safety
guarantees for oneshim gRPC usage (unary + server-streaming RPCs only).

No active RustSec advisories for tonic 0.14.6 as of 2026-05-24.
License: MIT.
"""

