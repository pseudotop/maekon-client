[[audits.libwebp-sys]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.9.6"
notes = """
Phase 6C codec/OCR/FFI deep audit (OOS sprint #4189).
Upstream: https://github.com/qnighy/libwebp-sys-rs. License: BSD-2-Clause (libwebp vendor: BSD-like).
Raw FFI bindings to libwebp (Google WebP codec). Used by maekon-vision crate via webp 0.3.1.
CVE-CRITICAL investigation — RUSTSEC-2023-0061 / CVE-2023-4863 / CVE-2023-5129:
  Heap buffer overflow in BuildHuffmanTable (OOB write, exploited in the wild Sep 2023).
  Advisory patched = ">= 0.9.3". Current version 0.9.6 >= 0.9.3: PATCHED.
  Source-level verification: huffman_utils.c in 0.9.6 vendor/ uses segmented HuffmanTables
    pool allocation (VP8LBuildHuffmanTable with HuffmanTablesSegment linked list) — this IS
    the 1.3.2-equivalent patch applied to the 0.9.3+ crate releases, despite configure.ac
    still reporting version string "1.3.1" (configure.ac was not bumped; C sources were patched).
  Verified by diffing huffman_utils.c in 0.9.2 (flat allocation) vs 0.9.6 (segmented pool).
RUSTSEC-2024-0443 (webp crate issue): affects webp < 0.3.1, not this crate directly.
Bundled libwebp version: 1.3.1 per configure.ac, but CVE-2023-4863 fix backported to sources.
Versions 0.11.0+ bundle libwebp 1.4.0 (clean version bump); 0.9.x applies targeted patch.
Unsafe usage: FFI boundary only (cc-compiled C library, bindings via bindgen).
Active maintenance: 0.9.6 released 2024-09-02; crate at 0.14.4 (May 2026) — upstream active.
RUSTSEC verification: cargo audit clean at 0.9.6 (RUSTSEC-2023-0061 not triggered — version satisfies >= 0.9.3).
"""

