[[audits.combine]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "4.6.7"
notes = """
VD-05.7 full audit — combine 4.6.7 (16,721 lines of runtime .rs).

No build script. No C, C++, or Objective-C. Powerful imports: zero on every axis —
filesystem, network, process, environment, `extern "C"`, `#[link]`,
`#[no_mangle]`, libc, dynamic loading. The whole safe-to-deploy question is the
unsafe.

Fourteen unsafe sites. Nine are unreachable in this build, five were reviewed.

Not compiled here — src/stream/buf_reader.rs (lines 258, 292, 377, 388, 401, 405,
513, 523, 551). The module is `#[cfg(feature = "std")]` (stream/mod.rs:50-52), but
every unsafe inside it sits in a region gated on `futures-03`, `tokio-02`,
`tokio-03`, or `tokio`. Each site was mapped to its enclosing `cfg` by brace-depth
rather than by picking the nearest preceding attribute, which would have
misattributed sites that follow a closed block. Those features are off: combine's
Cargo.lock entry lists exactly two dependencies, `bytes` and `memchr`, and the
optional futures/tokio/pin-project-lite crates the features require have no
entries. This matters because those nine include the sharpest edges in the crate —
`&mut *(bs as *mut _ as *mut [u8])` casting `[MaybeUninit<u8>]` to initialized
bytes, and `BufMut::advance_mut`. Anyone turning on an async feature must audit
them; this audit does not.

Reviewed:

1-2. src/parser/sequence.rs:42, 236 — `SequenceState::unwrap_value` calls
`core::hint::unreachable_unchecked()` on `None`, so a broken invariant here is
genuine UB, not a wrong value. The invariant holds. In the sequence macro, the
head (:180-194) and each tail parser (:200-231) run the same shape:
`if mode.is_first() || state.$x.value.is_none() { ...parse...; state.$x.value =
Some(temp); }`. Either the branch executes and assigns, or it is skipped precisely
because the value is already `Some`. Every failure path inside the branch is an
early `return` (`PeekErr`, `CommitErr`, or `add_errors!`), so reaching line 236
implies every slot was assigned.

3-4. src/stream/mod.rs:637, 1084 — `slice.get_unchecked(i)` inside an eight-way
unrolled `while len - i >= 8` loop. Within one iteration `i` advances from i₀ to
i₀+7 and the guard gives i₀+7 <= len-1, so each access is in bounds. The
underflow question is the real one: `len - i` is usize subtraction, and the
`debug_assert!(len >= i)` at :632 does nothing in release. It is sound anyway
because `i` comes from the private `enum UnconsStart { Zero = 0, One = 1 }`
(:618-621), so `i` is 0 or 1. `Zero` cannot underflow. `One` can only underflow on
an empty slice, and both `One` call sites guard first: :710 and :1155 each `match
self.first()` and return `PeekErr(Eoi)` on `None`. Worth recording that this
soundness rests on a private enum plus two caller guards rather than on the
assertion, so a future caller passing a computed offset would need a release-mode
check.

5. src/stream/mod.rs:862 — `&mut *(t as *mut S as *mut CompleteStream<S>)`. The
comment claims `repr(transparent)`; verified at :850, directly above
`pub struct CompleteStream<S>(pub S)`. A transparent newtype has the same layout
as its field, so the reference cast is sound."""

[[audits.compact_str]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.7.1 -> 0.9.0"
notes = """
Two minor versions across a rewrite of the representation module: 31 files, 3890 lines, 50 occurrences of unsafe added and 41 removed. repr/nonmax.rs is gone and repr/last_utf8_char.rs and repr/static_str.rs are new. Because the discriminant scheme itself changed, this audit starts from the invariant rather than from the diff hunks.

The scheme. 0.7.1 kept HEAP_MASK = 0b11111110 and LENGTH_MASK = 0b11000000 and recovered an inline length with last_byte.wrapping_sub(LENGTH_MASK).min(MAX_SIZE), using a NonMaxU8 for the niche. 0.9.0 replaces that with LastByte, a #[repr(u8)] enum that enumerates exactly [0, 217]: 0..=127 is an ASCII final byte, 128..=191 a UTF-8 continuation byte, L0..L23 = 192..=215 are inline length markers, Heap = 216 and Static = 217. 218..=255 are deliberately left out so the compiler has a niche, which is what keeps Option<CompactString> the same size as CompactString.

Why the marker range cannot collide with data: a well-formed UTF-8 string never ends in 192..=255. Bytes 192..=244 are leading bytes and must be followed by continuation bytes, and 245..=255 never occur at all. So the final byte of any real string is at most 191, and 192..=215 is free for length markers. The corollary is the crate's central invariant: LastByte is a restricted-range enum, so writing any byte above 217 into that slot is immediate undefined behaviour, and it is UTF-8's own structure rather than a runtime check that prevents it.

The .min(MAX_SIZE) in len() is load-bearing logic and not a clamp papering over corruption. An inline string of exactly MAX_SIZE bytes has no room for a marker, so its final byte is real data in 0..=191; wrapping_sub(192) then wraps to a very large value and .min(MAX_SIZE) resolves it to exactly MAX_SIZE, which is the right answer. The heap and static cases are caught by last_byte >= HEAP_MASK, which covers 216 and 217 together and reads the length out of the second word instead.

That last step depends on a layout coincidence, and the crate pins it at compile time rather than by comment. Repr is #[repr(C)] (*const (), usize, u32, u16, u8, LastByte), so on a 64-bit target the fields sit at 0, 8, 16, 20, 22, 23 for a total of 24. HeapBuffer { ptr, len, cap } and StaticStr { ptr, len, discriminant: [u8; 8] } are both #[repr(C)] with ptr at 0 and len at 8, and each carries static_assertions::assert_eq_size! and assert_eq_align! against Repr. Alongside those: assert_eq_size!([u8; MAX_SIZE], Repr), assert_eq_size!(LastByte, Option<LastByte>, u8) and const_assert!(size_of::<String>() <= 24). Fourteen such assertions across the crate. Every layout assumption this audit relies on is one the build will reject if it stops holding.

The unsafe that actually arrives with the delta:

Clone and clone_from now bitwise-copy with core::ptr::read(self) for the non-heap case, where 0.7.1 copied an inline buffer specifically. That is sound because is_heap_allocated() is exact equality against 216, not a range test, so only inline (at most 215) and static (217) reach the copy. Inline holds its bytes in place and owns nothing; static holds a &'static str, which is Copy. Heap takes the deep-clone branch, so no owning pointer is ever duplicated. In clone_from the *self = .. assignment drops the previous value through Repr's own Drop before moving the copy in.

as_static_str and as_static_variant_mut reinterpret &Repr as &StaticStr and &mut StaticStr. Both check is_static_str() first, both types are #[repr(C)], and their size and alignment are asserted equal, so the cast is guarded by the very discriminant it decodes.

from_static transmutes a StaticStr into a Repr. The byte that lands in the LastByte field is discriminant[7], which StaticStr::new always sets to STATIC_STR_MASK, so the transmuted enum always holds a valid discriminant -- the one thing that would be instant UB here. The other bytes map onto the u32, u16 and u8 fields, where any bit pattern is valid. The doc comment records that Repr used to be a union and was changed to a struct precisely to expose the niche.

char's into_repr calls unreachable_unchecked() for a length outside 1..=4. char::encode_utf8 returns 1 to 4 bytes by the language definition, so the arm is genuinely unreachable and the match is, as its comment says, a hint to the optimiser.

Much of the remaining churn is a no_std migration rather than new logic: std::alloc::realloc becomes alloc::alloc::realloc and similar throughout heap.rs, with the surrounding safety reasoning unchanged. HeapBuffer::set_len narrows from pub unsafe fn to pub(crate) unsafe fn, which shrinks the public unsafe surface. volatile_zero, added for the zeroize integration, is a per-byte ptr::write_volatile loop with its contract written out and attributed to RustCrypto's zeroize.

Scope, stated rather than implied. This is a delta audit: it covers the changed code and the invariant scheme those changes rest on, and it does not re-derive the unsafe that 0.7.1 already carried unchanged, which the existing audit of that version covers. The four new integration modules -- features/sqlx.rs, features/borsh.rs, features/zeroize.rs and features/diesel.rs, 272 added lines between them -- were not read line by line. default is ["std"] and none of those features is enabled anywhere in this tree; cargo tree -e features -i compact_str --target all shows only default reaching the crate, through tokenizers. A consumer that turns them on does not get coverage from this entry. src/tests.rs grows by 473 lines and was read for signal, not certified.

Reachability: compact_str 0.9.0 arrives through tokenizers 0.22.2 and fastembed 5.17.3 into maekon-embedding, so unlike some entries in this file this one is live code on the platforms the client ships."""

[[audits.compression-codecs]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.4.37"
notes = """
Whole crate read; 3737 lines, 29 unsafe sites over 22 shapes, no capability call at all. Every site is one half of the same pattern: hand a codec the uninitialised tail of an output buffer, then tell the buffer how much of it the codec filled.

Method note: the unsafe sites were clustered by normalised shape before reading, so a repeated idiom is argued once with its instance count recorded and the sites that do not fit a cluster are read individually.

Concretely the pairs are `unsafe { output.unwritten_mut() }` followed by `unsafe { output.assume_init_and_advance(n) }`, across the lz4, zstd, bzip2, deflate64 and brotli codecs. Each n comes from the codec's own report of bytes written -- total_out deltas for the flate family, output_size for lz4 -- so soundness reduces to those numbers being truthful.

Cross-reference worth making explicit, because this audit set already touched the other side of it: unwritten_mut and assume_init_and_advance are compression-core's API, and in that crate the bounds on advance and written are enforced by debug_assert! rather than by an unconditional check. In a release build a codec that over-reported would advance the buffer past what was actually initialised, and nothing here would catch it. This crate is where that API is called from, so the two entries should be read together."""

[[audits.compression-core]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.4.31"
notes = "Whole crate read, and one finding is recorded rather than smoothed over. The crate is a `MaybeUninit` write-buffer abstraction; most of its unsafe is sound. `new_initialized` casts `&mut [u8]` to `&mut [MaybeUninit<u8>]`, which is the safe direction, and sets `initialized` to the full length. `initialize_unwritten` zero-fills before casting back. `unwritten_mut` is a `pub unsafe fn` with its obligation documented. The finding is in the pair `advance` and `written`, both safe public functions on a type exported from a `pub mod`. `advance` guards `index + amount <= initialized` with `debug_assert!` only, and `written` casts `&self.buffer[..self.index]` from `[MaybeUninit<u8>]` to `[u8]` behind another `debug_assert!`. In a release build both are compiled out, so entirely safe downstream code can advance past the initialized region and then read uninitialized bytes as `&[u8]`, which is undefined behaviour and could expose adjacent memory. Reaching it requires a caller to pass a wrong amount rather than any untrusted input, and the only consumer here is async-compression driving a codec whose amounts come from its own output length, so it is not reachable in this tree today. Certified with that discretion recorded, per the criteria's allowance; it is an upstream soundness gap worth reporting rather than an exploit path in this dependency graph."

