[[audits.coreaudio-rs]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.14.2"
notes = """
Whole crate read; 4545 lines, 51 unsafe sites over 20 shapes, no capability call outside the CoreAudio API. macOS only. Two findings, both in the same function, and both are the kind that a screen-height read catches.

Method note: the unsafe sites were clustered by normalised shape before reading, so a repeated idiom is argued once with its instance count recorded and the sites that do not fit a cluster are read individually.

First, get_audio_device_ids_for_scope does
    audio_devices.reserve_exact(device_count as usize);
    unsafe { audio_devices.set_len(device_count as usize) };
and only afterwards passes as_mut_ptr() to AudioObjectGetPropertyData to be filled. Vec::set_len requires the elements to already be initialised; here they are not until the next call returns. AudioDeviceID is a u32 with no Drop and no validity invariant beyond being initialised, and on the error path the Vec is dropped without its elements ever being read, which is what keeps this from being observable in practice -- but the contract is violated as written, and the modern form is spare_capacity_mut followed by set_len.

Second, and more clearly wrong, the same call passes `NonNull::from(&data_size)` for ioDataSize. That parameter is in/out -- CoreAudio writes the number of bytes it actually produced -- so C writes through a pointer whose provenance is a **shared** reference, which is undefined behaviour under Rust's aliasing rules. Twelve lines earlier the same function passes `NonNull::from(&mut data_size)` to AudioObjectGetPropertyDataSize for the same kind of out-parameter, so the correct form is present in the same screen. The written value is never read afterwards, which is why nothing has broken, but the write itself is the violation.

Exposure: the macOS audio path."""

