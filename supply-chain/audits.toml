[[audits.javascriptcore6]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.6.0"
notes = '''
Whole crate read; 1565 lines, 111 unsafe sites. The distribution is the finding: **every one of them is in src/auto/**, which carries the gir header naming gtk-rs/gir and webkit-gir-files and marked DO NOT EDIT. The single hand-written file, src/lib.rs, contains no unsafe at all. So none of this crate's unsafe was written by a person; it is emitted from GObject introspection data.

Method note: this crate's unsafe sites were clustered by normalised shape before reading, so that a repeated idiom is argued once with its instance count recorded rather than restated per line, and the sites that do not fit a cluster are read individually. The counts below come from that pass.

The idiom is uniform and was counted: to_glib_none appears 126 times, from_glib_full 38, from_glib 37 and from_glib_none 10. That is the standard glib wrapper shape -- borrow the Rust wrapper as a raw pointer for the duration of the call, then convert the returned pointer back with the transfer mode the C function declares. Correctness therefore reduces to whether each site's transfer mode matches the annotation in the .gir data, which is exactly what gir generates it from.

Four sites do not fit that cluster: GStr::from_utf8_with_nul_unchecked over the JSC_OPTIONS_* constants. Those constants were read in the -sys crate and are plain ASCII byte literals with a trailing NUL and no interior NUL -- for example `pub const JSC_OPTIONS_USE_JIT: &[u8] = b"useJIT\0";` -- so the unchecked conversion holds.

Scope: the transfer annotations were not diffed against the JavaScriptCore headers one by one. A wrong annotation in the .gir data would produce a refcount error here and this audit does not rule it out; what it establishes is that no hand-written unsafe exists and that every site follows the generated idiom.

Exposure: through webkit6 into the vendored tauri 2.11.2. The WebKitGTK path, so Linux.'''

[[audits.javascriptcore6-sys]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.6.0"
notes = """
Whole crate read; three files, 1057 lines. Seventeen occurrences of unsafe and **not one executable unsafe block** -- a grep for `unsafe {` and for `unsafe fn <name>` over src/ returns nothing. Every occurrence is `unsafe extern "C" fn(..)` inside a type alias, that is, the signature of a callback the C library may invoke. Those are declarations, not code that runs.

The bindings are machine-generated and say so: both src/lib.rs and build.rs open with a gir header naming gtk-rs/gir and webkit-gir-files and marked DO NOT EDIT. The signatures therefore come from GObject introspection data rather than from hand-transcription, which is a stronger provenance than the hand-written FFI elsewhere in this file, though it moves the trust to the .gir data rather than removing it.

build.rs is sixteen lines and does exactly two things: return early when DOCS_RS is set so documentation builds do not link, and otherwise call system_deps::Config::new().probe(), printing a cargo warning and exiting 1 on failure. The probe resolves javascriptcoregtk-6.0 >= 2.40.0 through pkg-config per [package.metadata.system-deps]. There is no network access, no file written outside what cc/system-deps manage, and no command executed beyond pkg-config.

Scope: the declarations were not diffed field by field against the JavaScriptCore 6 headers. A wrong signature in generated bindings would be unsound and this audit does not rule that out; what it establishes is that the crate contains no executable unsafe of its own and no build-time capability beyond a pkg-config probe.

