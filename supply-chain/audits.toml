notes = """
Whole crate read; 919 lines in a single src/lib.rs and no occurrence of the unsafe token. A capability scan for process spawning, sockets, filesystem writes and environment access returns nothing: the runtime side is the RustEmbed trait, the EmbeddedFile and Metadata types, and the debug-mode path that reads files from disk through the caller's own folder argument.

