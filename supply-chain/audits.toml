[[audits.libwayshot-xcap]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.3.2"
notes = """
Whole crate read; 2359 lines, five unsafe sites. This is Wayland screen capture, so the unsafe is graphics and shared-memory rather than parsing.

`pub unsafe fn bind_output_frame_to_gl_texture(..)` is public and correctly marked: it hands a captured frame to a caller-supplied GL texture, and the caller must own a current GL context on the calling thread, which no signature can express. The adjacent blocks call into EGL to obtain a display and create an image from the dmabuf the compositor handed back. Each result is matched as an Option and the None arm returns the EGL error rather than proceeding; it is the khronos-egl binding that turns the no-object sentinel into None, so this crate checks that Option rather than comparing raw handles itself.

`MmapMut::map_mut(&mem_file)` maps the shared-memory file the crate itself created and sized for the frame before asking the compositor to fill it. Its unsafety is the standard mmap obligation -- the mapping must not be aliased or truncated underneath -- and the file descriptor never leaves the crate, so no other party can shrink it.

The single capability call is a std::fs::OpenOptions in the dispatch path, used to open that shm file.

Scope: this audit reasons about the Rust side's handling of the handles and the mapping. It does not verify the compositor protocol exchange itself, and a compositor that reported a frame larger than the buffer it accepted would be outside what these checks cover.

Exposure: reached through xcap into this workspace's maekon-vision. Linux only."""

