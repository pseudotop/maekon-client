[[audits.socket-pktinfo]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.4.0"
notes = """
Whole crate read; three files, 586 lines, 27 occurrences of unsafe. This is genuine recvmsg and control-message work, so the reasoning is about the ancillary-data handling rather than about counts.

The control buffer is a Vec<u8> built with with_capacity(CMSG_SPACE(size_of::<in_pktinfo>())) whose pointer and capacity are handed to the kernel as msg_control and msg_controllen. The vector's length stays zero and the kernel-written bytes are only ever read back through the CMSG_* macros on raw pointers, never through the Vec, so no uninitialised memory is exposed to safe code and the writes stay inside the allocation.

The msghdr is built from MaybeUninit::zeroed() with every field then assigned explicitly before assume_init. msghdr is a plain C aggregate for which all-zeros is a valid pattern, so the padding the code does not name is still initialised. The iovec is obtained by casting &mut IoSliceMut, which the standard library documents as ABI-compatible with iovec on Unix.

Two choices in the parsing loop are the right ones and worth naming. The payload is read with ptr::read_unaligned rather than a plain read, which is correct because CMSG_DATA gives no alignment guarantee for the payload type. Iteration advances with libc::CMSG_NXTHDR rather than hand-rolled pointer arithmetic, so the walk is the bounds-aware one the platform defines; the loop terminates because the two matching arms set the result and the default arm advances until CMSG_NXTHDR yields null. win.rs mirrors this through WSARecvMsg, obtaining the extension pointer via WSAIoctl with SIO_GET_EXTENSION_FUNCTION_POINTER and checking the returned byte count before transmuting it to a function pointer, which is the documented Winsock idiom.

Three things this audit does not rule out, recorded as the discretion the criteria allow. The code does not inspect h.cmsg_len before read_unaligned of in_pktinfo or in6_pktinfo, so it trusts the kernel to emit a control message whose payload is at least as large as the struct its level and type advertise; a malformed message from an emulated or hostile kernel interface would read past the payload. CMSG_FIRSTHDR(..).as_ref().unwrap() panics rather than erring if msg_controllen is positive but smaller than a cmsghdr. And bytes_recv <= 0 is treated as an error, so a legitimate zero-length UDP datagram is reported through last_os_error, which is a behavioural wart rather than a safety one.

Exposure measured: reached only through mdns-sd 0.20.2, which this workspace pulls behind maekon-network's optional lan-sync feature. Absent from the 1245-package default graph, present in the 1361-package --all-features graph."""

