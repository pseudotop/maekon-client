[[audits.usearch]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "2.26.0 -> 2.26.1"
notes = """
#11730 delta audit — usearch 2.26.0 -> 2.26.1. License: Apache-2.0.
Delta read in full: 7 files, +49/-13 (Cargo.toml, Cargo.toml.orig, README, build.rs,
include/usearch/index.hpp, include/usearch/index_dense.hpp, rust/lib.rs).

This crate compiles vendored C++ headers into the binary, so the C++ hunks were read as
first-class code, not treated as data. All of them are bounds hardening in the index-file
deserialisation path:

1. index.hpp — version patch macro bump, plus a new guard when loading node levels:
   `if (file.size() < first_offset.value) { reset(); return failed("File is corrupted
   and can't fit the node levels"); }`.

2. index_dense.hpp — three changes:
   a. `try_reserve` is made monotonic: `limits.members` is raised to at least
      `typed_->capacity()` and `vectors_lookup_.size()`, and the old assignment from
      `slot_lookup_.capacity()` is dropped. Reducing thread limits can no longer shrink
      member-addressed storage.
   b. New guard `if (offset > file.size()) return failed("File is corrupted and lacks
      matrix dimensions");`. Upstream's own comment states the motive: `file.size() -
      offset` would otherwise underflow into a huge span. This closes an integer
      underflow that fed an out-of-bounds span.
   c. The vectors span size changes from an unchecked `matrix_rows * matrix_cols` to
      `checked_mul(...)` plus a `file.size() - offset < vectors_bytes.value` bound check.
      This closes an integer overflow that fed an out-of-bounds read.

3. build.rs — one line removed: `.flag_if_supported("/MD")`. MSVC-only C runtime linkage
   flag. No new command, no download, no file write, no new build-time capability.

4. rust/lib.rs — adds one `#[test]`
   (`reserve_uses_requested_member_capacity_and_never_shrinks`) inside `mod tests`.
   Test-only; not part of the library surface.

Direction of change: this delta removes undefined behaviour on malformed index files. It
adds no capability, no dependency, no `unsafe`, and no process/network surface. Nothing in
the delta is reachable as new functionality; the only behavioural difference on
well-formed input is that `try_reserve` no longer shrinks.

Not a re-review of the whole vendored C++ tree; that was covered by the full-crate 2.26.0
audit already recorded in this file (#11509 VD-05.7a)."""

