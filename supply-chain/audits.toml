[[audits.enigo]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.6.1"
notes = """
VD-05.7 full audit — enigo 0.6.1 (17 runtime .rs files, 8,876 lines).

An input-simulation crate: it synthesizes keyboard and mouse events, so its unsafe
is almost entirely OS FFI. No build script, no C/C++/Objective-C sources of its
own.

## Reachability decided most of the scope

A raw count gives 55 unsafe sites. Twenty of those are in Linux backends that this
build does not compile, and the deciding line is a path attribute rather than a
plain `cfg`:

    #[cfg(any(feature = "x11rb", feature = "xdo"))]
    #[cfg_attr(feature = "x11rb", path = "x11rb.rs")]
    #[cfg_attr(not(feature = "x11rb"), path = "xdo.rs")]
    mod x11;

`default = ["x11rb"]`, and x11rb and nom are both present in enigo's Cargo.lock
entry, so `mod x11` resolves to `x11rb.rs` and `xdo.rs` — with its
`#[link(name = "xdo")]` block and sixteen unsafe sites — is never compiled. Feature
state was read off the lockfile rather than the feature list: `wayland` is off
(no wayland-client, wayland-protocols-misc or -wlr), and `libei_tokio`/`libei_smol`
are off (no reis, no ashpd). Note that `xkbcommon` *is* present, but it is an
unconditional `cfg(all(unix, not(target_os = "macos")))` dependency and does not
imply the wayland feature.

Not compiled here: `linux/xdo.rs` (16), `linux/libei.rs` (2),
`linux/keymap2/mod.rs` (1), `linux/wayland.rs`. Compiled: `macos/macos_impl.rs`
(27) and `win/win_impl.rs` (8), plus the pure-Rust `x11rb.rs` and `keymap.rs`.

All four desktop targets are built by CI (x86_64-pc-windows-msvc,
x86_64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-apple-darwin), so unlike a
platform-gated dependency, both the macOS and Windows paths genuinely ship.

## `unsafe impl Send`

Four of them. Each was checked against the three ways such a claim fails —
Clone/Copy defeating unique ownership, a missing or doubled Drop, and a public
field letting a caller extract the handle.

`xdo::Con` (not compiled, but reviewed): holds a raw `Xdo` pointer, has no Clone or
Copy, keeps the field private, and its Drop calls `xdo_free` exactly once. `Sync`
is deliberately not claimed, which is the right distinction for a handle that may
be moved between threads but not used from two at once. Sound.

`Keymap2` and the macOS `Enigo` follow the same shape and are sound.

`libei::Con` is the exception and is recorded rather than cleared: it carries
`#[derive(Clone)]` alongside `unsafe impl Send`. Its fields are Rust types
(`HashMap`s, `ei::Context`, `Connection`, `xkb::Keymap`) rather than raw pointers,
so the `Send` claim exists to cover whatever those wrap — and `xkb::Keymap` wraps a
libxkbcommon handle whose refcounting is not atomic. Clone plus Send on a
non-atomically-refcounted handle is the shape of a data race on the refcount. This
module is **not compiled here**, so it is not a finding against this build, but
anyone enabling `libei_tokio` or `libei_smol` must resolve it first.

## macOS (27 sites) — two findings

The CoreFoundation ownership discipline is correct where it matters. In
`keycode_to_string`, `TISCopy*` results are +1 retained and `TISGetInputSourceProperty`
returns a borrowed reference; the code releases the former and not the latter, and
critically the `CFRelease(current_keyboard)` at :1118 happens *after* the last use
of `keyboard_layout` — the pointer `CFDataGetBytePtr` returns is only valid while
its owner lives, so the ordering is what keeps this from being a use-after-free.

Two gaps, both the same family — an Apple API that can return NULL, used without a
check:

1. `keycode_to_string` (macos_impl.rs:1069) never NULL-checks any of the three
   `TISCopy*` results. `TISCopyCurrentKeyboardInputSource()` can return NULL when
   the process has no current input source. The value then flows into
   `TISGetInputSourceProperty(NULL, ..)` and, at :1089 and :1118, into
   `CFRelease(NULL)` — which Apple documents as undefined ("This value must not be
   NULL"). Separately, the first two fallback levels guard `layout_data` with a
   real `if .is_null()`, but the last one uses only
   `debug_assert!(!layout_data.is_null())`, so a release build proceeds to
   `CFDataGetBytePtr(NULL)`. The asymmetry between the two guards is what makes
   this look like an oversight rather than a decision.

   Reachability: `get_layoutdependent_keycode` loops keycodes 0..128 and calls
   `keycode_to_string` twice per iteration, so a NULL input source would hit the
   path up to 256 times per invocation, and that function runs whenever
   layout-dependent text is typed — the crate's main purpose. The trigger is an
   unusual system state (no current keyboard input source), not attacker-controlled
   input.

2. `ns_event_cg_event` (macos_impl.rs:653) is an `unsafe fn` with no `# Safety`
   doc. It does `msg_send![event, CGEvent]` and feeds the result straight to
   `CGEventRef::from_ptr` without a NULL check. `-[NSEvent CGEvent]` returns NULL
   for events not backed by a CGEvent. The call sites (:604, :635) pass events
   built by `+otherEventWithType:...` with `NSEventType::SystemDefined`, an idiom
   AppKit does synthesize a CGEvent for in practice — but "works in practice" is
   not the same as a checked contract, and the function's signature invites callers
   to pass any `&NSEvent`.

   The returned lifetime is fine: `&NSEvent -> &CGEventRef` ties the borrow to the
   event through elision, so the reference cannot outlive its owner.

Neither finding is reachable through untrusted input, which is why this audit still
certifies safe-to-deploy — but both are genuine UB if the NULL case occurs, and
both deserve an upstream report. A reviewer who reads safe-to-deploy as "no UB
reachable under any system state" should overrule this and keep the exemption.

Upstream status (checked 2026-08-27, enigo-rs/enigo main, #11511): both findings
are already fixed on main by a rewrite that post-dates 0.6.1. Finding 1: the
TISCopy* path is now `layout_from_source`, which None-returns on a NULL input
source, real-checks `layout_data.is_null()` on every level, and only CFReleases
a non-null pointer. Finding 2: `ns_event_cg_event` is now a safe fn returning
`Option<Retained<CGEvent>>` via the objc2 binding's `CGEvent()`. No upstream
report needed; input for the next-version audit — when bumping past 0.6.1,
verify these two shapes landed in the released tarball and drop this paragraph.

## Windows (8 sites)

Thin wrappers over the `windows` crate (0.61.3): `SendInput`, `GetSystemMetrics`,
`GetCursorPos`, `GetWindowThreadProcessId`, `GetKeyboardLayout`, `MapVirtualKeyExW`,
`SetProcessDpiAwareness`. No raw buffers and no pointer arithmetic — `SendInput`
takes a slice, so a length/pointer mismatch is not expressible at the call site, and
the wrapper additionally returns early on an empty input, converts both
`size_of::<INPUT>()` and `input.len()` through `try_into()` with an error on
overflow, and compares the return value against the expected count.
`GetCursorPos(&raw mut point)` passes a pointer to a stack local. Nothing here
needs a range or lifetime proof.

## Powerful imports

Seven, all in the FFI declarations: `libc::useconds_t` and `#[link(name = "xdo")]`
in the uncompiled `xdo.rs`, and `#[link(name = "Carbon", kind = "framework")]` plus
`#[link(name = "ApplicationServices", kind = "framework")]` on macOS. No filesystem,
process, network, or environment access anywhere in the crate. The privilege this
crate carries is the input simulation itself, which is its stated purpose and is
gated by the OS — on macOS it needs Accessibility permission, and the crate exposes
`has_permission()` to check it."""

[[audits.enumflags2]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.7.12"
notes = """
Whole crate read; 1579 lines, twelve unsafe items, no capability surface. Almost all of them are the from_bits_unchecked family and the bitwise operators that call it, which reconstruct a BitFlags<T> from a numeric value without revalidating.

The obligation is placed where it belongs. `pub unsafe trait RawBitFlags` carries the contract in its safety section -- bits() must return the same value as transmute_copy, and every value of T must have exactly one bit set -- and the public `BitFlag` trait requires it, so a BitFlags<T> cannot exist unless someone discharged that obligation, normally the #[bitflags] procmacro. The internal callers all mask with T::ALL_BITS before reconstructing, so they only pass bits the contract already covers.

The one call that is not a from_bits_unchecked is exactly_one, which does core::mem::transmute_copy(&self.val) after checking is_power_of_two(). transmute_copy differs from transmute in that it does not check sizes, so it would read out of bounds if T were larger than its Numeric; that is precisely what the RawBitFlags contract about bits() and transmute_copy agreeing rules out, and the procmacro enforces it by requiring a #[repr(uN)] enum. The single-bit check supplies the other half, since the invariant only guarantees validity for values with one bit set.

Exposure: reached through ashpd and rfd into tauri-plugin-dialog."""

[[audits.enumflags2_derive]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.7.12"
notes = 'Proc macro, so the criteria ask about the code it emits as well as the crate itself. The crate body contains no unsafe; the only unsafe is in the expansion, `unsafe impl RawBitFlags for #ident`, whose contract is that each variant occupies exactly one bit. The derive enforces that rather than assuming it. For a literal discriminant it checks `n.is_power_of_two()` at expansion time and rejects with "Flags must have exactly one set bit", plus a range check that the value fits the chosen repr. For a discriminant that is a const expression it cannot fold, it emits a const assertion through `AssertionHelper`/`ExactlyOneBitSet` so the same property is checked at compile time in the generated code. `ALL_BITS` is the OR of every variant and `bits(self)` is `self as #repr`, both consistent with that contract. Non-unit variants are rejected outright.'

