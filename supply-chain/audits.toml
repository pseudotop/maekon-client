[[audits.libloading]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.9.0 -> 0.8.9"
notes = """
Downgrade delta: the tree needs 0.8.9 and the audited version is 0.9.0, so this reviews what 0.8.9 has that 0.9.0 does not. Sixteen files. tests/functions.rs loses 149 lines and the CI workflow and manifests move a little; the substance is in src/os/unix/mod.rs, src/os/windows/mod.rs, src/error.rs, src/util.rs and src/lib.rs.

Most of the churn is an API shape, not a safety change. 0.9.0 introduced the sealed AsFilename and AsSymbolName traits; 0.8.9 takes P: AsRef<OsStr> and &[u8] directly. Every function that is unsafe in one version is unsafe in the other -- the diff moves generic parameters, it does not relax a single marker. core::ffi::c_void becomes raw::c_void, which is the same type by a pre-core::ffi path, and the private open_char_ptr helper folds back into open.

One unsafe block genuinely arrives. In util.rs, cstr_cow_from_bytes handles the empty-slice case with unsafe { Cow::Borrowed(CStr::from_ptr(&ZERO)) } over a static ZERO: raw::c_char = 0. That is a 'static, NUL-terminated empty string, so from_ptr's requirements hold and the borrow outlives any lifetime the signature can hand back.

The Windows buffer lifetime is maintained differently but correctly. 0.8.9 collects the UTF-16 filename into a Vec, passes as_ptr() into GetModuleHandleExW, and then calls drop(wide_filename) explicitly after the unsafe block, with a comment explaining that a drop inside the closure would clobber GetLastError before with_get_last_error reads it. 0.9.0 gets the same guarantee from the closure's own scope. Both keep the buffer alive across the call; 0.8.9's version is more fragile to a future edit but is correct as written.

The finding. 0.9.0 added util::check_null_bytes and calls it from windows_filename, rejecting a filename with an interior NUL as Error::InteriorZeroElements. 0.8.9 has no such check on the Windows path: it does encode_wide().chain(Some(0)).collect() and hands the pointer to Windows, which stops at the first NUL. A caller that validates the path string before passing it -- checking an extension or a directory prefix -- can therefore be bypassed, because the validator sees the whole string and Windows sees a truncated one. This audit does not rule that out; the check is genuinely absent in 0.8.9.

Two things bound it, and both were checked rather than assumed. First, the unix path is not affected: 0.8.9's open routes the filename through cstr_cow_from_bytes, whose CStr::from_bytes_with_nul and CString::new arms each reject interior NULs. The error variants differ from 0.9.0's but the rejection is there. Second, the entry points that load are unsafe fn, and their existing contract already requires the caller to vouch for the library being loaded, so a caller passing an attacker-influenced path to Library::new has a problem that predates this delta. open_already_loaded is safe, but it calls GetModuleHandleExW, which resolves an already-loaded module rather than loading one. That is why this is recorded as a missing defence-in-depth check rather than as a vulnerability, and the reasoning is written out here so a reader can disagree with it.

Reachability in this tree, measured rather than asserted. libloading enters through dlib and wayland-sys into the wayland stack under tauri-plugin-dialog and screen capture. cargo tree -i libloading -e normal --workspace --target x86_64-pc-windows-msvc prints nothing to print, so the Windows module -- the one carrying the gap -- is not in the graph for that target at all, while the same command against x86_64-unknown-linux-gnu does print the tree. That positive control makes the Windows absence a measured absence and not a failed lookup. The platform that is reachable here is the one that kept the guard. A downstream importer targeting Windows should read the finding above and not this paragraph."""

