[[audits.minimal-lexical]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.2.1"
notes = """
VD-05.7 full audit — minimal-lexical 0.2.1 (19 files, 5,412 lines of src).

Reaches this tree through `nom`. Capability surface is **zero** on every axis —
no filesystem, network, process, environment, `extern "C"`, `#[link]`,
`#[no_mangle]` or dynamic loading — and there is no build script, so the whole
safe-to-deploy question is the unsafe.

A raw count says 42 unsafe lines. **Twenty compile here**, and the difference is
module-level `cfg`, not judgement:

    stackvec.rs  17  #![cfg(not(feature = "alloc"))]                  — alloc is on
    libm.rs       3  #![cfg(all(not(feature = "std"), feature = "compact"))]
    fpu.rs        2  #![cfg(feature = "nightly")]

`default = ["std"]` and `compact`/`nightly` are opt-in, so the no-alloc vector,
the musl libm port and the x87 control-word code are all out. What remains is
bigint.rs 3, heapvec.rs 2, num.rs 9, number.rs 4, slow.rs 2.

**Length changes — three call sites, all discharged.**
  - bigint.rs:164 `normalize` shrinks inside `while let Some(_) = x.get(x.len().wrapping_sub(1))`.
    The access is bounds-checked, so an empty vector exits the loop rather than
    wrapping into it, and `x.len() >= 1` holds wherever `set_len(x.len() - 1)` runs.
  - bigint.rs:663 `shl_limbs` grows, and the guard is a real runtime check, not a
    debug assert: `if n + x.len() > x.capacity() { None } else if !x.is_empty() {
    .. set_len(n + x.len()) }`.
  - stackvec.rs:139 is inside `extend_unchecked`, itself a `pub unsafe fn` stating
    "Safe if `self.len() + slc.len() <= self.capacity()`" — and it does not compile
    here anyway.
  `HeapVec::set_len` is correctly a `pub unsafe fn` with the capacity contract
  documented; its `debug_assert!` is a development aid rather than the guard, which
  is the right shape for an explicitly-unsafe API.

**Everything else is one concept: bounded lookups into const power tables**,
reached through two `unsafe fn` whose contracts say the exponent must be smaller
than the table. The gate is `Number::is_fast_path::<F>()`, which requires
`MIN_EXPONENT_FAST_PATH <= exponent <= MAX_EXPONENT_DISGUISED_FAST_PATH`, bounding
both ends before any lookup. Checked against the actual table lengths for both
float types rather than argued in general:

    type  path                          max index   table              len
    f32   normal pow_fast_path                 10   SMALL_F32_POW10     16
    f32   disguised int_pow_fast_path           7   SMALL_INT_POW10     20
    f32   disguised tail pow_fast              10   SMALL_F32_POW10     16
    f64   normal pow_fast_path                 22   SMALL_F64_POW10     32
    f64   disguised int_pow_fast_path          15   SMALL_INT_POW10     20
    f64   disguised tail pow_fast              22   SMALL_F64_POW10     32

The disguised bound follows from `MAX_EXPONENT_DISGUISED_FAST_PATH =
MAX_EXPONENT_FAST_PATH + ⌊(MANTISSA_SIZE+1)/log2(10)⌋`, giving shift ≤ 15 for f64
and ≤ 7 for f32. bigint.rs:398 reaches `int_pow_fast_path(exp, 5)` only after
`while exp >= small_step { .. }` has driven `exp < small_step`, and
`SMALL_INT_POW5` has 28 entries. The `_ => hint::unreachable_unchecked()` arm in
`int_pow_fast_path` is reachable only with a radix other than 5 or 10, and both
call sites pass a literal.

safe-to-deploy is met.
"""

