notes = """
VD-05.7 delta audit — tinyvec 1.9.0 -> 1.11.0 (228 insertions / 9,754 deletions).

The size of this delta is almost entirely a deletion. src/array/generated_impl.rs
(9,616 lines) is removed outright: the hand-generated `Array` impls for fixed
array lengths (0..=32 plus powers of two up to 4096) are replaced by
unconditional const generics. The `rustc_1_55` and `rustc_1_57` features become
no-ops (`= []`) and the `#[cfg(not(feature = "rustc_1_55"))] mod generated_impl`
arm is gone, so const_generic_impl is now the only path. Coverage widens from
selected lengths to all lengths; nothing narrows.

Unsafe: none, and this is compiler-enforced rather than inspected — both 1.9.0
and 1.11.0 carry `#![forbid(unsafe_code)]` at src/lib.rs:2. The scan of added
lines found no raw pointers, transmute, set_len, MaybeUninit, asm, no_mangle,
filesystem, network, process spawning, or environment access, consistent with
that attribute.

The 228 added lines are: `is_full()` (a length-vs-capacity comparison, the only
unconditional addition); `as_mut_inner()` behind the `latest_stable_rust`
feature; `defmt::Format` impls behind the `defmt` feature; and an import swap
from `serde` to `serde_core` behind the `serde` feature. All safe Rust.

Dependency surface does change, unlike a typical patch bump: `defmt` (optional)
and `serde_core` (optional) are added and `serde` is dropped. Measured against
this repository's Cargo.lock rather than assumed: tinyvec 1.11.0 resolves with
`tinyvec_macros` as its only dependency, `defmt` does not appear anywhere in the
lockfile, and `serde_core` is present but pulled in by other crates, not by
tinyvec. The new optional dependencies are therefore inert in this build. If a
future change enables tinyvec's `defmt` or `serde` features, that pulls in code
this audit did not cover and should be re-examined.

Neither version has a build script.
