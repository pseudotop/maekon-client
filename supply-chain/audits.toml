[[audits.arc-swap]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "1.9.2"
notes = """
Whole crate read; 6015 lines, 63 unsafe sites over 50 shapes, none in tests. The distribution matters: 30 sites are in src/ref_cnt.rs and 12 in src/strategy/hybrid.rs, so the surface is the reference-counting abstraction plus the hazard-pointer strategy rather than being spread through the API.

The central abstraction is the RefCnt trait, and its contract is written out rather than assumed. from_ptr is declared unsafe with the plain statement "This must not be called by code outside of this crate", and the doc above it records the non-obvious part of the protocol -- that from_ptr may be called more times than into_ptr while the strategy temporarily owes a reference, provided the count never drops below one, and that the extra pointers are later either converted back or forgotten. That is exactly the invariant a reader needs and it is not left implicit.

The recurring implementation shape is refcount-neutral pointer extraction:
    let ptr = Arc::into_raw(unsafe { ptr::read(me) });
    mem::forget(unsafe { Arc::from_raw(ptr) });
The bitwise read plus into_raw yields the address without touching the count, and the from_raw/forget pair immediately rebalances what into_raw consumed, so the count is the same before and after. Each site carries a SAFETY comment naming where the pointer came from.

Scope, stated rather than implied. This entry identifies the crate's central invariant, confirms the unsafe surface is confined to the places that maintain it, and follows the reasoning at each cluster. It does not constitute an independent re-derivation of the algorithm's correctness under all interleavings or operation orders -- that needs either a proof or a Miri run under the crate's own test suite, and no Miri run was performed for this audit."""

