[[audits.tauri-plugin-wdio]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "1.3.0"
notes = """
Whole crate read; 714 lines, eight dependencies (log, serde, serde_json, tauri, tauri-plugin, thiserror, tokio, uuid), and a capability scan for process spawning, sockets, filesystem writes and environment access that returns nothing.

Two unsafe items, both in src/desktop.rs and both the same assertion:
    pub struct Wdio<R: Runtime> { _phantom: PhantomData<R> }
    unsafe impl<R: Runtime> Send for Wdio<R> {}
    unsafe impl<R: Runtime> Sync for Wdio<R> {}
The auto-trait rules would make Wdio<R> Send and Sync only when R is, because PhantomData<R> conventionally marks ownership of an R. Here there is no R value: the struct is zero-sized and carries nothing, so moving one between threads moves no bytes and hands the receiver no access to anything. The impls are therefore sound and the source comment states that reasoning.

Recorded as a maintenance hazard rather than a current defect: because the impls are unconditional, adding a real field to Wdio<R> later would keep asserting Send and Sync for it without any compiler complaint.

Exposure: a direct optional dependency of this workspace's own maekon-app behind the webdriver feature, alongside tauri-plugin-wdio-webdriver. Not in the default graph."""

