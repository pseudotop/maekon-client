[[audits.gl_generator]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.14.0"
notes = """
Whole crate read; 3374 lines. Four unsafe items and **none of them execute in this crate** -- they are inside the string templates the generator emits: `unsafe impl __gl_imports::Send for {api} {{}}` in the struct and debug-struct generators, and `unsafe {{ storage::{fnname}.is_loaded }}` in the global generator. So this is the generates-deployed-code case the criteria call out, and the generated code is what has to be reasoned about.

The emitted Send impl is for the API struct that holds loaded GL function pointers. Asserting Send for it is the long-standing gl-rs position: the struct is a bag of extern fn pointers with no interior mutability, and moving it between threads is sound even though calling into GL from the wrong thread is not -- that obligation belongs to the GL context, not to the pointer table. Notably no Sync impl is emitted, which is the correct asymmetry.

The emitted `is_loaded` read is a plain field read on a static the generator also emits, unsafe only because it touches a mutable static.

This crate is a build dependency: it runs at build time to produce bindings, and its own execution does no I/O beyond writing the generated source to the writer the caller supplies."""

