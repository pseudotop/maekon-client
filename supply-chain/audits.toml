notes = "Whole crate read; this is the safe wrapper over `vswhom-sys`, and it is Windows-only in effect — `search()` returns None unconditionally on other targets. Three unsafe blocks. `search` calls the FFI, parses the result, and calls `vswhom_free_resources` on it before returning, so the C++ allocation is released on both the Some and None paths. `osfpo` builds an `OsString` from `slice::from_raw_parts(s, wcslen(s))` after a null check, which is the correct pattern for a NUL-terminated wide string. One soundness gap is worth recording rather than passing over: `from_raw_result` guards on `res.windows_sdk_version != 0`, where that field is a `c_int`, and then calls `NonZeroU8::new_unchecked(res.windows_sdk_version as u8)`. A value that is non-zero but a multiple of 256 would truncate to zero and make the `new_unchecked` unsound. The bundled C++ only ever writes 0, 8 or 10, so it is not reachable today, but the check is not performed on the value that is actually passed. Note also that this audit covers the Rust crate; `vswhom-sys` compiles 549 lines of vendored C++ on Windows and is a separate crate with its own audit requirement."

[[audits.vswhom-sys]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.1.3"
notes = """
Whole crate read, C++ included; the Rust side is 104 lines across two files with no unsafe block of its own, and the substance is ext/vswhom.cpp at 549 lines, which locates a Visual Studio and Windows SDK installation through the registry and the COM setup-configuration interfaces.

build.rs gates everything: on any host that is not Windows it is literally fn main() {}, so the C++ is never compiled. On Windows it drives cc in C++ mode over the single source file, adds /Zm2000 under MSVC, and links OleAut32 and Ole32. There is no network access and no command run beyond the compiler.

The memory surface is small enough to enumerate: five malloc, eighteen free, four memcpy and two alloca. All four memcpy calls are inside one helper, concat, which joins up to four wide strings, and that is where a length error would become a heap overflow. It does not have one. The allocation is (len_a + len_b + len_c + len_d + 1) * 2 bytes, the copies write exactly len_a + len_b + len_c + len_d wide characters at cumulative offsets, and the terminator is stored at that same index, so the buffer is filled exactly with no off-by-one in either direction.

Two real defects in that helper, recorded because they are defects even though neither corrupts silently. malloc's result is never checked, so an allocation failure turns the first memcpy into a write through a null pointer -- undefined behaviour that in practice faults immediately. And `auto len_c = 0` gives an int rather than a size_t, so the subsequent assignment from wcslen narrows; a negative value would widen back to an enormous size_t in the sum and make the malloc fail rather than under-allocate, which is why this fails loudly too. Windows path lengths put both far out of reach in practice. Separately, the * 2 hard-codes sizeof(wchar_t), which is correct on Windows and would under-allocate anywhere else -- the build gate is what makes that safe rather than an in-source check.

Exposure: this is a build dependency, not shipped code. It arrives through tauri-build 2.6.2, tauri-winres 3.5 and embed-resource 3.0.8 into vswhom 0.1.0, where it exists to find the MSVC toolchain while embedding Windows resources. Its inputs are the local registry and filesystem of the build machine rather than anything an attacker supplies to the built product."""

