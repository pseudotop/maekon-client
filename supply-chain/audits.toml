[[audits.plotters]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-run"
version = "0.3.7"
notes = """
VD-05.7 full audit — plotters 0.3.7, safe-to-run (17,583 lines of runtime .rs).

Reachability first, because it decides the scope. plotters enters this graph only
through `criterion` (Cargo.lock: criterion 0.8.2 lists "plotters" among its
dependencies), so it is a benchmark-time dependency. That is why safe-to-run is
the criteria the exemption asked for, and it is what this audit certifies.

No build script. No C, C++, or Objective-C sources.

Unsafe: exactly one site in the whole crate — src/style/font/ttf.rs:83, a
lifetime transmute
`transmute::<Option<_>, Option<Face<'static>>>(ttf_parser::Face::parse(data, idx).ok())`
that builds a self-referential `FontExt { inner: Font, face: Option<Face<'static>> }`.

That site is not compiled here. `mod ttf` is gated on `feature = "ttf"`
(src/style/font/mod.rs:11-13), and the feature is off in this lockfile: `font-kit`
and `ttf-parser` — the dependencies the feature pulls in — have zero entries in
Cargo.lock. The check is falsifiable rather than inferred from the feature list:
if `ttf` were on, those two packages would have to be present, and they are not.

Recorded for whoever enables that feature later, since this audit does not clear
it: the transmute's soundness rests on the font bytes outliving the `Face`.
`FontExt::new` takes `data` from a `Handle::Memory { bytes, .. }` bound to a local
`handle` that drops at end of scope, so the buffer survives only if `font` — moved
into `inner` — shares ownership of the same allocation. `Drop for FontExt` does
take care to drop `face` before `inner`. Resolving this needs font-kit internals
and is out of scope for safe-to-run; it must be settled before any safe-to-deploy
claim on the `ttf` feature.

Powerful imports: two, both in src/evcxr.rs (`std::fs::File` at :5,
`File::create` at :63). That module is gated on `feature = "evcxr"`
(src/lib.rs:800-802), which is likewise off — `plotters-bitmap` has zero
Cargo.lock entries. No process spawning, no network, no environment writes
anywhere in the crate.

With `ttf` and `evcxr` both off, the compiled surface of this crate in this build
contains no unsafe and no filesystem, process, or network access."""

[[audits.plotters-backend]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-run"
