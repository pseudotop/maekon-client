[[audits.cmake]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.1.49 -> 0.1.58"
notes = """A build-script helper, so the powerful import is process execution and that is the crate's entire purpose rather than something this delta introduces — what changes is which flags are computed before cmake is invoked, not whether it is invoked. The one unsafe block is new and was checked: on Windows the crate declares `GetFullPathNameW` through a `raw-dylib` `extern "system"` block and calls it twice, first with a zero-length buffer to learn the required size and then with a buffer of that size, rejecting the result when `len == 0 || len > buffer.len()`. That is the documented two-call Win32 pattern with the return value validated, and a `FIXME` records that it exists only until the MSRV allows `std::path::absolute`. The remaining changes are flag computation: a new `no_default_flags` option, `uses_cxx11` deprecated along with removal of the hack that appended `11` to a `-darwin` target triple, and reworked `CMAKE_SYSTEM_NAME` selection for cross builds. Nothing widens what the build script can reach."""

