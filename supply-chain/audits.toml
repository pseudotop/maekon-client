notes = "Security fix. 0.5.4 addresses GHSA-3rjw-m598-pq24: on aarch64 the conditional-select macros compared the whole register against zero with `cmp {0:w}, 0`, but the Rust inline-asm ABI leaves the high bits of a register holding a `u8` unspecified, so a false condition with garbage in the upper bits selected the wrong branch. The fix masks the operand instead, `tst {0:w}, 0xff`. A matching `cseleq16!` is added for the `u16` CmovEq impls, which previously used the 32-bit form and had the same class of bug on the XOR result; it now tests `0xffff`. 0.5.3 adds Cmov/CmovEq for NonZeroUsize/NonZeroIsize and routes the soft backend under `cfg(miri)` so miri does not execute `asm!`. Verified with `cargo tree -i` that this crate sits under ctutils, and therefore under every constant-time equality in this tree: universal-hash/polyval/ghash for AEAD tag verification, and digest for hmac, sha2 and curve25519-dalek. The bug affected aarch64, which is a shipping target for this client, so this is an upgrade worth having."

