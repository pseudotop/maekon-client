[[audits.dlopen2]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.8.2"
notes = """
Whole crate read; 3031 lines, 162 unsafe sites in shipped code over 113 shapes, with a further 90 in tests. The crate loads dynamic libraries and resolves symbols, so the unsafe is the point rather than an implementation detail.

Method note: unsafe sites were clustered by normalised shape, then the sites using a sharp construct -- transmute, set_len, from_raw, assume_init, get_unchecked and relatives -- were pulled out and read individually rather than left inside a cluster.

The load and symbol paths are the platform ones -- dlopen/dlsym/dlclose under src/raw/unix.rs, LoadLibraryW/GetProcAddress/FreeLibrary under src/raw/windows.rs -- with every returned handle or address checked against null before use and the matching close issued from a Drop. Paths go through CString or a NUL-terminated wide buffer, so a name with an interior NUL is rejected rather than truncated.

The obligation the crate cannot discharge is the one it correctly pushes onto the caller: `pub unsafe fn into_raw` and the symbol getters are unsafe because the type a caller assigns to a resolved symbol is unchecked -- naming the wrong signature is unsound and no amount of care inside this crate prevents it. That is the same contract libloading carries, and marking the API rather than wrapping it is right.

Two sharp sites. `dlinfo.assume_init()` in unix.rs follows a successful dlinfo call. And src/utils.rs:64 holds `MaybeUninit::<[MaybeUninit<T>; LEN]>::uninit().assume_init()`, which reads alarming and is the standard sound idiom: an array of MaybeUninit has no validity invariant of its own, so claiming the *outer* MaybeUninit is initialised is true even while every element remains uninitialised. It is the pre-uninit_array workaround.

Scope: this audit covers the loader. What a caller does with a resolved symbol is outside it by construction."""

