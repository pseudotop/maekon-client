[[audits.sd-notify]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.5.0"
notes = """
Whole crate read; four files, 748 lines, 28 occurrences of unsafe. The shape is unusually disciplined and most of the count is signature, not body.

Five public functions are unsafe fn purely because they call std::env::remove_var, which became unsafe in the 2024 edition owing to the data race against other threads reading the environment. Each one propagates the obligation to its caller instead of hiding it, and the doc comment states the actual precondition -- callable only before threads are spawned, and specifically before any tokio runtime initialisation. That is the correct handling of that hazard.

The remaining unsafe is small and each piece checks out. slice::from_raw_parts(s.as_ptr() as *const RawFd, s.len()) reinterprets a &[BorrowedFd] as &[RawFd]; BorrowedFd is #[repr(transparent)] over RawFd and RawFd imposes no validity invariant the source could violate, so the cast is layout-sound. The libc::fcntl(fd, F_GETFD/F_SETFD) pair that sets FD_CLOEXEC passes an integer descriptor and no pointer. monotonic_time_usec is textbook: MaybeUninit::uninit(), clock_gettime writes it, the return value is checked and the function returns early on failure, and assume_init is reached only on success.

Exposure measured, and it is a shipped configuration rather than dead code. sd-notify is an optional dependency of this workspace's own maekon-app behind the systemd-notify feature, whose manifest comment reads "NOT in default features -- pass --features systemd-notify for Linux release builds". It is absent from the 1245-package default graph and present in the 1361-package --all-features graph."""

[[audits.seccompiler]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.5.0"
notes = """
Whole crate read; 5115 lines. The raw unsafe count is 90, and that number is misleading: 86 of them are inside #[cfg(test)] mod tests blocks. **Shipped code contains exactly two unsafe sites**, both in apply_filter_with_flags.

Method note: unsafe sites were clustered by normalised shape before reading, so a repeated idiom is argued once with its instance count recorded and the sites that do not fit a cluster are read individually. Sites under tests/, benches/ and examples/ were counted separately and are named where the split matters.

The first is libc::prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0) -- integer arguments only, no pointer crosses, return checked against zero and turned into Error::Prctl.

The second is the seccomp syscall itself:
    let bpf_prog = sock_fprog { len: bpf_filter.len() as u16,
                                filter: bpf_filter.as_ptr() };
    libc::syscall(SYS_seccomp, SECCOMP_SET_MODE_FILTER, flags, &bpf_prog as *const _)
and its SAFETY comment carries the actual argument: the kernel performs a copy_from_user on the filter and leaves the memory untouched, so a borrowed pointer suffices and no ownership transfer is needed. Both the sock_fprog and the slice it points at outlive the call. An empty filter is rejected before either site is reached, and the return is interpreted per the manpage -- negative is an errno failure, positive is the TSYNC thread id.

Recorded rather than passed over: `len: bpf_filter.len() as u16` is a narrowing cast. A filter longer than 65,535 instructions would wrap silently. The kernel's own BPF_MAXINSNS is 4096 so such a filter would be rejected anyway, but the truncation is in this crate's code and is not guarded here."""

