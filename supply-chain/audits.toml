[[audits.which]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "4.3.0"
notes = """
Whole crate read; 6 files, 1207 lines, exactly one unsafe block, in src/checker.rs: libc::access(c.as_ptr(), libc::X_OK) on the unix path. It is sound. The CString is built with CString::new, which rejects any interior NUL and returns Err, and the chain ends in unwrap_or(false), so a path carrying an interior NUL is never handed to access at all -- there is no truncation path here. The CString is owned by the closure and outlives the call, and access only reads and returns an int, so nothing is written back through the pointer.

Two behaviours are recorded because a caller could read more into this crate than it provides. access(2) answers with the real uid and gid and its answer can be stale by the time the caller execs, which is the syscall's documented time-of-check-to-time-of-use property rather than a defect in this binding; a caller must not treat a successful lookup as a guarantee about the file it later runs. And the Windows implementation of the same Checker is fn is_valid(&self, _path: &Path) -> bool { true } -- executability is not consulted there, and eligibility comes from the extension handling elsewhere in the crate. Neither is unsafe; both change what a lookup result means."""

[[audits.whisper-rs]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.16.0"
notes = """
Whole crate read; 4364 lines, 123 unsafe sites over 92 shapes. This is the safe layer over whisper-rs-sys, so nearly every site is one C call plus its result conversion.

Method note: unsafe sites were clustered by normalised shape, then the sites using a sharp construct -- transmute, set_len, from_raw, assume_init, get_unchecked and relatives -- were pulled out and read individually rather than left inside a cluster.

Three sites use a sharp construct and all three check out.

`tokens.set_len(ret as usize)` in whisper_ctx.rs is the correct ordering, which is worth stating because this audit set found the wrong ordering elsewhere. The vector is built with with_capacity, whisper_tokenize fills it through as_mut_ptr, the return is tested against -1 with an early error return, and set_len is reached only on success with the count the C function itself reported. Contrast coreaudio-rs in this same set, which calls set_len before the buffer is filled.

Two `slice::from_raw_parts` sites build slices over pointers whisper.cpp returned, with lengths from the adjacent n_vocab / prob_count the same API supplies. That is the trust boundary: the crate believes the library's pointer and count agree, which no Rust-side check can verify, and this audit does not go behind it. The same applies to the set_len above -- ret is trusted not to exceed max_tokens.

The remaining shape is CStr::from_ptr over strings the library owns, converted to owned Rust strings before the pointer can be invalidated.

Scope: the whisper.cpp implementation in whisper-rs-sys is not covered here."""

