- async_impl/client.rs + tls.rs: opt-in SSLKEYLOGFILE support, gated behind the
  `__rustls` feature and only active when the caller installs `KeyLogFile`; plus
  `rustls-no-provider` docs/feature. Inert unless explicitly enabled by the consumer.
- async_impl/response.rs: JSON/error decode now attaches the request URL to errors.
- async_impl/h3_client/connect.rs: Happy-Eyeballs 250ms delay; `local_addr` made Option.
- blocking/client.rs: opt-in HTTP/2 keep-alive ping interval.
- Cargo.toml: MSRV 1.64.0 → 1.85.0 (workspace already requires 1.88.0); optional deps
  hickory-resolver 0.25→0.26 and native-tls 0.2.10→0.2.16, both behind non-default features.
No new RustSec advisories. License unchanged (MIT OR Apache-2.0).
"""

[[audits.rfd]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.16.0"
notes = """
Whole crate read; 5844 lines, 132 unsafe sites over 79 shapes, split across three platform backends: win_cid (31 in the file-dialog FFI), macos (27 in the panel FFI) and gtk3 (15). Only one site uses a sharp construct.

Method note: unsafe sites were clustered by normalised shape, then the sites using a sharp construct -- transmute, set_len, from_raw, assume_init, get_unchecked and relatives -- were pulled out and read individually rather than left inside a cluster.

The Windows backend drives the COM IFileDialog interfaces -- CoCreateInstance, SetOptions, SetFileTypes, Show, GetResults -- with each HRESULT checked before the next call and the interface pointers released on drop. The macOS backend goes through objc2 typed bindings (NSOpenPanel::openPanel(mtm) and relatives) rather than raw msg_send, which is a meaningfully safer shape than hand-rolled selectors: the MainThreadMarker parameter makes the main-thread requirement a type-level obligation instead of a comment. The GTK backend calls gtk_file_chooser_* with owned CStrings.

The single sharp site is `response_flags.assume_init()` in the macOS alert path, reached after the alert has run and written the flags.

The four capability hits are process-related and sit in the backend selection, not in a dialog path.

Scope: the platform dialog APIs are trusted to behave as documented; this audit covers the Rust side's handling of their handles and return codes."""

