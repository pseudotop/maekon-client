[[audits.servo_arc]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.3.0 -> 0.2.0"
notes = """
Downgrade delta: the tree needs 0.2.0 and the audited version is 0.3.0, so this reviews what 0.2.0 has that 0.3.0 does not. That direction matters here because 0.2.0 carries the wider unsafe surface. Five files: two licence texts added, the two manifests, and lib.rs.

What comes back. (1) The whole RawOffsetArc type, which 0.3.0 had removed, including two unsafe impls. (2) nodrop::NoDrop in place of core::mem::ManuallyDrop at three transient-Arc sites. (3) Arc::into_raw and Arc::from_raw become private, and from_raw_addrefed disappears -- 0.2.0's public unsafe surface is narrower there, not wider. (4) from_header_and_iter_alloc takes I: ExactSizeIterator and derives num_items internally rather than receiving it as a parameter.

On (4), the allocation hazard is guarded in both directions and the guards are unconditional. num_items is read once, and the allocation is sized from that same value through size_of_val on a synthesised fat pointer, so a wrong len() cannot desynchronise the buffer from the loop bound. An over-reporting iterator hits items.next().expect("ExactSizeIterator over-reported length") inside the write loop; an under-reporting one hits assert!(items.next().is_none(), "ExactSizeIterator under-reported length") after it. Both are plain expect/assert and survive release builds. The only debug_assert! in that function checks buffer consumption after all writes are done and guards nothing. Read in the extracted 0.2.0 source, not inferred from the diff.

On (2), NoDrop is not equivalent to ManuallyDrop and the difference was checked in nodrop 0.1.14's source. ManuallyDrop has no Drop impl and is a lang item with a layout guarantee. NoDrop<T> wraps a #[repr(u8)] enum Flag { Alive(T), Dropped(u8) } and does have a Drop impl, which ptr::write's the discriminant to Dropped so the following drop-glue pass finds no T. The #[repr(u8)] is load-bearing: without it a niche optimisation could make the overwrite indistinguishable from a valid Alive value. The crate carries a test asserting the layout is not collapsed. At all three call sites the transient is additionally mem::forget'd, so neither the discriminant write nor the inner Arc's drop runs, and an unwind out of the callback is safe under either type because in both cases the inner Arc is never dropped and the refcount is left untouched. The mechanism is a pre-ManuallyDrop hack and the crate's own documentation says to use ManuallyDrop instead, but it is not unsound as used here.

On (1), RawOffsetArc's ownership arithmetic is consistent. The ptr field is private and the only constructor is Arc::into_raw_offset, so the type invariant cannot be forged from outside. Send/Sync are bounded on T: Sync + Send, matching Arc. Drop reconstitutes an Arc through from_raw_offset, which mem::forget's the temporary first, so there is no recursion and exactly one decrement. Clone goes through clone_arc, which clones the transient and therefore increments properly. with_arc hands out only &Arc<T> with an anonymous lifetime, so the transient cannot escape the callback.

Discretion, recorded because the criteria ask for it. RawOffsetArc::make_mut is not unwind-safe. It does ptr::read(self) to take an owned duplicate, converts it to an Arc, and only writes the result back after Arc::make_mut returns. Arc::make_mut calls (**this).clone() when the Arc is not unique, and that is a user Clone impl that may panic. On that path the owned duplicate is dropped by the unwind while self still holds the same bits and will be dropped again later, so one logical owner produces two decrements; with a starting refcount of two that reaches zero while another owner is live. This audit does not rule that out -- it is a real property of the code.

It is not reachable from this tree, which is a fact about the consumer rather than about servo_arc, so a downstream importer should not read it as settled. servo_arc 0.2.0 enters here only through selectors 0.24.0, whose entire use of the crate is servo_arc::ThinArc plus Arc and HeaderWithLength in builder.rs; RawOffsetArc, into_raw_offset and with_raw_offset_arc appear nowhere in it. That absence was taken with a positive control -- the same grep does find servo_arc in that source -- so it is a measured absence and not a failed search."""

