[[audits.lru]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.18.2"
notes = """
Whole crate read; 3231 lines, 88 unsafe sites over 53 shapes, all in src/lib.rs. The crate is a hand-rolled intrusive doubly-linked list of LruEntry nodes paired with a HashMap from key references to node pointers, which is where the unsafe comes from.

The central invariant was identified and its precondition confirmed in the source. LruEntry stores its key and value as MaybeUninit, and the list is anchored by a sentinel built with
    fn new_sigil() -> Self { LruEntry { key: MaybeUninit::uninit(),
                                        val: MaybeUninit::uninit(), .. } }
so the head/tail anchor genuinely holds uninitialised memory. Every `unsafe { (*node_ptr).key.as_ptr() }` and `unsafe { &*(*node_ptr).val.as_ptr() }` in the crate -- nine and four sites respectively, plus their variants -- is therefore sound only while the sentinel is never reached by a data path. The list operations maintain that by treating the sigil purely as a prev/next anchor, and the read sites are all preceded by a detach/attach pair or a map lookup that yields a real node.

The HashMap side has its own subtlety the crate handles deliberately: the map is keyed by a reference into the node's own key, so the node must not move once inserted, and nodes are held in Box and manipulated only through raw pointers for exactly that reason.

Scope, stated rather than implied. This entry identifies the crate's central invariant, confirms the unsafe surface is confined to the places that maintain it, and follows the reasoning at each cluster. It does not constitute an independent re-derivation of the algorithm's correctness under all interleavings or operation orders -- that needs either a proof or a Miri run under the crate's own test suite, and no Miri run was performed for this audit."""

