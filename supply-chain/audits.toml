[[audits.sqlite-wasm-rs]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.5.2"
notes = """
AUDIT SCOPE: full crate version; all targets and features reviewed. #11509 VD-05.7a full audit — sqlite-wasm-rs 0.5.2. License: MIT OR Apache-2.0. Reachability first: the crate enters this graph only through rusqlite's optional dependency gated on cfg(all(target_family = "wasm", target_os = "unknown")) — it is not compiled into any shipped target (CI targets: windows-msvc, linux-gnu, apple-darwin x2). The vendored C decomposes into four provenance-verified surfaces: (1) sqlite3/ is byte-identical to the official sqlite.org amalgamation 3.51.2 (3/3 files); (2) sqlite3mc/ is byte-identical to the utelle/SQLite3MultipleCiphers v2.2.7 release amalgamation (2/2); (3) shim/printf/ is byte-identical to eyalroz/printf at commit 29744601b9, pinned by git-blob-hash equality on both files; (4) shim/musl/ is emscripten-lineage musl fragments that match neither musl 1.2.5 nor emscripten df69e2cc byte-for-byte, so the full 1,739-line adaptation patch was read instead: branch trims to the wasm 113-bit long-double branch (retained logic byte-matches musl's own corresponding branch), __builtin_sqrt/__builtin_trunc substitutions, _Thread_local errno, emscripten's rewritten strtox (read: bounded scanning, saturating overflow handling, no OOB), include-path/weak_alias/hidden trims, and alltypes.h is emscripten's generated variant — no memory-unsafety introduced anywhere in the patch set. Hand-written Rust read in full: src/shim.rs (383 lines) implements the renamed libc surface from wasm-shim.h — a header-stored-size allocator with null-checked malloc, single-buffer localtime matching the C contract, and getentropy via crypto.getRandomValues with a WASI ENOTSUP error path. Recorded defects, none blocking and all behind the unreachable target gate: free/realloc lack NULL guards (SQLite's sqlite3_free checks NULL before dispatching, and the vendored musl/printf fragments never call free), calloc's multiply is unchecked (OOM class), and randomness falls back to non-cryptographic Math.random() when crypto.getRandomValues is unavailable — an exotic-environment weakening that would matter to sqlite3mc salt generation if wasm ever shipped. src/bindings/: two pregenerated bindgen files (markers present), mod.rs carries the canonical SQLITE_TRANSIENT transmute(-1) and zeroed-vtab Default idioms, error.rs is a safe error-code map. build.rs (261 lines): cc over the vendored C, bindgen feature using raw_line replacement declarations, and sqlite3_load_extension stubbed to return SQLITE_ERROR (hardening); no process/network/out-of-package access.
"""

