[[audits.rsqlite-vfs]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.1.0"
notes = """
Whole crate read; 2276 lines over two files, 19 unsafe sites. The crate implements a SQLite virtual filesystem, so its unsafe is the callback boundary where SQLite hands back raw pointers it owns.

Method note: this crate's unsafe sites were clustered by normalised shape before reading, so that a repeated idiom is argued once with its instance count recorded rather than restated per line, and the sites that do not fit a cluster are read individually. The counts below come from that pass.

The recurring shape is recovering typed state from a SQLite handle: `Self::app_data(vfs)` and `SQLiteVfsFile::from_file(file)`. Both are declared `unsafe fn` with the precondition written out -- from_file's doc reads "You must ensure that the pointer passed in is SQLiteVfsFile" -- and both are only called from the extern "C" shims that SQLite invokes with pointers it received from this same crate's registration, so the precondition is discharged by construction rather than by hope.

Recorded as discretion: from_file returns &'static SQLiteVfsFile, laundering the lifetime. The pointer's real lifetime is the SQLite connection's, which outlives every callback, so the reference is never observed dangling in the intended use; but the signature grants more than the invariant, and a caller that stored the reference beyond the connection would have a dangling one. The same applies to `name()` returning &'static mut str over a leaked String, which the doc marks with "Do not use again after free".

Scope: this audit reasons about the crate's own callback plumbing. It does not verify SQLite's side of the VFS contract."""

