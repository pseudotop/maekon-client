who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "1.0.228 -> 1.0.229"
notes = "The bulk of this delta is a syn 2 to syn 3 migration, which lines up with the anyhow 1.0.104 delta audited in this same batch where syn moved to 3 as a dev-dependency. The syn-driven edits are `Type::BareFn` becoming `Type::FnPtr`, `visit_type(argument)` becoming `visit_type(&argument.ty)`, a removed `eq_token` field, and several iterator chains over `Punctuated` rewritten as explicit push loops. Those are mechanical and change which predicates are collected not at all. Because this is a proc macro the emitted code matters too, and one change is in it: in de.rs a generated `next_element::<W>(&mut __seq)?` becomes an explicit `match` with `Ok(Some(..))`, `Ok(None)` and an `Err(__err) => return Err(__err)` arm. That is the desugaring of `?` minus the `From::from` conversion, and it is equivalent here because the produced and consumed error types are both `A::Error`. The rest is a `match`-to-`let else` rewrite and `fn field_i` gaining `pub(crate)`. No change to how serialization or deserialization behaves."

