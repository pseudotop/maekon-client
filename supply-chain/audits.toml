notes = """
#11730 delta audit — flate2 1.1.9 -> 1.1.10. License: MIT OR Apache-2.0.
Delta: 27 files, +794/-271 (counted here as +720/-263 excluding headers). This is the
`no_std` release; the breadth is mostly a mechanical import migration, so the delta was
decomposed before reading.

Not taken on trust: cargo-vet suggests `cargo vet trust flate2 Byron` because Mozilla
trusts that publisher. A publisher-trust precedent elsewhere is not evidence about this
delta, so this is a read audit instead.

Shape, measured:
- +117/-82 of the diff is `use std::...` -> `use core::...` / `alloc::...` / `crate::...`.
- `unsafe` is +1/-1 and `MaybeUninit` +3/-3, and both are the same migration: the single
  changed `unsafe` line is `std::ffi::CStr::from_ptr` -> `core::ffi::CStr::from_ptr`
  inside an already-existing block. No new `unsafe` operation, no new raw-pointer site.
- No process, network, filesystem, env, asm or extern-C token appears on any added line
