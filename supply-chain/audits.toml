criteria = "safe-to-run"
version = "0.4.0"
notes = """
VD-05.7 full audit — criterion 0.4.0, safe-to-run (55 files, 12,189 lines of src).

A benchmark harness, used at development and CI time only, which is why
safe-to-run is the operative criterion rather than safe-to-deploy.

Capability surface is wide but it is the crate's advertised job, not a surprise:
12 process hits (`Command::new(env::var_os("CARGO")?)` to re-invoke cargo),
6 network (`TcpStream::connect(("localhost", port))` at lib.rs:132, where the port
comes from `CARGO_CRITERION_PORT`, speaking to a local cargo-criterion process),
35 filesystem (reading and writing its own `target/criterion` result files), and
5 environment reads (`CRITERION_DEBUG`, `CARGO`, `CARGO_CRITERION_PORT`). The
network use is loopback with a port supplied by the caller's own toolchain; there
is no outbound connection to a remote host anywhere in the crate.

Unsafe: 8 occurrences, of which 5 ship, 2 are in tests and 1 is an `unsafe fn`
definition. All five shipped sites are in the statistics module and all are
guarded:

  - stats/univariate/sample.rs:33 — `mem::transmute(slice)` producing
    `&Sample<A>` from `&[A]`. `Sample<A>` is `#[repr(transparent)] struct
    Sample<A>([A])`, so the layouts are identical, and the type's documented
    invariants (at least two elements, no NaN) are established by an `assert!`
    on the line immediately above.
  - stats/univariate/sample.rs:138 — the same newtype cast after an in-place
    sort; the invariants come from the `&self` it was derived from.
  - stats/univariate/resamples.rs:55 — the same cast on `self.stage`, which was
    filled from an already-valid `Sample`.
  - stats/univariate/percentiles.rs:52 — `self.at_unchecked(p)` preceded by
    `assert!(p >= 0 && p <= 100)` and `assert!(self.0.len() > 0)`.
  - stats/bivariate/mod.rs:141 — `get_unchecked(i)` on both halves of a paired
    dataset inside `Pairs::next`, guarded by `i < self.data.len()`.

That last one deserves a note, because it carries `debug_assert!`s and this
repository has flagged debug-assert-only bounds elsewhere in this initiative
(compression-core). It is not that shape. The real guarantee is in
`Data::new`, which runs a genuine `assert!(xs.len() == ys.len() && xs.len() > 1
&& no NaNs)` at construction over private fields, and `Data::len()` returns
`self.0.len()`. The runtime guard `i < self.data.len()` therefore bounds both
slices, and the `debug_assert!`s are redundant confirmation rather than the
load-bearing check.

No build script.
"""

