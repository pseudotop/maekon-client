[[audits.time]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.3.51"
notes = """
VD-05.7 delta audit — time 0.3.47 -> 0.3.51 (41,442 diff lines).

A boundary crate: `time` feeds rcgen, x509-parser, and jsonwebtoken in this graph,
so PUBLISHER-TRUST-POLICY §4 rules out discharging it with publisher trust. This
is a hand audit.

Base correction, recorded because following the exemption would have left a gap:
the exemption's follow-up text says to audit "0.3.49..0.3.51". The audited base in
this repository is 0.3.47 (`[[audits.time]] version = "0.3.47"`, Phase 4C Group D),
which is also what `cargo vet suggest` proposes. Auditing from 0.3.49 would have
skipped 0.3.47..0.3.49 entirely.

Scope. The diff is 21,951 added lines, but 11,393 of those are in tests, benches,
and fuzz targets; the runtime path is 10,558 lines across 66 files. Extracting
only *added* runtime unsafe expressions — and truncating each file at its first
inline `#[cfg(test)]`, which a path-based filter misses — gives 218 sites in 21
files. That is the audit surface; the rest of the crate is covered by the 0.3.47
audit.

Everything below was verified by computation with falsification controls, not by
reading the safety comments. Where the domain was small enough the check is
exhaustive rather than sampled.

## num_fmt.rs (55) — new integer formatter

`StackStr`/`StackTrailingStr` hold `[MaybeUninit<u8>; N]` and hand out
`str_from_raw_parts`, so every write path must fill exactly what it later reads.
`u64_pad_none` was traced by hand: `offset` starts at 20 and decreases by 4, so it
only ever takes {20,16,12,8,4,0}; reaching 0 implies `remain == 0`, which disables
both later decrements, so the usize cannot underflow. `enc_16lsd::<OFFSET>` covers
exactly `OFFSET..OFFSET+16`, and its two call sites (23, 7) fit the 39-byte buffer.

`div_rem_1e16` is a magic-constant division and the one place a wrong answer is UB
rather than a wrong number: its remainder feeds
`ru64::<0, 9_999_999_999_999_999>::new_unchecked`, and deranged's `new_unchecked`
calls `core::hint::assert_unchecked`. It was verified in exact integer arithmetic:
the crate's 64-bit-limb `mulhi` matches full-width multiplication on 20,005 cases;
`M_HIGH == ceil(2^179 / 1e16)` exactly; the magic-division error bound
`(M*d - 2^s) * (2^128-1) <= 2^s` holds; and 42,009 boundary and random points
(k*d-1, k*d, k*d+1, plus 2^128 neighbourhoods) all reproduce `n // 1e16` with a
remainder inside [0, 1e16). Falsification fired on every perturbation — M±1 and
shift±1 each produce mismatches. `M_HIGH + 1` breaks only 1 of 5,000 sampled
points, which is why the ±1 control was necessary rather than decorative.

Recorded defect, not blocking: `write_one_digit`'s doc says "`buf` must be at
least `offset` bytes long" while it writes one byte *at* `offset`, so the stated
contract is one byte short. `write_two_digits` above it correctly says
`offset + 2`. Both in-tree callers satisfy the stronger requirement, so this is a
documentation bug, not a live one. Reported upstream (2026-08-27, #11511):
https://github.com/time-rs/time/issues/806 — includes the one-line fix and offers
it as a PR. Input for the next-version audit: when bumping past 0.3.51, check
whether the corrected doc landed and drop this pointer.

## timestamp.rs (28) — new module

`Timestamp::__new_unchecked` forwards to `Seconds::new_unchecked` and
`Nanoseconds::new_unchecked`, so every caller owes a range proof.

The three public constructors (`from_milliseconds`, `from_microseconds`,
`from_nanoseconds`) share one shape: `ensure_ranged!` then truncating division,
`rem_euclid`, and a `if v < 0 && nanos != 0 { seconds -= 1 }` correction.
`ensure_ranged!` is a real runtime check — it calls deranged's checked `::new()`
and returns `Err(ComponentRange)`, present in release builds. The decomposition was
verified over 40,019 points per constructor (range endpoints, ±3 neighbourhoods,
unit boundaries, random fill), confirming `seconds` stays inside
`[Seconds::MIN, Seconds::MAX]`, `nanos` inside [0, 1e9), and that the split is
lossless. Because `large-dates` cannot be read off the lockfile — it pulls in no
dependency — both bounds were checked: ±9,999 and ±999,999. Falsification: dropping
the negative-side correction breaks 20,034–23,888 of 40,019 points in every case,
so that one line is what turns truncating division into floor division.

`add`/`sub` (:794, :837, :865, :893) use `checked_add` plus explicit
`< Seconds::MIN.get()` / `> Seconds::MAX.get()` tests returning `Overflow`.

`Timestamp::time()` (:435) decomposes `as_seconds().rem_euclid(86_400)` into
hour/minute/second. Exhaustive over all 86,400 values: hour ∈ [0,23], minute and
second ∈ [0,59], and the split is lossless. Falsification: feeding the same
arithmetic negative values (i.e. removing `rem_euclid`) puts all 86,400 out of
range, so that call is load-bearing.

`replace_time` (:1012) and `replace_date` (:1034) floor to midnight and re-add a
time of day. Their safety comments claim const assertions enforce the needed
invariant, and they do — timestamp.rs:35-38 is a `const _: () = { assert!(...) }`
block checking that `Timestamp::MIN.time() == Time::MIDNIGHT` and
`Timestamp::MAX.time() == Time::MAX`, with a comment saying the soundness of some
functions depends on it. Being `const`, a violation is a compile error. That is
exactly the property the two functions need: MIN is day-aligned and MAX is the last
instant of a day, so replacing the time-of-day cannot leave the range.

Negation (:1356) computes `1e9 - nanosecond` behind an `if nanosecond != 0` guard,
mapping [1, 999_999_999] onto itself. Without the guard, n = 0 would yield
1_000_000_000 and leave `Nanoseconds<0, 999_999_999>`.

## date.rs (14) and util.rs (3)

`Date::fmt_into_buffer` writes into `[MaybeUninit<u8>; 13]` with raw
`copy_to_nonoverlapping`, so the constant has to be right. Exhaustive over every
representable year: with `large-dates` off the worst case is 11 bytes (2 spare);
with it on the worst case is **exactly 13 with zero slack** (year -999999). The
`ZERO_PADDED_PAIRS` table access inside `four_to_six_digits` was checked in the
same sweep and lands on [2, 200] — touching the exact end of the 200-byte table at
`first_two = 99`. Falsification: a 12-byte buffer overflows for 3 years, so 13 is
derived, not chosen.

The three `core::hint::unreachable_unchecked()` sites (util.rs:79, date.rs:380,
date.rs:522) all sit behind the same ordinal-to-month bit trick,
`((ordinal * 268 + 8031) >> 13) + month_adj`, feeding
`Month::from_number(NonZero::new_unchecked(month as u8))`. Exhaustive over both
365- and 366-day years: month is never zero, always in [1,12], and the (month, day)
pair matches a real calendar on every day. Falsification on two axes — ordinals
past the year end (366, 367, 400, 500) produce months 13-17, so the unchecked
depends on the caller's contract; and the magic constants are tight, with valid
windows of width 1 (`268`, unique), 3 (`3917`), 24 (`3866`) and 36 (`8031`), three
of the four sitting exactly at a window edge. An initial ±1 control on `8031`
passed and was too weak — measuring the window is what showed the constants are
derived.

## formatting/ (71) and parsing/component.rs

One pattern: unchecked narrowing of an already-ranged value. Verified exhaustively.
`year / 100` over every year gives [-99, 99] without `large-dates` and exactly
[-9999, 9999] with it — saturating `ri16<-9_999, 9_999>` precisely. Offset
components narrow from `ri8<-25, 25>` and `ri8<-59, 59>` through `unsigned_abs()`
into [0, 25] and [0, 59]. Falsification: years beyond ±999,999 push the century out
of range in 3 of 3 cases, so the unchecked genuinely rests on `Year`'s bounds.

The standard-range formatting paths do not assume: they take `StandardYear`
(`ri16<-9_999, 9_999>`) and `StandardCentury` (`ri8<-99, 99>`), distinct types, and
the conversion into them goes through a **checked** `narrow::<-99, 99>()` with
`.ok_or_else(|| ComponentRange::conditional("year"))?`. So unchecked is used only
where the type already proves the range, and a checked narrow guards the step that
would not.

`buf.first_chunk_mut().unwrap_unchecked()` (utc_date_time.rs:1267 and siblings) is
sound by construction: the outer buffer is
`PrimitiveDateTime::DISPLAY_BUFFER_SIZE + 4`, so a chunk of the inner size always
exists, and the following 4-byte `copy_to_nonoverlapping` at `pdt_len` fits because
`fmt_into_buffer` cannot return more than its own buffer length.

`transmute::<u8, Weekday>` (parsing/component.rs:460, :518, :540) is guarded by
`if index > 6 { return None }` — and at :518 the subsequent `(digit + 6) % 7`
preserves [0,6]. The transmute itself is sound because `Weekday` is `#[repr(u8)]`
(weekday.rs:15) with exactly seven variants and implicit discriminants 0..6; both
facts were checked rather than assumed, since a value-only argument would not
suffice without the repr.

## time.rs, utc_offset.rs, component_provider.rs

`Time::as_u64` transmutes `Time` to `u64`. Sound, and the reason is structural
rather than incidental: `Time` is `#[repr(C)]` (time.rs:56) with fields
`Nanoseconds`(4) + `Seconds`(1) + `Minutes`(1) + `Hours`(1) + an explicit
`padding: Padding` field that is `#[repr(u8)]` (time.rs:33). Those sum to exactly
8, so there is no room for implicit padding, and `transmute` enforces the size
equality at compile time. Every `u64` bit pattern is valid. The struct even carries
a "do not reorder" comment on the field list.

`duration_until` (time.rs:474-510) asserts bounds on component differences through
eight `hint::assert_unchecked` calls — false conditions there are UB directly, not
via a ranged type. Verified exhaustively for Hours (576 pairs), Minutes and Seconds
(3,600 each) and on boundaries plus 163,216 sampled pairs for Nanoseconds: every
difference lands in `[Xmin - Xmax, Xmax - Xmin]` and fits the signed type the
`cast_signed()` produces (i8 for the u8 components, i32 for nanoseconds).
Falsification: components outside their declared ranges break the assertion, so it
rests on the `ru8`/`ru32` bounds rather than being vacuous.

`UtcOffset::as_u32_for_equality` transmutes `[i8; 4]` to `u32`. A by-value
transmute between POD types of equal size: `[i8; 4]` has no padding, all four
elements are explicitly initialized (including the literal `0`), and every `u32`
bit pattern is valid. Alignment is not a concern because nothing is dereferenced.

`from_whole_seconds_ranged` (utc_offset.rs:292) splits `WholeSeconds` into h/m/s
for `__from_hms_unchecked`, whose contract is hours ∈ [-25,25] and minutes,
seconds ∈ [-59,59]. Exhaustive over all 187,199 values of
`WholeSeconds = ri32<-93_599, 93_599>`: hours saturates exactly [-25, 25], minutes
and seconds stay inside [-59, 59], all three fit i8, and the split is lossless.
Falsification: values one hour past either end give hours ±26, so the unchecked
depends on the `WholeSeconds` bound.

`component_provider.rs`'s narrowings feed `Day = ru8<1,31>`,
`Ordinal = ru16<1,366>`, `IsoWeekNumber = ru8<1,53>` and friends — all deranged
aliases with explicit ranges. Their sources are the `Date`/`Time` accessors: `day`
comes from `to_calendar_date()`, which is the ordinal-to-month algorithm proven
exhaustively above, and `ordinal` is the stored field validated at `Date`
construction. Worth recording that `formatting/mod.rs` defines
`Year = ri32<-999_999, 999_999>` unconditionally while `date.rs` defines it as
`ri32<MIN_YEAR, MAX_YEAR>`; with `large-dates` off the latter is the narrower
±9,999, a subset, so the narrowing is safe under either feature setting.

## Method, and what is pattern-covered rather than individually traced

Every one of the 218 sites was classified, and the classifier was widened twice
when it mis-sorted verified work into "unclassified" — first because the crate uses
type aliases (`Day::new_unchecked`) rather than the raw `ru8::` form, then because
multi-line `unsafe {` openers were counted separately from the call inside them.
Both corrections were driven by inspecting the leftovers rather than by assuming
the classifier was right.

The load-bearing sites are proven, most of them exhaustively: the magic division,
the timestamp decompositions, the time-of-day split, the calendar arithmetic, the
display buffer sizes, the century and offset narrowings, the difference assertions,
and both transmutes.

A residue of roughly a dozen sites is covered by pattern rather than by an
individual trace: `duration.rs:206`
(`new_ranged_unchecked(i64::MIN, Nanoseconds::new_static::<0>())`, constructing the
documented minimum), the four interop `unwrap_unchecked` sites and
`offset_date_time.rs:1614`, plus single sites in `rand010.rs`,
`format_description_v3.rs`, `lexer_ast.rs` and `strftime.rs`. Each matches a
pattern whose soundness condition is established above, but the specific source
range was not re-derived for each. Stated here so the next reader knows exactly
where the audit is proof and where it is classification."""

