[[audits.ntapi]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.4.3"
notes = """
VD-05.7 full audit — ntapi 0.4.3 (36 files, 20,881 lines of src).

Declarations for the Windows NT native API. Reaches this tree through `sysinfo`,
which gates it `[target."cfg(windows)".dependencies]`, so it compiles on Windows
only.

A raw scan reports 41 unsafe hits, 8 filesystem and 6 FFI. Split apart, the
shipped unsafe surface is **one block**:

  - 6 + more are `pub type $func = Option<unsafe extern "C" fn(..) -> $ret>` and
    `pub type $n = unsafe extern $c fn(..)` produced by macros in src/macros.rs —
    signature declarations for foreign functions, not unsafe code. This is the
    same shape as r-efi 6.0.0 audited in this batch, where 318 of 324 hits were
    type aliases.
  - The 8 "filesystem" hits are a false match on my scanner: they are
    `OpenOptions: ULONG` **parameter names** in NT API signatures in
    src/ntzwapi.rs, not `std::fs::OpenOptions`. There is no filesystem access in
    the crate, and likewise no network, process spawning, environment access or
    dynamic loading.

The one real block is `FIELD_OFFSET!` in src/macros.rs:33:

    let obj = core::mem::MaybeUninit::<$_type>::uninit();
    let base = obj.as_ptr();
    unsafe { core::ptr::addr_of!((*base).$field$(.$cfields)*) as usize - base as usize }

This is the standard pre-`offset_of!` idiom and it is sound: `addr_of!` forms a
pointer to a place without creating a reference and without reading, so the
uninitialised `MaybeUninit` is never loaded from, and the subtraction stays
within one allocation. Rust stabilised `offset_of!` in 1.77 and this crate
predates relying on it; the hand-rolled version has the same semantics.

Build script: 15 lines. On `x86_64-pc-windows-gnu` / `i686-pc-windows-gnu` with
the `user` feature it prints one `cargo:rustc-link-lib=ntdll` or
`=winapi_ntdll` line, choosing between them on the presence of
`WINAPI_NO_BUNDLED_LIBRARIES`. It reads two environment variables, writes no
files, spawns nothing and opens no sockets.

safe-to-deploy is met.
"""

