[[audits.aes-gcm]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.11.0 -> 0.11.1"
notes = """
#11730 delta audit — aes-gcm 0.11.0 -> 0.11.1. License: Apache-2.0 OR MIT.
Delta read in full: 5 files, +43/-19 (CHANGELOG, Cargo.toml, Cargo.toml.orig, README, src/lib.rs).

Publisher note: 0.11.0 was published by user-id 267 (tarcieri), who this file already
trusts via [[trusted.aes-gcm]]. 0.11.1 was published by `github:RustCrypto/AEADs`, a team
account outside that trust entry, so the existing publisher trust does not carry over.
This is a delta audit, not a trust extension.

Non-code changes: CHANGELOG adds the 0.11.1 entry and retroactively reorganises the 0.11.0
entries; README reorders badges. Neither carries meaning.

Manifest changes:
- `subtle` (v2) removed, `ctutils` (v0.4) added.
- New optional feature `zeroize = ["dep:zeroize", "aes?/zeroize", "ghash/zeroize"]`.

src/lib.rs has exactly two changes:

1. The AEAD authentication-tag comparison switches its constant-time helper:
   `use subtle::ConstantTimeEq;` -> `use ctutils::CtEq;`. The call site is unchanged
   (`expected_tag[..TagSize::to_usize()].ct_eq(tag).into()`). This is the one
   security-relevant line in the delta.
2. A `#[cfg(feature = "zeroize")]` marker impl `ZeroizeOnDrop for AesGcm` with an empty
   body; clearing is delegated to member drops (`Aes`, `Polyval`).

Reachability measured, not assumed:
- `ctutils 0.4.2` is already in this lockfile (pulled by other crates) and already carries
  a safe-to-deploy audit in this file, so the swap introduces no unvetted crate. `subtle`
  remains in the graph for other consumers.
- The `zeroize` feature is NOT enabled for aes-gcm in this workspace: `cargo tree -i
  aes-gcm -e features` shows only `default` -> `aes` from maekon-network / maekon-storage,
  with zero `zeroize` occurrences. The new marker impl is therefore cfg-gated out of every
  shipped target.

Limitation recorded honestly: the existing `ctutils` audit is a capability and
memory-safety check (no unsafe, no build script, no syscalls), not a timing analysis. The
constant-time property of the tag comparison rests on RustCrypto's upstream authorship
exactly as it did for `subtle` before this delta; this audit does not independently verify
constant-time execution of either crate.

No unsafe added, no build script, no new process/network/filesystem surface, no API
removal."""

