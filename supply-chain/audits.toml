[[audits.winapi-i686-pc-windows-gnu]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.4.0"
notes = """
This crate is a bundle of prebuilt MinGW import libraries, so the usual "read the source" audit does not reach its substance. What the Rust side does is fully readable and tiny: src/lib.rs is #![no_std] and a licence header, with no items at all, and build.rs does exactly one thing -- if TARGET equals i686-pc-windows-gnu it prints a cargo:rustc-link-search=native pointing at the bundled lib directory, and otherwise returns immediately. It also honours WINAPI_NO_BUNDLED_LIBRARIES as an opt-out. On any other target the crate emits nothing and the archives are inert.

Rather than record the 1387 bundled .a files as unauditable, their structure was verified. Members are named in dlltool's import-library convention -- one head object, one tail object, and one small object per exported symbol -- and every archive was enumerated with ar tv, not sampled: 1387 archives and 61448 object members, after excluding the archive symbol table and long-name members, which are metadata rather than objects. Not one object member exceeds 4096 bytes; the largest is 877 bytes. Import thunks are that small and implementation code is not.

That absence was taken with a positive control, because a size test that cannot see a large member proves nothing. A control archive was built locally from a C file containing a 16 KiB array and run through the same code path; it reports a 17072-byte member, so the detector does flag large members when they exist. An earlier run of this check was discarded because it reported the archive symbol table as the largest member and its positive control had failed to execute.

Stated limit: size and naming are structural evidence, not disassembly. A member under a kilobyte could still hold a handful of instructions, and this audit did not disassemble the objects or compare them against a Windows SDK. What it establishes is that the archives are shaped like import libraries throughout and contain no member large enough to carry an implementation.

Reachability: the crate is a target-gated dependency of winapi 0.3.9 and enters only for i686-pc-windows-gnu. cargo tree -i against x86_64-pc-windows-msvc prints nothing to print, so it is absent from the graph for the Windows target this client actually builds."""

