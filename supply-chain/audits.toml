[[audits.fast_image_resize]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "6.1.0"
notes = """
VD-05.7 full audit — fast_image_resize 6.1.0 (149 runtime .rs files, 25,233 lines).

`#![no_std]` with an alloc-backed std compat layer. No build script, no C, C++ or
Objective-C sources. The entire safe-to-deploy question is SIMD unsafe.

## Structure — 652 sites are a product, not 652 problems

411 `unsafe fn` definitions across 107 files, but only **150 distinct names**: the
same kernels (`horiz_convolution_one_row` ×32, `horiz_convolution_four_rows` ×31,
`multiply_alpha*` and `divide_alpha*` ×20 each) instantiated per ISA and per pixel
format. Broken down by operation: 284 `#[target_feature]`, 233 `get_unchecked`,
42 pointer add/offset, 22 transmute, 6 assume_init, 4 from_raw_parts.

By ISA: neon 126, avx2 94, sse4 94, wasm32 73, shared 24. This project ships
x86_64 and aarch64 desktop targets, so the sse4/avx2 and neon families both
compile; the 73 wasm32 definitions do not.

## May the kernels run at all

Every kernel is `#[target_feature(enable = ...)]`, so calling one on a CPU without
the feature is UB regardless of arguments. Two things had to hold.

First, detection must be real. It is on both compat paths, which mattered because
this crate is `no_std` by default and a missing-detection fallback would be the
dangerous shape: `compat/std_impl.rs` uses `is_x86_feature_detected!` and
`is_aarch64_feature_detected!`; `compat/no_std_impl.rs` uses the `cpufeatures`
crate, which does its own CPUID. Neither assumes. `CpuExtensions::default()`
(cpu_extensions.rs:41-58) picks the best *detected* extension and falls back to
`None`. This build takes the std path — `cpufeatures` has no Cargo.lock entry, so
the `std` feature is on.

Second, the caller must not be able to override detection safely. It cannot:
`Resizer::set_cpu_extensions` (resizer.rs:309) and `MulDiv::set_cpu_extensions`
(mul_div.rs:44) are both `pub unsafe fn`, correctly pushing the obligation onto a
caller who wants to force an ISA.

On our side, `maekon-vision/src/thumbnail.rs` never calls either setter — it uses
`Resizer::new()` (detected default), `Image::from_vec_u8` and `resize`, both of
which return `Result`. The compiled surface we exercise is the safe API only.

## Can the kernels write out of bounds

The kernels carry explicit, precise contracts rather than a vague "caller must
ensure". For example convolution/u8x4/neon.rs:196-200:

    /// - bounds.len() == dst_row.len()
    /// - coefficients_chunks.len() == dst_row.len()
    /// - max(chunk.start + chunk.values.len() for chunk in coefficients_chunks)
    ///     <= src_row.len()
    /// - precision <= MAX_COEFS_PRECISION

The entry point `horiz_convolution` (same file, :8) is a safe `pub(crate) fn` and
does not assert these locally; it obtains `coefficients_chunks` from
`Normalizer16::chunks()` and iterates rows through the `ImageView`/`ImageViewMut`
traits. So, as in rubato, the proof lives in the caller chain rather than at the
unsafe site. That chain was traced: kernel → `horiz_convolution` →
`Normalizer16::new` (optimisations.rs:52), which builds one chunk per entry of
`coefficients.bounds` from `values.chunks_exact(window_size)` → `Coefficients`,
computed by the resize algorithm from the source and destination dimensions.

`Normalizer16::clip` (optimisations.rs:105-115) was checked numerically because it
is the one place the bound is stated as arithmetic: the contract is
`v >> precision ∈ [-512, 511]`, giving `index = 640 + (v >> precision)` ∈
[128, 1151], and `CLIP8_LOOKUPS` is `[u8; 1280]`. So the reachable index range sits
inside the table with 128 elements of margin at each end — deliberate slack, not a
coincidence. The in-source guard is a `debug_assert!`, so that margin is what
absorbs a moderate contract violation in release.

## Recorded, because this project has already been bitten here

`maekon-vision/src/thumbnail.rs:177` carries a caller-side guard:

    // Guard against buffer overflow inside fast_image_resize.
    // 32768 accommodates triple 6K displays (18048px) and 8K monitors.
    // The actual crash was from usize::unchecked_add — log dimensions for diagnosis.
    const MAX_DIM: u32 = 32768;

So an earlier version of this crate reached `usize::unchecked_add` with dimensions
large enough to overflow, and the workaround lives at our call site rather than
upstream. Checked against 6.1.0: `unchecked_add`, `unchecked_mul` and
`unchecked_sub` appear **zero** times in the crate today, so the specific operation
is gone. The guard is now defence against a fixed defect; worth keeping, worth
knowing it is no longer load-bearing for that reason.

## Where this audit is proof and where it is trace

Proven: the feature-detection chain on both compat paths, the `unsafe fn` setter
design, our own usage staying on the safe API, the `clip` index range against the
table size, and the reachability exclusion of the wasm32 kernels.

Traced structurally but **not verified numerically**: the final link of the kernel
contract — that `max(chunk.start + chunk.values.len())` cannot exceed
`src_row.len()` for every filter and every source/destination size pair. That
bottoms out in the `Coefficients` computation, one level above `Normalizer16`, and
proving it would mean enumerating the filter/window arithmetic the way the timestamp
and calendar audits enumerated theirs.

For this project's exposure that gap is narrow: thumbnail.rs resizes screen
captures whose dimensions come from the display server and are additionally clamped
to 32768 before the call, so the inputs are not attacker-controlled. A reviewer who
reads safe-to-deploy as requiring the full arithmetic proof should overrule this and
keep the exemption until that link is closed."""

[[audits.fastembed]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "5.17.3"
notes = """
VD-05.7 full audit — fastembed 5.17.3 (37 files, 7,797 lines of src).

Unsafe: three occurrences, all the same call —
`unsafe { VarBuilder::from_mmaped_safetensors(&weight_files, dtype, device)? }`
in models/qwen3.rs (×2) and models/nomic_v2_moe.rs. **None of them compile in
this build**, and that was measured rather than inferred. Both modules are
feature-gated in models/mod.rs (`#[cfg(feature = "qwen3")]`,
`#[cfg(feature = "nomic-v2-moe")]`), this repository declares
`default-features = false` with only `ort-download-binaries-native-tls` and
`hf-hub-native-tls` enabled, and the confirming evidence is the lockfile:
fastembed resolves with `anyhow, hf-hub, ndarray, ort, safetensors, serde,
serde_json, tokenizers` and **no candle**, which is where `VarBuilder` lives. Our
path is ONNX Runtime (`ort`), not candle. Nothing else in the crate uses unsafe.

Capability surface, which is the substantive part and is the crate's declared
purpose rather than a surprise: it downloads model weights over HTTPS from
`HF_ENDPOINT` (defaulting to https://huggingface.co) into a cache directory taken
from `HF_HOME` or `FASTEMBED_CACHE_DIR`, then loads them. Ten filesystem hits and
three environment reads, all in service of that. No process spawning, no
`extern "C"`, no `#[link]`, no `#[no_mangle]`, no dynamic loading. No build
script.

fastembed itself performs **no integrity verification** of what it downloads —
it delegates fetching to `hf-hub`, whose ETag handling is cache-validity logic,
not content authentication. TLS to the endpoint is the only trust anchor, and
`HF_ENDPOINT` is an environment variable, so the endpoint is operator-controlled.

That gap is already compensated in this repository and the compensation was
checked, not assumed. `maekon-embedding` (the only consumer;
`default = ["fastembed-local"]`, so it is live) calls
`model_integrity::verify_cached_weights(..)` against a SHA-256 allowlist,
fail-closed for any model with a registered digest — issue #7082 MEMB-3. The
wrapper's own comment records the residual honestly: verification runs after
`TextEmbedding::try_new` has already handed the graph to ONNX Runtime, so it
guards inference rather than parsing, and a strict before-parse check needs a
pinned-revision pre-fetch (tracked by #7082). Worth carrying forward, but it is a
property of our integration, not of this crate.

safe-to-deploy is met: no unsafe compiles here, and the capability surface is the
documented behaviour of a model-fetching embedding library.
"""

