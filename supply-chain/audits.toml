[[audits.lru-slab]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.1.2"
notes = """Whole crate read. Two unsafe blocks, in `IterMut::next` and `next_back`, which form `&'a mut T` from a raw slot pointer. Their soundness needs the list invariant — exactly `len` distinct in-bounds nodes — so that was checked rather than taken from the safety comment. Every mutator uses checked indexing (`self.slots[idx]`), so a bad index panics instead of corrupting; the unchecked accesses exist only in the iterators. `insert` takes a slot from the free list, debug-asserts it was vacant, links it at the head and increments `len`; `remove` unlinks and decrements; `freshen` unlinks and relinks the same node with no net change. Capacity is explicitly clamped to `u32::MAX - 1` with the comment "Ensure `NONE` never becomes a real slot index", which is what keeps the sentinel distinct from every live index. The iterator walks at most `len` steps from the head, so even a malformed list terminates. `IterMut` is built from `&mut self` and carries `PhantomData<&'a mut [Slot<T>]>`, so exclusivity comes from the borrow. The `.expect("corrupt LRU list")` on a vacant slot is defence in depth rather than the main guarantee."""

