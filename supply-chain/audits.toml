notes = "Publish share: kennykerr shipped 77 of 81 published versions (95%); yoshuawuyts published 2 and DianaNites 1, and 1 version predates publisher records. Window basis: start is the publisher's first publication of this crate, per cargo-vet's default; no earlier owner's releases are covered. Corroboration: isrg, zcash, arielos, mozilla and one other trust this publisher, per cargo vet suggest. Those registries publish trust entries without stated reasons (measured 2026-08-22: mozilla 2 of 228, zcash 0 of 206, arielos 0 of 95, isrg 0 of 50), so the citation raises confidence but is not the basis; the findings recorded here are. Release process: trustpub_data is null on every version of all 22 crates in this family, so releases are made with a long-lived API token rather than crates.io Trusted Publishing. That is the norm for mature crates and is recorded rather than treated as disqualifying. Scale: an audit is not available as an alternative here — the family is roughly four million lines, with windows alone at 1.84M and windows-sys at 489K. Approval: this entry lands by pull request under the ONESHIM Contributors identity, which policy section 5 records as the approval mechanism; there is no separate ledger. Exposure: boundary — this crate declares the FFI signatures for the Win32 surface that everything above it calls, and a single wrong signature is memory corruption by itself. Why an audit was not performed: the declarations are machine-generated from Windows metadata, so the audit target is not logic. Reading them line by line would confirm transcription that no human performed. This is the same shape as the existing h2 entry in this file, which records that a line-by-line audit of an HTTP/2 framing state machine would not have been meaningful."

