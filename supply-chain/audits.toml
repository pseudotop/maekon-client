notes = """Publish share: 1 of 6 published versions carries trustpub_data from this repository, and it is 0.6.0 — the version this tree needs. An earlier note in this initiative recorded that this signature had published "0 of 6" versions and skipped it on that basis; that count was taken from `published_by` logins, which Trusted Publishing releases do not populate, so it was wrong. The signature published exactly the version that matters. Exposure: boundary — the crate declares macOS Mach kernel FFI signatures, where a wrong declaration is memory corruption by itself. Why an audit was not performed: the 0.4.2 to 0.6.0 delta adds 25 hand-written `extern` blocks of Mach declarations, and verifying those against XNU headers is not something this review can do; that is precisely the surface that makes the crate boundary-class. Why this entry names a signature rather than a person: releases made through crates.io Trusted Publishing carry no `published_by` login, so trusting the human maintainer does not cover them. Measured 2026-08-22 — after trusting the human publisher for this crate the exemption remained, and the crate's recent versions report `published_by = null` with `trustpub_data` naming the repository below. Trusting the signature is what covers those releases, and it is also the stronger claim: an OIDC-issued release is bound to a specific repository and CI run and cannot come from a leaked personal token. Window basis: start is the signature's first publication, per cargo-vet's default. Approval: this entry lands by pull request under the ONESHIM Contributors identity, which policy section 5 records as the approval mechanism. It does not cite the #3908 owner-approved identity review, because this identity was not part of it."""

