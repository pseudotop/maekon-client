[[audits.tracing-opentelemetry]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.33.0"
notes = """
Whole crate read; 6199 lines, three unsafe sites, no capability call of any kind.

All three are the tracing-subscriber downcast protocol: `unsafe fn downcast_raw(&self, id: TypeId) -> Option<*const ()>` declared twice and delegated once as `unsafe { self.inner.downcast_raw(id) }`. That method is unsafe in the trait because the returned pointer must actually point at a value of the type the TypeId names -- an obligation on the implementor that no signature can carry. This crate's implementations either return a pointer to self for its own type id or forward to the wrapped layer, which is the intended pass-through and does not widen the contract.

The rest of the crate is span and metric bridging between tracing and OpenTelemetry, in safe Rust."""

