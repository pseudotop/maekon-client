[[trusted.filetime]]
criteria = "safe-to-deploy"
user-id = 1 # Alex Crichton (alexcrichton)
start = "2019-04-23"
end = "2027-08-22"
notes = "Publish share: alexcrichton shipped 25 of 46 published versions (54%); the remaining 21 predate crates.io publisher records, and no other named publisher appears. Window: start is the publisher's first publication. Corroboration: isrg, arielos, mozilla and one other trust this publisher. Those registries publish trust entries without notes (measured 2026-08-22: mozilla 2 of 228, zcash 0 of 206, arielos 0 of 95, isrg 0 of 50), so the citation is corroboration and not the basis; the findings above are. Release process: trustpub_data is null on every version. Exposure: general, with a caveat worth stating rather than hiding. The crate reads and sets file modification and access times, so it does touch the filesystem, but only file metadata on paths the caller already supplies; it does not create, write or delete file contents, spawn processes, or handle key material."

[[trusted.find-msvc-tools]]
criteria = "safe-to-deploy"
user-id = 539
start = "2025-08-29"
end = "2027-08-22"
notes = "Publish share: cuviper shipped 1 of 12 published versions (8%); the remaining 11 predate publisher records under this name. Window basis: start is the publisher's first publication, per cargo-vet's default; no earlier owner's releases are covered. Corroboration: isrg, arielos, mozilla and one other trust this publisher, per cargo vet suggest. Those registries publish trust entries without stated reasons (measured 2026-08-22: mozilla 2 of 228, zcash 0 of 206, arielos 0 of 95, isrg 0 of 50), so the citation raises confidence but is not the basis. Release process: 11 of 12 versions carry trustpub_data, so nearly every release is published through crates.io Trusted Publishing and could not come from a leaked personal token. Exposure: boundary — the crate locates the MSVC toolchain for build scripts, so it influences which compiler a build invokes. Why an audit was not performed: it has not been reached yet; the crate is small enough that an audit would be feasible. The 8% publish share is the lowest in this batch and is stated plainly, but it is offset by the Trusted Publishing coverage above, which is the strongest such signal here. Approval: this entry lands by pull request under the ONESHIM Contributors identity, which policy section 5 records as the approval mechanism. It does not cite the #3908 owner-approved identity review, because this publisher was not part of it."

[[trusted.find-msvc-tools]]
criteria = "safe-to-deploy"
trusted-publisher = "github:rust-lang/cc-rs"
start = "2025-09-05"
end = "2027-08-22"
notes = "Publish share: 11 of 12 published versions carry trustpub_data from this repository — the highest Trusted Publishing coverage anywhere in this backlog. The crate is released from the same repository as cc, which is why the signature is identical. Exposure: boundary — the crate locates the MSVC toolchain for build scripts and so influences which compiler a build invokes. Why an audit was not performed: it has not been reached yet; the crate is small enough that an audit would be feasible and preferable. Why this entry names a signature rather than a person: releases made through crates.io Trusted Publishing carry no `published_by` login, so trusting the human maintainer does not cover them. Measured 2026-08-22 — after trusting the human publisher for this crate the exemption remained, and the crate's recent versions report `published_by = null` with `trustpub_data` naming the repository below. Trusting the signature is what covers those releases, and it is also the stronger claim: an OIDC-issued release is bound to a specific repository and CI run and cannot come from a leaked personal token. Window basis: start is the signature's first publication, per cargo-vet's default. Approval: this entry lands by pull request under the ONESHIM Contributors identity, which policy section 5 records as the approval mechanism. It does not cite the #3908 owner-approved identity review, because this identity was not part of it."

