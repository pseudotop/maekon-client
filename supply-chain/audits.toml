notes = "The DNS-name validator in src/server_name.rs is rewritten. Because this feeds TLS hostname verification, the old and new state machines were traced against each other rather than read for plausibility. The old code carried label length inside the state (Start/Next/NumericOnly/NextAfterNumericOnly/Subsequent/Hyphen); the new code keeps a four-state LabelState (Start/HasLetter/AllNumeric/EndsInHyphen) plus explicit start and idx cursors, and computes label length as idx - start. Cases checked to agree: empty input rejected (now via an explicit is_empty rather than falling through to the final state check); single dot rejected; consecutive dots rejected via a zero-length label; leading hyphen rejected via idx == start; trailing hyphen rejected via EndsInHyphen; a 63-byte label accepted and 64 rejected; total length over 253 rejected; underscore accepted; trailing dot accepted; and an all-numeric final label rejected both with and without a trailing dot, which the new code preserves deliberately by breaking out of the loop with `state` intact. What was not done: the two parsers were not proven equivalent exhaustively, only agreed on the representative cases above. The rest of the delta is a criterion dev-dependency and a `dns_name` benchmark, which suggests the motivation was performance."

[[audits.rustls-platform-verifier]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.6.1 -> 0.7.0"
notes = 'This sits on certificate-chain verification, so the Windows change was traced to the operating system contract rather than read for plausibility. The crate redefines `CERT_CHAIN_ENGINE_CONFIG` and `CERT_CHAIN_PARA` locally, and in 0.7.0 must cast a pointer to its own definition when calling `CertCreateCertificateChainEngine` because the windows-sys signature no longer accepts the local type directly. The redefinition is `#[repr(C)]` and mirrors the documented layout field for field, with `dwExclusiveFlags` correctly gated behind `#[cfg(not(target_vendor = "win7"))]` because MSDN records it as added in Windows 8. `cbSize` is set through a `ZeroedWithSize` trait, and the OS uses that field to decide how much of the structure to read — which is the whole reason a caller may declare an extended version. Worth recording: the cast removes the compile-time check that previously tied the local definition to the windows-sys one, so layout agreement is now maintained by review rather than by the type system. The other change is an Android jni migration to `EnvUnowned::from_raw` and `with_env`, largely in doc examples. No change to the trust decision logic itself.'

