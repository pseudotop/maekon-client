[[audits.cookie-factory]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.3.3"
notes = """
Whole crate read; 2761 lines across the serialisation combinators, one dependency (futures, for the async writer support), and no occurrence of the unsafe token. This is the write-side counterpart to nom: combinators that append bytes to a std::io::Write or a slice cursor.

The slice-backed writer is where a serialisation library would normally reach for unsafe, and this one does not: bounds are enforced by ordinary slice indexing and the combinators propagate GenError::BufferTooSmall rather than writing past the end. A capability scan for process, socket, filesystem-write and environment access returns nothing; the crate only writes into whatever sink the caller supplies.

