[[audits.lazycell]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "1.3.0"
notes = """
Whole crate read; two files, 766 lines, 18 unsafe sites and no capability surface at all -- process, network, filesystem and environment greps return nothing, and src/serde_impl.rs contains no unsafe. Dependencies are serde and an optional clippy; the only features are nightly and nightly-testing, neither default.

LazyCell<T> wraps UnsafeCell<Option<T>> and the whole soundness argument rests on one ordering. fill(&self, value) forms &mut *self.inner.get() through a shared reference, which would alias any outstanding &T -- but it first reads the slot and returns Err(value) when it is already Some. The &mut is therefore only created while the cell is empty, and an empty cell is exactly the state in which borrow() yields None and no reference into the payload can exist. replace and borrow_mut take &mut self and are exclusive by signature.

The closure variants are the usual re-entrancy hazard and they handle it. borrow_with and try_borrow_with call borrow() first and return early on Some, so no reference is held across f(); if f() fills the cell as a side effect, the following fill() returns Err and the method panics rather than proceeding, which is the documented behaviour. The _mut_ variants do the same through filled().

AtomicLazyCell uses a three-state AtomicUsize -- NONE, LOCK, SOME. fill compare-and-swaps NONE to LOCK with Acquire, writes through the UnsafeCell, then swaps LOCK to SOME with Release; readers dereference only after an Acquire load observes SOME, so the release/acquire pair orders the write before any read and a concurrent second fill loses the first CAS. unsafe impl<T: Sync + Send> Sync matches what Arc would require. The by-value accessor is confined to impl<T: Copy>, so reading *self.inner.get() duplicates a Copy type rather than an owner. into_inner takes &mut self.

Noted, not a defect: the CAS calls use compare_and_swap, deprecated since Rust 1.50 in favour of compare_exchange. Semantics are unchanged.

Exposure measured: the crate is not in the default dependency graph. cargo tree --workspace --target all -e normal,build,dev resolves 1245 packages and lazycell is not among them; the same command with --all-features resolves 1361 and it appears, reached through bindgen 0.64.0."""

