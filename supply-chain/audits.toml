[[audits.reqwest]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.13.3 -> 0.13.4"
notes = """
Dependabot bump 0.13.3 → 0.13.4 (#6218). Diff reviewed via `cargo vet diff --mode=local`:
9 files, 240 insertions / 59 deletions, ZERO new `unsafe`, no new C/native dependencies.

Delta summary:
- redirect.rs: cross-origin sensitive-header stripping now ALSO triggers on a scheme
  change (e.g. https→http downgrade) — a security hardening, not a regression.
- async_impl/client.rs + tls.rs: opt-in SSLKEYLOGFILE support, gated behind the
  `__rustls` feature and only active when the caller installs `KeyLogFile`; plus
  `rustls-no-provider` docs/feature. Inert unless explicitly enabled by the consumer.
- async_impl/response.rs: JSON/error decode now attaches the request URL to errors.
- async_impl/h3_client/connect.rs: Happy-Eyeballs 250ms delay; `local_addr` made Option.
- blocking/client.rs: opt-in HTTP/2 keep-alive ping interval.
- Cargo.toml: MSRV 1.64.0 → 1.85.0 (workspace already requires 1.88.0); optional deps
  hickory-resolver 0.25→0.26 and native-tls 0.2.10→0.2.16, both behind non-default features.
No new RustSec advisories. License unchanged (MIT OR Apache-2.0).
"""

