[[audits.zip]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "2.4.2 -> 8.6.0"
notes = """
VD-05.7 delta audit — zip 2.4.2 -> 8.6.0 (9,043 insertions / 4,353 deletions, six major versions).

Unsafe surface. Six `unsafe impl Pod` are added; all are sound by construction.
ZipCentralEntryBlock, ZipLocalEntryBlock, ZipDataDescriptorBlock,
Zip64DataDescriptorBlock and AexEncryption are `#[repr(packed, C)]` with every
field an integer scalar, so there is no padding and every bit pattern is a valid
value. BlockWithMagic<T> is `#[repr(C, packed)]` over `magic: Magic` and
`inner: T`; `Magic` is `#[repr(transparent)] struct Magic(u32)`, and the impl is
bounded on `T: FixedSizeBlock` where `trait FixedSizeBlock: Pod`, so T is already
Pod. Zip64CentralDirectoryEnd, which holds an `Option<Box<[u8]>>`, carries no Pod
impl — checked, not assumed.

Two `unsafe` blocks change inside `Pod::as_bytes`/`as_bytes_mut`. Both are
rewrites of pre-existing code: `self as *const Self as *const u8` becomes
`std::ptr::from_ref::<Self>(self).cast::<u8>()`. Semantics are identical and the
safety argument is unchanged; the edit is lint-motivated.

Three `zeroed()` call sites use the crate's own `Pod::zeroed()`, not
`mem::zeroed::<T>()`. All-zeros is a valid value for the all-integer packed types
above.

Five items are marked `unsafe fn` — `get_mut` (three sites),
`from_msdos_unchecked`, `unsafe_new_with_metadata`. Each documents a *consistency*
contract rather than a memory-safety one (do not desynchronise the writer; the
date parts must be valid; reader and metadata must belong to the same archive).
Their bodies perform no unsound operation; the marker is conservative.

Symlink extraction. `make_symlink` writes an archive-supplied target to disk
after only a UTF-8 check — there is no containment check, and the
`existing_files` parameter is accepted but unused on the Unix path. This was
compared against 2.4.2 rather than judged in isolation: src/read.rs:455-468 of
2.4.2 performs the same UTF-8 check and the same unvalidated
`std::os::unix::fs::symlink` call. The delta refactors this into
`make_symlink`/`make_symlink_impl` helpers and does not weaken it. It is a
pre-existing property of the crate, not a regression introduced here, and
callers that extract untrusted archives must gate on `enclosed_name()`
themselves.

Reachability in this repository was measured rather than assumed. `zip` is a
direct dependency of maekon-app and maekon-storage, and the only consumer is
crates/maekon-storage/src/tmd_xlsx_writer.rs, which manipulates XLSX containers
through `by_index()` and `by_name()` — entries are read into memory and new
archives are written. There is no `.extract(` call anywhere in the workspace, so
the filesystem-extraction path, and with it `make_symlink`, is not reached.

Build script: removed. 2.4.2 declares `build = "src/build.rs"`; 8.6.0 declares
`build = false`. Build-time executed code is eliminated, which narrows the
safe-to-deploy surface.

Dependency surface changes substantially, as expected across six majors: 11
added, 9 removed, 18 version-changed. Resolved against this repository's
Cargo.lock, zip 8.6.0 enables 19 dependencies; newly entering the graph are
lzma-rust2, ppmd-rust and typed-path (replacing lzma-rs/xz2 and adding a typed
path abstraction). Those are separate crates carrying their own cargo-vet
entries and are not covered by this audit.

Remaining scanned axes found nothing in the added lines: no transmute, no
`set_len`, no `MaybeUninit`, no inline `asm!`, no `#[no_mangle]`/`#[link_name]`,
no network access, no process spawning, and no environment variable access.
"""

[[audits.zopfli]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.8.3"
notes = """
Whole crate read; 4725 lines, four unsafe sites, all in src/hash.rs, plus one File::create in the binary's main.rs. This is a manual heap allocation and it is unusually careful.

ZopfliHash holds several [u16; ZOPFLI_WINDOW_SIZE] arrays, which is far too large to build on the stack, so new() allocates with the global allocator and initialises in place. The allocation result is checked -- NonNull::new(..).unwrap_or_else(|| handle_alloc_error(LAYOUT)) -- rather than dereferenced blindly, and the layout used for alloc is Layout::new::<ZopfliHash>(), which is what Box::from_raw will later deallocate with.

init() is the interesting part. It is an unsafe fn with its contract written out, and it uses addr_of_mut! throughout specifically to avoid creating intermediate references into uninitialised memory, with a source comment explaining that doing otherwise is undefined behaviour and citing the MaybeUninit documentation. Every field is written before the pointer becomes a Box: the prev/hashval pairs in a loop, head filled with 0xFF bytes because two's complement makes that -1 for i16, hash2 copied from hash1, and same zeroed. Nothing is left uninitialised.

Worth contrasting with vswhom-sys in this same audit set, whose C++ malloc result is not checked at all. Here the failure path is explicit."""

[[audits.zstd]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.13.3"
notes = """
Whole crate read; 3541 lines, three unsafe sites and they are all in one function, NoOp::run in src/stream/raw.rs. The two capability hits are File::create in examples/, not in the library.

The three form a single bounded copy and the bound is the part that matters:
    let output_pos = output.pos();
    let dst = unsafe { output.as_mut_ptr().add(output_pos) };
    let len = usize::min(src.len(), output.capacity() - output_pos);
    let src = &src[..len];
    unsafe { copy_nonoverlapping(src.as_ptr(), dst, len) };
    unsafe { output.set_pos(output_pos + len) };
len is the minimum of the source length and the remaining output capacity, so output_pos + len never exceeds capacity and both the copy and the position update stay inside the buffer. The re-slice to &src[..len] makes the source pointer valid for exactly that many bytes, and non-overlap holds because the function has &mut to the output and & to the input. Each site carries an inline SAFETY comment stating the same argument.

Scope: this crate is the safe wrapper; the compression itself lives in zstd-safe and zstd-sys, which are separate entries."""

[[audits.zstd-safe]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "7.2.4"
notes = """
Whole crate read; 3468 lines, 159 unsafe sites, 50 percent in the top four shapes, 116 in src/lib.rs and 41 in src/seekable.rs. This is the thin safe layer over zstd-sys, so nearly every site is one C call.

Method note: unsafe sites were clustered by normalised shape before reading, so a repeated idiom is argued once with its instance count recorded and the sites that do not fit a cluster are read individually. Sites under tests/, benches/ and examples/ were counted separately and are named where the split matters.

The pattern is uniform and the safety argument is the same each time: a Rust slice or WriteBuf is decomposed into pointer and length in the same expression that calls the C function, so the two can never disagree; the returned size_t goes through the crate's error check, which tests ZSTD_isError before any length is used to advance a buffer; and the context objects (ZSTD_CCtx, ZSTD_DCtx, the seekable variants) are created and freed in matched pairs with Drop impls.

The part that carries the real weight is that output lengths come back from the C library and are then used to mark bytes initialised. Those are checked for error status before use, so a failed operation cannot advance a buffer -- but a successful call reporting a length larger than the buffer it was given would not be caught here, and this audit does not rule that out. It rests on zstd honouring the sizes it was handed, which is the same trust boundary every -sys wrapper has.

Scope: the C implementation in zstd-sys is not covered by this entry."""

[[audits.zstd-sys]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "2.0.16+zstd.1.5.7"
notes = """
AUDIT SCOPE: full crate version; all targets and features reviewed. #11509 VD-05.7a full audit — zstd-sys 2.0.16+zstd.1.5.7. License: MIT OR Apache-2.0. The zstd/ tree (95 files, 80,084 C lines) is a byte-identical, unpatched copy of facebook/zstd at submodule commit f8745da6 (v1.5.7), verified file-by-file against the upstream tarball (0 differing; the 542 upstream-only files are trimming — tests, contrib, programs; positive control fired). The C verdict transfers to upstream zstd 1.5.7. Rust surface: three pregenerated bindgen files (markers present; 8 unsafe tokens, all type-position callback declarations) plus src/wasm_shim.rs — the only hand-written unsafe (8 sites), compiled only under cfg(target_arch = "wasm32") and read in full: a header-stored-size malloc/calloc/free and qsort/memcmp/memcpy/memmove/memset forwards under C caller contracts. Two recorded defects, neither blocking: the shim allocator does not null-check before writing its size header (an OOM-path write through null on wasm), and shim free lacks a free(NULL) guard — but every zstd-internal call routes through ZSTD_customFree, which checks ptr!=NULL before dispatching (verified in lib/common/allocations.h), and the shim is not compiled on any shipped target. calloc's nmemb*size multiply is unchecked (same OOM class). build.rs (301 lines): cc over the vendored tree, pkg-config probing, optional bindgen; no process/network/out-of-package access. Reached via zstd-safe -> zstd.
"""

[[audits.zune-core]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.5.1"
notes = """
Whole crate read; 2889 lines, no occurrence of the unsafe token and no capability call. Two dependencies, log and serde, both optional-feature shaped. The crate is the shared vocabulary for the zune image codecs -- colourspace and bit-depth enums, decoder options with their limits, and a byte reader over a caller-supplied slice.

The decoder-limit types are worth naming because they are the part that matters to a consumer: DecoderOptions in src/options/decoder.rs carries max_width and max_height, which the codecs enforce, and no per-component cap was found so none is claimed. That is how a decompression-bomb guard is expressed in this family.

Method note shared by this batch: the zero was not taken from one grep. Every line carrying the unsafe token, comments excluded, was listed and read, and the same detector was run against dlopen2 0.8.2 and simdutf8 0.1.5 from the same band as a positive control, where it reports 252 and 145 executable sites. A zero here is a measured zero.

Exposure: reached through image 0.25.10 and zune-jpeg, which arrive here via libwayshot-xcap and the screen-capture path."""

[[audits.zune-jpeg]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.5.15"
notes = """
VD-05.7 full audit — zune-jpeg 0.5.15 (9,737 lines of runtime .rs).

A decoder for attacker-supplied input, so bounds were the whole audit.

No build script. No C, C++, or Objective-C. Powerful imports: zero on every axis.

Eighty-eight unsafe sites, all SIMD (avx2, sse, neon) across idct, upsampler, and
color_convert. Two questions decide them: may these functions run at all, and can
they write outside their buffers.

**May they run.** Every `#[target_feature]` function is reached through a
dispatcher that consults `options.use_avx2()` / `use_neon()`
(upsampler.rs:95-160, color_convert.rs:64-80), whose SAFETY comments claim those
return true only when the feature is present. The claim was followed into
zune-core 0.5.1 rather than taken at face value: `use_avx2`
(options/decoder.rs:570-594) first requires the user flag, then on x86/x86_64
with `std` returns true only if `is_x86_feature_detected!("avx2")`, and without
`std` only if `target_feature = "avx2"` was set at compile time; every other path
falls through to `false`. `use_neon` has the same shape. The claim holds.

**Can they write out of bounds.** The defensive pattern is not uniform across the
SIMD files, so each family was checked rather than generalised from one.
  - upsampler/{avx2,neon}.rs — the strongest. Entry runs
    `assert_eq!(input.len() * 2, output.len())` and `assert!(input.len() > 2)`,
    falls back to the scalar path below 18 samples, and then drives the intrinsics
    through a closure taking `&[i16; 18]` / `&mut [i16; 32]`, so lengths are a
    type guarantee. The loop feeding it is entirely safe API:
    `input.windows(18).step_by(16).zip(output[2..].chunks_exact_mut(32))` with
    `try_into().unwrap()`, and the tail uses `last_chunk::<18>()` /
    `last_chunk_mut::<32>()`. Loads at offsets 0,1,2 of 16 lanes touch index 17 at
    most, inside 18.
  - idct/avx2.rs — no entry asserts, but the input is `&mut [i32; 64]`, so the
    eight loads at offsets 0,8,…,56 of 8 lanes reach index 63 at most. Output
    stores go through `out.get_mut(idx..idx + 8)`, bounds-checked; the first uses
    `.unwrap_or(&mut tmp)` and silently discards into a local scratch, the second
    `.unwrap()` and panics. Inconsistent, but neither writes out of bounds.
  - color_convert/avx.rs — the one place the obligation is implicit.
    `ycbcr_to_rgb_avx2_1` writes 48 bytes into `out: &mut [u8]` (32 at the base,
    16 at `out[32..]`) with no length check, and the wrapper
    `ycbcr_to_rgb_avx2` (:86) is a **safe** `fn`. `out[32..]` panics below 32, but
    a length of 32..47 would slip through and `_mm_storeu_si128` would write past
    the end. It is sound as shipped because the module is private
    (`mod color_convert;` at lib.rs:176, not `pub mod`) and every call site
    supplies enough: worker.rs:340 passes
    `out.chunks_exact_mut(16 * num_components)`, exactly 48 bytes for RGB, and
    worker.rs:326/:358 pass `temp`, a local `[0; 64]` (worker.rs:302). The RGBA
    variant checks for itself with
    `out.get_mut(*offset..*offset + 64).expect(..).try_into().unwrap()`.
    Recorded as an upstream report: a safe `fn` with an unstated 48-byte
    requirement, no `# Safety` note and no debug assert, so a future internal
    caller with a shorter slice gets out-of-bounds writes and no diagnostic.

The two `core::mem::transmute` calls in unsafe_utils_neon.rs:291,315 are inside
`#[cfg(test)] mod tests` (:271) and are not in any shipped build. Noting the
method, because a path-based test filter misses inline `#[cfg(test)]` modules and
would have promoted these to runtime findings: files were re-scanned by truncating
at the first `#[cfg(test)]`. With that correction, the runtime path contains no
`get_unchecked`, `from_raw_parts`, `set_len`, `assume_init`, or `transmute` at all."""

