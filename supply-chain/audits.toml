   caps its argument with `cmp::min(bits, 12)`, matching the width of the `rand_a` field,
   so an out-of-range request cannot widen the timestamp field beyond the v7 layout. A
   `#[test]` covers the 10-bit case, equivalence of `with_additional_precision()` and
   `with_additional_precision_bits(12)`, the cap at values above 12, and that 0 disables
   the feature.

Behaviour on existing call sites is unchanged: `with_additional_precision()` still yields
12 bits, and the test asserts that equivalence directly.

No `unsafe`, no new dependency, no build script, no process/network/filesystem surface, no
API removal, no change to random-number sourcing or to the UUID layout itself."""

