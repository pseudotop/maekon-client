[[audits.audioadapter]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "5.0.0"
notes = """
VD-05.7 full audit — audioadapter 5.0.0 (4 files, 1,896 lines of src).

Audited to unblock dependabot #11345. This crate defines the contract that
audioadapter-buffers implements and rubato consumes, so the reasoning here
carries to those two.

The design is the right one and worth stating explicitly, because this family
previously got it wrong in the other direction: `pub unsafe trait Adapter<T>` is
declared unsafe precisely so that the obligation lands on implementors, who must
write `unsafe impl` to take it. Its documented requirement is that `frames()` and
`channels()` report correct values and do not change spontaneously — "for example
due to some internal logic or because of some action in another thread".
`unsafe fn read_sample_unchecked(channel, frame)` then requires
`channel < channels()` and `frame < frames()`, and the safe wrapper
`read_sample` performs exactly that check before delegating. Contrast the 3.0.0
audioadapter-sample finding, where an obligation of the same kind sat on a *safe*
unsealed trait and could therefore be violated without anyone writing unsafe.

Unsafe: 25 occurrences, all calls to `read_sample_unchecked` (or its mut
counterpart) from inside this crate's own safe helpers. The non-obvious ones are
the iterators, which cache bounds rather than re-reading them, and they were
traced: `ChannelSamples::new` returns `None` unless `channel < buffer.channels()`
and captures `nbr_frames = buffer.frames()`; `next()` returns `None` unless
`self.frame < self.nbr_frames` and only then performs the unchecked read,
incrementing afterwards. `FrameSamples::new` guards `frame >= buffer.frames()`
the same way. Caching is sound exactly because the trait's unsafe contract
forbids the bounds from moving underneath it — the cache is the reason the trait
is unsafe rather than an oversight.

Powerful imports: zero on every axis — filesystem, network, process spawning,
environment access, `extern "C"`, `#[link]`, `#[no_mangle]`, libc, dynamic
loading. No build script.
"""

[[audits.audioadapter-buffers]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "3.0.0"
notes = """
Whole crate read; 4046 lines, 125 unsafe sites over 44 shapes, 69 of them in src/direct.rs. No capability surface.

Method note: unsafe sites were clustered by normalised shape, then the sites using a sharp construct -- transmute, set_len, from_raw, assume_init, get_unchecked and relatives -- were pulled out and read individually rather than left inside a cluster.

The crate is the concrete buffer implementations behind the audioadapter traits, so 33 of the sites are the trait methods themselves -- 22 read_sample_unchecked and 11 write_sample_unchecked -- whose unsafety is the bounds obligation the trait declares, and 16 are the accessor bodies that discharge it as `self.buf.get_unchecked(channel).get_unchecked(frame)`.

That pairing is the whole audit. The unchecked accessors are only reachable through the unsafe trait methods, and the safe read_sample / write_sample wrappers in the sibling audioadapter crate perform the channel and frame comparisons before delegating -- that was verified in this same audit set. The internal callers that use the unchecked form iterate over ranges derived from the same channels and frames values the buffer was constructed with.

Family context worth linking: audioadapter-sample, audited in this set, has a separate gap where mem::zeroed is called on a safe unsealed trait's parameter. Nothing in this crate widens it -- audioadapter-buffers implements no additional BytesSample."""

[[audits.audioadapter-buffers]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "5.2.0"
notes = """
VD-05.7 full audit — audioadapter-buffers 5.2.0 (8 files, 4,574 lines of src).

Audited to unblock dependabot #11345. This crate is the implementor side of the
`unsafe trait Adapter` contract defined in audioadapter 5.0.0, audited alongside
it; read that entry first, because the obligation this crate takes on is stated
there.

Unsafe: 127 occurrences, and they are two shapes rather than 127 arguments.
`unsafe impl<..> Adapter<T> for <buffer type>` takes on the trait's obligation,
and `unsafe fn read_sample_unchecked(&self, channel, frame)` supplies the
unchecked accessor for each concrete buffer layout (interleaved, sequential,
byte-backed, converting wrappers, and their mut counterparts). The macro
expansion across sample types is why the raw count is high.

The obligation is "report correct, stable `channels()` and `frames()`", and it is
discharged at construction rather than trusted. The size getters resolve two
ways, both honest: wrapper types delegate to the buffer they wrap
(`adapter_to_float.rs:45` returns `self.buf.channels()`), and owning types return
stored fields set once in the constructor. Those constructors are fallible for
exactly this reason — they return `Result<Self, SizeError>` and call
`check_slice_length!(channels, frames, buf.len())` before building, with
`SizeError` carrying dedicated `ChannelBuffer { actual, required }`,
`FrameBuffer`, `Total` and `Mask` variants. A buffer whose backing storage is too
short for the declared dimensions cannot be constructed, so the stored bounds
cannot over-report, and being plain fields they cannot drift afterwards.

Powerful imports: zero on every axis — filesystem, network, process spawning,
environment access, `extern "C"`, `#[link]`, `#[no_mangle]`, libc, dynamic
loading. No build script.
"""

[[audits.audioadapter-sample]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "3.0.0"
notes = """
Whole crate read; 1881 lines, two unsafe items, no capability surface. One is an `unsafe impl Sample for $newtype` inside a macro that expands over the crate's own 24-bit sample newtypes, each a wrapper over a byte array. The other is a finding.

The finding. src/readwrite.rs holds
    fn read_sample<T: BytesSample>(&mut self) -> io::Result<T> {
        let mut sample: T = unsafe { std::mem::zeroed() };
        self.read_exact(sample.as_mut_slice())?;
which calls mem::zeroed on a generic parameter. That is sound only if every T that can reach it has a valid all-zeros representation, and nothing in the crate establishes that. BytesSample is declared `pub trait BytesSample` -- a safe trait, not an unsafe one -- it is not sealed, and its documentation states no requirement about zero being a legal bit pattern. A downstream crate can therefore implement it for a type containing a NonZero, a reference or an enum without a zero discriminant using only safe code, and read_sample on that type is immediate undefined behaviour. This audit does not rule that out; the gap is in the trait's design.

The contrast is worth recording because the sibling crate gets it right: audio-core declares `pub unsafe trait Sample: Copy` and spells out "Implementor must make sure that a bit-pattern of all-zeros is a legal bit-pattern". Making BytesSample unsafe, or sealing it, would close this.

What bounds it here, measured: the only implementations in the graph are the crate's own I24_*/U24_* newtypes over byte arrays, all valid at zero, and a grep across this workspace's crates finds no `impl BytesSample` of our own. Exposure is audioadapter-buffers into rubato into maekon-audio."""

[[audits.audioadapter-sample]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "5.2.0"
notes = """
VD-05.7 full audit — audioadapter-sample 5.2.0 (3 files, 2,291 lines of src).

Audited to unblock dependabot #11345. It also closes a finding this repository
raised against 3.0.0, so that is worth recording rather than quietly dropping.

**The 3.0.0 finding is fixed upstream.** The entry for 3.0.0 in this file records
that `src/readwrite.rs` called `let mut sample: T = unsafe { std::mem::zeroed() }`
where `T: BytesSample` — a public, unsealed, *safe* trait with no documented
all-zeros requirement, so any downstream implementor could make that call unsound
without writing unsafe themselves. 5.2.0 replaces it with exactly the fix that
finding called for:

    // Using `T::zero()` rather than `mem::zeroed` keeps this sound
    // for any `T`, since `zero` is a safe, implementor-provided constructor.
    let mut sample = T::zero();
    self.read_exact(sample.as_mut_slice())?;

The obligation now sits with the implementor's own `zero()`, which is safe code,
rather than with a blanket assumption the trait never stated.

Unsafe: **none at all**. 3.0.0 carried two unsafe items — the `mem::zeroed` above
and an `unsafe impl Sample for $newtype` macro over the crate's 24-bit sample
wrappers. Neither survives: a scan of all three files finds zero occurrences of
the token.

Powerful imports: zero on every axis — filesystem, network, process spawning,
environment access, `extern "C"`, `#[link]`, `#[no_mangle]`, libc, dynamic
loading. No build script.

safe-to-deploy is met, and more cleanly than at 3.0.0.
"""

