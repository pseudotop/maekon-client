[[audits.if-addrs]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.15.0"
notes = """
Whole crate read; 1638 lines, 35 unsafe sites split across src/windows.rs (19), src/posix_not_apple.rs, src/posix.rs and src/sockaddr.rs.

Method note: this crate's unsafe sites were clustered by normalised shape before reading, so that a repeated idiom is argued once with its instance count recorded rather than restated per line, and the sites that do not fit a cluster are read individually. The counts below come from that pass.

The posix side walks the getifaddrs linked list: CStr::from_ptr on ifa_name, if_nametoindex on the same pointer, and a cast of ifa_addr to the sockaddr variant the family field selects. Each dereference is guarded by a null check on the pointer the kernel filled, and the family is read before the cast rather than assumed, which is the part that matters -- reading a sockaddr_in6 out of a sockaddr_in would over-read. The list is freed with freeifaddrs through a guard type, so an early return does not leak it.

The Windows side calls GetAdaptersAddresses twice, once to size the buffer and once to fill it, checking ERROR_BUFFER_OVERFLOW between the two, and then walks the returned linked list through `_head: unsafe { &*self.0 }` style accessors. The buffer is a Vec the crate owns for the duration of the walk.

Scope: the sockaddr casts rest on the kernel setting sa_family consistently with the storage it wrote. That is the platform contract and this audit does not go behind it.

Exposure: network interface enumeration, reached through the workspace's own networking path."""

