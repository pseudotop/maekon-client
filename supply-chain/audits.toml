[[audits.simd-adler32]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.3.7 -> 0.3.9"
notes = """This release activates a code path rather than only editing one, so the newly reachable code was read in full rather than judged from the diff. In 0.3.7 src/imp/neon.rs existed but was never declared in src/imp/mod.rs, so it was dead; 0.3.9 adds `pub mod neon;` and chains `.or_else(neon::get_imp)`, making the NEON implementation live on aarch64, which is a shipping target here. The file is also rewritten: the old nightly-and-std runtime feature detection (`is_aarch64_feature_detected`) is replaced by compile-time `#[cfg(target_feature = "neon")]`, which is why the unsafe count drops from eight to one. That single unsafe block was checked for memory safety: the only loads are `vld1q_u8(block_ptr)` and `vld1q_u8(block_ptr.add(16))` over blocks produced by `chunks_exact(32)`, so exactly 32 bytes are read from a 32-byte block, and `vld1_u16` reads four u16 from fixed `[u16; 4]` stack arrays; every other intrinsic is register-to-register. `reduce_add_blocks` returns early when the input is shorter than one block. The algorithm is a cited port of Chromium zlib's adler32_simd.c and the crate's tests compare it against a reference adler32 for zeros, ones, random data and the Wikipedia vector. Correctness was assessed from that test design, not by executing the suite."""

[[audits.simd_cesu8]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "1.1.1"
notes = """
Whole crate read; 1710 lines, 31 unsafe sites over 20 shapes, no capability surface. The crate converts between UTF-8 and CESU-8/Modified UTF-8, and its unsafe is entirely the unchecked-optimisation family.

Method note: the unsafe sites were clustered by normalised shape before reading, so a repeated idiom is argued once with its instance count recorded and the sites that do not fit a cluster are read individually.

The clusters are get_unchecked on a byte slice (six sites), unwrap_unchecked on an Option the surrounding code has already proven Some (four), unchecked_add on an index (two), and hint::unreachable_unchecked on match arms the encoding rules exclude (two), with the remainder in the SIMD and word-at-a-time backends. Every one of them trades a bounds or discriminant check for a proof obligation carried in the surrounding control flow.

Recorded plainly as the shape of the risk rather than as a defect: this is a crate whose soundness rests on the invariants of a hand-written scanner over attacker-supplied bytes, with the checks deliberately removed. The reasoning was followed for each cluster and the index arithmetic stays within the slice lengths the callers establish, but a single off-by-one in that scanner would be an out-of-bounds read rather than a panic, and no runtime check would surface it. A consumer decoding untrusted input through this crate is relying on that scanner being right."""

[[audits.simdutf8]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.1.5"
notes = """
Whole crate read; 3130 lines, 133 unsafe sites in shipped code plus 12 in tests, and seven asm/arch sites. The crate validates UTF-8 with vector instructions, so every site is either an intrinsic call or an index operation with its bounds check removed.

Method note: for a SIMD crate the soundness question is not the count of unsafe blocks but whether an intrinsic can ever run on a CPU lacking its feature, which is undefined behaviour. That was checked directly rather than assumed: the #[target_feature(enable = ..)] attributes, the runtime detection macros, and the dispatch sites that connect them were each located in the source.

The gating checks out and the dispatch is real code rather than documentation. Thirty-eight #[target_feature(enable = ..)] attributes mark the avx2, sse4.2, neon and simd128 kernels; src/implementation/x86/mod.rs holds the actual selection at lines 41, 43 and 137 with `std::is_x86_feature_detected!("avx2")` and its sse4.2 fallback; and the wasm path is compile-time gated with `#[cfg(target_feature = "simd128")]` because wasm has no runtime detection. An earlier pass found is_x86_feature_detected! only in examples/ and doc comments, which would have been the wrong conclusion -- the src/ dispatch was confirmed separately.

Recorded as the shape of the residual risk rather than as a defect, the same way this audit set recorded simd_cesu8: outside the gating, the crate's soundness rests on a hand-written validator over attacker-supplied bytes with its bounds checks deliberately removed. The index arithmetic in each kernel stays within the chunk lengths the caller establishes, and that reasoning was followed -- but an off-by-one in that validator would be an out-of-bounds read rather than a panic, and no runtime check would surface it. A consumer validating untrusted input through this crate is relying on that."""

