[[audits.schannel]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.1.29"
notes = """
Whole crate read; 4851 lines, 94 unsafe sites, 64 percent in the top four shapes, spread over the certificate context, store and chain modules. Windows only.

Method note: unsafe sites were clustered by normalised shape before reading, so a repeated idiom is argued once with its instance count recorded and the sites that do not fit a cluster are read individually. Sites under tests/, benches/ and examples/ were counted separately and are named where the split matters.

The dominant cluster is the Windows CryptoAPI call: hand a handle and a sized buffer to CertGetCertificateContextProperty, CertFindCertificateInStore, CertGetCertificateChain and their siblings, check the BOOL or the returned pointer against null, and convert. Buffers are Vec or fixed arrays the crate owns and their sizes are passed as the paired DWORD, in the two-call size-then-fill pattern the API requires. Every acquired handle has a Drop that issues the matching CertFreeCertificateContext, CertCloseStore or CertFreeCertificateChain.

The scope note is the Send and Sync assertions. CertStore, CertChainContext and CtlContext each carry `unsafe impl Send` and `unsafe impl Sync`, which are claims about the threading contract of the underlying CryptoAPI objects rather than about this crate's code. Microsoft documents concurrent use of certificate stores as permitted for reads, but this audit cannot independently verify the Sync half for every operation the wrappers expose, and it does not.

Exposure: the Windows TLS path under the HTTP stack."""

