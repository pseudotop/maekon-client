[[audits.bs58]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.5.0"
notes = """
Whole crate read; 2100 lines. The crate declares #![deny(unsafe_code)] at the top and takes exactly one #[allow(unsafe_code)] escape, which is the only unsafe in the crate: String::as_bytes_mut inside the encode-into-String path.

That call obliges the caller to restore UTF-8 validity before the borrow ends, and the crate discharges it with a Drop guard rather than a trailing fix-up. Guard::drop walks the buffer with core::str::from_utf8, and for each error region zeroes exactly error_len() bytes -- or the whole tail when error_len() is None -- then continues from that point, returning only once the remainder validates. Because the work is in Drop it also runs while unwinding, so a panic inside the user closure still leaves a well-formed String rather than one that violates its own invariant.

A capability scan for process, socket, filesystem and environment access returns nothing; the crate transforms bytes to base58 and back."""

