[[audits.system-configuration]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.7.0"
notes = """
Whole crate read; 1469 lines, 52 unsafe sites concentrated in network_reachability.rs, network_configuration.rs and dynamic_store.rs.

Method note: this crate's unsafe sites were clustered by normalised shape before reading, so that a repeated idiom is argued once with its instance count recorded rather than restated per line, and the sites that do not fit a cluster are read individually. The counts below come from that pass.

The dominant cluster is Core Foundation ownership: wrap_under_get_rule and wrap_under_create_rule around the SCNetworkReachability, SCNetworkConfiguration and SCDynamicStore entry points. Those two are not interchangeable -- get-rule retains a borrowed reference while create-rule adopts one the callee already owns -- and picking the wrong one is either a leak or an over-release. Each site was checked against the Apple naming convention that governs it: the functions whose names contain Copy or Create are wrapped with create-rule, and the Get accessors with get-rule. The remaining sites are the extern statics for the kSCPropNet* / kSCDynamicStoreProp* keys, which are borrowed constants and correctly taken under get-rule.

The finding. That check does not come out clean. In SCDynamicStoreBuilder::create_store_options, dynamic_store.rs holds
    let key = unsafe { CFString::wrap_under_create_rule(kSCDynamicStoreUseSessionKeys) };
kSCDynamicStoreUseSessionKeys is not an object this code created. It is declared in the -sys crate as `pub static kSCDynamicStoreUseSessionKeys: CFStringRef;` inside an extern block -- a framework constant the process never retained. create-rule adopts the reference, so the resulting CFString releases it on drop, and every call to create_store_options therefore releases a constant one more time than it retained it. The correct wrapper for a borrowed constant is get-rule, which is what the same file uses for the other kSC* keys. Framework string constants are usually immortal in practice, which is why this has not shown up as a crash, but it is an over-release and this audit does not paper over it.

The line after it is fine and worth distinguishing so the finding is not read more broadly than it is: the function ends with wrap_under_get_rule over a dictionary it just built, which retains, and the owning typed_dict then drops, releasing once -- net balanced.

Scope, stated rather than implied: the remaining sites were judged against the documented Core Foundation naming rule rather than a per-function reading of Apple's headers. A framework function that departs from its own convention would be mis-wrapped here and this audit does not rule that out.

Exposure: reached through hyper-util. macOS only."""

