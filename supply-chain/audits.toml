[[audits.argon2]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.6.0"
notes = """
#11848 exact-version full-source audit for PR #11840. License: MIT OR Apache-2.0;
Rust 2024, MSRV 1.85, and no build script. Reviewed every Rust source file plus
the crate feature graph (default alloc/getrandom/password-hash; optional kdf,
parallel, rand_core, and zeroize). No process, filesystem, network, shell, FFI,
or build-time execution capability was found.
AUDIT SCOPE: full crate version; all targets and features reviewed.

The unsafe surface is confined to three reviewed clusters. The custom zeroed
Block allocator validates a non-zero array Layout, checks allocation failure,
builds a slice with the same pointer/length, and deallocates exactly that Layout
once. The parallel memory view holds a bounded non-null Block slice; Params
enforces p_cost >= 1 and memory >= 8*p_cost, the outer pass/slice loops are
serial synchronization boundaries, one view is created per lane, and runtime
guards reject same-slice cross-lane reads and all out-of-segment writes. The AVX2
compression call remains guarded by runtime cpufeatures detection. These
invariants cover the unsafe Send/Sync and raw-pointer dereferences; no unguarded
pointer escape was found.

Exact crate tests passed on Windows for --all-features --all-targets: 6 unit,
25 KAT, and 15 PHC tests (14 upstream ignored reference/oversize cases), with
zero failures. --no-default-features also compiled and ran its zero-test targets.
The KAT set covers Argon2d/i/id, versions 0x10/0x13, parallel lanes, wrong
password, and different salt. Scope is memory safety, capability safety, PHC
compatibility, and bundled algorithm vectors for this version; it is not an
independent cryptographic proof.
"""

