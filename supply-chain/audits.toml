[[audits.winreg]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.55.0"
notes = """
Whole crate read; 3791 lines, 37 unsafe sites over fourteen shapes, no capability call outside the registry API itself. Windows only.

Method note: the unsafe sites were clustered by normalised shape before reading, so a repeated idiom is argued once with its instance count recorded and the sites that do not fit a cluster are read individually.

The dominant shape -- thirteen sites -- is `match unsafe { RegSomethingW(..) }` with the status code matched rather than discarded, and the buffer arguments are Vec or CString the crate owns with their lengths passed alongside. That part is unremarkable and correct.

The finding is the other shape. Two sites transmute an API-supplied integer straight into an enum: `transmute(buf_type as u8)` into RegType and `transmute(disp_buf as u8)` into RegDisposition. The enums come from a local winapi_enum! macro that emits a bare `pub enum` with **no #[repr] attribute**, so the discriminant width the `as u8` cast assumes is not language-guaranteed to begin with.

The two sites are then treated differently, and that asymmetry is the point. Before the RegType transmute the crate writes `if buf_type > Registry::REG_QWORD { return werr!(ERROR_BAD_FILE_TYPE); }` with the comment "minimal check before transmute to RegType" -- and that check is in fact sufficient, because the enum lists all twelve values from REG_NONE(0) to REG_QWORD(11) contiguously and buf_type is unsigned. Before the RegDisposition transmute there is no check at all. That enum has exactly two variants, REG_CREATED_NEW_KEY(1) and REG_OPENED_EXISTING_KEY(2), so **zero is not a valid discriminant** -- and disp_buf is declared `let mut disp_buf: u32 = 0;` and handed to RegCreateKeyExW as an out-parameter. If that call ever returned ERROR_SUCCESS without writing the disposition, the transmute would materialise an invalid enum value. Windows documents that it does write it, so this requires an API contract violation rather than ordinary input -- but the author guarded the sibling transmute against exactly this class and left this one open, and this audit does not rule it out.

Exposure: Windows registry access."""

