[[audits.constant_time_eq]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.3.1 -> 0.4.2"
notes = """A substantial hardening of the crate's whole reason for existing, so the new machinery was read rather than skimmed. The implementation splits into generic, sse2, neon, dit and classic modules. The nineteen new `asm!` blocks are all the same `optimizer_hide` idiom: an empty template such as `"/* {0} */"` with the value passed `inout(reg)`, so no instruction is emitted while a data dependency the optimiser cannot see through is created. The options are accurate for that — `pure, nomem, nostack, preserves_flags` — and non-asm targets and miri fall back to a `black_box`-based version. The genuinely new capability is dit.rs, which enables ARM's FEAT_DIT (data-independent timing) and FEAT_SB on aarch64, which matters because it moves the guarantee from compiler barriers to hardware. Its unsafe was checked: detection is cached in an `AtomicU8` where zero means undetected, and the `transmute::<u8, Features>` is sound because the only writer stores `features as u8` from the enum itself and the zero case is excluded before the transmute; the `#[target_feature(enable = "dit,sb")]` functions are called under unsafe only in the branch where detection reported those features; and the manual override is a `pub unsafe fn` documented as requiring a call before other threads exist. Note that classic.rs is explicitly retained for benchmarking only and its own docs say its optimiser protection is weaker. Scope recorded: memory safety and the gating were verified, but the algorithmic equivalence of the SIMD comparison paths was taken from the crate's own test suite rather than re-derived."""

