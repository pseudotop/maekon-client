[[audits.r-efi]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "5.3.0"
notes = """
VD-05.7 full audit — r-efi 5.3.0 (55 files, 8,804 lines of src).

UEFI type and ABI definitions. Powerful imports: none — filesystem, network,
process spawning, environment access, `#[link]`, `#[no_mangle]`, libc and dynamic
loading all returned zero across every file. No build script.

Unsafe: the raw token appears 10 times, but only **two** are unsafe code that
ships. The rest are one doc comment, macro arms in `eficall!` that match the
`unsafe` token while rewriting a signature, and one occurrence inside `mod tests`.
Both shipped blocks are in `src/base.rs` and both are `Guid` layout casts:

  - `:752` `transmute::<[u8; 16], Guid>(*bytes)`
  - `:760` `transmute::<&Guid, &[u8; 16]>(self)`

`Guid` is `#[repr(C, align(4))]` over `time_low: [u8; 4]`, `time_mid: [u8; 2]`,
`time_hi_and_version: [u8; 2]`, `clk_seq_hi_res: u8`, `clk_seq_low: u8`,
`node: [u8; 6]`. Every field is u8-based and therefore align 1, so under repr(C)
they lay out contiguously at offsets 0, 4, 6, 8, 9, 10 for a total of exactly 16
bytes with no interior padding; 16 is a multiple of the declared alignment of 4,
so there is no trailing padding either. Size matches `[u8; 16]` and every bit
pattern is a valid `Guid`, so the first transmute is sound. The second goes from
`&Guid` (align 4) to `&[u8; 16]` (align 1) — same size, weaker alignment
requirement — and is likewise sound.

The one test-only transmute, `:907` `transmute::<u8, Boolean>(i)`, is inside
`mod tests` (which begins at :765) and is itself a positive control: the test
iterates all 256 u8 values and asserts the transmute agrees with the `From` impl.
`Boolean` is `#[repr(C)] pub struct Boolean(u8)`, so all 256 are valid.

Reachability in this repository, measured rather than assumed: the only crate
depending on r-efi is `getrandom`, and it does so as
`[target.'cfg(all(target_os = "uefi", getrandom_backend = "efi_rng"))'.dependencies.r-efi]`
— gated on both a UEFI target and an opt-in backend cfg. This tree builds for
macOS, Windows and Linux desktop, so the crate does not enter compilation at all.
Nothing in the workspace references `r_efi` directly.
"""

