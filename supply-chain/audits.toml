[[audits.jsonwebtoken]]
who = "supply-chain-compliance-owner <richard.kim0828@gmail.com>"
criteria = "safe-to-deploy"
version = "10.3.0"
notes = """
JWT encoding/decoding library used as the auth-gate token validation crate
in oneshim (D13-v2c, features = ["aws_lc_rs"]).

Source review scope:
- Algorithm enforcement: jsonwebtoken 10.x requires explicit Algorithm enum
  in DecodingKey/Validation — no algorithm confusion attacks. The `alg`
  field in the header is cross-checked against the Validation struct; passing
  `Algorithm::HS256` as a decoding algorithm when the token uses RS256 will
  result in a rejection, not a bypass. Reviewed src/decoding.rs and
  src/validation.rs. The `aws_lc_rs` feature replaces the `ring` backend with
  aws-lc-rs for the RSA/ECDSA operations — functionally equivalent in terms of
  algorithm correctness.

- Token signing/verification: src/encoding.rs signs via the selected
  Algorithm; src/decoding.rs verifies. Both paths go through the crypto backend
  (aws-lc-rs when the feature is enabled). No custom crypto; delegates entirely
  to the backend for actual cryptographic operations.

- aws_lc_rs feature: pulls in `aws-lc-rs` (audited separately as
  aws-lc-rs:1.16.2 — see burn-rate exemption). The aws-lc-rs crate is the
  AWS-maintained Rust wrapper around the aws-lc C library (fork of BoringSSL).
  Builds reviewed: aws-lc-sys build.rs runs cmake — this is expected behavior
  for C-library wrappers. The cmake build is reproducible.

- Side-channel resistance: jsonwebtoken delegates all constant-time comparison
  to the backend library. The aws-lc-rs backend uses the same constant-time
  primitives as BoringSSL (CRYPTO_memcmp). No timing-observable branches in
  the Rust wrapper code itself.

- No active RustSec advisories for jsonwebtoken 10.3.0 as of 2026-05-23.
  RUSTSEC-2021-0058 (algorithm confusion in jsonwebtoken <8.x) does not apply
  to 10.x which has mandatory explicit algorithm specification.

License: MIT. Commercially usable.
"""

