Method note shared by this batch: the absence of executable unsafe was not taken from a single grep. Every line containing the token, comments excluded, was listed and read, and the same detector was run against uds_windows 1.2.1 and javascriptcore6 0.6.0 as a positive control, where it reports 59 and 116 hits. A zero here is therefore a measured zero rather than a failed search.

