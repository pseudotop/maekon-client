[[audits.twox-hash]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "2.1.2"
notes = """
Whole crate read; 4749 lines, 70 unsafe sites and two inline-assembly blocks. No capability surface -- it hashes bytes.

Method note: for a SIMD crate the soundness question is not the count of unsafe blocks but whether an intrinsic can ever run on a CPU lacking its feature, which is undefined behaviour. That was checked directly rather than assumed: the #[target_feature(enable = ..)] attributes, the runtime detection macros, and the dispatch sites that connect them were each located in the source.

The gating is present and complete. Ten #[target_feature(enable = "avx2")] and neon attributes mark the vector kernels, four `pub unsafe fn new_unchecked()` constructors carry the "caller has verified the feature" obligation in their signature, and src/xxhash3/large.rs is the single dispatch point where `std::arch::is_aarch64_feature_detected!("neon")` and `is_x86_feature_detected!("avx2")` decide which one is constructed. The unchecked constructors are the only way in, and they are unsafe.

Both asm! blocks were read and neither is a hazard.

The first, in neon.rs, emits no machine code at all: its template is the assembly comment `/* {r:v} */` with `r = in(vreg) r` and `options(nomem, nostack)`. It exists only to make the compiler treat the value as used at that point and so refuse to reorder around it -- the same barrier trick the upstream xxHash source uses, whose line range is cited above the function. It is #[target_feature(enable = "neon")] and unsafe fn with the CPU-feature obligation stated.

The second, in scalar.rs, is one AArch64 instruction: `umaddl {res}, {lhs:w}, {rhs:w}, {acc}`. The {:w} modifiers select the 32-bit W registers for the multiply operands while the accumulator and result stay 64-bit, which is exactly umaddl's operand shape, and `options(pure, nomem, nostack)` is correct for a pure arithmetic instruction. umaddl is base AArch64 rather than a gated extension, so the enclosing fn needs no target_feature and is correctly a safe fn. It carries `#[cfg(all(not(miri), target_arch = "aarch64"))]`, so Miri -- which cannot execute inline asm -- takes a portable path instead; that is a deliberate testability choice and worth naming."""

