[[audits.ulid]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "1.2.1 -> 3.0.0"
notes = 'Major bump, but the base32 codec is the whole of the risk and it was checked. `encode` stops using `String::from_utf8(..).expect(..)` and now calls `String::from_utf8_unchecked`, which is a checked conversion becoming an unchecked one, so the invariant was verified rather than taken from the comment: `ALPHABET` is declared `&[u8; 32] = b"0123456789ABCDEFGHJKMNPQRSTVWXYZ"`, every byte of it is ASCII, `encode_to_array` writes all `ULID_LEN` positions, and each write is `ALPHABET[(value & 0x1f) as usize]` where the mask bounds the index to 0..31 with checked indexing. So the buffer is entirely ASCII by construction and the unchecked conversion is sound. Offsetting it, the deprecated `to_str` is deleted and with it a `from_utf8_unchecked_mut`, and `encode_to_array`/`array_to_str` become `const fn` with the `for` loop rewritten as an index `while`. The deprecated fallible `encode_to` is removed and `Ulid::new` is renamed to `Ulid::generate`, which is the source of the major bump.'

