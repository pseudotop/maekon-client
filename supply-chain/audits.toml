[[audits.swift-rs]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "1.0.7"
notes = """
Whole crate read; 1247 lines, 24 unsafe sites, of which six are in tests/test_bindings.rs. The crate bridges Rust and Swift, so the unsafe is Objective-C runtime memory management.

Method note: this crate's unsafe sites were clustered by normalised shape before reading, so that a repeated idiom is argued once with its instance count recorded rather than restated per line, and the sites that do not fit a cluster are read individually. The counts below come from that pass.

The core is a retain/release pair -- `unsafe fn retain(&self)` and its release counterpart -- around Swift objects that are reference-counted by the Objective-C runtime, plus objc_autoreleasePoolPush and objc_autoreleasePoolPop bracketing calls that may autorelease. The push/pop are correctly paired within a single function scope rather than stored, so an early return cannot leave a pool unbalanced. The SwiftArg and SwiftRet conversions are unsafe trait methods whose obligation is that the Rust representation matches what the Swift side declares, which is exactly the kind of contract a signature cannot carry.

The build script needed correcting mid-audit and the correction is worth recording. There is no build.rs at the conventional path; the manifest points at src-rs/test-build.rs, which is twenty lines and a no-op for normal builds. It emits a rerun-if-env-changed for TEST_SWIFT_RS and, only when the non-default `build` feature is on and that variable equals "true", compiles the crate's own test Swift package. The SwiftLinker that actually drives the Swift toolchain is a library API a consumer calls from their own build script -- swift-rs does not run a compiler on its own behalf during a normal build of this tree.

Scope: the Rust-Swift ABI agreement is asserted by the unsafe traits, not proven here. A mismatched declaration on the Swift side would be unsound and this audit does not rule it out."""

