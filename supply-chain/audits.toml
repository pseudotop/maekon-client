[[audits.field-offset]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.3.6"
notes = "Whole crate read. The design is unsafe construction with safe application, and it is consistent: `FieldOffset::new` and `new_from_offset` are both `pub unsafe fn` whose documentation states the caller must ensure the offset is valid for any instance of `T`, and explicitly warns that an enum with multiple variants breaks that. Once a `FieldOffset` exists, `apply`/`apply_mut` are safe dereferences at that offset, which is sound given the construction contract. `unapply_ptr`/`unapply_ptr_mut` are `pub unsafe fn` with prominent warnings about negative offsets and aliasing. `new_from_offset` carries a sanity check that `offset + size_of::<U>() <= size_of::<T>()`, and the source says plainly that it is not sufficient for safety and only fires under a cfg or via debug overflow — an honest comment rather than an overclaim, and acceptable because the function is already unsafe. The safe entry point users reach is the `offset_of!` macro, which wraps the unsafe constructor around `memoffset::raw_field!`. Scope recorded: `memoffset` computes the offset and is a separate crate not covered here."

