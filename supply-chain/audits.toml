[[audits.rand_hc]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.2.0"
notes = "Whole crate read. HC-128 keystream generator; two unsafe blocks, `step_p` and `step_q`, which use `get_unchecked`/`get_unchecked_mut` on the two halves of `t: [u32; 1024]` split at 512, so every index must be below 512. That was checked rather than assumed. `generate` opens with `assert!(self.counter1024 % 16 == 0)` — a real runtime assert, not a debug one — and the counter only ever advances by `wrapping_add(16)`. From that, `cc = counter1024 % 512` and `dd = (cc + 16) % 512` are multiples of 16 at most 496, and `ee = cc.wrapping_sub(16) % 512` is likewise at most 496 (for cc = 0 it wraps to 496, because 2^64 is a multiple of 512). The largest index formed anywhere in the two blocks is `cc + 15` or `ee + 15`, that is 511, which is in bounds. The h1/h2 table lookups use checked indexing with a `u8` and `256 + u8`, so at most 511 as well. No I/O, no build script. This is a statistical generator seeded through `rand_core`; the crate reaches this tree only through the legacy rand 0.7 build-time path."

[[audits.rand_pcg]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.2.1"
notes = "Whole crate read; no unsafe anywhere, no build script, no filesystem, process or network access. It implements the PCG family — Lcg64Xsh32 (Pcg32), Lcg128Xsl64 (Pcg64) and Mcg128Xsl64 (Pcg64Mcg) — as pure integer arithmetic: a wrapping multiply-add state step and an xorshift-plus-rotate output permutation, with `RngCore` and `SeedableRng` impls that forward to `rand_core`'s little-endian seed helpers. These generators are statistical, not cryptographic, which the crate documents; that is its stated purpose rather than a defect, and it is not a claim this audit needs to make either way."

