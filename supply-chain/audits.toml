[[audits.miniz_oxide]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "0.8.9 -> 0.9.1"
notes = """
#11730 delta audit — miniz_oxide 0.8.9 -> 0.9.1. License: MIT OR Zlib OR Apache-2.0.
Delta: 14 files, +540/-185. Pure-Rust deflate/inflate. This is a minor release, so the
delta was scanned on capability axes first and then read where it matters.

Measured properties (not assumed):
- `unsafe`: 0 added and 0 removed in the delta; whole-crate token count identical between
  0.8.9 and 0.9.1 (4 in both), same 14 source files, and neither version has a build.rs.
- Capability tokens with zero occurrences on added lines: std::process, Command, std::net,
  TcpStream, std::fs, File::, include_str, include_bytes, env!, std::env, extern "C",
  asm!, transmute, from_raw, as_ptr, MaybeUninit.
- Manifest: `simd-adler32` requirement 0.3.3 -> 0.3.8 and `serde` gains
  `default-features = false` + `alloc`; `std` feature now forwards `serde?/std`. No crate
  enters the graph: this lockfile already pins simd-adler32 0.3.9 (satisfying >=0.3.8) both
  before and after, and serde is optional.

Decompression path (untrusted input) read line by line:

1. `inflate/core.rs` — Huffman table construction is rewritten to match zlib's
   `inftrees.c`. It now checks over-subscription at every code length
   (`left <<= 1; left -= ts; if left < 0 -> BadTotalSymbols`) instead of only inspecting
   the final total, and the incomplete-table rule changes from
   `total != 65536 && (used_symbols > 1 || bt == HUFFLEN_TABLE)` to
   `total != 65536 && (bt == HUFFLEN_TABLE || max_code_len > 1)`, with the RFC 1951 /
   zlib rationale in the source. Net effect: malformed tables are rejected earlier and
   the accepted set is aligned to zlib.

2. New `decompress_with_limit(r, in_buf, out, out_pos, out_max, flags)`; `decompress()`
   now delegates with `out_max = usize::MAX`, so existing callers are unchanged.

3. `inflate/output_buffer.rs` — `OutputBuffer` gains a `max` field built by
   `position.saturating_add(max_count)` and then clamped to `slice.len()`. The
   construction cannot overflow and cannot exceed the slice. `bytes_left()` changes from
   `slice.len() - position` to `max - position`, i.e. it can only shrink.

4. The LZ77 match-copy guard changes `out_len` from `out_buf.get_ref().len()` to
   `out_buf.bytes_left()`. Because `max <= slice.len()`, the new threshold is less than
   or equal to the old one for every position, so the bulk `apply_match` fast path is
   entered on a strict subset of the previously allowed cases; everything else falls back
   to the bounds-checked `WriteLenBytesToEnd` byte-wise path. The distance guard on the
   line above still uses `get_ref().len()` and is unchanged. The direction of this change
   is conservative — it cannot admit a bulk copy the old code rejected.

Compression side (deflate/core.rs +303/-82 and friends) is API surface for the new 0.9
features plus the stored-block and zlib-header refactors; it introduces no unsafe, no new
dependency, and no new capability per the scan above, and it does not parse untrusted
input the way the inflate path does.

Scope: capability and memory-safety oriented delta review with line-by-line reading of the
decompression changes. Not a line-by-line re-derivation of the whole deflate encoder; that
was covered by the whole-crate 0.8.9 audit already recorded in this file."""

