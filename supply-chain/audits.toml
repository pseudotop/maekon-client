[[audits.inotify]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
version = "0.11.1"
notes = """
Whole crate read; 2517 lines, nineteen unsafe sites over thirteen distinct shapes. Linux only. The five capability hits are File::create in examples/ and tests/.

Method note: the unsafe sites were clustered by normalised shape before reading, so a repeated idiom is argued once with its instance count recorded and the sites that do not fit a cluster are read individually.

Three groups. The syscall wrappers (inotify_init1, inotify_add_watch, inotify_rm_watch) pass an owned CString or an integer descriptor and check the return before use. The fd handling goes through FromRawFd/IntoRawFd and a small guard type whose Drop closes the descriptor, so an early return does not leak it; that Drop is gated on a close_on_drop AtomicBool, which is how ownership can be handed out through into_raw_fd without risking a double close. And the event decoding reads a struct inotify_event out of the kernel's byte buffer with `ffi_event_ptr.read_unaligned()` -- the right call, because the kernel packs events at arbitrary offsets and a plain read would assume an alignment the buffer does not guarantee.

Two sites are `pub unsafe fn from_bits_unchecked(bits: u32)` on the watch-mask bitflags, which is the standard bitflags escape hatch and carries its obligation in the signature.

Exposure: the filesystem-watch path on Linux."""

