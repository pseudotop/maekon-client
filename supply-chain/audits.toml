`tests/zero-write.rs` (+99) is test-only. No public API is removed other than the
`mtime_as_datetime` signature path change noted above.

Direction of change: one C dependency path deleted, no new capability, no new unsafe
operation, I/O unchanged for this workspace's configuration.

Scope: capability and memory-safety oriented delta review with the import migration
verified as mechanical. Not a line-by-line re-derivation of the gz/zlib wrappers; those
were covered by the whole-crate 1.1.9 audit already recorded in this file."""

