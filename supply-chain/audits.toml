Reviewed against vendored registry source (whole crate; tests/benches/examples
excluded). Not ManuallyDrop-equivalent, despite serving the same purpose: NoDrop<T> wraps a #[repr(u8)] enum Flag { Alive(T), Dropped(u8) } and does have a Drop impl, which ptr::write's the discriminant to Dropped so the following drop-glue pass finds no T. ManuallyDrop by contrast has no Drop impl at all and is a lang item with a layout guarantee. The #[repr(u8)] here is load-bearing -- without it a niche optimisation could make the overwrite indistinguishable from a valid Alive value -- and the crate carries a test asserting the layout is not collapsed. Deref and DerefMut match on Alive and route the Dropped arm to debug_assert_unreachable. That is not merely debug-checked: in a release build the debug_assert! compiles out and control reaches `match *(1 as *const Void) {}`, a read of address 1, which is undefined behaviour rather than a panic. It is unreachable through the type invariant, since Drop takes &mut self and the value cannot be dereferenced afterwards, but the release-build consequence of reaching it is recorded here rather than described as checked. Pure, no capabilities. Deprecated crate by bluss; its own documentation directs users to ManuallyDrop or MaybeUninit.
No process/network syscalls beyond the crate's stated purpose, no native
(cc/cmake/bindgen) compilation. safe-to-deploy. Scope: per-crate unsafe-block review.
"""

