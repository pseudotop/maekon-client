[[trusted.winapi]]
criteria = "safe-to-deploy"
user-id = 63 # Peter Atashian (retep998)
start = "2019-04-03"
end = "2027-08-27"
notes = "#11281 VD-05.7 Tier 3-c publisher-trust (2026-08-27 owner decision after deep research; supersedes the earlier legitimate-residual proposal). Publish share: retep998 shipped 3 of 3 publisher-recorded versions (100%); 48 versions predate crates.io publisher records, so the corrected denominator is 3, and 0.3.9 — the version in this tree — is one of the recorded three (published 2020-06-26; the earlier note saying dormant since 2019 was off by a year). Window basis: start is the publisher's first recorded publication; pre-record releases fall outside the window. Sole crates.io owner. Corroboration: no registry in the cargo-vet ecosystem covers winapi at all — the official registry list equals our ten imports and imports.lock holds no winapi records (checked 2026-08-27; positive control in the same suggest run: the rib/jni-macros NOTE). Identity tie: the crates.io account is the GitHub account owning retep998/winapi-rs, the crate's repository. Release process: trustpub_data is null on all versions. Dormancy, measured: last publish 2020-06-26, last repository push 2024-04-27, not archived — the risk surface is frozen, and a trust window over a dormant publisher covers exactly the released versions and no future ones. Exposure: boundary — the crate is the FFI declaration surface for Win32, the same family as libc and mach2, where a wrong declaration is memory corruption by itself; this note is therefore also the owner exception policy section 4 requires. Why an audit was not performed: 181,323 lines of machine-transcribed API declarations cannot be meaningfully verified line-by-line against Windows SDK headers — the mach2 entry records the same judgment for the same surface class. What was checked instead: the identity tie, the 100% corrected share, the frozen release surface, and reachability (Windows is a shipped CI target, reached via ntapi, socks, dlopen2, page_size). Approval: lands by pull request under the ONESHIM Contributors identity (policy section 5); owner approval recorded in #11281 (2026-08-27). Not part of the #3908 identity review."

