[[audits.signal-hook-registry]]
who = "ONESHIM Contributors <security@oneshim.thengd.com>"
criteria = "safe-to-deploy"
delta = "1.4.1 -> 1.4.8"
notes = "Two substantive changes. First, the registry stops using BTreeMap and HashMap and uses a small purpose-built VecMap for both the per-signal action list and the signal table; the point is that lookups performed from inside a signal handler must not allocate, so this narrows what runs in async-signal-unsafe context. Insertion order is still the execution order, which is what the previous BTreeMap-keyed-by-increasing-ActionId arrangement provided. Second, `handler as sighandler_t` becomes `handler as *const () as sighandler_t`, and the sigaction field is set the same way; the added comment explains that casting a function item directly to an integer type is questionable with respect to pointer provenance and that miri rejects it, so the cast now goes through a raw pointer. Also: SA_RESTART is not set on QNX (nto) because that platform does not support it, an AIX libc naming workaround with an explanation of why it is not mandated for all targets, and lifetime elision on the guard types."

