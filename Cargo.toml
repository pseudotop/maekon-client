[workspace]
members = [
    "crates/maekon-api-contracts",
    "crates/maekon-audio",
    "crates/maekon-lint",
    "crates/maekon-core",
    "crates/maekon-http-core",
    "crates/maekon-integration",
    "crates/maekon-monitor",
    "crates/maekon-vision",
    "crates/maekon-network",
    "crates/maekon-storage",
    "crates/maekon-suggestion",
    # "crates/maekon-ui",      # iced UI → Tauri v2 마이그레이션으로 제거
    "crates/maekon-web",
    "crates/maekon-automation",
    "crates/maekon-analysis",
    "crates/maekon-embedding",
    "crates/maekon-sandbox-worker",
    # "crates/maekon-app",     # src-tauri로 대체
    "src-tauri",
]
resolver = "2"

# H1 (#7719): workspace-wide lint policy, replacing the per-crate `#![deny(...)]`
# headers that had drifted (some crates declared a lint, others didn't, with no
# single source of truth). This table is the UNION of every crate-root
# `#![deny(...)]` found in the pre-#7719 survey:
#   - `derive_partial_eq_without_eq`: 6/14 crates denied it explicitly.
#   - `significant_drop_tightening`: 6/14 crates denied it (with
#     `#[cfg_attr(test, allow(...))]`); 4/14 crates instead carried a
#     crate-wide `#![allow(...)]` with a documented false-positive rationale
#     (analysis, automation, network, storage) — those source-level allows
#     are kept as-is and still override this workspace `deny` for that one
#     crate (source attributes take precedence over Cargo.toml-configured
#     levels), so behavior for those 4 crates is unchanged.
# `unwrap_used`/`expect_used` are new additions (were not declared by any
# crate before #7719): measured at 58 non-test/non-bench production call
# sites workspace-wide (3 `unwrap_used` + 55 `expect_used`, out of ~8,100
# total occurrences that are overwhelmingly `#[cfg(test)]`-scoped) — above
# the ~30-site fix-in-place threshold, so landed at `warn` (not `deny`) per
# #7719 scope decision; see the PR body for the full count breakdown. Tests
# are exempted via `clippy.toml`'s `allow-unwrap-in-tests`/
# `allow-expect-in-tests`; benches carry a per-file `#![allow(...)]` (bench
# harnesses are dev tooling, not shipped code). NOTE: CI's `-D warnings`
# invocation promotes ANY configured-`warn` lint to a hard error (verified
# empirically), so `ci.yml`'s clippy steps additionally pass
# `-A clippy::unwrap_used -A clippy::expect_used` alongside the existing
# `-A clippy::empty_docs -A clippy::derivable_impls -A clippy::type_complexity`
# — the same bridge pattern already used for those three lints.
# A2 (#7743, Wave-3 of #7744): restore a real deny gate for first-party rustc
# warnings (unused_imports/dead_code/unused_variables/etc.) on EVERY platform,
# without touching the vendored `patches/` fork stack.
#
# Mechanism (verified empirically against this workspace's toolchain, not
# assumed): `patches/*` crates are `[patch.crates-io]` PATH dependencies, not
# `[workspace]` members (see the `members = [...]` list above — none of the 8
# `patches/<crate>` dirs are listed). Cargo does NOT apply `--cap-lints allow`
# to path dependencies the way it does for plain registry/git deps, so a
# workspace-wide `-D warnings` also lints their vendored GTK4/WebKitGTK6 source
# (macOS objc2 deprecated-static warnings etc.) — that is the actual reason
# `ci.yml`/`build-smoke.yml` carry a global `RUSTFLAGS: -W warnings` instead of
# `-D`.
#
# `RUSTFLAGS: -W warnings` is a single flag naming the `warnings` GROUP. Cargo
# appends RUSTFLAGS-derived flags AFTER the `[lints]`-derived flags on the
# final rustc invocation (confirmed via `cargo build -v`), so when `[lints]`
# ALSO configures the `warnings` group (e.g. a hypothetical
# `warnings = "deny"` — a real, valid rustc lint group name, contrary to the
# initial review assumption that it wasn't expressible), the later
# RUSTFLAGS `-W warnings` wins and silently downgrades it back to warn. BUT:
# when `[lints]` instead names a lint/group MORE SPECIFIC than the bare
# `warnings` super-group (a named sub-group like `unused`, or an individual
# lint like `dead_code`), that specific `--deny=...` flag is NOT overridden by
# a later, less-specific `-W warnings` — rustc keeps the more specific level.
# This was confirmed with a throwaway crate: `[lints.rust] unused = "deny"`
# plus `dead_code = "deny"` still hard-errored on an unused import/variable and
# a dead function even under `RUSTFLAGS="-W warnings"`, while a
# `warnings = "deny"` control case was neutralized under the same RUSTFLAGS.
#
# Design: deny the SPECIFIC lint groups that regressed silently before (the
# `check` job's pre-existing-bug comment cites an `unused_imports` case that
# only a macOS-only compile path exposed) via `[workspace.lints.rust]`
# instead of trying to flip the blanket `warnings` group or remove the
# workspace-global RUSTFLAGS outright. This is intentionally conservative:
# - `unused` (covers `unused_imports`, `unused_variables`, `unused_mut`,
#   `unused_assignments`, etc.) and `dead_code` are the two classes the CTD
#   review + prior ci.yml comments explicitly named.
# - Every OTHER default-warn rustc lint (`deprecated`, `unreachable_patterns`,
#   etc.) remains governed by the workflow's `RUSTFLAGS: -W warnings` as
#   before — not silently promoted to deny by this change.
# - `[lints]` only applies to packages that opt in via `lints.workspace = true`
#   (every first-party crate does, per #7719); the 8 `patches/*` manifests
#   have no such table and are untouched, so this cannot newly break the
#   vendored fork.
# - Because `[lints]`-derived flags are baked into the rustc invocation
#   itself (not a CI-only flag), this closes the actual gap A2 identified:
#   macOS/Windows `#[cfg(target_os = "...")]` first-party code that is only
#   ever COMPILED on those runners (`test-platform`/`build` jobs, which never
#   run a Linux-only `clippy -D warnings` step) is now deny-linted for these
#   two classes on every platform, every job, not just the ubuntu `check` job.
[workspace.lints.rust]
unused = "deny"
dead_code = "deny"

[workspace.lints.clippy]
derive_partial_eq_without_eq = "deny"
significant_drop_tightening = "deny"
unwrap_used = "warn"
expect_used = "warn"

[workspace.package]
edition = "2021"
version = "0.0.1-rc.10"
license = "Apache-2.0"
# #11339: 1.88.0 was declared for jsonwebtoken 11.0.0 (#9375) and stayed there
# long after the lockfile stopped honouring it. Nothing verified the claim — no
# workflow ever built on the declared toolchain — so it drifted silently while
# other decisions kept citing it as their justification.
#
# The first run of the MSRV canary (#11324) resolved the committed Cargo.lock on
# 1.88.0 and found 26 dependencies requiring rustc 1.92: the GTK/GLib stack that
# Tauri pulls in (gtk4-sys, glib, pango, soup3, cairo-rs, gdk4, …).
#
# 1.92.0 was what the lockfile required once the false 1.88.0 was corrected.
#
# 1.95.0 is a second, different decision: sysinfo 0.39.x declares
# `rust_version = 1.95` (verified against crates.io), and that line has been held
# back since #6624 solely by the MSRV claim. Taking it means raising the floor
# deliberately rather than because the lockfile forced us — the contributors who
# build this workspace need 1.95 from here.
rust-version = "1.95.0"
repository = "https://github.com/pseudotop/maekon-client"
homepage = "https://github.com/pseudotop/maekon-client"
authors = ["Maekon Contributors"]
keywords = ["desktop-agent", "monitoring", "ai", "productivity", "automation"]
categories = ["gui", "os", "network-programming", "asynchronous"]

[workspace.dependencies]
# 비동기 런타임
tokio = { version = "1", features = ["full"] }

# 직렬화
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP 클라이언트 (native-tls로 ring 의존성 회피)
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "stream", "native-tls", "form", "multipart"] }

# SSE 수신 스트림 파서
eventsource-stream = "0.2"

# WebSocket (native-tls로 ring 의존성 회피)
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }

# 시스템 모니터링
# #11339: unpinned. 0.39.x declares `rust_version = 1.95`, which the workspace
# now declares too — the hold since #6624/#6848 existed only for that gap.
sysinfo = "0.39"

# 로컬 DB
#
# #9884: `bundled-sqlcipher-vendored-openssl`, NOT plain `bundled-sqlcipher`.
# SQLCipher needs libcrypto. Under plain `bundled-sqlcipher`,
# `libsqlite3-sys/build.rs` takes this branch on Windows:
#
#     if is_windows && !cfg!(feature = "bundled-sqlcipher-vendored-openssl") {
#
# i.e. it locates a SYSTEM OpenSSL on the build host and links it DYNAMICALLY.
# The CI runner has OpenSSL, so the build succeeds — and the shipped
# `maekon.exe` then imports `libcrypto-3-x64.dll`, which is absent on a clean
# user machine. A real user hit exactly that launch failure on v0.0.1-rc.6.
#
# The vendored variant compiles OpenSSL from source and links it STATICALLY, so
# the binary is self-contained: nothing to bundle into MSI/NSIS/ZIP, nothing to
# sign, and no "which OpenSSL did the runner happen to have" supply-chain
# question. This is the first (preferred) option in #9884's acceptance criteria
# — "make the Windows release binary self-contained" — rather than the fallback
# "or bundle the reviewed OpenSSL runtime DLL".
#
# Cost: OpenSSL is compiled during the build (needs perl + a C toolchain, both
# present on GitHub-hosted runners). Do NOT revert to `bundled-sqlcipher`
# without re-solving the clean-host DLL closure; `scripts/verify-windows-runtime-closure.mjs`
# is the gate that catches a regression here.
rusqlite = { version = "0.40", features = [
    "bundled-sqlcipher-vendored-openssl",
    "fallible_uint",
] }

# 압축
flate2 = "1"
zstd = "0.13"
lz4_flex = "0.14"

# ML inference (ONNX Runtime — aligned with fastembed's transitive version)
ort = "2.0.0-rc.12"

# 이미지 처리 (Edge Processing)
# Keep decoder/encoder surface explicit. The client captures raw RGBA frames,
# writes PNG for privacy redaction, decodes PNG/JPEG/WebP inputs, and keeps
# WebP encoding on the dedicated `webp` crate. AVIF/rav1e stays disabled.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fast_image_resize = "6"
webp = "0.3"
xcap = "0.9"
leptess = "0.14"
base64 = "0.23"

# Tauri v2 (iced → Tauri 마이그레이션)
tauri = { version = "2", features = ["image-png", "macos-private-api"] }
tauri-build = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-notification = "2"
tauri-winrt-notification = "0.8.1"
tauri-plugin-wdio = "1.2.0"
tauri-plugin-wdio-webdriver = "1.2.0"

# 공간 인덱스
rstar = "0.13"

# 에러 처리
thiserror = "2"
anyhow = "1"

# 오디오 캡처 + STT
cpal = "0.18"
rubato = "5.0"
whisper-rs = "0.16"

# 비동기 trait (dyn Trait + async fn 지원)
async-trait = "0.1"
async-stream = "0.3"

# 상수 시간 비교 (D13-v2b auth_gate token compare, RFC 7235)
subtle = "2.5"

# 로깅
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 설정
config = "0.14"
directories = "6"

# CLI
clap = { version = "4", features = ["derive"] }

# 유틸리티
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
futures-util = "0.3"
semver = { version = "1", features = ["serde"] }
sha2 = "0.11"
hmac = "0.13"
rand = "0.10"
url = "2"
ed25519-dalek = "3.0"
zeroize = { version = "1", features = ["derive"] }
gethostname = "1.1"

# Sync encryption (Phase 3b — shared by maekon-storage + maekon-network)
aes-gcm = "0.11"
argon2 = "0.5"
hex = "0.4"

# LAN Sync (Phase 3b-2)
rcgen = "0.14"
mdns-sd = "0.21"
axum-server = "0.8"
rustls-pki-types = "1"

# External gRPC binding (D13-v2c)
arc-swap = "1"
aws-lc-rs = "1.16.2"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
notify = "8"
notify-debouncer-mini = "0.7"
rustls = "0.23"
time = "0.3"
tokio-rustls = "0.26"
ulid = "3"
x509-parser = "0.18"

# OS 키체인 (시크릿 저장)
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# Linux AT-SPI2 accessibility (D-Bus based)
atspi = { version = "0.30", default-features = false, features = ["tokio", "connection", "proxies"] }
atspi-common = { version = "0.14", default-features = false }

# 성능 최적화 (Phase 31-33)
lru = "0.18"
crossbeam = "0.8"
parking_lot = "0.12"
once_cell = "1.21"

# gRPC (Phase 34 - Protobuf API 통합)
# tls-aws-lc: enables Certificate/ClientTlsConfig/Identity for integration tests.
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-prost = "0.14"
tonic-health = "0.14"
tonic-build = "0.14"
prost = "0.14"
prost-types = "0.14"

# 입력 시뮬레이션 (크로스 플랫폼 마우스/키보드)
enigo = { version = "0.6", features = ["serde"] }

# X11 native client (pure-Rust RustConnection — no libxcb). Used by maekon-monitor
# for native EWMH active-window detection on Linux (#6828, replaces the xdotool fork).
# Pure-Rust + already in the lockfile transitively (enigo / global-hotkey), so it is
# declared all-target: the native module then compiles + is unit-testable on the
# macOS/Windows hosts too, even though it is only CALLED on Linux.
x11rb = "0.14"

# 자동 업데이트 (self-replace only — reqwest 0.12 중복 제거)
bsdiff = "0.2"
self-replace = "1.5"
tar = "0.4.46"
zip = "8"
quick-xml = "=0.42.0"

# 웹 프레임워크 (Axum)
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "fs", "compression-gzip"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"

# macOS 네이티브 API
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSRunningApplication",
    "NSWindow", "NSView", "NSColor", "NSScreen",
    "NSGraphics", "NSResponder", "NSImage",
] }
objc2-user-notifications = "0.3"

# Windows 플랫폼 API
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_Security_Authentication_Identity"] }
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Ole", "Win32_Foundation", "Win32_System_Variant", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation"] }

# 내부 크레이트
maekon-core = { path = "crates/maekon-core" }
# ADR-034: shared outbound-HTTP substrate. Sits below the adapters so a future
# maekon-integration can reuse the hardened client/breaker without depending on
# maekon-network (adapter→adapter is forbidden).
maekon-http-core = { path = "crates/maekon-http-core" }
# ADR-034 P3: third-party connector adapter (read-only Context Sources). Depends
# only on maekon-core + maekon-http-core — never on maekon-network.
maekon-integration = { path = "crates/maekon-integration" }
maekon-audio = { path = "crates/maekon-audio" }
maekon-api-contracts = { path = "crates/maekon-api-contracts" }
maekon-monitor = { path = "crates/maekon-monitor" }
maekon-vision = { path = "crates/maekon-vision" }
maekon-network = { path = "crates/maekon-network" }
maekon-storage = { path = "crates/maekon-storage" }
maekon-suggestion = { path = "crates/maekon-suggestion" }
maekon-web = { path = "crates/maekon-web" }
maekon-automation = { path = "crates/maekon-automation" }
maekon-analysis = { path = "crates/maekon-analysis" }
maekon-embedding = { path = "crates/maekon-embedding" }
maekon-sandbox-worker = { path = "crates/maekon-sandbox-worker" }
maekon-lint = { path = "crates/maekon-lint" }

# POSIX 디스크 공간 조회 (statvfs)
libc = "0.2"

# 테스트 의존성 (각 crate의 [dev-dependencies]에서 workspace = true로 참조)
mockito = "1"
tokio-test = "0.4"
tempfile = "3"
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
assert_matches = "1"
criterion = { version = "0.8", features = ["html_reports"] }

[patch.crates-io]
tao = { path = "patches/tao-0.35.2" }
tauri = { path = "patches/tauri-2.11.2" }
tauri-runtime = { path = "patches/tauri-runtime-2.11.2" }
wry = { path = "patches/wry-0.55.1" }
tauri-runtime-wry = { path = "patches/tauri-runtime-wry-2.11.2" }
tray-icon = { path = "patches/tray-icon-0.23.1" }
muda = { path = "patches/muda-0.19.1" }
tauri-plugin-wdio-webdriver = { path = "patches/tauri-plugin-wdio-webdriver-1.2.0" }
