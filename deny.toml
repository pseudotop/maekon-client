[graph]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "MIT",
  "MPL-2.0",          # webpki-roots@0.26.x (TLS root CA bundle); file-level copyleft — permissible unmodified
  "NCSA",
  "0BSD",             # alignment with about.toml `accepted` (no crate uses it today)
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016", # alignment with about.toml `accepted` (no crate uses it today)
  "Zlib",
  "bzip2-1.0.6",    # libbz2-rs-sys (zip crate transitive dep)
  "Unlicense",      # whisper-rs / whisper-rs-sys (오디오 STT, OSI approved + FSF Free)
  # --- Tauri v2 (iced → Tauri 마이그레이션) ---
  # E31 retired the old webkit2gtk/glib 0.18 line. The active WebKitGTK 6 Rust
  # bindings (`webkit6`, `webkit6-sys`, `javascriptcore6*`) are MIT-licensed crates.
]
private = { ignore = true }

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
# Every crate in the graph is checked: vulnerabilities (always), unmaintained
# and unsound advisories, and yanked releases (#13705). This replaces the
# former "workspace" scope, which skipped transitive crates. The former review
# dates 2026-12-31 (advisory policy), 2027-01-16 (unsound policy) and
# 2027-02-16 (informational advisories) are satisfied by activation, not
# renewal.
# Positive control: on the lock before #13631 (main 9f73d063) the "workspace"
# scope passed, although that lock carried RUSTSEC-2026-0202 (cxx) and
# RUSTSEC-2026-0221 (event-listener); the "all" scope reports both.
# Measured on main 76e0c70634 with cargo-deny 0.19.7 and advisory-db 309392b1
# (2026-11-06): only the four unmaintained advisories ignored below match, and
# no unsound advisory does.
# When a new advisory fails this check, update to a fixed release if one
# exists. Otherwise add an exact `ignore` entry whose reason names the path and
# the upstream change that removes it, instead of a date.
# `unused-ignored-advisory = "deny"` fails the check once an entry stops
# matching, so each entry goes as soon as upstream resolves it and cannot hide
# a later reintroduction.
# Vulnerability ignores are mirrored in .cargo/audit.toml. Unmaintained and
# unsound ignores are not: cargo audit reports those as non-failing warnings.
# What this check does not see (mutation test on main 9cbed721, 2026-11-09):
# path crates from [patch.crates-io] are skipped for advisories; advisories
# published only as GHSA are not read (block-buffer 0.12.0 passed with
# GHSA-qwgh-2vcv-g2f7); and lock entries outside this graph, such as quinn and
# quinn-proto on reqwest's inactive http3 path, are never checked (quinn-proto
# 0.11.15 passed with RUSTSEC-2026-0338..0342). The OSV step in
# cargo-supply-chain.yml (scripts/ci/check_cargo_lock_osv.py) checks every
# Cargo.lock entry and sees all three; an advisory only that step can see is
# accepted in osv-ignore.toml, not here.
# Earlier rationale and re-evaluations (#5431, #12778, #13038, #13114, #13631)
# are in this file's git history.
# RUSTSEC-2026-0459 (#13722) is the only vulnerability ignored below. Updating
# libsqlite3-sys to 0.39.0 or 0.39.1 would clear this check and the OSV step
# without fixing Maekon's build: their bundled-sqlcipher still compiles SQLite
# 3.53.4 (sqlcipher-src =419.0.6), while the advisory's version range treats
# them as fixed. The sqlcipher-src entry in [bans] rejects that update. Take
# the libsqlite3-sys release whose bundled SQLCipher is on SQLite >= 3.54.0
# instead, and delete the ignore entry in the same change.
unmaintained = "all"
unsound = "all"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15, a build-time proc-macro, via tokenizers 0.22.2 from fastembed 5.17.3. Every stable tokenizers release (0.23.2 included) still depends on paste; only the 1.0.0 release candidates drop it." },
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5.15.0 via zbus 5.19. zbus 6 absorbed it, but atspi 0.30, notify-rust 4.18, tauri-plugin-notification 2.8, tauri-plugin-single-instance 2.5 and xcap 0.9 have no zbus 6 release." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.4 via zbus 5.19; the same zbus 6 blocker as RUSTSEC-2026-0370." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.15.0 via zbus 5.19; the same zbus 6 blocker as RUSTSEC-2026-0370." },
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.38.2 via rusqlite 0.40.2 (maekon-storage). bundled-sqlcipher-vendored-openssl compiles SQLCipher 4.14.0 on SQLite 3.51.3. libsqlite3-sys 0.39.0 and 0.39.1 do not fix this build: their bundled-sqlcipher uses sqlcipher-src =419.0.6 (SQLite 3.53.4). Remove with the libsqlite3-sys release that moves bundled-sqlcipher to sqlcipher-src 420.0.0 or later (SQLCipher 4.20.0 on SQLite 3.54.1, rusqlite/rusqlite#1932)." },
]

[bans]
# DEP-7 (#7719): tripwire, not a gate — 89 existing version-split warnings
# (`cargo deny check bans`, measured 2026-07) in the current dependency graph
# make `deny` an immediate hard failure; `warn` surfaces new splits in CI
# output without blocking the build. Tighten to `deny` once the existing
# splits are triaged/reduced.
multiple-versions = "warn"
wildcards = "allow"
# F-SC-C35-02: deny list activated at its 2026-12-01 review (#13698).
# Each entry bans the crate except as a direct dependency of its wrappers.
# The wrappers are exactly the crate's direct dependents in the graph this file
# checks (all features, all targets, dev included), measured with
# `cargo tree -i` on main f99e05b079.
# - md5 / md-5: not in the graph, so no wrapper.
# - sha1: only where a protocol or format requires SHA-1. tungstenite computes
#   the RFC 6455 Sec-WebSocket-Accept value; zip's default `aes-crypto` feature
#   derives WinZip AES keys with PBKDF2-HMAC-SHA1.
# - openssl / openssl-sys: native-tls links OpenSSL on Linux. The workspace
#   picks native-tls for reqwest and tokio-tungstenite to avoid ring
#   (Cargo.toml), and fastembed's ort/hf-hub download features use it too.
#   libsqlite3-sys builds vendored OpenSSL libcrypto for SQLCipher
#   (`bundled-sqlcipher-vendored-openssl`, #9884). The old candidate note
#   ("prefer rustls", blocked by Tauri/WebKit) did not match these edges.
# - sqlcipher-src: a version floor, not a wrapper ban (#13722). Releases before
#   420.0.0 bundle SQLite older than 3.54.0 (RUSTSEC-2026-0459), but
#   libsqlite3-sys 0.39.0 and 0.39.1 pull 419.0.6 while the advisory treats them
#   as fixed. `name:<req>` is a version requirement. `name@<version>` takes one
#   exact version, and `sqlcipher-src@<420.0.0` silently matched nothing
#   (cargo-deny 0.19.7, measured on a lock with 419.0.6).
# A new direct dependent fails `cargo deny check bans` with error[banned]; a
# wrapper that stops being a parent shows up as warning[unused-wrapper].
# The former 2026-12-01 review date is satisfied by activation, not renewal.
deny = [
  { crate = "md5", reason = "MD5 is broken; no crate in the graph needs it." },
  { crate = "md-5", reason = "MD5 is broken; no crate in the graph needs it." },
  { crate = "sha1", wrappers = ["tungstenite", "zip"], reason = "SHA-1 only where a protocol or file format requires it." },
  { crate = "openssl", wrappers = ["native-tls"], reason = "OpenSSL only through native-tls." },
  { crate = "openssl-sys", wrappers = ["libsqlite3-sys", "native-tls", "openssl"], reason = "OpenSSL only through native-tls and SQLCipher." },
  { crate = "sqlcipher-src:<420.0.0", reason = "RUSTSEC-2026-0459: these releases bundle SQLite older than 3.54.0, which the advisory's libsqlite3-sys version range does not flag." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
