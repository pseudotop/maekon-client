[package]
name = "maekon-monitor"
description = "시스템 모니터링 어댑터 — CPU, 메모리, 활성 창 추적"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
maekon-core = { workspace = true }
thiserror = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
# #6828: native EWMH active-window on Linux (pure-Rust x11rb, no libxcb). Declared
# all-target so the parsing logic + module compile and unit-test on every host; the
# X-server connection is only reached on Linux (returns None elsewhere at runtime).
x11rb = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
core-graphics = { workspace = true }
# #8685: the changed-line mutation gate runs on Linux, where macOS-only hook
# orchestration is cfg-elided and every whole-function replacement is therefore
# equivalent. This inert marker keeps those unmeasurable functions out of that
# lane; deterministic macOS lifecycle tests cover their behavior instead.
mutants = "=0.0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
tokio = { workspace = true }
serial_test = "4"

[[bench]]
name = "monitor_bench"
harness = false
