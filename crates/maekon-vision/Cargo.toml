[package]
name = "maekon-vision"
description = "Edge 이미지 처리 — 스크린 캡처, 델타 인코딩, OCR"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["native-vision", "linux-atspi"]
ocr = ["leptess"]
ml-detect = ["dep:ort"]
# linux-atspi enables the AT-SPI2 accessibility extractor on Linux. It is
# target-scoped via [target.'cfg(target_os = "linux")'.dependencies], so the
# feature is a no-op on macOS/Windows builds (no extra deps compiled in).
linux-atspi = ["atspi", "atspi-common", "futures"]
native-vision = []
# macos-screencapturekit builds the ScreenCaptureKit change listener
# (`dirty_region/macos.rs`, #13655). ScreenCaptureKit exists from macOS 12.3,
# and objc2-screen-capture-kit links it unconditionally, so a binary built with
# this feature does not launch on older macOS. The app declares macOS 10.15
# (`src-tauri/tauri.conf.json` `minimumSystemVersion`), so the feature stays
# off by default. Target-scoped like linux-atspi: a no-op off macOS.
macos-screencapturekit = [
    "dep:objc2-screen-capture-kit",
    "dep:objc2-core-graphics",
    "dep:objc2-core-media",
    "dep:block2",
    "dep:dispatch2",
    "objc2-foundation/NSError",
    "objc2-foundation/NSGeometry",
    "objc2-foundation/NSValue",
    "objc2-foundation/objc2-core-foundation",
]

[dependencies]
maekon-core = { workspace = true }
image = { workspace = true }
fast_image_resize = { workspace = true }
webp = { workspace = true }
xcap = { workspace = true }
leptess = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
rstar = { workspace = true }
thiserror = { workspace = true }
lru = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }
core-foundation-sys = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSArray", "NSData", "NSDictionary", "NSString"] }
objc2-core-foundation = { workspace = true }
objc2-screen-capture-kit = { workspace = true, optional = true, features = ["std", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-graphics = { workspace = true, optional = true, features = ["std", "CGDirectDisplay", "CGError", "CGGeometry", "CGWindow"] }
objc2-core-media = { workspace = true, optional = true, features = ["std", "CMSampleBuffer", "CMTime"] }
block2 = { workspace = true, optional = true }
dispatch2 = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true }
# #13655: DXGI Desktop Duplication change listener (`dirty_region/windows.rs`).
# Features only; the lock file does not change.
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { workspace = true, optional = true }
atspi-common = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# #13655: X11 DAMAGE change listener (pure-Rust RustConnection, no libxcb).
# `damage` adds the DAMAGE and XFIXES protocol modules of the crate already
# used by maekon-monitor; it brings no new crate.
x11rb = { workspace = true, features = ["damage"] }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
# #7729 ctd-W2 G2: canonical `FakeOcrProvider` test double lives in maekon-core
# next to the `OcrProvider` port, gated `test-support`. Enabled ONLY here (dev
# builds), never via `[dependencies]`, so it never reaches the shipped binary.
maekon-core = { workspace = true, features = ["test-support"] }

[[bench]]
name = "vision_bench"
harness = false
