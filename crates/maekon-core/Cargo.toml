[package]
name = "maekon-core"
description = "Maekon domain models, ports, and error types"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
ulid = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
semver = { workspace = true }
gethostname = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
futures-core = "0.3"

# #6942: Windows owner-only DACL primitive (secure_file::set_owner_only_dacl) —
# the Unix 0o600 equivalent for config.json/consent.json plaintext-secret files.
# cfg(windows)-gated so the contract crate gains no dependency on any other target.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }

[[bench]]
name = "core_bench"
harness = false
