[package]
name = "maekon-api-contracts"
description = "Maekon web API transport contracts"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
maekon-core = { workspace = true }
# Optional: only pulled in by the `schema` feature used by the schema-emit
# binary (`cargo run --bin emit-openapi-schemas --features schema`). The 14
# client crates and the binary stay schemars-free in normal builds. Pinned to
# the locked 1.x major already present in the workspace lockfile.
# The integration contracts declare the RFC 3339 schema for their UTC fields.
schemars = { version = "1", optional = true }

[dev-dependencies]
# Exercise the schema helpers in the default crate test build.
schemars = "1"

[features]
# Enables `#[derive(schemars::JsonSchema)]` on the contract DTOs so the
# OpenAPI generator can splice real body schemas. OFF by default. Provider
# surface catalog types are core-owned and opt into schema derive only when this
# feature is enabled.
schema = ["dep:schemars", "maekon-core/schema"]

[[bin]]
name = "emit-openapi-schemas"
path = "src/bin/emit_openapi_schemas.rs"
required-features = ["schema"]
