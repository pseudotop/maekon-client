allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false
overrides:
  # #12049: patch GHSA-w9m9-85wc-3x92 without changing the CSS parser major
  # or holding future patched releases at this version.
  'postcss-selector-parser@>=6.1.0 <6.1.3': 6.1.3
  serialize-javascript: 7.0.5
  '@babel/core': 7.29.6
  form-data: 4.0.6
  # #11396: 4.3.0 was itself the fix for an earlier advisory and has since
  # become the vulnerable version (GHSA-5p4m-2wfm-xmqj, < 4.3.1). A pin that
  # stops being re-measured turns into the thing holding the vulnerability in
  # place — Dependabot cannot raise it while this override stands.
  # #12497: exactly that happened — the 4.3.1 pin became GHSA-2883-xcg3-v3hh
  # (< 4.3.2). Lift only the vulnerable range, as #12049 does above, so later
  # patched releases are not held at this version.
  'js-yaml@<4.3.2': 4.3.2
  ws: 8.21.0
  # #11396: not previously pinned. 10.2.0 is covered by three advisories
  # (GHSA-mwp4-54f8-5fhr, -22jq-vg5j-6vgg, -4xrf-jv44-h6hh); 10.3.1 clears all
  # three.
  # #12763: 10.3.1 is also affected by GHSA-rpw4-54j3-4h4q and
  # GHSA-2vr4-cq9g-pvrc. Raise only vulnerable versions so future patched
  # releases are not held at this version (#12497).
  # #12783: GHSA-j6r3-76f7-8jcv covers <= 10.7.0, including the 10.5.1 pin.
  'ip-address@<10.7.1': 10.7.1
  # #11396: 7.28.0 -> 7.29.0 (GHSA-4cwx-7wf7-3272 and three medium advisories,
  # all `>= 7.0.0, < 7.29.0`).
  # #12783: 7.29.0 -> 7.29.1 (GHSA-w293-vg96-wgc3 high and five low/medium
  # advisories, all `< 7.29.1`).
  'cheerio>undici': 7.29.1
  # brace-expansion 5.0.7 patches GHSA exponential-expansion DoS (dependabot #86).
  # #12783: GHSA-q2hr-2g5m-vwhr covers all three in-tree lines (< 1.1.21,
  # >= 2.0.0 < 2.1.7, >= 4.0.0 < 5.0.12). Raise only the vulnerable ranges.
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  # #11396: 6.27.0 -> 6.28.0 (three advisories, all `< 6.28.0`).
  # #12783: 6.28.0 -> 6.28.1 (GHSA-r53p-7pc4-xj5r, `< 6.28.1`).
  'webdriver>undici': 6.28.1
  # esbuild 0.28.1 patches GHSA-gv7w-rqvm-qjhr (Deno-loader binary-integrity RCE)
  # and GHSA-g7r4-m6w7-qqqr (dev-server file read). Forces every transitive
  # instance (Vite, tsx, …) onto the patched line. Requires build.target to skip
  # the legacy-Safari destructuring lowering esbuild 0.28 no longer performs —
  # see vite.config.ts `build.target`. oneshim#5909.
  esbuild: 0.28.1
