[package]
name = "maekon-embedding"
description = "Local embedding provider — fastembed-rs (ONNX Runtime) wrapper"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
maekon-core = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dependencies.fastembed]
version = "5"
optional = true
default-features = false
features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"]

[features]
default = ["fastembed-local"]
fastembed-local = ["dep:fastembed"]

[dev-dependencies]
tokio-test = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "embedding_bench"
harness = false
